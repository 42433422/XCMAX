name: "XCAGI production CodeQL scope"

paths-ignore:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/examples/**"
  - "scripts/**"
  - "**/scripts/**"
  - "**/node_modules/**"
  - "**/dist/**"

# Local barrier pack is NOT listed here: codeql-config `packs:` rejects
# relative paths ("Invalid CodeQL pack specification"). The pack is loaded
# via github/codeql-action/init `packs:` in .github/workflows/codeql.yml.
