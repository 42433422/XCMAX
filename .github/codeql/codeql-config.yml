name: "XCAGI production CodeQL scope"

paths-ignore:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/examples/**"
  - "scripts/**"
  - "**/scripts/**"
  - "**/node_modules/**"
  - "**/dist/**"

# Local model pack lives under extensions/ for offline CLI use. GitHub
# Actions `packs:` only accepts published scope/name packs; ETL sinks use
# _validated_path_component + codeql[py/path-injection] suppressions.
