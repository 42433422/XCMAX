name: "XCAGI production CodeQL scope"

paths-ignore:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/examples/**"
  - "scripts/**"
  - "**/scripts/**"
  - "**/node_modules/**"
  - "**/dist/**"

# Local model pack staged into ~/.codeql/packages in codeql.yml, then loaded
# as xcmax/retort-path-model@1.0.0 (barrierModel for ETL path helpers).
