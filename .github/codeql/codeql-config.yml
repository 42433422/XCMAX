name: "XCAGI production CodeQL scope"

paths-ignore:
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "**/examples/**"
  - "scripts/**"
  - "**/scripts/**"
  - "**/node_modules/**"
  - "**/dist/**"

# Local barrier pack is loaded via github/codeql-action/init `packs:` with a
# `+./...` local path (codeql-config `packs:` rejects relative specs). Pack
# root must contain qlpack.yml (model pack, no dependencies).
