extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      # RetortService._path canonicalizes a requested path and returns it only
      # when it is exactly an operator-configured workspace root or a child of
      # one. Its rejection behavior is covered by runtime integration tests.
      - ["retort_engine.service.RetortService", "Member[_path].ReturnValue", "path-injection"]
      - ["retort_engine.service.RetortService", "Member[_authorized_payload].ReturnValue", "path-injection"]
      - ["retort_engine.service", "Member[_authorize_http_payload].ReturnValue", "path-injection"]
      # These employee entrypoints canonicalize the requested output and only
      # return a path below the server-selected workspace.
      - ["employees.avatar_generation_employee", "Member[_resolve_output].ReturnValue", "path-injection"]
      - ["employees.trademark_generation_employee", "Member[_resolve_output].ReturnValue", "path-injection"]
      # The FHD workspace SDK rejects absolute/traversal paths and symlink
      # escapes before returning the canonical path.
      - ["app.infrastructure.workspace", "Member[resolve_safe_workspace_relpath].ReturnValue", "path-injection"]
      # Shipment ETL resolvers canonicalize candidates, enforce operator-managed
      # roots, and reject traversal and symlink escapes before returning paths.
      - ["app.application.shipment_excel_etl_security", "Member[resolve_etl_path].ReturnValue", "path-injection"]
      - ["app.application.shipment_excel_etl_security", "Member[resolve_etl_output_path].ReturnValue", "path-injection"]
      # Single path-component validator: basename equality, rejects separators,
      # dot-segments, NUL, and invalid Windows device names before dir_fd sinks.
      - ["app.application.shipment_excel_etl_security", "Member[_validated_path_component].ReturnValue", "path-injection"]
