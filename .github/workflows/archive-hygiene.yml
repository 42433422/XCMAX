name: archive-hygiene

# XCAGI v9.0.0 安全整改：archive 卫生 CI 门禁
# ----------------------------------------------------------------------------
# 目标：保证 main / master 分支永远不含 _archive/ 实体目录。历史归档已迁出工作区
# （见根 ARCHIVE_POINTER.md），因此本 workflow 只做"目录不得回流"这一件事。
# 敏感文件扫描脚本 scripts/cleanup_archive_secrets.py --check --strict 仍保留，
# 需要时手动执行；不再在 CI 中维护一个永不运行的 job。
#   - 仅依赖 bash + git，无第三方依赖。
#   - 定时每日 03:00（北京时间）兜底，防止有人绕过 pre-commit 强推。
# ----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"  # 每日 UTC 19:00 = 北京时间 03:00 兜底扫描

concurrency:
  group: archive-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-workspace-archive:
    name: Forbid _archive in workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify _archive not in tree
        run: bash scripts/verify_no_archive_in_tree.sh

