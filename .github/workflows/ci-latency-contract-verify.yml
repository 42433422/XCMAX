name: CI closure merge-source preflight
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: ccb9ffe90e4f886499ff07ba603a6080adf3addf
      BASE: 83319ef62276f8a01b89510051a6cf5a6c2c0426
      OLD_HEAD: f43d8d1cca7ea414e9d49aa035a57c0a5bc8b31a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify exact tree and unchanged protected CI contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = 100e545110df01146655b8bcc46e6bde70f65b70
          test "$(git rev-parse HEAD^1)" = "$BASE"
          test "$(git rev-parse HEAD^2)" = "$OLD_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
          python -m pip install pytest pytest-cov PyYAML ruff
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          base,old=os.environ['BASE'],os.environ['OLD_HEAD']
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',old,'HEAD']).decode().strip('\0').split('\0'))
          assert changed=={'FHD/CHANGELOG.md','FHD/XCAGI/mods/xcagi-erp-domain-bridge/manifest.json','FHD/mods/xcagi-erp-domain-bridge/manifest.json'},changed
          for name in changed-{'FHD/CHANGELOG.md'}:
              assert Path(name).read_bytes()==subprocess.check_output(['git','show',base+':'+name])
          original=subprocess.check_output(['git','show',base+':FHD/CHANGELOG.md']).decode()
          entry='- 自动检查可与配置一致性校验并行启动，减少等待；配置校验失败时仍禁止通过和发布。同步后端分片门禁的守卫输入与依赖断言，保留主线的员工包测试隔离修复。\n\n'
          assert Path('FHD/CHANGELOG.md').read_text().replace(entry,'',1)==original
          PY
          mkdir -p "$RUNNER_TEMP/closure-preflight"
          cd FHD
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest --noconftest -c /dev/null -p no:cacheprovider tests/test_ci/test_backend_shards.py tests/test_ci/test_workflow_gate_contracts.py tests/release_gate/test_admin_console_release_policy.py::test_fhd_release_chain_carries_and_verifies_admin_identity -q --junitxml="$RUNNER_TEMP/closure-preflight/contracts.xml"
          python scripts/dev/push_preflight.py --fix --base "$BASE"
          python scripts/dev/ssot_cli.py gate
          cd ..
          python -m scripts.dev.test_change_classifier
          python scripts/dev/publish_ci_workflows_to_root.py --check
          git diff --exit-code
          git diff --check "$BASE" HEAD
          python - <<'PY'
          import json,os,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'closure-preflight'
          suites=list(ET.parse(out/'contracts.xml').iter('testsuite'))
          counts={key:sum(int(s.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          assert counts['tests']==275 and counts['failures']==counts['errors']==counts['skipped']==0,counts
          result={'candidate':os.environ['CANDIDATE'],'base':os.environ['BASE'],'old_head':os.environ['OLD_HEAD'],'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'tests':counts,'preflight':'pass','ssot':'pass','workflow_sync':'pass','refs_modified':False}
          (out/'receipt.json').write_text(json.dumps(result,indent=2));print(json.dumps(result))
          PY
      - name: Preserve exact preflight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/closure-preflight/
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup disposable runner
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/clean-home" "$RUNNER_TEMP/clean-tmp"
          HOME="$RUNNER_TEMP/clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/clean-tmp" python3 scripts/dev/clean_agent_workspace.py
          df -h .
