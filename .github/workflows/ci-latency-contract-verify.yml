name: CI history checkout comparison
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: read
jobs:
  compare:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - mode: full
            filter: ''
          - mode: blobless
            filter: blob:none
    env:
      TARGET_SHA: ec843482bc5e75461fcd1bea9188de8545ff556f
      TARGET_TREE: c48e9a5ca4f2a41833d8bc1ff59f5cc3531d2602
      MODE: ${{ matrix.mode }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - name: Start checkout timer
        run: echo "CHECKOUT_START=$(date +%s%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          filter: ${{ matrix.filter }}
          persist-credentials: false
      - name: Retain checkout measurements
        run: |
          echo "CHECKOUT_END=$(date +%s%N)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse --is-shallow-repository)" = false
          git count-objects -v
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install isolated verification tools
        run: python -m pip install 'pytest<10' pyyaml
      - name: Verify complete-history SSOT and exact submitted contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          start = time.monotonic()
          result = subprocess.run(['python','scripts/dev/ssot_cli.py','gate'], cwd='FHD', capture_output=True, text=True)
          elapsed = time.monotonic() - start
          print(result.stdout, result.stderr, flush=True)
          history = subprocess.check_output(['git','log','--format=%H:%cI','HEAD'])
          pack = subprocess.check_output(['git','count-objects','-v'], text=True)
          report = {'mode':os.environ['MODE'], 'source_sha':os.environ['TARGET_SHA'], 'tree_sha':os.environ['TARGET_TREE'], 'checkout_seconds':(int(os.environ['CHECKOUT_END'])-int(os.environ['CHECKOUT_START']))/1e9, 'ssot_seconds':elapsed, 'ssot_exitcode':result.returncode, 'history_sha256':hashlib.sha256(history).hexdigest(), 'history_commits':len(history.splitlines()), 'pack':pack, 'sample_size':1}
          print('CHECKOUT_COMPARISON', json.dumps(report, ensure_ascii=False), flush=True)
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
              f.write('## Checkout sample (not a P95 claim)\n```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
          assert result.returncode == 0, 'SSOT must pass with complete history'
          PY
          python scripts/dev/publish_ci_workflows_to_root.py --check
          python -m pytest --noconftest -c /dev/null -p no:cacheprovider FHD/tests/test_ci/test_workflow_gate_contracts.py FHD/tests/release_gate/test_admin_console_release_policy.py::test_fhd_release_chain_carries_and_verifies_admin_identity -q
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml
          workflow = Path('FHD/.github/workflows/ci-cd.yml')
          original = workflow.read_text()
          command = ['python','-m','pytest','--noconftest','-c','/dev/null','-p','no:cacheprovider','FHD/tests/release_gate/test_admin_console_release_policy.py::test_fhd_release_chain_carries_and_verifies_admin_identity','-q']
          try:
              workflow.write_text(yaml.safe_dump(yaml.safe_load(original)))
              subprocess.run(command,check=True)
              print('MUTATION_SERIALIZATION_POSITIVE_CONTROL_PASS',flush=True)
              for job, dependency in [('pack-verify','classify'),('backend-test','ssot-drift-gate'),('frontend-test','ssot-drift-gate'),('docker-build-fhd-api','backend-test')]:
                  data = yaml.safe_load(original)
                  data['jobs'][job]['needs'].remove(dependency)
                  workflow.write_text(yaml.safe_dump(data))
                  outcome = subprocess.run(command,capture_output=True,text=True)
                  assert outcome.returncode == 1 and 'AssertionError' in outcome.stdout, (job,dependency,outcome.stdout,outcome.stderr)
                  print('EXPECTED_REJECTION',job,dependency,flush=True)
          finally:
              workflow.write_text(original)
          PY
          (cd FHD && python scripts/dev/push_preflight.py --fix --base c8c9c90ca47cbde6361c94b11cf5c94815b53147)
          git diff --exit-code
          git diff --check
      - name: Clean only this disposable checkout
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/latency-clean-home" "$RUNNER_TEMP/latency-clean-tmp"
          if [ -f scripts/dev/clean_agent_workspace.py ]; then
            HOME="$RUNNER_TEMP/latency-clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/latency-clean-tmp" python3 scripts/dev/clean_agent_workspace.py
          fi
          df -h .
