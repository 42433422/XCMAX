name: CI latency shard-isolation diagnosis
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ef06416e9e0e8ceedcdffc72ad977ffdb2afee3d
      XCAGI_SKIP_LEGACY_COMPAT_ROUTES: '1'
      INTENT_BENCHMARK_RUN: '1'
      XCAGI_SKIP_INTENT_LLM: '1'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Snapshot all test-side app entry points
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'app-entry-sources'
          out.mkdir()
          for p in Path('FHD/tests').rglob('*.py'):
              text = p.read_text()
              if any(s in text for s in ('get_fastapi_app', 'get_test_fastapi_app', 'XCAGI_DESKTOP_FAST_START', 'create_fastapi_app')):
                  dest = out / p
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, dest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: app-entry-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/app-entry-sources/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            FHD/requirements-server-api.txt
            FHD/deploy/requirements-dev.txt
            FHD/pyproject.toml
            FHD/packages/**/pyproject.toml
      - name: Install matching backend dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server-api.txt
          pip install -r deploy/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install real runtime Mod compiler
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install observation hooks outside the product tree
        run: |
          mkdir -p "$RUNNER_TEMP/ci-isolation-evidence"
          cat > "$RUNNER_TEMP/ci-isolation-evidence/trace_app.py" <<'PY'
          import json, os, sys, traceback
          from pathlib import Path
          import pytest
          output = Path(os.environ['RUNNER_TEMP']) / 'ci-isolation-evidence' / 'app-transitions.jsonl'
          current = 'collection'
          previous = None
          def snapshot():
              module = sys.modules.get('app.fastapi_app.factory')
              app = getattr(module, '_app_singleton', None)
              routes = getattr(app, 'routes', []) if app is not None else []
              auth = sorted((str(getattr(r, 'path', '')), str(sorted(getattr(r,'methods',[]) or []))) for r in routes if '/auth/' in str(getattr(r,'path','')))
              return {'id':id(app) if app is not None else None,'type':type(app).__name__,'pending':str(getattr(getattr(app,'state',None),'deferred_routes_pending',None)),'routes':len(routes),'auth':auth,'fast_start':os.environ.get('XCAGI_DESKTOP_FAST_START')}
          def record(phase, node):
              global previous
              state = snapshot()
              if state != previous or 'test_auth_subscription_register' in node:
                  with output.open('a') as f: f.write(json.dumps({'phase':phase,'node':node,'state':state})+'\n')
                  previous = state
          def pytest_runtest_logstart(nodeid, location):
              global current
              current = nodeid
              record('before', nodeid)
          def pytest_runtest_logfinish(nodeid, location):
              record('after', nodeid)
          def pytest_sessionstart(session):
              import app.fastapi_app.factory as factory
              real = factory.create_fastapi_app
              def observed(*a,**kw):
                  with output.open('a') as f: f.write(json.dumps({'phase':'factory-call','node':current,'fast_start':os.environ.get('XCAGI_DESKTOP_FAST_START'),'stack':traceback.format_stack(limit=18)})+'\n')
                  return real(*a,**kw)
              factory.create_fastapi_app = observed
          PY
      - name: Reproduce complete shard seven with original assertions
        working-directory: FHD
        env:
          BACKEND_SHARD_INDEX: '7'
          BACKEND_SHARD_TOTAL: '8'
          BACKEND_TIMINGS_FILE: metrics/backend_test_timings.json
          BACKEND_SOURCE_SHA: ef06416e9e0e8ceedcdffc72ad977ffdb2afee3d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          export PYTHONPATH="$RUNNER_TEMP/ci-isolation-evidence:${PYTHONPATH:-}"
          export BACKEND_SHARD_MANIFEST="$RUNNER_TEMP/ci-isolation-evidence/full.json"
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ci-isolation-evidence'
          command = [sys.executable,'-m','pytest','tests/','-v','-p','scripts.ci.backend_shards','-p','trace_app','--cov','--cov-branch','--cov-fail-under=0','--cov-report=','--junitxml='+str(out/'full.xml')]
          with (out/'pytest.txt').open('w') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, timeout=840)
          print('DIAGNOSTIC_PYTEST_EXIT',result.returncode,flush=True)
          print((out/'pytest.txt').read_text()[-20000:],flush=True)
          PY
      - name: Retain observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-isolation-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-isolation-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Clean only this disposable checkout
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/latency-clean-home" "$RUNNER_TEMP/latency-clean-tmp"
          HOME="$RUNNER_TEMP/latency-clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/latency-clean-tmp" python3 scripts/dev/clean_agent_workspace.py
          df -h .
