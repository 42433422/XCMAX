name: CI latency remaining-failure diagnosis
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ef06416e9e0e8ceedcdffc72ad977ffdb2afee3d
      XCAGI_SKIP_LEGACY_COMPAT_ROUTES: '1'
      INTENT_BENCHMARK_RUN: '1'
      XCAGI_SKIP_INTENT_LLM: '1'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            FHD/requirements-server-api.txt
            FHD/deploy/requirements-dev.txt
            FHD/pyproject.toml
            FHD/packages/**/pyproject.toml
      - name: Install the same backend dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server-api.txt
          pip install -r deploy/requirements-dev.txt
      - name: Preserve relevant instructions and test assembly sources
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p "$RUNNER_TEMP/ci-closure-evidence/sources"
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          dest = Path(os.environ['RUNNER_TEMP']) / 'ci-closure-evidence' / 'sources'
          files = {Path('AGENTS.md'), Path('FHD/tests/conftest.py'), Path('FHD/tests/fixtures/app_factory.py'), Path('FHD/tests/test_ci/test_backend_shards.py'), Path('FHD/app/fastapi_app/factory.py'), Path('FHD/app/fastapi_routes/__init__.py'), Path('FHD/app/fastapi_routes/domains/auth/routes.py')}
          for parent in ('FHD', 'FHD/tests', 'FHD/tests/test_ci', 'FHD/tests/fixtures', 'FHD/tests/test_routes', 'FHD/tests/test_fastapi_app'):
              files.add(Path(parent) / 'AGENTS.md')
          for p in Path('FHD/tests').rglob('*.py'):
              text = p.read_text(encoding='utf-8')
              if any(token in text for token in ('_app_singleton', 'create_fastapi_app', 'register_all_routes', 'app.routes.clear', 'app.router.routes')):
                  files.add(p)
          for p in sorted(files):
              if p.is_file():
                  out = dest / p
                  out.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, out)
          print('DIAGNOSTIC_SOURCE_FILES', len(list(dest.rglob('*.py'))))
          PY
      - name: Reproduce and align all backend CI contracts
        working-directory: FHD
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ci-closure-evidence'
          path = Path('tests/test_ci/test_backend_shards.py')
          command = [sys.executable, '-m', 'pytest', '--noconftest', '-c', '/dev/null', '-p', 'no:cacheprovider', str(path), '-q', '--tb=short']
          before = subprocess.run(command, capture_output=True, text=True)
          (out / 'contracts-before.txt').write_text(before.stdout + before.stderr)
          print('CONTRACTS_BEFORE', before.returncode, before.stdout[-5000:], flush=True)
          assert before.returncode == 1 and '3 failed' in before.stdout, 'Unexpected baseline contract failure set'
          text = path.read_text()
          old = 'prerequisites = {"guard-temp-scripts", "ssot-drift-gate", "classify"}'
          assert text.count(old) == 1
          text = text.replace(old, 'prerequisites = {"guard-temp-scripts", "classify"}')
          old = 'assert set(gate["needs"]) == {"classify", "backend-quality", "backend-test-shard"}'
          assert text.count(old) == 1
          text = text.replace(old, 'assert set(gate["needs"]) == prerequisites | {\n        "ssot-drift-gate", "backend-quality", "backend-test-shard"\n    }')
          text, count = re.subn(r'(?m)^( +)CLASSIFY="success",$', lambda m: m[1]+'GUARD="success",\n'+m[1]+'SSOT="success",\n'+m[0], text)
          assert count == 2, count
          path.write_text(text)
          subprocess.run([sys.executable, '-m', 'ruff', 'format', str(path)], check=True)
          after = subprocess.run(command, capture_output=True, text=True)
          (out / 'contracts-after.txt').write_text(after.stdout + after.stderr)
          print('CONTRACTS_AFTER', after.returncode, after.stdout[-5000:], flush=True)
          assert after.returncode == 0
          (out / 'candidate_test_backend_shards.py').write_text(path.read_text())
          PY
      - name: Compare isolated and all-collected auth tests without changing assertions
        working-directory: FHD
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ci-closure-evidence'
          cases = [('auth-alone', ['tests/test_routes/test_auth_subscription_register.py']), ('auth-all-collection', ['tests/', '-k', 'test_subscription_status_requires_login or test_subscription_status_trial or test_register_enriches_tenant_id'])]
          results = {}
          for name, args in cases:
              command = [sys.executable, '-m', 'pytest', *args, '-q', '--tb=short', '--junitxml='+str(out / (name+'.xml'))]
              result = subprocess.run(command, capture_output=True, text=True, timeout=240)
              (out / (name+'.txt')).write_text(result.stdout+result.stderr)
              print(name, result.returncode, result.stdout[-16000:], flush=True)
              results[name] = result.returncode
          (out / 'diagnosis.json').write_text(json.dumps(results, indent=2))
          PY
      - name: Upload diagnostic evidence, not product acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-closure-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-closure-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Clean only this disposable checkout
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/latency-clean-home" "$RUNNER_TEMP/latency-clean-tmp"
          HOME="$RUNNER_TEMP/latency-clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/latency-clean-tmp" python3 scripts/dev/clean_agent_workspace.py
          df -h .
