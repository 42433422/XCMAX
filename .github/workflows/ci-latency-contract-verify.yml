name: CI closure read-only evidence
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  observe:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OBSERVED_SHA: f43d8d1cca7ea414e9d49aa035a57c0a5bc8b31a
      OBSERVED_EVENT: pull_request
      OBSERVED_BASE: 2cb0c77dca3913955aa5cdcb8505fc0c8d496fe3
      EXPECTED_TREE: 296d89847b2b23d1b435744534716b5a695f2f8c
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OBSERVED_SHA }}
          fetch-depth: 1
          sparse-checkout: FHD/scripts/ci
          persist-credentials: false
      - name: Capture all checks, attempts and job timestamps without modifying refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime,json,os,subprocess,time,urllib.parse,urllib.request
          from pathlib import Path
          repo='42433422/XCMAX';head=os.environ['OBSERVED_SHA'];event=os.environ['OBSERVED_EVENT']
          out=Path(os.environ['RUNNER_TEMP'])/'ci-observation';out.mkdir(exist_ok=True)
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=45) as response:return json.load(response)
          def pages(path,key):
              result=[];count=0
              for page in range(1,21):
                  value=get(path+('&' if '?' in path else '?')+f'per_page=100&page={page}')
                  result.append(value);count+=len(value[key])
                  if count>=value['total_count']:
                      assert count==value['total_count'],(key,count,value['total_count'])
                      return result
                  assert value[key],(path,'unexpected empty page')
              raise AssertionError('Pagination safety limit exceeded: '+path)
          path='actions/runs?'+urllib.parse.urlencode({'head_sha':head,'event':event})
          for attempt in range(30):
              runs=[r for p in pages(path,'workflow_runs') for r in p['workflow_runs']]
              assert runs and all(r['head_sha']==head and r['event']==event for r in runs)
              pending=[{'id':r['id'],'status':r['status']} for r in runs if r['status']!='completed']
              failed=[r['id'] for r in runs if r['status']=='completed' and r['conclusion']!='success']
              print('OBSERVATION',attempt,'pending',pending,'unsuccessful',failed,flush=True)
              if failed or not pending:break
              time.sleep(30)
          branch=get('branches/main');required=branch['protection']['required_status_checks']
          assert required['checks'],'App-bound required checks unavailable'
          assert len({r['workflow_id'] for r in runs})==len(runs),'Repeated workflows require reconciliation'
          checks=pages(f'commits/{head}/check-runs?filter=all','check_runs')
          jobs=[pages(f"actions/runs/{r['id']}/jobs?filter=all",'jobs') for r in runs]
          snapshot={'repository':repo,'head_sha':head,'event':event,'required':required,'runs':runs,'checks':checks,'jobs':jobs,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'cache_state':'unknown'}
          identity={'head':head,'event':event,'main_at_observation':branch['commit']['sha']}
          if event=='pull_request':
              pr=get('pulls/2516')
              assert pr['head']['sha']==head,'PR advanced; old-head evidence is not current'
              assert pr['state']=='open' and not pr['merged'],'Capture PR identity before merge'
              snapshot.update(pull_request_number=2516,base_sha=os.environ['OBSERVED_BASE'])
              source=pr['merge_commit_sha'];commit=get('git/commits/'+source)
              assert commit['tree']['sha']==os.environ['EXPECTED_TREE'],'PR merge tree differs from verified tree'
              identity.update(merge_source=source,merge_tree=commit['tree']['sha'],pr_mergeable=pr['mergeable'],pr_draft=pr['draft'],pr_base_at_observation=pr['base']['sha'])
              (out/'pull-request.json').write_text(json.dumps(pr,indent=2))
          else:
              commit=get('git/commits/'+head)
              assert commit['tree']['sha']==os.environ['EXPECTED_TREE'],'Main tree differs from reviewed tree'
              identity.update(main_tree=commit['tree']['sha'])
          (out/'snapshot.json').write_text(json.dumps(snapshot,indent=2))
          (out/'identity.json').write_text(json.dumps(identity,indent=2))
          (out/'branch-protection-public.json').write_text(json.dumps(branch,indent=2))
          status=subprocess.run(['python','FHD/scripts/ci/measure_required_checks.py',str(out/'snapshot.json'),'--output',str(out/'required-report.json')])
          report=json.loads((out/'required-report.json').read_text())
          summary={'identity':identity,'required':report,'workflows':[{'id':r['id'],'name':r['name'],'status':r['status'],'conclusion':r['conclusion'],'created_at':r['created_at'],'run_attempt':r['run_attempt']} for r in runs]}
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,ensure_ascii=False),flush=True)
          assert status.returncode==0,'Required checks are not a complete successful sample'
          assert all(r['status']=='completed' and r['conclusion']=='success' for r in runs),'Some workflows are incomplete or unsuccessful'
          PY
      - name: Retain identity and timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-observation-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-observation/
          if-no-files-found: warn
          retention-days: 7
