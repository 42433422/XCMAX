name: CI closure current-main verification
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ef06416e9e0e8ceedcdffc72ad977ffdb2afee3d
      MAIN_SHA: 250bdb4ea32d3e19f6fc30ac4588acfc240db72a
      XCAGI_SKIP_LEGACY_COMPAT_ROUTES: '1'
      INTENT_BENCHMARK_RUN: '1'
      XCAGI_SKIP_INTENT_LLM: '1'
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Merge pinned main and preserve every unrelated upstream file
        run: |
          set -euo pipefail
          git config user.name 'CI verification'
          git config user.email 'ci-verification@users.noreply.github.com'
          git config core.quotepath false
          git status --short
          git worktree list --porcelain
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git fetch --no-tags origin "$MAIN_SHA"
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          main=os.environ['MAIN_SHA']
          out=Path(os.environ['RUNNER_TEMP'])/'ci-current-main';out.mkdir()
          assert not subprocess.check_output(['git','status','--porcelain'])
          result=subprocess.run(['git','merge','--no-commit','--no-ff',main],capture_output=True,text=True)
          print(result.stdout,result.stderr,flush=True)
          assert result.returncode in (0,1)
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().strip('\0').split('\0'))-{''}
          assert conflicts <= {'FHD/CHANGELOG.md','FHD/metrics/line_baseline.json'},conflicts
          heading='## Unreleased（1.0.0.6 候选，尚未发布）\n\n'
          entry='- 自动检查可与配置一致性校验并行启动，减少等待；配置校验失败时仍禁止通过和发布。同步后端分片门禁的守卫输入与依赖断言，保留主线的员工包测试隔离修复。\n\n'
          original=subprocess.check_output(['git','show',main+':FHD/CHANGELOG.md']).decode()
          assert original.count(heading)==1 and entry not in original
          Path('FHD/CHANGELOG.md').write_text(original.replace(heading,heading+entry,1))
          Path('FHD/metrics/line_baseline.json').write_bytes(subprocess.check_output(['git','show',main+':FHD/metrics/line_baseline.json']))
          for name in ('FHD/tests/test_infrastructure/test_mod_manager_branch_cov3.py','FHD/tests/test_routes/test_auth_subscription_register.py'):
              assert Path(name).read_bytes()==subprocess.check_output(['git','show',main+':'+name]),name
          subprocess.run(['git','add','FHD/CHANGELOG.md','FHD/metrics/line_baseline.json'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'])
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            FHD/requirements-server-api.txt
            FHD/deploy/requirements-dev.txt
            FHD/pyproject.toml
            FHD/packages/**/pyproject.toml
      - name: Install matching backend dependencies
        working-directory: FHD
        run: |
          python -m pip install -r requirements-server-api.txt
          python -m pip install -r deploy/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json
      - name: Install real runtime Mod compiler
        working-directory: FHD/frontend
        run: npm ci --no-audit --no-fund
      - name: Reproduce the three stale contract failures before repair
        working-directory: FHD
        run: |
          python - <<'PY'
          import os,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ci-current-main'
          prefix='tests/test_ci/test_backend_shards.py::'
          cases=['test_workflow_preserves_gates_and_uses_isolated_hosted_shards','test_aggregate_shell_result_semantics[success-success-false-True]','test_aggregate_shell_result_semantics[success-skipped-true-True]']
          env=dict(os.environ,PYTEST_DISABLE_PLUGIN_AUTOLOAD='1',PYTHONPATH='.')
          command=[sys.executable,'-m','pytest','--noconftest','-c','/dev/null','-p','no:cacheprovider',*[prefix+n for n in cases],'-q','--tb=short','--junitxml='+str(out/'contracts-before.xml')]
          result=subprocess.run(command,env=env,capture_output=True,text=True,timeout=120)
          (out/'contracts-before.txt').write_text(result.stdout+result.stderr)
          print(result.stdout,result.stderr,flush=True)
          failed={n.get('name') for n in ET.parse(out/'contracts-before.xml').iter('testcase') if n.find('failure') is not None}
          assert result.returncode==1 and failed==set(cases),failed
          PY
      - name: Repair stale contracts without weakening the final gates
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('FHD/tests/test_ci/test_backend_shards.py');text=p.read_text()
          old='prerequisites = {"guard-temp-scripts", "ssot-drift-gate", "classify"}'
          assert text.count(old)==1
          text=text.replace(old,'prerequisites = {"guard-temp-scripts", "classify"}')
          old='assert set(gate["needs"]) == {"classify", "backend-quality", "backend-test-shard"}'
          assert text.count(old)==1
          text=text.replace(old,'assert set(gate["needs"]) == prerequisites | {\n        "ssot-drift-gate", "backend-quality", "backend-test-shard"\n    }')
          text,count=re.subn(r'(?m)^( +)CLASSIFY="success",$',lambda m:m[1]+'GUARD="success",\n'+m[1]+'SSOT="success",\n'+m[0],text)
          assert count==2
          p.write_text(text)
          PY
          python -m ruff format FHD/tests/test_ci/test_backend_shards.py
          test "$(git hash-object FHD/tests/test_ci/test_backend_shards.py)" = f11c51cfadc5753b4ca3e006f05fb2bc376571c2
          python -m ruff check FHD/tests/test_ci/test_backend_shards.py
          git diff --check
      - name: Verify original route isolation and all affected CI contracts
        working-directory: FHD
        run: |
          set -euo pipefail
          python -m pytest tests/test_infrastructure/test_mod_manager_branch_cov3.py tests/test_routes/test_auth_subscription_register.py -q --tb=short --junitxml="$RUNNER_TEMP/ci-current-main/routes.xml"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest --noconftest -c /dev/null -p no:cacheprovider tests/test_ci/test_backend_shards.py tests/test_ci/test_workflow_gate_contracts.py tests/release_gate/test_admin_console_release_policy.py::test_fhd_release_chain_carries_and_verifies_admin_identity -q --junitxml="$RUNNER_TEMP/ci-current-main/contracts.xml"
          cd ..
          python -m scripts.dev.test_change_classifier
          python scripts/dev/publish_ci_workflows_to_root.py --check
      - name: Commit local merge and generator-only capability date reconciliation
        run: |
          set -euo pipefail
          git add FHD/tests/test_ci/test_backend_shards.py
          git commit -m 'Merge pinned main and close backend shard contract regressions'
          test "$(git rev-parse HEAD^1)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^2)" = "$MAIN_SHA"
          python '成都修茈科技有限公司/scripts/build_capability_center.py'
          python - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ci-current-main'
          names={'ai-chat-core','erp-inventory-warehouse','erp-sales-order','erp-shipment','erp-uom','ind-modstore-pay','pay-alipay','pay-backend-bridge'}
          allowed={'成都修茈科技有限公司/capabilities/feature/'+n+'.html' for n in names}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z']).decode().strip('\0').split('\0'))-{''}
          assert changed==allowed,changed
          for name in sorted(changed):
              before=subprocess.check_output(['git','show','HEAD:'+name]).decode();after=Path(name).read_text()
              assert re.sub(r'\d{4}-\d{2}-\d{2}','DATE',before)==re.sub(r'\d{4}-\d{2}-\d{2}','DATE',after),name
              assert len(before.splitlines())==len(after.splitlines()),name
          (out/'generated-date-reconciliation.patch').write_bytes(subprocess.check_output(['git','diff','--',*sorted(changed)]))
          subprocess.run(['git','add','--',*sorted(changed)],check=True)
          subprocess.run(['git','commit','-m','docs: regenerate upstream capability dates without changing content'],check=True)
          PY
          (cd FHD && python scripts/dev/check_net_deletion.py --update --force --reason '用户2026-10-22要求完整闭环CI并行改造；保留最终SSOT硬门禁与完整测试，补齐三项旧分片契约及守卫输入，净增39行；沿用主线路由隔离修复，八份能力页面仅生成器同步合入日期且不增行，不改产品权限、不降覆盖率。')
          git add FHD/metrics/line_baseline.json
          git commit -m 'chore(ci): record measured closure regression accounting'
          (cd FHD && python scripts/dev/push_preflight.py --fix --base "$MAIN_SHA")
          (cd FHD && python scripts/dev/ssot_cli.py gate)
          python -m ruff format --check FHD/tests/test_ci/test_backend_shards.py
          git diff --exit-code
          git diff --check "$MAIN_SHA" HEAD
      - name: Store only verified Git blobs and retain exact merge tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,shutil,subprocess,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'ci-current-main'
          target,main=os.environ['TARGET_SHA'],os.environ['MAIN_SHA']
          expected={'.github/workflows/fhd-ci-cd.yml','FHD/.github/workflows/ci-cd.yml','FHD/CHANGELOG.md','docs/CI_SSOT.md','FHD/metrics/line_baseline.json','FHD/tests/test_ci/test_workflow_gate_contracts.py','FHD/tests/release_gate/test_admin_console_release_policy.py','FHD/tests/test_ci/test_backend_shards.py'}
          expected|={'成都修茈科技有限公司/capabilities/feature/'+n+'.html' for n in ('ai-chat-core','erp-inventory-warehouse','erp-sales-order','erp-shipment','erp-uom','ind-modstore-pay','pay-alipay','pay-backend-bridge')}
          changed=set(subprocess.check_output(['git','diff','--name-only','-z',main,'HEAD']).decode().strip('\0').split('\0'))
          assert changed==expected,changed
          results={}
          for filename in ('routes.xml','contracts.xml'):
              suites=list(ET.parse(out/filename).iter('testsuite'))
              results[filename]={key:sum(int(s.get(key,0)) for s in suites) for key in ('tests','failures','errors','skipped')}
              assert results[filename]['failures']==results[filename]['errors']==results[filename]['skipped']==0,results
          elements=[]
          for name in sorted(changed):
              raw=Path(name).read_bytes();blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              payload=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/42433422/XCMAX/git/blobs',data=payload,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=45) as response:stored=json.load(response)
              assert stored['sha']==blob
              elements.append({'path':name,'mode':'100644','type':'blob','sha':blob})
              destination=out/'candidate'/name;destination.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(name,destination)
          receipt={'target':target,'main':main,'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'base_tree':subprocess.check_output(['git','rev-parse',main+'^{tree}'],text=True).strip(),'elements':elements,'tests':results,'baseline':json.loads(Path('FHD/metrics/line_baseline.json').read_text()),'refs_modified':False,'upstream_isolation_retained':True,'generated_pages':'eight date-only generator updates, zero line growth'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False))
          print('VERIFIED_OBJECT_HANDOFF',json.dumps(receipt,ensure_ascii=False),flush=True)
          PY
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-current-main-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-current-main/
          if-no-files-found: error
          retention-days: 7
      - name: Clean only this disposable checkout
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/latency-clean-home" "$RUNNER_TEMP/latency-clean-tmp"
          HOME="$RUNNER_TEMP/latency-clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/latency-clean-tmp" python3 scripts/dev/clean_agent_workspace.py
          df -h .
