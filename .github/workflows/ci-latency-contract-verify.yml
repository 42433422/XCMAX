name: CI latency main reconciliation verification
'on':
  push:
    branches: ['ci/latency-contract-verify-20261022']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-contract-verify-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: ec843482bc5e75461fcd1bea9188de8545ff556f
      MAIN_SHA: aff192308fd3e82afc8258e44958c22a1b8dac62
      PREVIOUS_MERGE: 9d6351c14d3e7ddba632b35ec7491859e52a2137
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install isolated verification tools
        run: python -m pip install 'pytest<10' pyyaml 'ruff>=0.8,<0.16'
      - name: Reconcile exact main and regenerate maintained-line accounting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin "$MAIN_SHA" "$PREVIOUS_MERGE"
          git config user.name 'CI verification'
          git config user.email 'ci-verification@users.noreply.github.com'
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          target, main = os.environ['TARGET_SHA'], os.environ['MAIN_SHA']
          result = subprocess.run(['git','merge','--no-commit','--no-ff',main], text=True, capture_output=True)
          print(result.stdout, result.stderr, flush=True)
          assert result.returncode in (0,1), 'Unexpected merge error'
          conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines())
          allowed = {'FHD/CHANGELOG.md','FHD/metrics/line_baseline.json'}
          assert conflicts <= allowed, f'Unreviewed merge conflicts: {conflicts}'
          print('MERGE_CONFLICTS', sorted(conflicts), flush=True)
          changelog = 'FHD/CHANGELOG.md'
          expected_log = subprocess.check_output(['git','show',os.environ['PREVIOUS_MERGE']+':'+changelog])
          if changelog in conflicts:
              Path(changelog).write_bytes(expected_log)
          assert Path(changelog).read_bytes() == expected_log, 'Must preserve both CI and upstream admin release notes'
          for name in ['FHD/admin-console/src/views/CustomerServiceTickets.css','ops/releases/c8c9c90ca47cbde6361c94b11cf5c94815b53147.json']:
              assert Path(name).read_bytes() == subprocess.check_output(['git','show',main+':'+name]), f'Upstream file modified: {name}'
          if 'FHD/metrics/line_baseline.json' in conflicts:
              Path('FHD/metrics/line_baseline.json').write_bytes(subprocess.check_output(['git','show',target+':FHD/metrics/line_baseline.json']))
          subprocess.run(['python','scripts/dev/check_net_deletion.py','--update'],cwd='FHD',check=True)
          subprocess.run(['git','add','FHD/CHANGELOG.md','FHD/metrics/line_baseline.json'],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).strip()
          subprocess.run(['git','commit','-m','Merge current main into CI parallel gates; preserve upstream release record'],check=True)
          parents = subprocess.check_output(['git','show','-s','--format=%P','HEAD'],text=True).split()
          assert parents == [target,main], parents
          PY
      - name: Verify reconciled tree and all unchanged gate contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --noconftest -c /dev/null -p no:cacheprovider FHD/tests/test_ci/test_workflow_gate_contracts.py FHD/tests/release_gate/test_admin_console_release_policy.py::test_fhd_release_chain_carries_and_verifies_admin_identity -q
          python -m scripts.dev.test_change_classifier
          python -m ruff check FHD/tests/release_gate/test_admin_console_release_policy.py FHD/tests/test_ci/test_workflow_gate_contracts.py
          python -m ruff format --check FHD/tests/release_gate/test_admin_console_release_policy.py FHD/tests/test_ci/test_workflow_gate_contracts.py
          python scripts/dev/publish_ci_workflows_to_root.py --check
          (cd FHD && python scripts/dev/push_preflight.py --fix --base "$MAIN_SHA")
          git diff --exit-code
          (cd FHD && python scripts/dev/ssot_cli.py gate)
          git diff --exit-code
          git diff --check "$MAIN_SHA" HEAD
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = {'.github/workflows/fhd-ci-cd.yml','FHD/.github/workflows/ci-cd.yml','FHD/CHANGELOG.md','FHD/docs/CI_SSOT.md','FHD/metrics/line_baseline.json','FHD/tests/test_ci/test_workflow_gate_contracts.py','FHD/tests/release_gate/test_admin_console_release_policy.py'}
          changed = set(subprocess.check_output(['git','diff','--name-only',os.environ['MAIN_SHA'],'HEAD'],text=True).splitlines())
          assert changed == expected, f'Unexpected scope: {changed}'
          print('VERIFIED_MERGE_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),flush=True)
          print('VERIFIED_BASELINE',Path('FHD/metrics/line_baseline.json').read_text(),flush=True)
          print('DIFF_FROM_PREVIOUS_MERGE',subprocess.check_output(['git','diff','--raw',os.environ['PREVIOUS_MERGE'],'HEAD'],text=True),flush=True)
          for name in sorted(changed | {'ops/releases/c8c9c90ca47cbde6361c94b11cf5c94815b53147.json','FHD/admin-console/src/views/CustomerServiceTickets.css'}):
              print('VERIFIED_BLOB',json.dumps({'path':name,'sha':subprocess.check_output(['git','hash-object',name],text=True).strip()}),flush=True)
          PY
      - name: Clean only this disposable checkout
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/latency-clean-home" "$RUNNER_TEMP/latency-clean-tmp"
          HOME="$RUNNER_TEMP/latency-clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/latency-clean-tmp" python3 scripts/dev/clean_agent_workspace.py
          df -h .
