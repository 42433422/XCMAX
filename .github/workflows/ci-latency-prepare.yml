name: CI latency exact-commit verification
'on':
  push:
    branches: ['ci/latency-prepare-20261022-v2']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == '42433422/XCMAX' && github.ref == 'refs/heads/ci/latency-prepare-20261022-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: a25e915680765efcb20f60b87d1a5e5a13124383
      BASE_SHA: c8c9c90ca47cbde6361c94b11cf5c94815b53147
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.TARGET_SHA }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install isolated verification tools
      run: python -m pip install pytest pyyaml ruff
    - name: Check exact identity and targeted regressions
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$TARGET_SHA"
        test "$(git rev-parse HEAD^{tree})" = de7d63316d5dbe65dc7d48ee55eb9ec970c4c50e
        python -m pytest -p no:cacheprovider --noconftest -c /dev/null FHD/tests/test_ci/test_workflow_gate_contracts.py -q
        python -m scripts.dev.test_change_classifier
        python -m ruff check FHD/tests/test_ci/test_workflow_gate_contracts.py
        python -m ruff format --check FHD/tests/test_ci/test_workflow_gate_contracts.py
        python scripts/dev/publish_ci_workflows_to_root.py --check
        (cd FHD && python scripts/dev/push_preflight.py --fix --base "$BASE_SHA")
        git diff --exit-code
        git diff --check "$BASE_SHA" HEAD
        git diff --stat "$BASE_SHA" HEAD
    - name: Validate GitHub Actions workflow syntax
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/fhd-ci-cd.yml
    - name: Clean only this disposable checkout
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/latency-clean-home" "$RUNNER_TEMP/latency-clean-tmp"
        HOME="$RUNNER_TEMP/latency-clean-home" XCMAX_CLEAN_TMP_ROOT="$RUNNER_TEMP/latency-clean-tmp" python3 scripts/dev/clean_agent_workspace.py
        df -h .
