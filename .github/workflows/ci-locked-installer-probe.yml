name: Isolated locked installer probe
on:
  push:
    branches: ['ci/probe-locked-installer-20261022']
    paths: ['.github/workflows/ci-locked-installer-probe.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5b052a95fd9deab27e37addf3374c4ff4ea248bf
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Prepare fixed-source experiment without changing product files
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: ${{ github.workspace }}/FHD
          PYTHONHASHSEED: '0'
        run: |
          python - <<'PY'
          import ast, hashlib, os, pathlib, subprocess, textwrap
          root = pathlib.Path.cwd()
          p = root / '.github/workflows/ci-locked-installer-probe.yml'
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == 'd9a2d275f5d669d86940a9a8c66de53f6baa476b'
          script = textwrap.dedent(raw.decode().split("          python - <<'PY'\n",1)[1].split('\n          PY\n',1)[0])
          old = "'-m','pytest','-q','-o','addopts=',"
          new = "'-m','pytest','-c','/dev/null','--rootdir=.','-q','-o','addopts=',"
          assert script.count(old) == 1
          script = script.replace(old,new).replace('699102f771b7d03661f0bbd9e67a1eec7edde2b4','a74823076ebea3afac3859ee256d20360b3aa73f')
          ast.parse(script)
          target = pathlib.Path(os.environ['RUNNER_TEMP'])/'run_pinned_installer_probe.py'
          target.write_text(script)
          print('Probe script SHA256:', hashlib.sha256(target.read_bytes()).hexdigest())
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin','a74823076ebea3afac3859ee256d20360b3aa73f'],check=True)
          subprocess.run(['git','checkout','--detach','a74823076ebea3afac3859ee256d20360b3aa73f'],check=True)
          PY
          cd FHD
          python "$RUNNER_TEMP/run_pinned_installer_probe.py"
      - name: Clean task-created runner caches
        if: always()
        run: |
          python3 scripts/dev/clean_agent_workspace.py
          df -h .
      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-locked-installer-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/installer-probe-evidence/
            ${{ runner.temp }}/run_pinned_installer_probe.py
          if-no-files-found: error
          retention-days: 7
