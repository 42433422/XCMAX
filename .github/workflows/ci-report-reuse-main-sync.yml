name: Verify report reuse integration with main 1ab42432
on:
  push:
    branches: [ci/publish-report-reuse-20261022-r1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PR_HEAD: a74823076ebea3afac3859ee256d20360b3aa73f
      TARGET_MAIN: 1ab4243239ee68e3c7884d0514b52ddcea727d2d
      CANDIDATE_BRANCH: ci/report-reuse-integrate-1ab42432-20261022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a74823076ebea3afac3859ee256d20360b3aa73f
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install fixed lightweight verification tools
        run: python -m pip install pytest==9.1.1 pytest-cov==7.1.0 coverage==7.16.2 PyYAML==6.0.3 ruff==0.15.22
      - name: Merge exact main without overwriting upstream fixes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test -z "$(git status --porcelain)"
          git worktree list
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/integration-evidence"
          set +e
          git -c core.hooksPath=/dev/null merge --no-ff --no-commit "$TARGET_MAIN"
          merge_status=$?
          set -e
          test "$merge_status" -le 1
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          git=lambda *args:subprocess.check_output(['git',*args],text=True)
          conflicts=set(git('diff','--name-only','--diff-filter=U').splitlines())
          allowed={'FHD/CHANGELOG.md','FHD/metrics/line_baseline.json'}
          assert conflicts and conflicts <= allowed,conflicts
          (Path(os.environ['RUNNER_TEMP'])/'integration-evidence/conflicts.txt').write_text('\n'.join(sorted(conflicts))+'\n')
          marker='## Unreleased（1.0.0.6 候选，尚未发布）\n\n'
          note='- 自动检查仅在同一次运行的测试范围与原始覆盖率数据完全一致时复用报告计算，仍分别执行两道覆盖率门槛；新增测试收集和执行分段计时。提速幅度以正式运行记录为准。\n\n'
          current=git('show',os.environ['TARGET_MAIN']+':FHD/CHANGELOG.md')
          previous=git('show',os.environ['PR_HEAD']+':FHD/CHANGELOG.md')
          assert current.count(marker)==1 and note in previous and note not in current
          Path('FHD/CHANGELOG.md').write_text(current.replace(marker,marker+note),encoding='utf-8')
          baseline=git('show',os.environ['TARGET_MAIN']+':FHD/metrics/line_baseline.json')
          Path('FHD/metrics/line_baseline.json').write_text(baseline,encoding='utf-8')
          for path in ('FHD/scripts/release/ticket_loop_ledger_check.py','FHD/tests/release_gate/test_ticket_loop_ledger_check.py'):
              expected=subprocess.check_output(['git','show',os.environ['TARGET_MAIN']+':'+path])
              assert Path(path).read_bytes()==expected,path
          for path in ('FHD/scripts/ci/backend_shard_aggregate.py','FHD/scripts/ci/backend_shard_plugin.py','FHD/tests/test_ci/test_backend_shard_aggregate.py'):
              expected=subprocess.check_output(['git','show',os.environ['PR_HEAD']+':'+path])
              assert Path(path).read_bytes()==expected,path
          PY
          cd FHD
          python scripts/dev/check_net_deletion.py --update --force --reason '2026-10-22 用户授权 CI 提速闭环：保留 main 1ab42432 的 #2524 工单证据硬门禁及回归；本 PR 仅复用同次同源相同覆盖率报告并记录阶段计时，含合成夹具隔离。相对该 main 净增141行，不删无关代码、不降低门槛。'
          git add CHANGELOG.md metrics/line_baseline.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'Merge protected main 1ab42432 and retain both verified CI and ticket-ledger changes'
      - name: Test CI contracts under the real parent timing profile
        working-directory: FHD
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          BACKEND_TIMINGS_FILE: metrics/backend_test_timings.json
        run: |
          set -euo pipefail
          printf '[pytest]\n' > "$RUNNER_TEMP/unit.ini"
          PYTHONPATH="$PWD" python -m pytest -c "$RUNNER_TEMP/unit.ini" --confcutdir=tests/test_ci tests/test_ci/test_backend_shards.py tests/test_ci/test_backend_shard_aggregate.py tests/test_ci/test_workflow_gate_contracts.py -q --junitxml="$RUNNER_TEMP/integration-evidence/ci-contracts.xml"
          PYTHONPATH="$PWD" python -m pytest -c "$RUNNER_TEMP/unit.ini" --noconftest tests/release_gate/test_ticket_loop_ledger_check.py -q --junitxml="$RUNNER_TEMP/integration-evidence/upstream-ticket-ledger.xml"
          python -m ruff check scripts/ci/backend_shard_aggregate.py scripts/ci/backend_shard_plugin.py tests/test_ci/test_backend_shard_aggregate.py scripts/release/ticket_loop_ledger_check.py tests/release_gate/test_ticket_loop_ledger_check.py
          python -m ruff format --check scripts/ci/backend_shard_aggregate.py scripts/ci/backend_shard_plugin.py tests/test_ci/test_backend_shard_aggregate.py scripts/release/ticket_loop_ledger_check.py tests/release_gate/test_ticket_loop_ledger_check.py
      - name: Enforce committed preflight and complete-history SSOT
        working-directory: FHD
        run: |
          set -euo pipefail
          python scripts/dev/push_preflight.py --fix --base "$TARGET_MAIN"
          python scripts/dev/ssot_cli.py gate
          test -z "$(git status --porcelain --untracked-files=no)"
          git diff --check "$TARGET_MAIN" HEAD
      - name: Verify exact scope and publish only a new candidate branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          paths=git('diff','--name-only',os.environ['TARGET_MAIN'],'HEAD').splitlines()
          expected={'FHD/CHANGELOG.md','FHD/metrics/line_baseline.json','FHD/scripts/ci/backend_shard_aggregate.py','FHD/scripts/ci/backend_shard_plugin.py','FHD/tests/test_ci/test_backend_shard_aggregate.py'}
          assert set(paths)==expected,paths
          assert git('rev-parse','HEAD^1')==os.environ['PR_HEAD']
          assert git('rev-parse','HEAD^2')==os.environ['TARGET_MAIN']
          assert json.loads(Path('FHD/metrics/line_baseline.json').read_text())['lines']==2328790
          out=Path(os.environ['RUNNER_TEMP'])/'integration-evidence'
          counts={}
          for filename in ('ci-contracts.xml','upstream-ticket-ledger.xml'):
              suites=list(ET.parse(out/filename).getroot().iter('testsuite'))
              assert all(int(s.get(k,'0'))==0 for s in suites for k in ('failures','errors','skipped'))
              counts[filename]=sum(int(s.get('tests','0')) for s in suites)
          assert counts['ci-contracts.xml']==287 and counts['upstream-ticket-ledger.xml']>0,counts
          receipt={'old_head':os.environ['PR_HEAD'],'main':os.environ['TARGET_MAIN'],'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'run':os.environ['GITHUB_RUN_ID'],'branch':os.environ['CANDIDATE_BRANCH'],'tests':counts,'files':{p:git('hash-object',p) for p in paths},'scope':'targeted integration checks, not new formal full CI'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
          test -z "$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH")"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
      - name: Clean task-owned caches
        if: always()
        run: |
          python3 scripts/dev/clean_agent_workspace.py
          df -h .
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-main-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/integration-evidence/
          if-no-files-found: error
          retention-days: 7
