name: CI report reuse isolated verification
on:
  push:
    branches: [ci/verify-report-reuse-20261022-r1]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: .ci-report-reuse
      - uses: actions/checkout@v4
        with:
          ref: 4a80c983b179c876bf43e9689910dcb9b218e6c2
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install exact lightweight verification toolchain
        run: python -m pip install pytest==9.1.1 pytest-cov==7.1.0 coverage==7.16.2 PyYAML==6.0.3 ruff==0.15.22
      - name: Prepare isolated candidate
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4a80c983b179c876bf43e9689910dcb9b218e6c2
          git status --porcelain
          git worktree list
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/baseline/scripts/ci"
          cp FHD/scripts/ci/backend_shard_aggregate.py "$RUNNER_TEMP/baseline/scripts/ci/backend_shard_aggregate.py"
          python ../harness/.ci-report-reuse/patch.py
          python -m ruff check --fix FHD/scripts/ci/backend_shard_aggregate.py FHD/scripts/ci/backend_shard_plugin.py FHD/tests/test_ci/test_backend_shard_aggregate.py
          python -m ruff format FHD/scripts/ci/backend_shard_aggregate.py FHD/scripts/ci/backend_shard_plugin.py FHD/tests/test_ci/test_backend_shard_aggregate.py
          git diff --check
      - name: Run real coverage and fail-closed contract regressions
        working-directory: source/FHD
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          printf '[pytest]\n' > "$RUNNER_TEMP/unit.ini"
          PYTHONPATH="$PWD" python -m pytest -c "$RUNNER_TEMP/unit.ini" --confcutdir=tests/test_ci tests/test_ci/test_backend_shards.py tests/test_ci/test_backend_shard_aggregate.py tests/test_ci/test_workflow_gate_contracts.py -q --junitxml="$RUNNER_TEMP/evidence/contracts.xml"
          python -m ruff check scripts/ci/backend_shard_aggregate.py scripts/ci/backend_shard_plugin.py tests/test_ci/test_backend_shard_aggregate.py
          python -m ruff format --check scripts/ci/backend_shard_aggregate.py scripts/ci/backend_shard_plugin.py tests/test_ci/test_backend_shard_aggregate.py
      - name: Commit locally and run mandatory preflight
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'CI verification'
          git config user.email 'ci-verification@users.noreply.github.com'
          git add FHD/scripts/ci/backend_shard_aggregate.py FHD/scripts/ci/backend_shard_plugin.py FHD/tests/test_ci/test_backend_shard_aggregate.py FHD/CHANGELOG.md
          git -c core.hooksPath=/dev/null commit -m 'ci: reuse equivalent coverage reports and measure collection phases'
          cd FHD
          python scripts/dev/check_net_deletion.py --update --force --reason 'User-authorized CI acceleration: exact-input report reuse, distinct-scope and tamper regressions, collection-phase timing; no threshold or test-scope reduction.'
          git add metrics/line_baseline.json
          git -c core.hooksPath=/dev/null commit -m 'Record explicit CI correctness and measurement line exception'
          python scripts/dev/push_preflight.py --fix --base 4a80c983b179c876bf43e9689910dcb9b218e6c2
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Download existing same-source raw coverage for paired replay
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: 42433422/XCMAX
          run-id: 39703375132
          pattern: backend-shard-1-*
          path: source/FHD/replay-shards
      - name: Compare baseline and candidate on identical evidence
        working-directory: source/FHD
        run: python ../../harness/.ci-report-reuse/replay.py
      - name: Export exact candidate and evidence
        working-directory: source
        run: |
          python - <<'PY'
          import json,os,shutil,subprocess
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'])/'evidence'
          paths=subprocess.check_output(['git','diff','--name-only','4a80c983b179c876bf43e9689910dcb9b218e6c2','HEAD'],text=True).splitlines()
          expected={'FHD/scripts/ci/backend_shard_aggregate.py','FHD/scripts/ci/backend_shard_plugin.py','FHD/tests/test_ci/test_backend_shard_aggregate.py','FHD/CHANGELOG.md','FHD/metrics/line_baseline.json'}
          assert set(paths)==expected,paths
          blobs={}
          for name in paths:
              dest=output/'candidate'/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(name,dest)
              blobs[name]=subprocess.check_output(['git','hash-object',name],text=True).strip()
          receipt={'base':'4a80c983b179c876bf43e9689910dcb9b218e6c2','base_tree':'100e545110df01146655b8bcc46e6bde70f65b70','tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':blobs,'scope':'targeted verification and historical-evidence replay, not new full CI'}
          (output/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Cleanup isolated working tree
        if: always()
        working-directory: source
        run: |
          python3 scripts/dev/clean_agent_workspace.py
          df -h .
      - name: Retain candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-reuse-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
