name: CI 2525 latest main integration verification
on:
  push:
    branches: ['ci/verify-aggregate-profile-fix-20261022']
    paths: ['.github/workflows/ci2525-integrate-main.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a74823076ebea3afac3859ee256d20360b3aa73f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked validation tools
        working-directory: FHD
        run: uv sync --frozen --extra server-api --extra dev
      - name: True merge, scoped reconciliation and verification
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONPATH: ${{ github.workspace }}/FHD
        run: |
          FHD/.venv/bin/python - <<'PY'
          import json, os, pathlib, shutil, subprocess, sys, xml.etree.ElementTree as ET
          repo=pathlib.Path.cwd(); fhd=repo/'FHD'; out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ci2525-main-integration';out.mkdir()
          head='a74823076ebea3afac3859ee256d20360b3aa73f'; main='1ab4243239ee68e3c7884d0514b52ddcea727d2d'; old='b9e6a5ee47b114b5e45d678123f0ca2d48a77e6f'
          def git(*args): return subprocess.check_output(['git',*args],cwd=repo,text=True).strip()
          def show(ref,path): return subprocess.check_output(['git','show',f'{ref}:{path}'],cwd=repo)
          def run(name,args,cwd=fhd,env=None):
              with (out/(name+'.log')).open('w') as log:
                  r=subprocess.run(args,cwd=cwd,env=env,stdout=log,stderr=subprocess.STDOUT,timeout=600)
              print(name,r.returncode,flush=True)
              if r.returncode:
                  print((out/(name+'.log')).read_text()[-8000:]);raise RuntimeError(name)
          assert git('rev-parse','HEAD')==head and not git('status','--porcelain')
          git('fetch','--no-tags','origin',main)
          assert git('merge-base',head,main)==old
          own=['FHD/scripts/ci/backend_shard_aggregate.py','FHD/scripts/ci/backend_shard_plugin.py','FHD/tests/test_ci/test_backend_shard_aggregate.py']
          upstream=['FHD/scripts/release/ticket_loop_ledger_check.py','FHD/tests/release_gate/test_ticket_loop_ledger_check.py']
          shared=['FHD/CHANGELOG.md','FHD/metrics/line_baseline.json']
          assert set(git('diff','--name-only',old,main).splitlines())==set(upstream+shared)
          git('config','user.name','CI integration verifier');git('config','user.email','ci-verification@users.noreply.github.com')
          merged=subprocess.run(['git','merge','--no-ff','--no-commit',main],cwd=repo,capture_output=True,text=True)
          (out/'merge.log').write_text(merged.stdout+merged.stderr)
          assert merged.returncode in (0,1)
          conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
          assert set(conflicts)<=set(shared), conflicts
          changelog='FHD/CHANGELOG.md'
          base_text=show(old,changelog).decode(); own_text=show(head,changelog).decode(); main_text=show(main,changelog).decode()
          marker='## Unreleased（1.0.0.6 候选，尚未发布）\n\n'
          assert all(t.count(marker)==1 for t in (base_text,own_text,main_text))
          prefix, suffix=base_text.split(marker,1)
          own_prefix,own_suffix=own_text.split(marker,1)
          assert own_prefix==prefix and own_suffix.endswith(suffix)
          entry=own_suffix[:-len(suffix)];assert entry.startswith('- 自动检查仅在同一次运行') and entry.count('\n')==2
          combined=main_text.replace(marker,marker+entry,1)
          (repo/changelog).write_text(combined)
          assert combined.replace(marker+entry,marker,1)==main_text
          baseline='FHD/metrics/line_baseline.json';(repo/baseline).write_bytes(show(main,baseline))
          for path in own: assert (repo/path).read_bytes()==show(head,path),path
          for path in upstream: assert (repo/path).read_bytes()==show(main,path),path
          # Resolve conflict stages before invoking the existing line-count generator.
          git('add','--',*shared)
          reason='用户2026-10-22授权CI提速完整闭环；合入main工单验收修复，保留其全部逻辑与回归；本批覆盖率等价报告复用、阶段计时及夹具隔离相对新main净增141行，不降低任何门槛。'
          run('baseline',[sys.executable,'scripts/dev/check_net_deletion.py','--update','--force','--reason',reason])
          git('add','--',baseline)
          git('commit','-m','Merge protected main into CI report reuse; preserve both validated batches')
          assert git('show','-s','--format=%P','HEAD').split()==[head,main]
          expected=set(own+shared)
          assert set(git('diff','--name-only',main,'HEAD').splitlines())==expected
          env=dict(os.environ,BACKEND_TIMINGS_FILE=str(fhd/'metrics/backend_test_timings.json'))
          contracts=['tests/test_ci/test_backend_shards.py','tests/test_ci/test_backend_shard_bootstrap.py','tests/test_ci/test_backend_shard_aggregate.py','tests/test_ci/test_workflow_gate_contracts.py']
          cmd=[sys.executable,'-m','pytest','-c','/dev/null','--rootdir=.','--confcutdir=tests/test_ci','-q','-o','addopts=']
          run('ci-contracts',cmd+contracts+[f'--junitxml={out}/ci-contracts.xml'],env=env)
          run('upstream-ledger',[sys.executable,'-m','pytest','-c','/dev/null','--rootdir=.','--confcutdir=tests/release_gate','-q','-o','addopts=','tests/release_gate/test_ticket_loop_ledger_check.py',f'--junitxml={out}/upstream-ledger.xml'])
          run('classifier',[sys.executable,'-m','unittest','discover','-s',str(repo/'scripts/dev'),' -p'.strip(),'test_change_classifier.py'],cwd=repo)
          run('ruff-check',[sys.executable,'-m','ruff','check',*map(lambda p:str(repo/p),own+upstream)])
          run('ruff-format',[sys.executable,'-m','ruff','format','--check',*map(lambda p:str(repo/p),own+upstream)])
          run('workflow-sync',[sys.executable,'scripts/dev/publish_ci_workflows_to_root.py','--check'],cwd=repo)
          run('preflight',[sys.executable,'scripts/dev/push_preflight.py','--fix','--base',main])
          run('ssot',[sys.executable,'scripts/dev/ssot_cli.py','gate'])
          run('diff-check',['git','diff','--check',main,'HEAD'],cwd=repo)
          assert not git('status','--porcelain','--untracked-files=no')
          receipt={'head_parent':head,'main_parent':main,'local_commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'conflicts':conflicts,'files':{},'tests':{},'upstream_preserved':upstream,'own_code_preserved':own,'baseline':json.loads((repo/baseline).read_text()),'scope':'exact integration tree targeted checks, not formal full CI'}
          for path in sorted(expected):
              dest=out/'candidate'/path;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(repo/path,dest);receipt['files'][path]=git('hash-object',path)
          for name in ('ci-contracts','upstream-ledger'):
              doc=ET.parse(out/f'{name}.xml'); counts={key:len(list(doc.iter(tag))) for key,tag in [('cases','testcase'),('failures','failure'),('errors','error'),('skipped','skipped')]}
              assert counts['cases'] and all(counts[k]==0 for k in ('failures','errors','skipped'));receipt['tests'][name]=counts
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2));print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY
      - name: Clean task-created runner caches
        if: always()
        run: |
          python3 scripts/dev/clean_agent_workspace.py
          df -h .
      - name: Retain exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2525-main-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/ci2525-main-integration/
          if-no-files-found: error
          retention-days: 7
