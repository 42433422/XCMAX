name: CI 2525 exact check observation
on:
  push:
    branches: ['ci/verify-aggregate-profile-fix-20261022']
    paths: ['.github/workflows/ci2525-required-observation.yml']
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a74823076ebea3afac3859ee256d20360b3aa73f
          persist-credentials: false
      - name: Record complete read-only GitHub snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, urllib.request
          from datetime import datetime, timezone
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ci2525-observation';out.mkdir()
          repo='42433422/XCMAX'; head='a74823076ebea3afac3859ee256d20360b3aa73f'
          api='https://api.github.com/repos/'+repo
          def get(path):
              request=urllib.request.Request(api+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=60) as response: return json.load(response)
          def pages(path,key):
              output=[];n=1;count=0
              while True:
                  page=get(path+('&' if '?' in path else '?')+'per_page=100&page='+str(n))
                  output.append(page);count+=len(page[key])
                  if count>=page['total_count']: break
                  assert page[key], 'Pagination ended before total_count'
                  n+=1
              assert count==page['total_count'], 'Pagination totals changed'
              return output
          branch=get('/branches/main');pr=get('/pulls/2525')
          (out/'branch.json').write_text(json.dumps(branch,indent=2));(out/'pr.json').write_text(json.dumps(pr,indent=2))
          assert pr['head']['sha']==head, 'PR head moved; do not reuse this result'
          required=branch['protection']['required_status_checks']
          assert len(required['checks'])==11 and all(r['app_id']==15368 for r in required['checks']), 'Required protection changed'
          run_pages=pages('/actions/runs?head_sha='+head+'&event=pull_request','workflow_runs')
          runs=[r for page in run_pages for r in page['workflow_runs']]
          jobs=[pages('/actions/runs/'+str(r['id'])+'/jobs?filter=all','jobs') for r in runs]
          checks=pages('/commits/'+head+'/check-runs?filter=all','check_runs')
          snapshot={'repository':repo,'head_sha':head,'event':'pull_request','pull_request_number':2525,'base_sha':pr['base']['sha'],'required':required,'runs':runs,'checks':checks,'jobs':jobs,'observed_at':datetime.now(timezone.utc).isoformat(),'cache_state':'unknown'}
          (out/'snapshot.json').write_text(json.dumps(snapshot,indent=2))
          result=subprocess.run([sys.executable,'FHD/scripts/ci/measure_required_checks.py',str(out/'snapshot.json'),'--output',str(out/'required-metrics.json')])
          metrics=json.loads((out/'required-metrics.json').read_text())
          print(json.dumps(metrics,indent=2))
          summary={'head_sha':head,'base_sha':pr['base']['sha'],'merge_source_sha':pr.get('merge_commit_sha'),'workflow_count':len(runs),'workflows':[{'id':r['id'],'name':r['name'],'status':r['status'],'conclusion':r['conclusion'],'attempt':r['run_attempt']} for r in runs],'all_workflows_success':all(r['status']=='completed' and r['conclusion']=='success' for r in runs),'required_status':metrics['status'],'required_success_seconds':metrics.get('success_seconds'),'merge_authorized':False}
          (out/'summary.json').write_text(json.dumps(summary,indent=2));print(json.dumps(summary,indent=2))
          if result.returncode: raise SystemExit(result.returncode)
          assert summary['all_workflows_success'], 'Required checks may be done, but a workflow remains incomplete'
          PY
      - name: Clean isolated checkout
        if: always()
        run: |
          python3 scripts/dev/clean_agent_workspace.py
          df -h .
      - name: Retain observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2525-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci2525-observation/
          if-no-files-found: error
          retention-days: 7
