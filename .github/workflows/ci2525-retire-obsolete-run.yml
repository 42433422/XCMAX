name: Retire superseded CI 2525 run
on:
  push:
    branches: ['ci/verify-aggregate-profile-fix-20261022']
    paths: ['.github/workflows/ci2525-retire-obsolete-run.yml']
permissions:
  contents: read
  actions: write
  pull-requests: read
jobs:
  retire-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard and finish cancellation of superseded PR run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request, urllib.error
          from datetime import datetime, timezone
          root='https://api.github.com/repos/42433422/XCMAX'
          old_id=39714351521; old_head='f54e9da02a0911a9962da09706c674a1ebfcd47f'
          new_id=39716406440; new_head='b13d5e2a72eae21f837d762e30572879becba42c'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'obsolete-run-retirement';out.mkdir()
          receipt={'old_run_id':old_id,'old_head':old_head,'new_run_id':new_id,'new_head':new_head,'status':'running','actions':[],'started_at':datetime.now(timezone.utc).isoformat()}
          def save(): (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          def request(path, method='GET'):
              req=urllib.request.Request(root+path,method=method,data=b'' if method=='POST' else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      payload=response.read();return response.status,json.loads(payload) if payload else {}
              except urllib.error.HTTPError as error:
                  if method=='POST' and error.code==409: return 409,{'already_finished_or_cancelling':True}
                  raise
          def get(path): return request(path)[1]
          def guard():
              pr=get('/pulls/2525');old=get('/actions/runs/'+str(old_id));new=get('/actions/runs/'+str(new_id))
              assert pr['state']=='open' and not pr['merged'] and pr['head']['sha']==new_head, 'Latest PR identity changed; no cancellation'
              assert old['head_sha']==old_head and new['head_sha']==new_head
              for run in (old,new):
                  assert run['event']=='pull_request' and run['head_branch']=='ci/coverage-report-reuse-20261022' and run['workflow_id']==291181631
                  assert any(p['number']==2525 for p in run['pull_requests'])
              assert new['created_at']>old['created_at'] and old_head!=pr['head']['sha']
              assert new['status'] in ('pending','queued','in_progress'), 'No active newer run to unblock'
              return old,new
          def post(action):
              guard()
              code,body=request('/actions/runs/'+str(old_id)+'/'+action,'POST')
              assert code in (202,409),code
              receipt['actions'].append({'action':action,'http_status':code,'at':datetime.now(timezone.utc).isoformat(),'response':body});save()
              print('Obsolete run only:',old_id,action,code,flush=True)
          def finish_wait(attempts):
              for _ in range(attempts):
                  current=get('/actions/runs/'+str(old_id))
                  if current['status']=='completed': return current
                  time.sleep(10)
              return current
          try:
              old,new=guard();receipt['before']={k:old.get(k) for k in ('status','conclusion','head_sha','event')}
              if old['status']=='completed':
                  receipt['status']='already_completed_no_write'
              else:
                  post('cancel')
                  current=finish_wait(6)
                  if current['status']!='completed':
                      # Force only after normal cancellation failed, and only
                      # final aggregate jobs remain. Never target current tests.
                      jobs=get('/actions/runs/'+str(old_id)+'/jobs?per_page=100&filter=latest')
                      assert jobs['total_count']==len(jobs['jobs'])
                      active=[j for j in jobs['jobs'] if j['status']!='completed']
                      assert active and {j['name'] for j in active}<={'backend-test','frontend-test'}, 'Unexpected active work; refuse force cancellation'
                      assert all(j['status']=='queued' for j in active), 'An old aggregate is executing; leave it intact'
                      receipt['stuck_aggregate_jobs']=[{'id':j['id'],'name':j['name'],'status':j['status']} for j in active]
                      post('force-cancel')
                      current=finish_wait(6)
                  receipt['after']={k:current.get(k) for k in ('status','conclusion','head_sha','event')}
                  assert current['status']=='completed', 'Cancellation requested but completion not confirmed'
                  receipt['status']='obsolete_run_retired'
              latest=get('/actions/runs/'+str(new_id))
              receipt['new_run_untouched']={k:latest.get(k) for k in ('id','head_sha','status','conclusion')}
          finally:
              if receipt['status']=='running':receipt['status']='incomplete'
              receipt['finished_at']=datetime.now(timezone.utc).isoformat();save();print(json.dumps(receipt,indent=2))
          PY
      - name: Retain cancellation receipt, never delete CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci2525-obsolete-run-retirement-${{ github.run_id }}
          path: ${{ runner.temp }}/obsolete-run-retirement/
          if-no-files-found: error
          retention-days: 7
