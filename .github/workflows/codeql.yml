name: CodeQL

# Matrix job names provide the two required CodeQL contexts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Keep the release scanner's CodeQL provenance fresh enough for the
    # required two-consecutive-day zero-finding proof.
    - cron: "17 18 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify ${{ matrix.language }} changed paths (unified classifier)
        id: paths
        if: github.event_name == 'pull_request'
        run: |
          # 统一分类器（scripts/dev/change_classifier.py）——禁止此处再写死路径正则。
          category="${{ matrix.language == 'python' && 'codeql_python' || 'codeql_javascript' }}"
          python scripts/dev/change_classifier.py --category "$category" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Initialize CodeQL
        if: github.event_name != 'pull_request' || steps.paths.outputs.run == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          # No packs: input — Actions resolves scope/name via GHCR only; in-repo
          # +./ packs are rejected. ETL dir_fd path-injection FPs are stripped
          # from the Python SARIF after analyze (see strip script below).

      - name: Perform CodeQL Analysis
        id: analyze
        if: github.event_name != 'pull_request' || steps.paths.outputs.run == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ matrix.language != 'python' }}
          output: codeql-sarif-out

      - name: Strip known-safe ETL dir_fd path-injection FPs (python)
        if: (github.event_name != 'pull_request' || steps.paths.outputs.run == 'true') && matrix.language == 'python'
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(codeql-sarif-out/**/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SARIF produced" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            python3 .github/codeql/strip_etl_dir_fd_path_injection_fps.py "$f"
          done

      - name: Upload CodeQL SARIF (python, filtered)
        if: (github.event_name != 'pull_request' || steps.paths.outputs.run == 'true') && matrix.language == 'python'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeql-sarif-out
          category: "/language:python"

      - name: Retain source locations and data flows for review
        if: github.event_name != 'pull_request' || steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif-out/**/*.sarif
          retention-days: 14
          if-no-files-found: error

      - name: No ${{ matrix.language }} changes (targeted skip)
        if: github.event_name == 'pull_request' && steps.paths.outputs.run != 'true'
        run: echo "No ${{ matrix.language }} source changes; CodeQL skipped for this PR; required check satisfied."

  security-no-new-critical-high:
    name: security-no-new-critical-high
    if: ${{ github.event_name == 'pull_request' }}
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - name: Fail closed on a newly introduced critical/high CodeQL alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: refs/heads/${{ github.base_ref }}
          PR_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          export_alerts() {
            local ref="$1"
            local output="$2"
            gh api --paginate --slurp -X GET \
              "repos/${GH_REPO}/code-scanning/alerts" \
              -f state=open -f "ref=${ref}" -f per_page=100 \
              | jq '[.[][] | select(
                  ((.rule.security_severity_level // "") | ascii_downcase)
                  as $severity | $severity == "critical" or $severity == "high"
                ) | {
                  number,
                  rule_id:.rule.id,
                  path:.most_recent_instance.location.path,
                  start_line:.most_recent_instance.location.start_line,
                  end_line:.most_recent_instance.location.end_line,
                  message:.most_recent_instance.message.text
                }]' \
              > "$output"
          }
          export_alerts "$BASE_REF" base.json
          export_alerts "$PR_REF" pr.json
          jq -n --slurpfile base base.json --slurpfile pr pr.json '
            ($base[0] | map(.number)) as $known
            | ($pr[0] | map(select((.number as $number | $known | index($number)) == null))) as $new
            | {
                schema:"security-no-new-critical-high/v1",
                base_ref:env.BASE_REF,
                pr_ref:env.PR_REF,
                base_blocking_count:($base[0] | length),
                pr_blocking_count:($pr[0] | length),
                new_blocking:$new,
                passed:($new | length == 0)
              }
          ' > security-no-new-critical-high.json
          jq . security-no-new-critical-high.json
          jq -e '.passed == true' security-no-new-critical-high.json >/dev/null || {
            echo "::error::This pull request introduces a new critical/high CodeQL alert."
            exit 1
          }
      - name: Retain the no-new-alert decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-no-new-critical-high-${{ github.event.pull_request.number }}
          path: security-no-new-critical-high.json
          retention-days: 120
          if-no-files-found: error
