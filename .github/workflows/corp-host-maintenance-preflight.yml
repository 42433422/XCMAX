name: FHD host maintenance preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fhd-host-maintenance-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect fixed production metadata without maintenance actions
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.FHD_PUSH_HOST }}
          username: root
          key: ${{ secrets.FHD_PUSH_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            timeout --kill-after=25s 180s python3 - <<'PY'
            import datetime
            import json
            import fcntl
            import hashlib
            import os
            import shutil
            import re
            import stat
            import subprocess
            import selectors
            import time
            import uuid
            import signal
            import sys
            from pathlib import Path

            class ProbeInterrupted(BaseException):
                pass

            def interrupted(signum, frame):
                raise ProbeInterrupted("probe_interrupted")

            signal.signal(signal.SIGTERM, interrupted)
            signal.signal(signal.SIGINT, interrupted)
            probe_deadline = time.monotonic() + 150
            errors = []
            def emit(label, value):
                print(json.dumps({"check": label, "value": value}, ensure_ascii=True), flush=True)

            def command(label, args, accepted=(0,)):
                try:
                    result = subprocess.run(args, capture_output=True, text=True, timeout=15,
                                            env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"})
                    if result.returncode not in accepted:
                        raise ValueError("command_failed")
                    emit(label, result.stdout.strip())
                except (OSError, ValueError, subprocess.TimeoutExpired) as exc:
                    errors.append(label)
                    emit(label, {"error": type(exc).__name__})

            def fixed_value(path, pattern):
                try:
                    if path.is_symlink() or not stat.S_ISREG(path.stat().st_mode) or path.stat().st_size > 16384:
                        raise ValueError("unsafe_metadata")
                    value = path.read_text()
                    match = re.search(pattern, value, re.MULTILINE)
                    emit(str(path), match.group(1) if match else "unknown_format")
                except FileNotFoundError:
                    emit(str(path), "missing")
                except (OSError, UnicodeError, ValueError):
                    errors.append(str(path))
                    emit(str(path), "unreadable_or_invalid")

            def validator_version(tool, search_path):
                binary = shutil.which(tool, path=search_path)
                result = {"path": binary, "version": "unknown"}
                if binary:
                    try:
                        completed = subprocess.run([binary, "--version"], capture_output=True, text=True,
                                                   timeout=15, env={"PATH": search_path, "LC_ALL": "C"})
                        match = re.fullmatch(re.escape(tool) + r" \(PostgreSQL\) ([0-9]+(?:\.[0-9]+){0,2})(?: [^\r\n]*)?\s*", completed.stdout)
                        if completed.returncode == 0 and match:
                            result["version"] = match[1]
                    except (OSError, UnicodeError, subprocess.TimeoutExpired):
                        pass
                emit(tool + "_host_candidate", result)
                return binary

            def run_validator(args, stdin=None, timeout=15):
                detail = bytearray()
                with subprocess.Popen(args, stdin=stdin, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                                      env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"}) as process:
                    try:
                        deadline = time.monotonic() + timeout
                        with selectors.DefaultSelector() as selector:
                            selector.register(process.stderr, selectors.EVENT_READ)
                            while True:
                                if time.monotonic() >= deadline:
                                    raise subprocess.TimeoutExpired(args, timeout)
                                if selector.select(timeout=0.1):
                                    chunk = os.read(process.stderr.fileno(), 4096)
                                    if not chunk:
                                        break
                                    detail.extend(chunk[:max(0, 4096 - len(detail))])
                        return process.wait(timeout=max(0.01, deadline - time.monotonic())), bytes(detail)
                    finally:
                        if process.poll() is None:
                            process.kill()
                            process.wait()

            def validate_archive(binary, option, path):
                result = {"file": path.name, "exitcode": None, "category": "missing_tool"}
                if not binary:
                    return result
                try:
                    exitcode, detail = run_validator([binary, option, str(path)])
                    result["exitcode"] = exitcode
                    result["category"] = "ok" if exitcode == 0 else "other"
                    if exitcode:
                        # Classify locally; never publish raw stderr, untrusted names or SQL.
                        detail = detail.lower()
                        for phrase, category in ((b"unsupported version", "unsupported_version"),
                                                 (b"magic string", "bad_magic"),
                                                 (b"permission denied", "permission")):
                            if phrase in detail:
                                result["category"] = category
                                break
                except subprocess.TimeoutExpired:
                    result["category"] = "timeout"
                except OSError:
                    result["category"] = "execution_error"
                return result

            def container_create_args(image_id, declared):
                # Docker's exact-path tmpfs replaces the image VOLUME without an anonymous volume.
                if not re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
                    raise ValueError("invalid_image_id")
                mounts = []
                if declared is not None and declared != {}:
                    if (not isinstance(declared, dict) or len(declared) != 1
                            or next(iter(declared)) not in ("/var/lib/postgresql/data", "/var/lib/postgresql")
                            or next(iter(declared.values())) != {}):
                        raise ValueError("candidate_rejected_declared_volumes")
                    mounts = ["--tmpfs=" + next(iter(declared)) + ":ro,nosuid,nodev,noexec,size=65536,mode=0555"]
                return ["docker", "create", "--pull=never", "--network=none", "--read-only", "--no-healthcheck", "--log-driver=none",
                        "--cap-drop=ALL", "--security-opt=no-new-privileges", "--pids-limit=32",
                        "--memory=128m", "--user=65534:65534", "-i", "--entrypoint=pg_restore"] + mounts + [image_id]

            def create_probe_container(args, name, deadline):
                def run(command):
                    timeout = min(15, deadline - time.monotonic())
                    if timeout <= 0:
                        raise subprocess.TimeoutExpired(command, 15)
                    return subprocess.run(command, capture_output=True, text=True, timeout=timeout,
                                          env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"})
                if args[-1] not in ("--version", "--list"):
                    raise ValueError("invalid_reader_option")
                created = run(args[:2] + ["--name=" + name] + args[2:])
                if created.returncode:
                    raise ValueError("container_create_failed")
                inspected = run(["docker", "inspect", "--format", "{{json .}}", name])
                if inspected.returncode:
                    raise ValueError("container_inspection_unverified")
                info = json.loads(inspected.stdout)
                if not isinstance(info, dict):
                    raise ValueError("container_inspection_unverified")
                config, host, state = info.get("Config"), info.get("HostConfig"), info.get("State")
                if (not all(isinstance(item, dict) for item in (config, host, state))
                        or not isinstance(config.get("Healthcheck"), dict) or not isinstance(host.get("LogConfig"), dict)):
                    raise ValueError("container_inspection_unverified")
                tmpfs = dict(arg[len("--tmpfs="):].split(":", 1) for arg in args if arg.startswith("--tmpfs="))
                mounts = info.get("Mounts")
                if (info.get("Image") != args[-2] or config.get("Image") != args[-2]
                        or info.get("Name") != "/" + name or state.get("Status") != "created" or state.get("Running") is not False
                        or config.get("Entrypoint") != ["pg_restore"] or config.get("Cmd") != [args[-1]]
                        or config.get("User") != "65534:65534" or config.get("OpenStdin") is not True
                        or config.get("Tty") is not False or config["Healthcheck"].get("Test") != ["NONE"]
                        or config.get("Volumes") is not None and not isinstance(config["Volumes"], dict)
                        or (config.get("Volumes") or {}) != {path: {} for path in tmpfs}
                        or host.get("NetworkMode") != "none" or host.get("ReadonlyRootfs") is not True
                        or host.get("Privileged") is not False or host.get("CapDrop") != ["ALL"]
                        or host.get("SecurityOpt") != ["no-new-privileges"] or host.get("CapAdd")
                        or host.get("PidsLimit") != 32 or host.get("Memory") != 134217728
                        or host["LogConfig"].get("Type") != "none" or host["LogConfig"].get("Config") not in (None, {})
                        or host.get("Binds") or host.get("VolumesFrom") or host.get("Mounts")
                        or host.get("Devices") or host.get("DeviceRequests") or host.get("PortBindings")
                        or host.get("Tmpfs") is not None and not isinstance(host["Tmpfs"], dict)
                        or (host.get("Tmpfs") or {}) != tmpfs or not isinstance(mounts, list)
                        or any(not isinstance(m, dict) or m.get("Type") != "tmpfs"
                               or m.get("Destination") not in tmpfs or m.get("Source") or m.get("RW") is not False
                               for m in mounts)):
                    raise ValueError("container_isolation_unverified")
                return info

            def container_command(args, *, stdin=None, version=False):
                # Bound create/inspect/start together and reserve 15 seconds for unique-container cleanup.
                if time.monotonic() + 60 > probe_deadline:
                    raise subprocess.TimeoutExpired(args, 15)
                name = "xcmax-backup-probe-" + uuid.uuid4().hex
                deadline = min(probe_deadline - 15, time.monotonic() + 45)
                try:
                    create_probe_container(args, name, deadline)
                    timeout = min(15, deadline - time.monotonic())
                    if timeout <= 0:
                        raise subprocess.TimeoutExpired(args, 15)
                    start = ["docker", "start", "--attach", "--interactive", name]
                    if version:
                        return subprocess.run(start, capture_output=True, text=True, timeout=timeout,
                                              env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"})
                    return run_validator(start, stdin=stdin, timeout=timeout)
                finally:
                    was_interrupted = isinstance(sys.exc_info()[1], ProbeInterrupted)
                    previous = {sig: signal.signal(sig, signal.SIG_IGN) for sig in (signal.SIGTERM, signal.SIGINT)}
                    try:
                        cleanup = subprocess.run(["docker", "rm", "--force", "--volumes", name], stdout=subprocess.DEVNULL,
                                                 stderr=subprocess.DEVNULL, timeout=15,
                                                 env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"})
                        if cleanup.returncode != 0:
                            raise ValueError("container_cleanup_unverified")
                    except (OSError, ValueError, subprocess.TimeoutExpired):
                        errors.append("container_cleanup_unverified")
                        if not was_interrupted:
                            raise ValueError("container_cleanup_unverified")
                    finally:
                        for sig, handler in previous.items():
                            signal.signal(sig, handler)

            def container_restore_candidates():
                # Parse two literal image values only. Never evaluate shell configuration.
                keys = ("OPS_PG_DUMP_CONTAINER_IMAGE", "OPS_PAYMENT_PG_DUMP_CONTAINER_IMAGE")
                candidates = {}
                try:
                    config = Path("/etc/xcmax-ops.env")
                    with open(config, "rb", opener=lambda p, f: os.open(p, f | os.O_NOFOLLOW | os.O_NONBLOCK)) as stream:
                        info = os.fstat(stream.fileno())
                        if not stat.S_ISREG(info.st_mode) or info.st_size > 65536:
                            raise ValueError("unsafe_config")
                        raw = stream.read(65537)
                        after = os.fstat(stream.fileno())
                        if (len(raw) > 65536 or len(raw) != info.st_size
                                or (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
                                != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns)):
                            raise ValueError("config_changed_during_read")
                        content = raw.decode("utf-8")
                    for key in keys:
                        # A malformed or empty dedicated setting must never mean "not configured".
                        lines = [line for line in content.splitlines() if not line.lstrip().startswith("#")
                                 and re.search(r"\b" + re.escape(key) + r"\b", line)]
                        values = [line[len(key) + 1:] for line in lines if line.startswith(key + "=")]
                        result = {"key": key, "status": "not_configured", "version": "unknown"}
                        candidates[key] = result
                        if lines:
                            value = values[0].strip() if values else ""
                            if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                                value = value[1:-1]
                            # No options, whitespace, shell expansion or registry credentials.
                            if len(lines) != 1 or len(values) != 1 or not re.fullmatch(r"[a-zA-Z0-9][a-zA-Z0-9._/:@-]{0,255}", value):
                                result["status"] = "invalid_config"
                            else:
                                result["status"] = "installed_image_unknown"
                                args = ["docker", "image", "inspect", "--format", "{{.Id}}", value]
                                completed = subprocess.run(args, capture_output=True, text=True, timeout=15,
                                                           env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"})
                                image_id = completed.stdout.strip()
                                if completed.returncode == 0 and re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
                                    try:
                                        volumes = subprocess.run(
                                            ["docker", "image", "inspect", "--format", "{{json .Config.Volumes}}", image_id],
                                            capture_output=True, text=True, timeout=15,
                                            env={"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "LC_ALL": "C"})
                                        declared = json.loads(volumes.stdout) if volumes.returncode == 0 else "unknown"
                                    except (OSError, ValueError, subprocess.TimeoutExpired):
                                        declared = "unknown"
                                    try:
                                        args = container_create_args(image_id, declared)
                                    except ValueError:
                                        result["status"] = "candidate_rejected_declared_volumes"
                                        emit("pg_restore_container_candidate", result)
                                        continue
                                    result["status"] = "candidate_execution_unverified"
                                    try:
                                        completed = container_command(args + ["--version"], version=True)
                                        match = re.fullmatch(r"pg_restore \(PostgreSQL\) ([0-9]+(?:\.[0-9]+){0,2})(?: [^\r\n]*)?\s*", completed.stdout)
                                        if completed.returncode == 0 and match:
                                            result.update(status="candidate_available", version=match[1], image_id=image_id, args=args)
                                    except (OSError, ValueError, subprocess.TimeoutExpired):
                                        pass
                        emit("pg_restore_container_candidate", {k: v for k, v in result.items() if k != "args"})
                except FileNotFoundError:
                    emit("container_config", "missing_config_or_docker")
                except (OSError, UnicodeError, ValueError, subprocess.TimeoutExpired):
                    emit("container_config", "unreadable_invalid_or_timed_out")
                return candidates

            def validate_container_archive(args, path):
                result = {"file": path.name, "exitcode": None, "category": "unknown"}
                try:
                    # No bind mounts, DB credentials, network or SQL execution; discard the TOC.
                    with open(path, "rb", opener=lambda p, f: os.open(p, f | os.O_NOFOLLOW)) as stream:
                        exitcode, detail = container_command(args + ["--list"], stdin=stream)
                    result.update(exitcode=exitcode, category="ok" if exitcode == 0 else "other")
                    if exitcode and b"unsupported version" in detail.lower():
                        result["category"] = "unsupported_version"
                except subprocess.TimeoutExpired:
                    result["category"] = "timeout"
                except OSError:
                    result["category"] = "execution_error"
                except ValueError:
                    result["category"] = "container_verification_failed"
                return result

            def verify_latest_backup():
                names = ("fhd_pg.dump", "modstore_pg.dump", "payment_pg.dump",
                         "modstore_sqlite.db.gz", "configs.tar.gz")
                root = Path("/var/backups/xcmax/daily")
                status = {"status": "unknown", "reason": "not_checked"}
                try:
                    # Share the writer's existing lock without creating or truncating it.
                    with open(Path("/tmp/xcmax-backup.lock"), "rb", opener=lambda p, f: os.open(p, f | os.O_NOFOLLOW)) as lock:
                        if not stat.S_ISREG(os.fstat(lock.fileno()).st_mode):
                            raise ValueError("unsafe_lock")
                        fcntl.flock(lock, fcntl.LOCK_SH | fcntl.LOCK_NB)
                        if root.resolve() != root:
                            raise ValueError("unsafe_backup_root")
                        directories = sorted((p for p in root.iterdir() if re.fullmatch(r"\d{8}", p.name)
                                              and not p.is_symlink() and p.is_dir()), reverse=True)
                        completed = [p for p in directories if (p / "MANIFEST.txt").exists()]
                        if not completed:
                            raise ValueError("no_completed_snapshot")
                        directory = completed[0]
                        status["snapshot"] = directory.name
                        paths = [directory / name for name in ("MANIFEST.txt",) + names]
                        before = {}
                        for path in paths:
                            info = path.lstat()
                            if not stat.S_ISREG(info.st_mode) or info.st_size == 0:
                                raise ValueError("unsafe_or_empty_backup_file")
                            before[path.name] = (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
                        manifest = paths[0]
                        age = datetime.datetime.now(datetime.timezone.utc).timestamp() - manifest.stat().st_mtime
                        if not -300 <= age <= 26 * 3600 or manifest.stat().st_size > 16384:
                            raise ValueError("stale_or_invalid_manifest")
                        expected, seen = {}, set()
                        summary = dict.fromkeys(("line_count", "format_valid_count", "allowlisted_count",
                                                 "duplicate_count", "unknown_name_count", "invalid_format_count"), 0)
                        for line in manifest.read_text().splitlines():
                            summary["line_count"] += 1
                            match = re.fullmatch(r"([0-9a-f]{64}) [ *](?:\./)?(.+)", line)
                            if not match:
                                summary["invalid_format_count"] += 1
                                continue
                            summary["format_valid_count"] += 1
                            name = match[2]
                            if name in seen:
                                summary["duplicate_count"] += 1
                            else:
                                seen.add(name)
                            if name not in names:
                                summary["unknown_name_count"] += 1
                                continue
                            summary["allowlisted_count"] += 1
                            expected.setdefault(name, match[1])
                        summary["missing_expected_count"] = len(set(names) - set(expected))
                        emit("manifest_summary", summary)
                        if any(summary[key] for key in ("invalid_format_count", "duplicate_count", "unknown_name_count")):
                            raise ValueError("invalid_manifest_entries")
                        if set(expected) != set(names):
                            raise ValueError("incomplete_manifest")
                        for name in names:
                            digest = hashlib.sha256()
                            with open(directory / name, "rb", opener=lambda p, f: os.open(p, f | os.O_NOFOLLOW)) as stream:
                                for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                                    digest.update(chunk)
                            if digest.hexdigest() != expected[name]:
                                raise ValueError("checksum_mismatch")
                        restore = validator_version("pg_restore", "/usr/pgsql-16/bin:/usr/sbin:/usr/bin:/sbin:/bin")
                        emit("writer_version_limit", "Installed configured candidates are not proof of the historical dump producer; readability is not a restore test.")
                        containers = container_restore_candidates()
                        archive_versions = {}
                        for name in names[:3]:
                            with open(directory / name, "rb", opener=lambda p, f: os.open(p, f | os.O_NOFOLLOW)) as stream:
                                header = stream.read(8)
                            valid = len(header) == 8 and header[:5] == b"PGDMP"
                            version = [header[5], header[6], 0 if header[5:7] == b"\x01\x00" else header[7]] if valid else None
                            archive_versions[name] = version
                            emit("archive_format", {"file": name, "magic": "PGDMP" if valid else "unknown", "version": version})
                        commands = [("pg_restore", "--list", name) for name in names[:3]]
                        commands += [("gzip", "-t", names[3]), ("tar", "-tzf", names[4])]
                        results = []
                        for tool, option, name in commands:
                            binary = restore if tool == "pg_restore" else shutil.which(tool, path="/usr/sbin:/usr/bin:/sbin:/bin")
                            result = validate_archive(binary, option, directory / name)
                            result["tool"] = tool
                            emit("archive_validator", result)
                            if tool == "pg_restore" and result["category"] != "ok":
                                key = "OPS_PAYMENT_PG_DUMP_CONTAINER_IMAGE" if name == "payment_pg.dump" else "OPS_PG_DUMP_CONTAINER_IMAGE"
                                reader = containers.get(key, {})
                                general = containers.get("OPS_PG_DUMP_CONTAINER_IMAGE", {})
                                if (name == "payment_pg.dump" and reader.get("status") == "not_configured"
                                        and result["category"] == "unsupported_version" and archive_versions[name] == [1, 15, 0]
                                        and general.get("status") == "candidate_available" and int(general["version"].split(".")[0]) >= 16):
                                    reader = general
                                    emit("container_reader_selection", {"file": name, "key": reader["key"],
                                         "version": reader["version"], "image_id": reader["image_id"],
                                         "reason": "unconfigured_payment_reader_archive_1_15"})
                                if reader.get("status") == "candidate_available":
                                    candidate = validate_container_archive(reader["args"], directory / name)
                                    emit("container_archive_validator", candidate)
                                    if candidate["category"] == "ok":
                                        result = candidate
                            results.append(result)
                        for path in paths:
                            info = path.lstat()
                            after = (info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns)
                            if not stat.S_ISREG(info.st_mode) or after != before[path.name]:
                                raise ValueError("snapshot_changed_during_check")
                        if "container_cleanup_unverified" in errors:
                            raise ValueError("container_cleanup_unverified")
                        failed = [r for r in results if r["category"] != "ok"]
                        if failed:
                            raise ValueError("archive_validator_failed_or_unknown")
                        status.update(status="verified", reason="hashes_and_archive_readability_only")
                except BlockingIOError:
                    status["reason"] = "backup_writer_busy"
                except FileNotFoundError:
                    status["reason"] = "required_file_or_lock_missing"
                except (OSError, UnicodeError, subprocess.TimeoutExpired):
                    status["reason"] = "read_or_validation_error"
                except ValueError as exc:
                    status["reason"] = str(exc)
                if status["status"] != "verified":
                    errors.append("backup_integrity")
                emit("backup_integrity", status)

            emit("snapshot_started", datetime.datetime.now(datetime.timezone.utc).isoformat())
            command("running_kernel", ["uname", "-r"])
            command("installed_kernels", ["rpm", "-q", "kernel", "kernel-core", "--qf", "%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n"])
            command("default_kernel", ["grubby", "--default-kernel"])
            command("disk_bytes", ["df", "-B1", "--output=target,size,used,avail,pcent", "/", "/boot"])
            command("disk_inodes", ["df", "--output=target,itotal,iused,iavail,ipcent", "/", "/boot"])
            verify_latest_backup()
            for name in ("backup_last_success", "offsite_ssh_last_success"):
                fixed_value(Path("/var/lib/xcmax-ops/state") / name, r"\A([0-9]{1,12})\s*\Z")
            fixed_value(Path("/etc/xcmax-dr-runtime-role.env"),
                        r"^XCMAX_DR_SAVED_RUNTIME_MODE=(standby|active-peer|primary)\s*$")
            fixed_value(Path("/etc/xcmax-dr-auto-failover.env"), r"^OPS_DR_AUTO_FAILOVER_ENABLED=([01])\s*$")
            for unit in ("fhd-full", "modstore", "postgresql", "nginx", "xcmax-dr-failover-guard.timer"):
                command("unit_" + unit, ["systemctl", "show", unit, "--property=LoadState,ActiveState,SubState"])
            emit("limits", "Host and backup metadata checked; archive readability is not a restore proof. Remote DR state, cloud snapshots and rescue console remain unverified. This is not maintenance clearance.")
            emit("failed_checks", errors)
            raise SystemExit(bool(errors))
            PY
