# 官网静态（xiu-ci.com）：developer.html、logo-river assets、styles.css、nginx root。
# 与 market-live-deploy（仅 market/dist）分离；解决「点开发者门户仍是首页」「logo 白底未更新」。
#
# Secrets（与 FHD push 共用）：
#   FHD_PUSH_HOST、FHD_PUSH_SSH_KEY
# Variables（可选）：
#   XCMAX_REMOTE_ROOT   默认依次尝试 /root/XCMAX、/root/modstore-git
#   XCMAX_GIT_BRANCH    默认 main

name: Deploy corp site (xiu-ci.com)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on server
        required: false
        default: main
  # Cursor 云代理 token 没有 actions:write，不能 workflow_dispatch。
  # 合入 main 后用 repository_dispatch（event_type=corp-site-deploy）触发同一套发布。
  repository_dispatch:
    types: [corp-site-deploy]
  # push 事件在 main 上曾整体未投递（#1952/#1953 合并后无任何 push 事件 run），
  # 且服务器 cron 自动更新被 hotfix hold 冻结，静态站会静默停留在旧版本；小时级巡检兜底。
  schedule: [{cron: '23 * * * *'}]
  push:
    branches: [main]
    paths:
      - '成都修茈科技有限公司/*.html'
      - '成都修茈科技有限公司/robots.txt'
      - '成都修茈科技有限公司/llms.txt'
      - '成都修茈科技有限公司/sitemap.xml'
      - '成都修茈科技有限公司/baidu_urls.txt'
      - '成都修茈科技有限公司/BingSiteAuth.xml'
      - '成都修茈科技有限公司/partials/**'
      - '成都修茈科技有限公司/assets/**'
      - '成都修茈科技有限公司/*.js'
      - '成都修茈科技有限公司/*.css'
      - '成都修茈科技有限公司/site/**'
      - '成都修茈科技有限公司/data/**'
      - '成都修茈科技有限公司/scripts/build_public_site.py'
      - '成都修茈科技有限公司/scripts/evidence_assets.py'
      - 'scripts/dev/materialize_media_assets.mjs'
      - 'config/media-aliases.json'
      - 'FHD/frontend/public/**'
      - 'FHD/docs/evidence/**'
      - '成都修茈科技有限公司/scripts/site_acceptance.py'
      # 下列两条被 test_immutable_release_contract 明确断言，保留显式声明。
      - '成都修茈科技有限公司/world-will-ticker.js'
      - '成都修茈科技有限公司/world-will-ticker.css'
      - '成都修茈科技有限公司/**/capabilities/**'
      - '成都修茈科技有限公司/nginx-xiu-ci*.conf'
      - '成都修茈科技有限公司/MODstore_deploy/scripts/**'
      - '成都修茈科技有限公司/deploy/**'
      - '成都修茈科技有限公司/MODstore_deploy/market/public/download-release.json'
      - '成都修茈科技有限公司/download-action-board.json'
      - '成都修茈科技有限公司/download-action-board.js'
      - '成都修茈科技有限公司/download-company-hall.json'
      - '成都修茈科技有限公司/MODstore_deploy/market/public/download-action-board.json'
      - '成都修茈科技有限公司/MODstore_deploy/market/public/download-company-hall.json'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/views/SoftwareDownloadView.vue'
      - '.github/workflows/corp-site-deploy.yml'

concurrency:
  group: corp-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || vars.XCMAX_AUTO_SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git sync + xcmax-site-auto-update + nginx reload
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.FHD_PUSH_HOST }}
          username: root
          key: ${{ secrets.FHD_PUSH_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            BRANCH="${{ github.event.inputs.branch || github.event.client_payload.branch }}"
            if [ -z "${BRANCH}" ]; then BRANCH="${{ vars.XCMAX_GIT_BRANCH }}"; fi
            if [ -z "${BRANCH}" ]; then BRANCH="main"; fi
            REMOTE_ROOT="${{ vars.XCMAX_REMOTE_ROOT }}"
            if [ -z "${REMOTE_ROOT}" ]; then
              for candidate in /root/XCMAX /root/modstore-git; do
                if [ -d "${candidate}/.git" ]; then REMOTE_ROOT="${candidate}"; break; fi
              done
            fi
            if [ -z "${REMOTE_ROOT}" ] || [ ! -d "${REMOTE_ROOT}/.git" ]; then
              echo "[err] 未找到 XCMAX git 根（设 Variables XCMAX_REMOTE_ROOT）"
              exit 1
            fi
            echo "[info] XCMAX_ROOT=${REMOTE_ROOT} branch=${BRANCH}"
            export XCMAX_ROOT="${REMOTE_ROOT}"
            export XCMAX_GIT_BRANCH="${BRANCH}"
            export XCMAX_GIT_RESET_HARD=1
            # Bound each bootstrap command; retain configured SSH identity and host checks.
            if [ "$(readlink -f "${REMOTE_ROOT}/成都修茈科技有限公司")" = "$(readlink -f /root/成都修茈科技有限公司)" ]; then
              echo "[err] live site must be separate from the Git tree before reset" >&2
              exit 1
            fi
            SYNC_STAGE=fetch
            trap 'rc=$?; echo "[err] site stage=${SYNC_STAGE} exit=${rc}; stopped before further publication" >&2; exit "$rc"' ERR
            echo "[stage] fetch begin (900s limit)"
            timeout --kill-after=15s 900s env GIT_TERMINAL_PROMPT=0 \
              git -C "${REMOTE_ROOT}" -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 fetch --progress origin "${BRANCH}"
            SYNC_STAGE=reset
            echo "[stage] fetch complete; reset begin (120s limit)"
            timeout --kill-after=15s 120s git -C "${REMOTE_ROOT}" reset --hard "origin/${BRANCH}"
            SYNC_STAGE=identity
            DEPLOY_SHA="$(git -C "${REMOTE_ROOT}" rev-parse HEAD)"
            REMOTE_SHA="$(git -C "${REMOTE_ROOT}" rev-parse "origin/${BRANCH}")"
            if [ "${DEPLOY_SHA}" != "${REMOTE_SHA}" ]; then
              echo "[err] server worktree did not converge to origin/${BRANCH}"
              exit 1
            fi
            echo "[info] exact server worktree sha=${DEPLOY_SHA}"
            # This job publishes static content only; the general updater also rebuilds
            # market/runtime dependencies and restarts services, outside this scope.
            SYNC_STAGE=publish
            SITE_ROOT="${REMOTE_ROOT}/成都修茈科技有限公司"
            GIT_SITE="${SITE_ROOT}"
            python3 "${GIT_SITE}/scripts/evidence_assets.py" materialize
            node "${XCMAX_ROOT}/scripts/dev/materialize_media_assets.mjs" marketing
            PUBLICATION_LOCK="${XCMAX_PUBLICATION_LOCK:-/run/lock/xcmax-publication.lock}"
            mkdir -p "$(dirname "$PUBLICATION_LOCK")"
            exec 8>"$PUBLICATION_LOCK"
            flock -w 60 8
            # Publish git-tree site chrome into nginx live root. Production serves
            # /root/成都修茈科技有限公司 (immutable-release symlink), not /root/XCMAX/...
            LIVE_SITE="$(readlink -f /root/成都修茈科技有限公司)"
            if [[ ! "$LIVE_SITE" =~ ^/opt/xcmax/releases/[0-9a-f]{40}/成都修茈科技有限公司$ &&
                  "$LIVE_SITE" != /root/成都修茈科技有限公司 ]] || [ ! -d "$LIVE_SITE" ]; then
              echo "[err] unexpected live site root" >&2
              exit 1
            fi
            deployment_marker_path() {
              local parent
              for parent in "$LIVE_SITE/site" "$LIVE_SITE/site/data"; do
                if [ -L "$parent" ] || { [ -e "$parent" ] && [ ! -d "$parent" ]; }; then
                  echo "[err] unsafe deployment marker directory" >&2
                  return 1
                fi
              done
              printf '%s\n' "$LIVE_SITE/site/data/corp-download-deployment.json"
            }
            # The marker is generated here only. Invalidate it before changing the site.
            DEPLOYMENT_MARKER="$(deployment_marker_path)"
            rm -f -- "$DEPLOYMENT_MARKER"
            if [ -e "$GIT_SITE/site/data/corp-download-deployment.json" ] ||
               [ -L "$GIT_SITE/site/data/corp-download-deployment.json" ]; then
              echo "[err] deployment marker must not be included in Git site data" >&2
              exit 1
            fi
            if [ -d "${GIT_SITE}" ] && [ -d "${LIVE_SITE}" ] && [ "$(readlink -f "${GIT_SITE}")" != "${LIVE_SITE}" ]; then
              echo "[info] publishing site chrome ${GIT_SITE} -> ${LIVE_SITE}"
              chmod u+w "${LIVE_SITE}" 2>/dev/null || true
              mkdir -p "${LIVE_SITE}/partials" "${LIVE_SITE}/assets"
              chmod u+w "${LIVE_SITE}/partials" "${LIVE_SITE}/assets" 2>/dev/null || true
              # Runtime projections and the release pointer must not be overwritten by
              # git snapshots.  `fhd-release-desktop.yml` publishes the latter only
              # after both platform artifacts pass verification.
              for f in "${GIT_SITE}"/*.html "${GIT_SITE}/styles.css" "${GIT_SITE}/main.js" "${GIT_SITE}/contact-intake.js" \
                       "${GIT_SITE}/contact-channels.js" "${GIT_SITE}/visualization.js" "${GIT_SITE}/release-data.js" \
                       "${GIT_SITE}/world-will.js" "${GIT_SITE}/world-will-ticker.js" \
                       "${GIT_SITE}/world-will-ticker.css" \
                       "${GIT_SITE}/robots.txt" "${GIT_SITE}/sitemap.xml" \
                       "${GIT_SITE}/llms.txt" \
                       "${GIT_SITE}/baidu_urls.txt" "${GIT_SITE}/BingSiteAuth.xml" \
                       "${GIT_SITE}/download-action-board.js"; do
                [ -e "$f" ] || continue
                base="$(basename "$f")"
                chmod u+w "${LIVE_SITE}/${base}" 2>/dev/null || true
                cp -f "$f" "${LIVE_SITE}/${base}"
              done
              # Only the desktop publisher may create or replace download pointers.
              echo "[info] preserving release-managed download-release.json; no Git bootstrap"
              if [ -e "${LIVE_SITE}/download-windows-hotfix.json" ]; then
                echo "[info] preserving release-managed download-windows-hotfix.json"
              fi
              if [ -d "${GIT_SITE}/partials" ]; then
                cp -af "${GIT_SITE}/partials/." "${LIVE_SITE}/partials/"
              fi
              if [ -d "${GIT_SITE}/assets" ]; then
                cp -af "${GIT_SITE}/assets/." "${LIVE_SITE}/assets/"
              fi
              if [ -d "${GIT_SITE}/corp-butler" ]; then
                mkdir -p "${LIVE_SITE}/corp-butler"
                find "${GIT_SITE}/corp-butler" -mindepth 1 -maxdepth 1 \
                  ! -name download-release.json ! -name download-windows-hotfix.json \
                  -exec cp -af {} "${LIVE_SITE}/corp-butler/" \;
              fi
              # 产品能力中心（#1951）：整目录发布，漏发即线上 404。
              if [ -d "${GIT_SITE}/capabilities" ]; then
                mkdir -p "${LIVE_SITE}/capabilities"
                cp -af "${GIT_SITE}/capabilities/." "${LIVE_SITE}/capabilities/"
              fi
              if [ -d "${GIT_SITE}/data/capabilities" ]; then
                mkdir -p "${LIVE_SITE}/data/capabilities"
                cp -af "${GIT_SITE}/data/capabilities/." "${LIVE_SITE}/data/capabilities/"
              fi
              # SSOT 聚合数据（public-site.json）与官网数据目录发布
              if [ -d "${GIT_SITE}/site/data" ]; then
                mkdir -p "${LIVE_SITE}/site/data"
                cp -af "${GIT_SITE}/site/data/." "${LIVE_SITE}/site/data/"
              fi
              if [ -d "${GIT_SITE}/data" ]; then
                mkdir -p "${LIVE_SITE}/data"
                cp -af "${GIT_SITE}/data/." "${LIVE_SITE}/data/"
              fi
              chmod a+rx "${LIVE_SITE}" 2>/dev/null || true
              echo "[ok] live site chrome published"
            else
              echo "[err] live site root coincides with git tree or source is missing" >&2
              exit 1
            fi
            SYNC_STAGE=nginx
            NGINX_SRC="${SITE_ROOT}/nginx-xiu-ci-root.conf"
            if [ -f /etc/nginx/conf.d/xiu-ci.com.conf ]; then
              echo "[info] canonical xiu-ci.com.conf exists; skip conflicting standalone corp vhost"
              # 同步版本化 XCAGI 下载路由；否则新版本 /xcagi-vX.Y.Z.W/ 会落入官网首页。
              bash "${SITE_ROOT}/deploy/scripts/sync-nginx-xiu-ci-snippets.sh"
              # HTTPS whitelist never included /partials/; pin it on the live conf.
              python3 "${SITE_ROOT}/MODstore_deploy/scripts/fix-nginx-corp-partials.py"
              python3 "${SITE_ROOT}/MODstore_deploy/scripts/fix-nginx-corp-download-routes.py"
              # 2026-09 SSOT 改版：verify/pricing 页面与 /site/data/ 白名单注入。
              python3 "${SITE_ROOT}/MODstore_deploy/scripts/fix-nginx-corp-pages.py"
            elif [ -f "${NGINX_SRC}" ]; then
              install -m 644 "${NGINX_SRC}" /etc/nginx/conf.d/xiu-ci-corp-root.conf
            fi
            nginx -t
            if ! systemctl reload nginx; then
              echo "[warn] systemd reload unavailable; sending HUP to verified nginx master"
              NGINX_PID="$(cat /run/nginx.pid)"
              kill -HUP "${NGINX_PID}"
            fi
            systemctl is-active --quiet nginx
            echo "[ok] nginx reloaded"
            # Refresh public world-will projections from production DB (not git snapshots).
            MOD_ROOT="/opt/xcmax/current/成都修茈科技有限公司/MODstore_deploy"
            if [ -x "${MOD_ROOT}/.venv/bin/python" ]; then
              echo "[info] regenerating public action board + company hall"
              ( cd "${MOD_ROOT}" && PYTHONPATH=. ./.venv/bin/python - <<'PY'
            from dotenv import load_dotenv
            load_dotenv("/etc/xcmax/modstore.env", override=True)
            from modstore_server.public_action_board import write_public_action_board
            r = write_public_action_board()
            print("public_board", {k: r.get(k) for k in ("ok", "day", "written")} if isinstance(r, dict) else r)
            PY
              ) || echo "[warn] public board regenerate failed (non-fatal)"
            fi
            # Loopback HTTPS over h2 is flaky on this host (curl exit 16); prefer http1.1 + retry.
            xc_curl() {
              local attempt=1
              while [ "$attempt" -le 4 ]; do
                if curl --http1.1 -fsS --connect-timeout 10 --max-time 30 "$@"; then
                  return 0
                fi
                attempt=$((attempt + 1))
                sleep 1
              done
              return 1
            }
            SYNC_STAGE=public-verification
            echo "[verify] public corp/download/market surfaces:"
            xc_curl https://xiu-ci.com/ >/dev/null
            xc_curl -o /tmp/xc-llms.txt https://xiu-ci.com/llms.txt
            cmp "${GIT_SITE}/llms.txt" /tmp/xc-llms.txt
            xc_curl https://xiu-ci.com/developer.html >/dev/null
            xc_curl https://xiu-ci.com/download >/dev/null
            xc_curl https://xiu-ci.com/download/releases >/dev/null
            xc_curl -o /tmp/xc-release-history.json https://xiu-ci.com/data/release-history.json
            cmp "${GIT_SITE}/data/release-history.json" /tmp/xc-release-history.json
            xc_curl -o /tmp/xc-release-data.js https://xiu-ci.com/release-data.js
            cmp "${GIT_SITE}/release-data.js" /tmp/xc-release-data.js
            xc_curl -L https://xiu-ci.com/market/download >/dev/null
            xc_curl https://xiu-ci.com/market/ >/dev/null
            echo "[verify] homepage nav present:"
            xc_curl -o /tmp/xc-home.html https://xiu-ci.com/
            grep -E -q 'site-header|>首页<|/download' /tmp/xc-home.html
            grep -E -q '产品下载|软件下载|下载' /tmp/xc-home.html  # 首页入口文案自 #2038 起为「下载」；意图仍是首页必须有下载入口，链接目标由 /download 校验保证
            grep -E -q '/site/data/public-site.json' /tmp/xc-home.html
            echo "[verify] SSOT aggregated data must be live:"
            xc_curl -o /tmp/xc-public-site.json https://xiu-ci.com/site/data/public-site.json
            python3 -c "import json; d=json.load(open('/tmp/xc-public-site.json')); assert d.get('product',{}).get('version'), 'public-site.json 空'; assert d.get('pricing',{}).get('trial'), '价格缺失'"
            echo "[verify] customer verification center + pricing pages:"
            xc_curl -o /tmp/xc-verify.html https://xiu-ci.com/verify.html
            grep -E -q '验证中心|plat-grid|feat-list' /tmp/xc-verify.html
            xc_curl -o /tmp/xc-pricing.html https://xiu-ci.com/pricing.html
            grep -E -q 'plan-trial|plan-permanent|价格' /tmp/xc-pricing.html
            xc_curl -o /tmp/xc-cases2.html https://xiu-ci.com/cases.html
            grep -E -q '客户案例|case' /tmp/xc-cases2.html
            # Verify the original slash URL without following unapproved redirect targets.
            (
              download_html="$(mktemp)"
              trap 'rm -f "$download_html"' EXIT
              download_response() {
                local response
                response="$(xc_curl -w '%{http_code} %{redirect_url}\n' "$@")" || return
                # curl also emits write-out for failed attempts; xc_curl retries them.
                printf '%s' "${response##*$'\n'}"
              }
              verify_download_routes() {
                local suffix="$1" download_host original slash_url redirect_hop redirect download_url download_status
                for download_host in xiu-ci.com www.xiu-ci.com; do
                  original="https://${download_host}/download/${suffix}"
                  slash_url="$original"
                  for redirect_hop in 1 2; do
                    redirect="$(download_response -o /dev/null "$slash_url")"
                    if [ "$(download_response --head -o /dev/null "$slash_url")" != "$redirect" ]; then
                      printf '[err] %s HEAD did not match GET at hop %s (sha=%s)\n' \
                        "$original" "$redirect_hop" "$DEPLOY_SHA" >&2
                      exit 1
                    fi
                    # Production redirects www to the apex before evaluating the path.
                    if [ "$redirect_hop" = 1 ] && [ "$download_host" = www.xiu-ci.com ] && \
                       [ "$redirect" = "301 https://xiu-ci.com/download/${suffix}" ]; then
                      slash_url="${redirect#301 }"
                      continue
                    fi
                    break
                  done
                  case "$redirect" in
                    "301 https://xiu-ci.com/download${suffix}"|"301 https://www.xiu-ci.com/download${suffix}") ;;
                    *)
                      printf '[err] %s expected a 301 to the approved download page preserving the query (sha=%s, status=%s)\n' \
                        "$original" "$DEPLOY_SHA" "${redirect%% *}" >&2
                      exit 1
                      ;;
                  esac
                  download_url="${redirect#301 }"
                  download_status="$(download_response -o "$download_html" "$download_url")"
                  if [ "$download_status" != "200 " ] || ! grep -Fq '<title>XCAGI 产品下载</title>' "$download_html"; then
                    printf '[err] %s did not reach the download page (sha=%s, status=%s)\n' \
                      "$original" "$DEPLOY_SHA" "${download_status%% *}" >&2
                    exit 1
                  fi
                  if [ "$(download_response --head -o /dev/null "$download_url")" != "$download_status" ]; then
                    printf '[err] %s final HEAD did not match GET (sha=%s)\n' "$original" "$DEPLOY_SHA" >&2
                    exit 1
                  fi
                  printf '[verify] download redirect sha=%s host=%s get=301 head=301 hops=%s target=%s status=200\n' \
                    "$DEPLOY_SHA" "$download_host" "$redirect_hop" "$download_url"
                done
              }
              verify_download_routes "?xcmax_download_probe=${DEPLOY_SHA}"
              verify_download_routes ""
            )
            echo "[verify] capability center must never 404 after merge (regression guard):"
            xc_curl -o /tmp/xc-capabilities.html https://xiu-ci.com/capabilities/
            grep -E -q '产品能力|能力目录' /tmp/xc-capabilities.html
            xc_curl -o /tmp/xc-cap-catalog.html https://xiu-ci.com/capabilities/catalog.html
            grep -E -q '能力目录|cap-status' /tmp/xc-cap-catalog.html
            xc_curl -o /tmp/xc-cap-catalog.json https://xiu-ci.com/data/capabilities/catalog.json
            python3 -c "import json,sys; d=json.load(open('/tmp/xc-cap-catalog.json')); assert d.get('domains'), 'catalog.json 空'"
            xc_curl -o /tmp/xc-honors.html https://xiu-ci.com/honors.html
            grep -E -q '/capabilities/' /tmp/xc-honors.html
            echo "[verify] public action board independent pages:"
            xc_curl -o /tmp/xc-breakpoints.html https://xiu-ci.com/download/breakpoints
            xc_curl -o /tmp/xc-goals.html https://xiu-ci.com/download/goals
            grep -E -q '断点清单|data-board="breakpoints"' /tmp/xc-breakpoints.html
            grep -E -q '工作目标|data-board="goals"' /tmp/xc-goals.html
            xc_curl -o /tmp/xc-action-board.json https://xiu-ci.com/download-action-board.json
            grep -E -q 'public_action_board|breakpoints|goals' /tmp/xc-action-board.json
            xc_curl -o /tmp/xc-action-board.js https://xiu-ci.com/download-action-board.js
            grep -E -q 'ACTION_BOARD|breakpoints|goals' /tmp/xc-action-board.js
            echo "[verify] world-will company hall:"
            xc_curl -o /tmp/xc-world-will.html https://xiu-ci.com/world-will
            xc_curl -o /tmp/xc-world-will.js https://xiu-ci.com/world-will.js
            xc_curl -o /tmp/xc-world-will-ticker.js https://xiu-ci.com/world-will-ticker.js
            xc_curl -o /tmp/xc-world-will-ticker.css https://xiu-ci.com/world-will-ticker.css
            xc_curl -o /tmp/xc-company-hall.json https://xiu-ci.com/download-company-hall.json
            grep -E -q '公司大厅|hall-depts|download-company-hall' /tmp/xc-world-will.html
            grep -E -q 'filteredFeed|hall-timeline|download-company-hall' /tmp/xc-world-will.js
            grep -F -q '/api/public/action-board' /tmp/xc-world-will.js
            grep -F -q '/api/public/action-board' /tmp/xc-world-will-ticker.js
            grep -F -q '.world-will' /tmp/xc-world-will-ticker.css
            grep -E -q 'public_company_hall|presence_model|departments' /tmp/xc-company-hall.json
            echo "[verify] live root partials on disk:"
            if [ -n "${LIVE_SITE:-}" ] && [ -f "${LIVE_SITE}/partials/header.html" ]; then
              head -n 2 "${LIVE_SITE}/partials/header.html"
              grep -E -q 'site-header|nav-menu' "${LIVE_SITE}/partials/header.html"
            else
              echo "[warn] ${LIVE_SITE:-unset}/partials/header.html missing on disk"
            fi
            echo "[verify] HTTPS /partials must return fragments, not homepage SPA fallback:"
            xc_curl -o /tmp/xc-partial-header.html https://xiu-ci.com/partials/header.html
            xc_curl -o /tmp/xc-partial-loader.js https://xiu-ci.com/partials/loader.js
            grep -E -q '^<header class="site-header">' /tmp/xc-partial-header.html
            grep -E -q 'site-header|nav-menu|/download' /tmp/xc-partial-header.html
            ! grep -E -q '<!DOCTYPE html>' /tmp/xc-partial-header.html
            grep -E -q 'site-header|loadPartials|partials' /tmp/xc-partial-loader.js
            ! grep -E -q '<!DOCTYPE html>' /tmp/xc-partial-loader.js
            echo "[verify] logo bytes:"
            wc -c "${SITE_ROOT}/assets/xiu-ci-logo.png" 2>/dev/null || true
            SYNC_STAGE=deployment-marker
            if [ "$BRANCH" = main ] && [ "${{ github.ref }}" = refs/heads/main ] &&
               [ "$DEPLOY_SHA" = "${{ github.sha }}" ]; then
              # Keep the shared lock until publication, so other site writers cannot
              # swap the live root or overwrite the verified pages during the smoke test.
              test "$(readlink -f /root/成都修茈科技有限公司)" = "$LIVE_SITE"
              test "$(git -C "$REMOTE_ROOT" rev-parse HEAD)" = "$DEPLOY_SHA"
              git -C "$REMOTE_ROOT" show "$DEPLOY_SHA:成都修茈科技有限公司/download.html" |
                cmp -s - "$LIVE_SITE/download.html"
              test "$(deployment_marker_path)" = "$DEPLOYMENT_MARKER"
              python3 - "$DEPLOYMENT_MARKER" "$DEPLOY_SHA" "${{ github.run_id }}" "${{ github.run_attempt }}" <<'PY'
            import json
            import os
            import sys
            import tempfile
            from datetime import datetime, timezone
            from pathlib import Path

            marker, sha, run_id, attempt = sys.argv[1:]
            marker = Path(marker)
            payload = {
                "deployed_sha": sha,
                "workflow_run_id": int(run_id),
                "run_attempt": int(attempt),
                "verified_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
            }
            tmp = None
            try:
                with tempfile.NamedTemporaryFile(mode="w", dir=marker.parent, delete=False) as stream:
                    tmp = Path(stream.name)
                    json.dump(payload, stream)
                    stream.write("\n")
                    os.fchmod(stream.fileno(), 0o644)
                os.replace(tmp, marker)
            finally:
                if tmp is not None:
                    tmp.unlink(missing_ok=True)
            PY
              echo "[verify] published corp download deployment marker sha=$DEPLOY_SHA"
            else
              echo "[info] deployment is not the controller main SHA; leaving deployment marker absent"
            fi
            exec 8>&-
