# 官网静态（xiu-ci.com）：developer.html、logo-river assets、styles.css、nginx root。
# 与 market-live-deploy（仅 market/dist）分离；解决「点开发者门户仍是首页」「logo 白底未更新」。
#
# Secrets（与 FHD push 共用）：
#   FHD_PUSH_HOST、FHD_PUSH_SSH_KEY
# Variables（可选）：
#   XCMAX_REMOTE_ROOT   默认依次尝试 /root/XCMAX、/root/modstore-git
#   XCMAX_GIT_BRANCH    默认 main

name: Deploy corp site (xiu-ci.com)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on server
        required: false
        default: main
  push:
    branches: [main]
    paths:
      - '成都修茈科技有限公司/*.html'
      - '成都修茈科技有限公司/partials/**'
      - '成都修茈科技有限公司/styles.css'
      - '成都修茈科技有限公司/main.js'
      - '成都修茈科技有限公司/visualization.js'
      - '成都修茈科技有限公司/world-will.js'
      - '成都修茈科技有限公司/assets/**'
      - '成都修茈科技有限公司/nginx-xiu-ci*.conf'
      - '成都修茈科技有限公司/MODstore_deploy/scripts/xcmax-site-auto-update.sh'
      - '成都修茈科技有限公司/MODstore_deploy/scripts/install-site-auto-update-cron.sh'
      - '成都修茈科技有限公司/MODstore_deploy/scripts/fix-nginx-corp-partials.py'
      - '成都修茈科技有限公司/MODstore_deploy/scripts/fix-nginx-corp-download-routes.py'
      - '成都修茈科技有限公司/MODstore_deploy/market/public/download-release.json'
      - '成都修茈科技有限公司/download-action-board.json'
      - '成都修茈科技有限公司/download-action-board.js'
      - '成都修茈科技有限公司/download-company-hall.json'
      - '成都修茈科技有限公司/MODstore_deploy/market/public/download-action-board.json'
      - '成都修茈科技有限公司/MODstore_deploy/market/public/download-company-hall.json'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/views/SoftwareDownloadView.vue'
      - '.github/workflows/corp-site-deploy.yml'

concurrency:
  group: corp-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git sync + xcmax-site-auto-update + nginx reload
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.FHD_PUSH_HOST }}
          username: root
          key: ${{ secrets.FHD_PUSH_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            BRANCH="${{ github.event.inputs.branch }}"
            if [ -z "${BRANCH}" ]; then BRANCH="${{ vars.XCMAX_GIT_BRANCH }}"; fi
            if [ -z "${BRANCH}" ]; then BRANCH="main"; fi
            REMOTE_ROOT="${{ vars.XCMAX_REMOTE_ROOT }}"
            if [ -z "${REMOTE_ROOT}" ]; then
              for candidate in /root/XCMAX /root/modstore-git; do
                if [ -d "${candidate}/.git" ]; then REMOTE_ROOT="${candidate}"; break; fi
              done
            fi
            if [ -z "${REMOTE_ROOT}" ] || [ ! -d "${REMOTE_ROOT}/.git" ]; then
              echo "[err] 未找到 XCMAX git 根（设 Variables XCMAX_REMOTE_ROOT）"
              exit 1
            fi
            echo "[info] XCMAX_ROOT=${REMOTE_ROOT} branch=${BRANCH}"
            export XCMAX_ROOT="${REMOTE_ROOT}"
            export XCMAX_GIT_BRANCH="${BRANCH}"
            export XCMAX_GIT_RESET_HARD=1
            # Always republish static chrome into the nginx live root (immutable
            # release symlink). Git sync alone only updates /root/XCMAX.
            export XCMAX_FORCE_SITE_PUBLISH=1
            # workflow_dispatch / path-push deploy must not be blocked by the
            # cron "hotfix hold" that skips overwrite when live release SHA
            # differs from origin/<branch>.
            export XCMAX_FORCE_AUTO_UPDATE=1
            # Explicitly sync the deploy branch before auto-update / publish so
            # live chrome never copies a stale worktree after an early exit.
            # Server worktrees often have local dirty files from prior hotfixes;
            # force checkout so deploy is not blocked.
            git -C "${REMOTE_ROOT}" fetch origin "${BRANCH}" --prune
            git -C "${REMOTE_ROOT}" checkout -f -B "${BRANCH}" "origin/${BRANCH}"
            git -C "${REMOTE_ROOT}" reset --hard "origin/${BRANCH}"
            git -C "${REMOTE_ROOT}" clean -fd
            echo "[info] worktree $(git -C "${REMOTE_ROOT}" rev-parse --short HEAD) on ${BRANCH}"
            AUTO_SCRIPT="${REMOTE_ROOT}/成都修茈科技有限公司/MODstore_deploy/scripts/xcmax-site-auto-update.sh"
            if [ ! -f "${AUTO_SCRIPT}" ]; then
              echo "[err] 缺少 ${AUTO_SCRIPT}；请先 git pull 含该脚本的提交"
              exit 1
            fi
            bash "${AUTO_SCRIPT}"
            SITE_ROOT="${REMOTE_ROOT}/成都修茈科技有限公司"
            # Publish git-tree site chrome into nginx live root. Production serves
            # /root/成都修茈科技有限公司 (immutable-release symlink), not /root/XCMAX/...
            LIVE_SITE="$(readlink -f /root/成都修茈科技有限公司 2>/dev/null || true)"
            if [ -z "${LIVE_SITE}" ]; then LIVE_SITE="/root/成都修茈科技有限公司"; fi
            GIT_SITE="${SITE_ROOT}"
            if [ -d "${GIT_SITE}" ] && [ -d "${LIVE_SITE}" ] && [ "$(readlink -f "${GIT_SITE}")" != "${LIVE_SITE}" ]; then
              echo "[info] publishing site chrome ${GIT_SITE} -> ${LIVE_SITE}"
              chmod u+w "${LIVE_SITE}" 2>/dev/null || true
              mkdir -p "${LIVE_SITE}/partials" "${LIVE_SITE}/assets" "${LIVE_SITE}/corp-butler"
              chmod u+w "${LIVE_SITE}/partials" "${LIVE_SITE}/assets" "${LIVE_SITE}/corp-butler" 2>/dev/null || true
              # Runtime DB projections (action-board / company-hall JSON) must not be
              # overwritten by git snapshots — refresh them after publish instead.
              for f in "${GIT_SITE}"/*.html "${GIT_SITE}/styles.css" "${GIT_SITE}/main.js" "${GIT_SITE}/contact-intake.js" "${GIT_SITE}/visualization.js" \
                       "${GIT_SITE}/world-will.js" \
                       "${GIT_SITE}/download-release.json" "${GIT_SITE}/download-action-board.js"; do
                [ -e "$f" ] || continue
                base="$(basename "$f")"
                chmod u+w "${LIVE_SITE}/${base}" 2>/dev/null || true
                cp -f "$f" "${LIVE_SITE}/${base}"
              done
              if [ -d "${GIT_SITE}/partials" ]; then
                cp -af "${GIT_SITE}/partials/." "${LIVE_SITE}/partials/"
              fi
              if [ -d "${GIT_SITE}/assets" ]; then
                cp -af "${GIT_SITE}/assets/." "${LIVE_SITE}/assets/"
              fi
              if [ -d "${GIT_SITE}/corp-butler" ]; then
                cp -af "${GIT_SITE}/corp-butler/." "${LIVE_SITE}/corp-butler/"
              fi
              chmod a+rx "${LIVE_SITE}" 2>/dev/null || true
              echo "[ok] live site chrome published"
              echo "[verify] published main.js head:"
              sed -n '246,249p' "${LIVE_SITE}/main.js" || true
              echo "[verify] download.html title:"
              grep -E '<title>' "${LIVE_SITE}/download.html" | head -1 || true
            else
              echo "[info] live site root coincides with git tree or missing; skip publish copy"
            fi
            NGINX_SRC="${SITE_ROOT}/nginx-xiu-ci-root.conf"
            if [ -f /etc/nginx/conf.d/xiu-ci.com.conf ]; then
              echo "[info] canonical xiu-ci.com.conf exists; skip conflicting standalone corp vhost"
              # HTTPS whitelist never included /partials/; pin it on the live conf.
              python3 "${SITE_ROOT}/MODstore_deploy/scripts/fix-nginx-corp-partials.py"
              python3 "${SITE_ROOT}/MODstore_deploy/scripts/fix-nginx-corp-download-routes.py"
            elif [ -f "${NGINX_SRC}" ]; then
              install -m 644 "${NGINX_SRC}" /etc/nginx/conf.d/xiu-ci-corp-root.conf
            fi
            nginx -t
            if ! systemctl reload nginx; then
              echo "[warn] systemd reload unavailable; sending HUP to verified nginx master"
              NGINX_PID="$(cat /run/nginx.pid)"
              kill -HUP "${NGINX_PID}"
            fi
            systemctl is-active --quiet nginx
            echo "[ok] nginx reloaded"
            # Refresh public world-will projections from production DB (not git snapshots).
            MOD_ROOT="/opt/xcmax/current/成都修茈科技有限公司/MODstore_deploy"
            if [ -x "${MOD_ROOT}/.venv/bin/python" ]; then
              echo "[info] regenerating public action board + company hall"
              ( cd "${MOD_ROOT}" && PYTHONPATH=. ./.venv/bin/python - <<'PY'
            from dotenv import load_dotenv
            load_dotenv("/etc/xcmax/modstore.env", override=True)
            from modstore_server.public_action_board import write_public_action_board
            r = write_public_action_board()
            print("public_board", {k: r.get(k) for k in ("ok", "day", "written")} if isinstance(r, dict) else r)
            PY
              ) || echo "[warn] public board regenerate failed (non-fatal)"
            fi
            # Loopback HTTPS over h2 is flaky on this host (curl exit 16); prefer http1.1 + retry.
            xc_curl() {
              local attempt=1
              while [ "$attempt" -le 4 ]; do
                if curl --http1.1 -fsS --connect-timeout 10 --max-time 30 "$@"; then
                  return 0
                fi
                attempt=$((attempt + 1))
                sleep 1
              done
              return 1
            }
            echo "[verify] public corp/download/market surfaces:"
            xc_curl https://xiu-ci.com/ >/dev/null
            xc_curl https://xiu-ci.com/developer.html >/dev/null
            xc_curl https://xiu-ci.com/download >/dev/null
            xc_curl https://xiu-ci.com/download/releases >/dev/null
            xc_curl -L https://xiu-ci.com/market/download >/dev/null
            xc_curl https://xiu-ci.com/market/ >/dev/null
            echo "[verify] homepage nav present:"
            xc_curl -o /tmp/xc-home.html https://xiu-ci.com/
            grep -E -q 'site-header|>首页<|/download' /tmp/xc-home.html
            grep -E -q '产品下载|软件下载' /tmp/xc-home.html
            echo "[verify] download center is new product page (not old stub):"
            xc_curl -o /tmp/xc-download.html https://xiu-ci.com/download
            grep -E -q 'download/releases|更新日志|产品下载' /tmp/xc-download.html
            echo "[verify] public action board independent pages:"
            xc_curl -o /tmp/xc-breakpoints.html https://xiu-ci.com/download/breakpoints
            xc_curl -o /tmp/xc-goals.html https://xiu-ci.com/download/goals
            grep -E -q '断点清单|data-board="breakpoints"' /tmp/xc-breakpoints.html
            grep -E -q '工作目标|data-board="goals"' /tmp/xc-goals.html
            xc_curl -o /tmp/xc-action-board.json https://xiu-ci.com/download-action-board.json
            grep -E -q 'public_action_board|breakpoints|goals' /tmp/xc-action-board.json
            xc_curl -o /tmp/xc-action-board.js https://xiu-ci.com/download-action-board.js
            grep -E -q 'ACTION_BOARD|breakpoints|goals' /tmp/xc-action-board.js
            echo "[verify] world-will company hall:"
            xc_curl -o /tmp/xc-world-will.html https://xiu-ci.com/world-will
            xc_curl -o /tmp/xc-world-will.js https://xiu-ci.com/world-will.js
            xc_curl -o /tmp/xc-company-hall.json https://xiu-ci.com/download-company-hall.json
            grep -E -q '公司大厅|hall-depts|download-company-hall' /tmp/xc-world-will.html
            grep -E -q 'filteredFeed|hall-timeline|download-company-hall' /tmp/xc-world-will.js
            grep -E -q 'public_company_hall|presence_model|departments' /tmp/xc-company-hall.json
            echo "[verify] live root partials on disk:"
            if [ -n "${LIVE_SITE:-}" ] && [ -f "${LIVE_SITE}/partials/header.html" ]; then
              head -n 2 "${LIVE_SITE}/partials/header.html"
              grep -E -q 'site-header|nav-menu' "${LIVE_SITE}/partials/header.html"
            else
              echo "[warn] ${LIVE_SITE:-unset}/partials/header.html missing on disk"
            fi
            echo "[verify] HTTPS /partials must return fragments, not homepage SPA fallback:"
            xc_curl -o /tmp/xc-partial-header.html https://xiu-ci.com/partials/header.html
            xc_curl -o /tmp/xc-partial-loader.js https://xiu-ci.com/partials/loader.js
            grep -E -q '^<header class="site-header">' /tmp/xc-partial-header.html
            grep -E -q 'site-header|nav-menu|/download' /tmp/xc-partial-header.html
            ! grep -E -q '<!DOCTYPE html>' /tmp/xc-partial-header.html
            grep -E -q 'site-header|loadPartials|partials' /tmp/xc-partial-loader.js
            ! grep -E -q '<!DOCTYPE html>' /tmp/xc-partial-loader.js
            echo "[verify] logo bytes:"
            wc -c "${SITE_ROOT}/assets/xiu-ci-logo.png" 2>/dev/null || true
