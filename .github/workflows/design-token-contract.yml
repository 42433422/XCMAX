name: design-token-contract
on:
  pull_request:
    paths:
      - 'FHD/config/mobile_design_tokens.json'
      - 'FHD/scripts/design/**'
      - 'FHD/frontend/src/styles/**'
      - 'FHD/mobile-flutter-poc/lib/src/theme/**'
      - 'FHD/mobile-flutter-poc/test/theme_contract_test.dart'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/tokens.css'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/style.css'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/design-tokens.generated.css'
      - '.github/workflows/design-token-contract.yml'
  push:
    branches: [main]
    paths:
      - 'FHD/config/mobile_design_tokens.json'
      - 'FHD/scripts/design/**'
      - 'FHD/frontend/src/styles/**'
      - 'FHD/mobile-flutter-poc/lib/src/theme/**'
      - 'FHD/mobile-flutter-poc/test/theme_contract_test.dart'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/tokens.css'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/style.css'
      - '成都修茈科技有限公司/MODstore_deploy/market/src/design-tokens.generated.css'
      - '.github/workflows/design-token-contract.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node FHD/scripts/design/generate-design-tokens.mjs --check
