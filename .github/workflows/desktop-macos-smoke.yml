# T47 — macOS Electron 启动冒烟（不打完整安装包，验证后端就绪 + Vue renderer 挂载）
# full_build 手动触发时产 arm64+x64 双架构 dmg，并跑可交付冒烟
name: desktop-macos-smoke

on:
  push:
    branches: [main, master]
    paths:
      - "FHD/desktop/**"
      - ".github/workflows/desktop-macos-smoke.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "FHD/desktop/**"
      - ".github/workflows/desktop-macos-smoke.yml"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Build dmg + deliverable smoke for arm64+x64 (requires signing secrets)"
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-macos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-smoke:
    name: Electron backend + renderer readiness (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FHD/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: FHD/deploy/requirements-server-api.lock.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: FHD/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install locked backend runtime
        working-directory: FHD
        run: python -m pip install --disable-pip-version-check -r deploy/requirements-server-api.lock.txt

      - name: TypeScript build
        run: npm run build

      - name: Electron smoke (headless CI)
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
          XCAGI_DESKTOP_SMOKE: "1"
          XCAGI_DATA_DIR: ${{ runner.temp }}/xcagi-smoke-data
        run: |
          LOG_PATH="${RUNNER_TEMP}/xcagi-electron-smoke.log"
          ELECTRON_BIN="$(node -p "require('electron')")"
          export PYTHON="$(command -v python)"
          export NODE_OPTIONS="${NODE_OPTIONS:+${NODE_OPTIONS} }--unhandled-rejections=strict"

          "${ELECTRON_BIN}" --version
          set +e
          perl -e 'alarm 180; exec @ARGV' "${ELECTRON_BIN}" . --no-sandbox 2>&1 | tee "${LOG_PATH}"
          pipeline_codes=("${PIPESTATUS[@]}")
          set -e
          electron_code="${pipeline_codes[0]}"
          tee_code="${pipeline_codes[1]}"

          if [ "${tee_code}" -ne 0 ]; then
            echo "::error::Failed to capture Electron smoke log (tee exit ${tee_code})."
            exit "${tee_code}"
          fi
          if [ "${electron_code}" -ne 0 ]; then
            echo "::error::Electron smoke did not exit cleanly (exit ${electron_code}); timeout codes are failures."
            exit "${electron_code}"
          fi
          if ! grep -Fq '[xcagi-desktop] smoke-ready {"backendReady":true,"rendererReady":true' "${LOG_PATH}"; then
            echo "::error::Electron exited 0 without the backend+renderer readiness marker."
            exit 1
          fi
          if grep -Eq 'UnhandledPromiseRejection|\[unhandledrejection\]|ModuleNotFoundError|application readiness failed|backend process exited|启动失败' "${LOG_PATH}"; then
            echo "::error::Fatal startup diagnostics were present despite the readiness marker."
            exit 1
          fi
          echo "[smoke] backend and Vue renderer ready; Electron exited cleanly."

      - name: Upload Electron smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-smoke-log
          path: ${{ runner.temp }}/xcagi-electron-smoke.log
          if-no-files-found: warn
          retention-days: 14

  # 手动触发 full_build 时：双架构矩阵各出 personal SKU dmg + 可交付冒烟
  macos-deliverable-build:
    name: macOS dmg + deliverable smoke (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_build == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: FHD
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      XCAGI_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Build personal SKU (${{ matrix.arch }}) smoke
        run: |
          chmod +x scripts/package/build-installer.sh scripts/dev/mac_deliverable_smoke.sh
          scripts/package/build-installer.sh 10.0.0 personal
      - name: Deliverable smoke
        run: bash scripts/dev/mac_deliverable_smoke.sh
