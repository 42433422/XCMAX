# T47 — macOS Electron 壳冒烟（不打出完整安装包，验证 tsc + electron 可启动）
# full_build 手动触发时产 arm64+x64 双架构 dmg，并跑可交付冒烟
name: desktop-macos-smoke

on:
  push:
    branches: [main, master]
    paths:
      - "FHD/desktop/**"
      - ".github/workflows/desktop-macos-smoke.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "FHD/desktop/**"
      - ".github/workflows/desktop-macos-smoke.yml"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Build dmg + deliverable smoke for arm64+x64 (requires signing secrets)"
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-macos-smoke-${{ github.ref }}
  cancel-in-progress: true

# Candidate tests never inherit repository-wide write permissions.
permissions:
  contents: read

jobs:
  electron-smoke:
    name: Electron build + launch (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FHD/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: "npm"
          cache-dependency-path: FHD/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Desktop CSP and navigation contracts
        run: npm test -- session-security.test.ts desktop-navigation.test.ts

      - name: Signed updater, rollback and desktop launch E2E
        run: |
          npx electron --version
          npx playwright test e2e/update-rollback.e2e.spec.ts e2e/desktop.e2e.spec.ts --reporter=line

      - name: Upload desktop test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: FHD/desktop/test-results/
          if-no-files-found: ignore

  # 手动触发 full_build 时：双架构矩阵各出 enterprise SKU dmg + 可交付冒烟
  macos-deliverable-build:
    name: macOS dmg + deliverable smoke (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.full_build == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: FHD
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      XCAGI_MAC_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build XCAGI (${{ matrix.arch }}) smoke
        run: |
          chmod +x scripts/package/build-installer.sh scripts/dev/mac_deliverable_smoke.sh
          scripts/package/build-installer.sh
      - name: Deliverable smoke
        run: bash scripts/dev/mac_deliverable_smoke.sh
