name: desktop-security-scan

# 桌面端 Electron 安全扫描(electronegativity)
# 与 gitleaks / codeql 同级,作为 PR 门禁;每周一全量扫描一次。
# 扫描对象: FHD/desktop/(剔除 node_modules/dist/build/coverage/.vitest-cache)
# 失败门禁: 任何 HIGH 严重程度 finding 即阻断合并(可用 -x 在源码中按需排除并写明理由)。
# 报告: SARIF 上传 GitHub Code Scanning + CSV/HTML artifact 保留 30 天。

on:
  pull_request:
    branches: [main, master]
    paths:
      - "FHD/desktop/**"
      - ".github/workflows/desktop-security-scan.yml"
      - ".github/scripts/parse-electronegativity-csv.js"
  push:
    branches: [main, master]
    paths:
      - "FHD/desktop/**"
      - ".github/workflows/desktop-security-scan.yml"
      - ".github/scripts/parse-electronegativity-csv.js"
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC 全量扫描
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # 上传 SARIF 到 Code Scanning

concurrency:
  group: desktop-security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electronegativity-scan:
    name: Electronegativity (Electron security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: FHD/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FHD/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (so dist/main.js exists for AST checks)
        run: npm run build

      - name: Install electronegativity
        # 锁定 1.10.3: 与本地验证一致;v2+ 依赖更新但 CLI 选项兼容。
        run: npm install -g @doyensec/electronegativity@1.10.3

      - name: Prepare clean scan target (exclude build artifacts)
        # electronegativity 无 -e/--exclude 路径选项,需先把源码同步到干净目录。
        run: |
          mkdir -p /tmp/desktop-scan
          rsync -a --delete \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='coverage' \
            --exclude='.vitest-cache' \
            --exclude='*.log' \
            --exclude='release/' \
            ./ /tmp/desktop-scan/
          echo "[scan] prepared /tmp/desktop-scan:"
          ls -la /tmp/desktop-scan/

      - name: Run electronegativity (SARIF for Code Scanning)
        # SARIF 不含 severity 字段(electronegativity 只输出 warning/note level),仅用于 PR 行内标注。
        run: |
          mkdir -p /tmp/en-report
          npx electronegativity \
            -i /tmp/desktop-scan \
            -o /tmp/en-report/electronegativity.sarif \
            -r \
            -v false || code=$?
          # electronegativity 在无 finding 时也可能非 0 退出,以文件是否存在为准
          if [ ! -f /tmp/en-report/electronegativity.sarif ]; then
            echo '{"$schema":"http://json.schemastore.org/sarif-2.1.0","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Electronegativity","rules":[]}},"results":[]}]}' > /tmp/en-report/electronegativity.sarif
          fi
          echo "[scan] SARIF size: $(wc -c < /tmp/en-report/electronegativity.sarif) bytes"

      - name: Run electronegativity (CSV for gating)
        # CSV 含 severity 字段,用于解析+门禁。
        run: |
          npx electronegativity \
            -i /tmp/desktop-scan \
            -o /tmp/en-report/electronegativity.csv \
            -r \
            -v false || code=$?
          if [ ! -f /tmp/en-report/electronegativity.csv ]; then
            echo "issue, severity, confidence, filename, location, sample, description, url" > /tmp/en-report/electronegativity.csv
          fi
          echo "[scan] CSV size: $(wc -c < /tmp/en-report/electronegativity.csv) bytes"
          echo "[scan] CSV preview:"
          head -20 /tmp/en-report/electronegativity.csv

      - name: Parse findings & gate on HIGH severity
        id: gate
        working-directory: ${{ github.workspace }}
        env:
          GATE_SEVERITY: ${{ github.event_name == 'schedule' && 'medium' || 'high' }}
        run: |
          node .github/scripts/parse-electronegativity-csv.js \
            /tmp/en-report/electronegativity.csv \
            --gate-severity "${GATE_SEVERITY}"

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/en-report/electronegativity.sarif
          category: electronegativity

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electronegativity-report
          path: /tmp/en-report/
          retention-days: 30
