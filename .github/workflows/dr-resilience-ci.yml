name: DR resilience

on:
  pull_request:
    paths:
      - "ops/backup/**"
      - "ops/dr/**"
      - "ops/env.example"
      - "ops/install.sh"
      - "ops/monitor/xcmax_monitor.py"
      - "FHD/scripts/deploy/fhd-auto-update.sh"
      - "成都修茈科技有限公司/MODstore_deploy/.github/workflows/prod-deploy.yml"
      - ".github/workflows/modstore-prod-deploy.yml"
      - ".github/workflows/dr-resilience-ci.yml"
  push:
    branches: [main]
    paths:
      - "ops/backup/**"
      - "ops/dr/**"
      - "ops/env.example"
      - "ops/install.sh"
      - "ops/monitor/xcmax_monitor.py"
      - "FHD/scripts/deploy/fhd-auto-update.sh"
      - "成都修茈科技有限公司/MODstore_deploy/.github/workflows/prod-deploy.yml"
      - ".github/workflows/modstore-prod-deploy.yml"
      - ".github/workflows/dr-resilience-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse operational shell scripts
        run: |
          set -euo pipefail
          bash -n ops/install.sh ops/backup/xcmax_backup.sh ops/dr/*.sh
          bash -n FHD/scripts/deploy/fhd-auto-update.sh

      - name: ShellCheck DR boundary
        run: |
          set -euo pipefail
          shellcheck --severity=error \
            ops/install.sh \
            ops/backup/xcmax_backup.sh \
            ops/dr/*.sh \
            FHD/scripts/deploy/fhd-auto-update.sh

      - name: Validate Python monitor
        run: |
          set -euo pipefail
          python -m py_compile \
            ops/monitor/xcmax_monitor.py \
            ops/dr/xcmax_release_order.py \
            ops/dr/xcmax_dr_failover_guard.py
          python -m unittest discover -s ops/dr/tests -v

      - name: Verify workflow SSOT publication
        run: python scripts/dev/publish_ci_workflows_to_root.py --check

      - name: Verify DR safety contracts
        run: |
          set -euo pipefail
          grep -q -- '--confirm-primary-down' ops/dr/xcmax_dr_promote.sh
          grep -q -- '--witness-file' ops/dr/xcmax_dr_promote.sh
          grep -q 'OPS_DR_PAYMENT_API_PORT=18080' \
            ops/dr/xcmax_dr_promote.sh
          grep -q 'provider_fence_proof_missing' \
            ops/dr/xcmax_dr_failover_guard.py
          grep -q 'StopInstances' ops/dr/xcmax_dr_tencent_fence.sh
          grep -q 'DescribeInstances' ops/dr/xcmax_dr_tencent_fence.sh
          grep -q -- '--StopType SOFT_FIRST' \
            ops/dr/xcmax_dr_tencent_fence.sh
          grep -q 'LatestOperationState' ops/dr/xcmax_dr_tencent_fence.sh
          grep -q 'authoritative_dns_has_not_fenced_primary' \
            ops/dr/xcmax_dr_failover_guard.py
          grep -q 'OPS_DR_AUTO_FAILOVER_ENABLED=0' \
            ops/dr/xcmax_dr_install.sh
          grep -q -- '--active-peer' ops/dr/xcmax_dr_prepare_edge.sh
          grep -q '127.0.0.1:5433' \
            ops/dr/xcmax_dr_prepare_tunnel_primary.sh
          grep -q 'ExitOnForwardFailure=yes' \
            ops/dr/xcmax_dr_prepare_active_peer.sh
          grep -q '"MODSTORE_RUN_BACKGROUND_JOBS": "0"' \
            ops/dr/xcmax_dr_prepare_runtime.sh
          grep -q 'XCMAX_DR_SAVED_RUNTIME_MODE' \
            ops/dr/xcmax_dr_prepare_runtime.sh
          grep -q 'pg_is_in_recovery' ops/dr/xcmax_wal_prepare_standby.sh
          grep -q 'pg_is_in_recovery' ops/dr/xcmax_wal_prepare_standby_pg16.sh
          grep -q 'X-XCMAX-DR' ops/dr/xcmax_dr_prepare_edge.sh
          grep -q 'runtime-releases' ops/dr/xcmax_release_sync.sh
          grep -q 'modstore-static.tar.gz' ops/dr/xcmax_release_sync.sh
          grep -q 'modstore-static.tar.gz' ops/dr/xcmax_dr_apply_release.sh
          grep -q 'xcmax-dr-transfer.lock' ops/backup/xcmax_backup.sh
          grep -q 'xcmax-dr-transfer.lock' ops/dr/xcmax_wal_ship.sh
          grep -q 'xcmax-dr-transfer.lock' ops/dr/xcmax_wal_ship_pg16.sh
          grep -q 'xcmax-dr-transfer.lock' ops/dr/xcmax_release_sync.sh
          grep -q 'OPS_DR_WAL_TRANSFER_MAX_SECONDS' ops/dr/xcmax_wal_ship.sh
          grep -q 'OPS_DR_WAL_TRANSFER_MAX_SECONDS' ops/dr/xcmax_wal_ship_pg16.sh
          grep -q 'xcmax-dr-storage-retention' ops/dr/xcmax_dr_install.sh
          bash ops/tests/test_bounded_transfer.sh
          bash ops/tests/test_dr_storage_retention.sh
          grep -q 'pg_create_restore_point' ops/dr/xcmax_wal_ship.sh
          grep -q 'pg_create_restore_point' ops/dr/xcmax_wal_ship_pg16.sh
          ! grep -q 'cat >/etc/cron.d/xcmax-dr' \
            ops/dr/xcmax_dr_prepare_runtime.sh
          grep -q 'xcmax-dr-prepare-standby-pg16' \
            ops/dr/xcmax_dr_install.sh
          grep -q 'xcmax-dr-apply-release' ops/dr/xcmax_dr_install.sh
          grep -q 'release_modstore_sha' ops/dr/xcmax_dr_status.sh
          grep -q 'release_fhd_sha' ops/dr/xcmax_dr_status.sh
          grep -q 'xcmax-release-order' ops/dr/xcmax_dr_apply_release.sh
          grep -q 'xcmax_release_sync.sh' FHD/scripts/deploy/fhd-auto-update.sh
          grep -q 'xcmax_release_sync.sh' \
            "成都修茈科技有限公司/MODstore_deploy/.github/workflows/prod-deploy.yml"
