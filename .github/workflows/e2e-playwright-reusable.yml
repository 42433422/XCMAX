# CI SSOT: Playwright P0 reusable workflow (called from .github/workflows/e2e.yml)
name: e2e-playwright-reusable

on:
  workflow_call:
    inputs:
      run_skeleton:
        description: Run plan2026-skeleton specs when E2E_FULL_STACK=1
        required: false
        type: boolean
        default: false

jobs:
  playwright:
    name: Playwright P0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FHD/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up cached uv installer
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            FHD/requirements-server-api.txt
            FHD/ops/deploy/requirements-dev.txt
            FHD/uv.lock
            FHD/pyproject.toml
            FHD/packages/**/pyproject.toml

      - name: Install backend dependencies for live smoke
        working-directory: FHD
        run: |
          set -euo pipefail
          pytest_pin="$(python "$GITHUB_WORKSPACE/FHD/scripts/dev/check_requirements_lock.py" --pytest-pin)"
          [[ "$pytest_pin" =~ ^pytest==[0-9]+(\.[0-9]+){2}$ ]]
          python -m venv .venv
          uv pip install --python .venv/bin/python -r requirements-server-api.txt -r ops/deploy/requirements-dev.txt "$pytest_pin"
          uv pip check --python .venv/bin/python

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers (pinned by package-lock)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('FHD/frontend/package-lock.json') }}

      # 2026-09-10 #1851 复审：apt 外部源（Google Chrome 等）曾出现 Hash Sum
      # mismatch 导致 P0 E2E 被环境阻断。整改：浏览器二进制走 Playwright CDN
      # 让 job 红掉并保留日志——禁止 || true 或跳过当修复。
      - name: Install Playwright Chromium binary (CDN)
        run: npx playwright install chromium

      - name: Install Playwright system deps (bounded retry)
        run: |
          set -uo pipefail
          rc=1
          for attempt in 1 2 3; do
            echo "[deps] attempt ${attempt}/3"
            if npx playwright install-deps chromium; then
              rc=0
              break
            fi
            echo "::warning::playwright install-deps attempt ${attempt} failed; refreshing apt lists"
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/*
            sudo find /etc/apt -type f -exec sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' {} + || true
            sudo apt-get update
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::playwright system deps failed after 3 attempts (环境阻断，需人工排查，不得跳过)"
            exit 1
          fi

      # Mock contracts run once in fhd-ci-cd/frontend-e2e. This independent gate
      # retains the strict production build and real API + browser path.
      - name: Run full-stack login + ERP P0 (mandatory)
        env:
          E2E_FULL_STACK: "1"
          E2E_PYTHON: ${{ github.workspace }}/FHD/.venv/bin/python
        run: bash ../scripts/dev/e2e-full.sh

      - name: Upload full-stack Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-full-stack-playwright-evidence
          path: |
            ${{ runner.temp }}/xcagi-e2e-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
