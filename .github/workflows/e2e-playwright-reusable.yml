# CI SSOT: Playwright P0 reusable workflow (called from .github/workflows/e2e.yml)
name: e2e-playwright-reusable

on:
  workflow_call:
    inputs:
      run_skeleton:
        description: Run plan2026-skeleton specs when E2E_FULL_STACK=1
        required: false
        type: boolean
        default: false

jobs:
  playwright:
    name: Playwright P0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FHD/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies for live smoke
        working-directory: FHD
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            -r requirements-server-api.txt \
            -r deploy/requirements-dev.txt

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # E2E_VITE_MOCK_API=1: SSOT mock contract (Playwright route mocks in e2e/helpers.ts).
      - name: Run P0 e2e (mock API)
        env:
          E2E_VITE_MOCK_API: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5001
        run: |
          npm run dev -- --host 127.0.0.1 --port 5001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5001/ >/dev/null && break
            sleep 2
          done
          npm run test:e2e:p0 -- --reporter=line

      # Mandatory real API + browser path. Mock contracts and deployable runtime
      # remain separate gates so one cannot make the other look green.
      - name: Run full-stack login + ERP P0 (mandatory)
        env:
          E2E_FULL_STACK: "1"
          E2E_USER: xcagi-enterprise-demo
          E2E_PASSWORD: Demo@2026
          E2E_ACCOUNT_KIND: enterprise
          E2E_PYTHON: ${{ github.workspace }}/FHD/.venv/bin/python
        run: bash ../scripts/dev/e2e-full.sh

      - name: Upload full-stack Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-full-stack-playwright-evidence
          path: |
            FHD/frontend/playwright-report/
            FHD/frontend/test-results/
            FHD/docs/evidence/e2e/*.png
          if-no-files-found: warn
          retention-days: 14
