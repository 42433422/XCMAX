# CI SSOT: generated from FHD/.github/workflows/ai-issue-implement.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: AI Issue Implement
run-name: >-
  AI Issue Implement #${{ github.event.issue.number || inputs.issue_number }}${{ inputs.dispatch_request_id && format(' [dispatch:{0}]', inputs.dispatch_request_id) || '' }}

# 决策矩阵承诺兑现：
#   - issue 打 `ai-implement` 标签时触发
#   - 授权：命中 config/auto-implement-allowlist.yaml 域标签，或 owner 评论「确认」
#   - 预估变更 >5 文件时拒做
#   - 修复交给 Para（devfleet，优先 cursor）执行，经 MODstore 派单专用服务令牌下发；
#     本链路不调用任何 LLM key（2026-10-10 用户规则：发版解决问题必须经过 Para）
#   - Para 推送分支后创建 PR（`ai-generated` + `para`），CI 全绿后才合并；PR 正文用 Refs 不用 Closes，
#     需安装包验收的缺陷在新包实机验收通过后再关单
#
# 触发条件：
#   1. issues 事件（labeled: ai-implement）
#   2. issue_comment 事件（owner 精确评论「确认实现」或 /approve-implementation）
#   3. workflow_dispatch（手动）
#   4. 原 Para worker 完成后，只读核验原公司预算与任务并恢复同一 producer

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Para GitHub Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue 编号（手动触发用）"
        required: true
      control_task_id:
        description: "恢复已有控制任务（从 Issue 回执复制），不重新派单"
        required: false
        default: ""
      target_branch:
        description: "修复 PR 的目标分支（自愈事件传入原失败分支）"
        required: false
        default: "main"
      dispatch_request_id:
        description: "Original self-heal dispatch identity for lost-response readback"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read


defaults:
  run:
    working-directory: FHD

jobs:
  resolve:
    # 标签事件只处理开放 issue；评论事件必须是开放 issue 的 owner 明确确认。
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.run_attempt == 1) ||
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       github.event.label.name == 'ai-implement') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.state == 'open' &&
       github.event.comment.author_association == 'OWNER' &&
       (github.event.comment.body == '确认实现' ||
        github.event.comment.body == '/approve-implementation') &&
       contains(github.event.issue.labels.*.name, 'ai-implement'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      issue_number: ${{ steps.identity.outputs.issue_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Read the original issue identity
        id: identity
        working-directory: FHD
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODSTORE_PARA_DISPATCH_TOKEN: ${{ secrets.MODSTORE_PARA_DISPATCH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --resolve-only)
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            args+=(--resume-worker-event)
          else
            args+=(--issue-number "$ISSUE_NUMBER")
          fi
          python scripts/dev/para_issue_dispatch.py "${args[@]}"

  implement:
    needs: resolve
    if: needs.resolve.outputs.issue_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: ai-issue-implement-${{ needs.resolve.outputs.issue_number }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MODSTORE_PARA_DISPATCH_TOKEN: ${{ secrets.MODSTORE_PARA_DISPATCH_TOKEN }}
      # GITHUB_TOKEN 开的 PR 不会触发 pull_request workflow，必需 CI 不会启动；改用 CI_COMMIT_TOKEN 开 PR。
      PR_CREATE_TOKEN: ${{ secrets.CI_COMMIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server-api.txt

      - name: Validate & hand issue to Para
        working-directory: FHD
        env:
          ISSUE_NUMBER: ${{ needs.resolve.outputs.issue_number }}
          BASE_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
          CONTROL_TASK_ID: ${{ github.event.inputs.control_task_id || '' }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --tool cursor)
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            args+=(--resume-worker-event)
          else
            args+=(--issue-number "$ISSUE_NUMBER" --base-branch "$BASE_BRANCH" --control-task-id "$CONTROL_TASK_ID")
          fi
          python scripts/dev/para_issue_dispatch.py "${args[@]}"

      - name: Upload implementation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-issue-implement-log-${{ needs.resolve.outputs.issue_number }}
          path: FHD/test_reports/para_issue_dispatch_${{ needs.resolve.outputs.issue_number }}.json
          if-no-files-found: ignore
