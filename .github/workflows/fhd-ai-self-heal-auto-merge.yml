name: AI Self-Heal Auto-Merge SLA

on:
  schedule:
    # 每 6 小时：00:00 / 06:00 / 12:00 / 18:00 UTC
    # 加快 ai-generated PR 的 auto-merge 闭环（原每日 01:00 UTC）
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅打印动作不实际合并/关闭"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-self-heal-sla
  cancel-in-progress: false

defaults:
  run:
    working-directory: FHD

jobs:
  process-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Process ai-self-heal PRs by SLA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/ci/ai_self_heal_sla.py \
            --auto-merge-r0-hours 12 \
            --auto-merge-r1-hours 48 \
            --stale-r2-days 7 \
            --close-r2-days 14 \
            --stale-r3-days 7 \
            --close-r3-days 30 \
            $DRY_RUN_FLAG

      - name: Commit stale log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/ai-self-heal-stale.jsonl || true
          git diff --staged --quiet || git commit -m "chore(self-heal): sla stale log $(date -u +%Y%m%d)"
          git push || true
