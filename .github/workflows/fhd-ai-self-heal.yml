# CI SSOT: generated from FHD/.github/workflows/ai-self-heal.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: AI Self-Heal

on:
  workflow_run:
    # workflow_run matches the target workflow's `name:`, not its file path.
    # Keep this inline so the monorepo workflow publisher does not path-prefix
    # these display names while rewriting path-list entries.
    # 监听 CI/CD Pipeline / Smoke Tests / cvm-autonomy-watcher 等关键 workflow 失败：
    #   - cvm-autonomy-watcher：每 10 min cron SSH 触发，失败时必须被感知，
    #     否则相对导入 bug / SSH 失败 / manifest drift 永不闭环（详见 cvm_autonomy_watcher.py）
    workflows: ["CI/CD Pipeline", "Smoke Tests", "cvm-autonomy-watcher", "Deploy MODstore Production", "fhd-deploy", "Release gate CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "失败 workflow run id（手动触发用）"
        required: false
        default: ""
      workflow_name:
