# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
# CI SSOT: generated from FHD/.github/workflows/fhd-ai-self-heal.yml
# 编辑源：FHD/.github/workflows/fhd-ai-self-heal.yml（根仓 .github/workflows/fhd-ai-self-heal.yml 为同步副本）
name: AI Self-Heal

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_run:
    # Match display names in one inline list; the publisher path-prefixes sequence items.
    workflows: ["CI/CD Pipeline", "CI - Backend Python", "Source Governance", "Smoke Tests", "Employee Smoke Gate", "MODstore tests", "cvm-autonomy-watcher", "Deploy MODstore Production", "fhd-deploy", "Release gate CI", "Capacity staging monthly", "desktop-macos-smoke", "ci-mobile-flutter", "ci-mobile-ios", "Deploy corp site (xiu-ci.com)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reconcile:
        description: "核对并恢复已有故障，不创建新的事故"
        type: boolean
        default: false
      dry_run:
        description: "仅盘点已有事故，不续接或关单"
        type: boolean
        default: true
      run_id:
        description: "失败 workflow run id（手动触发用）"
        required: false
        default: ""
      workflow_name:
        description: "失败 workflow 名称"
        required: false
        default: ""
      branch:
        description: "失败 workflow 所在分支"
        required: false
        default: ""
      head_repo:
        description: "失败 workflow 的 head 仓库（fork 保护）"
        required: false
        default: ""

# Keep the latest failed source run; isolate manual, deploy and monitoring runs.
concurrency:
  group: >-
    ai-self-heal-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && !contains(fromJSON('["cvm-autonomy-watcher", "Deploy MODstore Production", "fhd-deploy", "Capacity staging monthly", "Deploy corp site (xiu-ci.com)"]'), github.event.workflow_run.name)) && format('src-{0}-{1}', github.event.workflow_run.workflow_id, github.event.workflow_run.head_branch) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write


defaults:
  run:
    working-directory: FHD

jobs:
  self-heal:
    # 仅当 workflow_run 失败时触发；workflow_dispatch 手动触发不受此条件限制
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.reconcile) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Durable GitHub-side circuit breaker. Repository variables may tighten
      # these bounds without changing code; missing/invalid values fail to defaults.
      AI_SELF_HEAL_MAX_OPEN_INCIDENTS: ${{ vars.AI_SELF_HEAL_MAX_OPEN_INCIDENTS || '20' }}
      AI_SELF_HEAL_MAX_OPEN_PER_WORKFLOW: ${{ vars.AI_SELF_HEAL_MAX_OPEN_PER_WORKFLOW || '5' }}
      AI_SELF_HEAL_MAX_RECENT_INCIDENTS: ${{ vars.AI_SELF_HEAL_MAX_RECENT_INCIDENTS || '20' }}
      AI_SELF_HEAL_INCIDENT_BUDGET_HOURS: ${{ vars.AI_SELF_HEAL_INCIDENT_BUDGET_HOURS || '24' }}
      # Approval ledger callback（fail-open client needs both）
      FHD_API_BASE_URL: https://xiu-ci.com/fhd-api
      AUTONOMY_WEBHOOK_TOKEN: ${{ secrets.MODSTORE_OPS_INGEST_TOKEN }}
      MODSTORE_OPS_INGEST_TOKEN: ${{ secrets.MODSTORE_OPS_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FHD/scripts/ci/requirements-self-heal.txt

      - name: Install dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ci/requirements-self-heal.txt

      - name: Run ai-self-heal (workflow_run trigger)
        if: ${{ github.event_name == 'workflow_run' }}
        working-directory: FHD
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          python scripts/ci/ai_self_heal.py \
            --workflow "$SOURCE_WORKFLOW" \
            --branch "$SOURCE_BRANCH" \
            --head-repo "$SOURCE_REPO"

      - name: Run ai-self-heal (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: FHD
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          SOURCE_WORKFLOW: ${{ inputs.workflow_name }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          SOURCE_REPO: ${{ inputs.head_repo }}
        run: |
          python scripts/ci/ai_self_heal.py \
            --run-id "$SOURCE_RUN_ID" \
            --workflow "$SOURCE_WORKFLOW" \
            --branch "$SOURCE_BRANCH" \
            --head-repo "$SOURCE_REPO"

  reconcile:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.reconcile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ai-self-heal-incident-reconciliation
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned GitHub adapter dependencies
        working-directory: FHD
        run: pip install -r scripts/ci/requirements-self-heal.txt
      - name: Reconcile durable incident receipts
        working-directory: FHD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--reconcile)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python scripts/ci/ai_self_heal.py "${args[@]}"
      - name: Retain incident reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-heal-reconciliation-${{ github.run_id }}
          path: FHD/test_reports/self_heal_reconciliation.json
          if-no-files-found: error
