name: FHD Alembic SSOT

"on":
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Candidate tests never inherit repository-wide write permissions.
permissions:
  contents: read

jobs:
  # 统一 changed-path 分类（SSOT: scripts/dev/change_classifier.py）——docs/前端改动不跑迁移重活。
  classify:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths (backend)
        id: c
        if: github.event_name == 'pull_request'
        run: |
          python scripts/dev/change_classifier.py --category backend \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  single-head:
    needs: classify
    if: needs.classify.outputs.backend != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Alembic single-head / no-dangling check
        run: python3 scripts/guard_alembic_single_head.py

  ssot-parity-sqlite:
    needs: classify
    if: needs.classify.outputs.backend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    env:
      DATABASE_URL: sqlite:////tmp/fhd_alembic_ssot_parity.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install FHD runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server-api.txt -e ".[server-api]"
      - name: alembic upgrade head
        run: alembic -c alembic.ini upgrade head
      - name: alembic check
        run: alembic -c alembic.ini check

  ssot-parity-postgresql:
    needs: classify
    if: needs.classify.outputs.backend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    services:
      postgres:
        # Reuse the existing pgvector PostgreSQL 16 deployment image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: xcagi_test
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: xcagi_migration_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U xcagi_test -d xcagi_migration_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://xcagi_test:migration-test-only@127.0.0.1:5432/xcagi_migration_test
      XCMAX_MIGRATION_TEST_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install FHD runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server-api.txt -e ".[server-api]"
      - name: PostgreSQL historical upgrade and ERP preservation
        run: python scripts/dev/verify_pg_history_upgrade.py
      - name: alembic upgrade head
        run: alembic -c alembic.ini upgrade head
      - name: alembic check
        run: alembic -c alembic.ini check
