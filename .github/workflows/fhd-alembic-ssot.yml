name: FHD Alembic SSOT

"on":
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # 统一 changed-path 分类（SSOT: scripts/dev/change_classifier.py）——docs/前端改动不跑迁移重活。
  classify:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths (backend)
        id: c
        if: github.event_name == 'pull_request'
        run: |
          python scripts/dev/change_classifier.py --category backend \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

  single-head:
    needs: classify
    if: needs.classify.outputs.backend != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Alembic single-head / no-dangling check
        run: python3 scripts/guard_alembic_single_head.py

  ssot-parity-sqlite:
    needs: classify
    if: needs.classify.outputs.backend != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    env:
      DATABASE_URL: sqlite:////tmp/fhd_alembic_ssot_parity.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FHD runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server-api]"
      - name: alembic upgrade head
        run: alembic -c alembic.ini upgrade head
      - name: alembic check
        run: alembic -c alembic.ini check
