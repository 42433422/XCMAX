# CI SSOT: generated from FHD/.github/workflows/audit-remediation-snapshot.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Audit remediation source snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: audit-remediation-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/audit-a01-a14-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download verification dependencies without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/xcmax-audit-tools"
          mkdir -p "$destination"
          python -m pip download --index-url https://pypi.org/simple --only-binary=:all: --dest "$destination" black==26.10.1 isort==6.1.0 mypy==2.4.0 'bcrypt>=4' 'apscheduler<4' 'redis>=5' 'paramiko>=3.4' 'PyJWT>=2.8' 'langchain-core>=0.3' types-requests types-redis types-PyYAML
          sha256sum "$destination"/*.whl > "$destination/SHA256SUMS.txt"
      - name: Retain public verification tooling for this audit only
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-tools-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/xcmax-audit-tools/
          retention-days: 1
          if-no-files-found: error
