# CI SSOT: root-only workflow — dispatches backend pending actions into environment review.
name: FHD autonomy approval dispatcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      seed_action:
        description: Optional production E2E probe before dispatching pending work
        required: false
        type: choice
        default: none
        options:
          - none
          - freeze_manifest
          - unfreeze_manifest
          - probe_db_migration
      action_id:
        description: Optional stable id for the seeded action
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: read

concurrency:
  group: fhd-autonomy-approval-dispatch
  cancel-in-progress: false

jobs:
  dispatch-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pending actions into production environment review
        env:
          AUTONOMY_CALLBACK_URL: ${{ vars.AUTONOMY_CALLBACK_URL }}
          AUTONOMY_WEBHOOK_TOKEN: ${{ secrets.MODSTORE_OPS_INGEST_TOKEN }}
          SEED_ACTION: ${{ inputs.seed_action }}
          SEED_ACTION_ID: ${{ inputs.action_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${AUTONOMY_CALLBACK_URL:-}" ] || [ -z "${AUTONOMY_WEBHOOK_TOKEN:-}" ]; then
            echo "::error::AUTONOMY_CALLBACK_URL and MODSTORE_OPS_INGEST_TOKEN are required."
            exit 1
          fi
          autonomy_api_base="${AUTONOMY_CALLBACK_URL%/github-approval}"
          seed_action="${SEED_ACTION:-none}"
          seed_action_id="${SEED_ACTION_ID:-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          if [ "$seed_action" = "probe_db_migration" ]; then
            probe_body="${RUNNER_TEMP}/prohibited-probe.json"
            status="$(curl --silent --show-error --output "$probe_body" --write-out '%{http_code}' \
              -X POST "$autonomy_api_base/actions/evaluate" \
              -H "Authorization: Bearer $AUTONOMY_WEBHOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg action_id "$seed_action_id" '{action:"db_migration",action_id:$action_id}')")"
            cat "$probe_body"
            if [ "$status" != "403" ]; then
              echo "::error::Expected prohibited db_migration to return 403, got $status"
              exit 1
            fi
            echo "Prohibited action was blocked and audited (action_id=$seed_action_id)."
          elif [ "$seed_action" != "none" ]; then
            case "$seed_action" in
              freeze_manifest|unfreeze_manifest) ;;
              *) echo "::error::Unsupported seed action: $seed_action"; exit 1 ;;
            esac
            curl --fail-with-body --silent --show-error \
              -X POST "$autonomy_api_base/actions/request" \
              -H "Authorization: Bearer $AUTONOMY_WEBHOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg action "$seed_action" --arg action_id "$seed_action_id" '{action:$action,action_id:$action_id,payload:{probe:"github-actions-e2e"}}')"
          fi
          pending="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $AUTONOMY_WEBHOOK_TOKEN" \
            "$autonomy_api_base/actions/pending")"
          jq -r '
            .items[]
            | select(.state == "pending_approval")
            | select(.executor_name == "github_deploy")
            | [.action_id, .payload.workflow_action]
            | @tsv
          ' <<< "$pending" | while IFS=$'\t' read -r action_id workflow_action; do
            if [ -z "$action_id" ] || [ -z "$workflow_action" ]; then
              continue
            fi
            case "$workflow_action" in
              apply-latest|restart-only|freeze-manifest|unfreeze-manifest) ;;
              *) echo "::warning::Unsupported workflow action for $action_id"; continue ;;
            esac
            active_run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow fhd-deploy.yml \
              --limit 100 \
              --json displayTitle,status,databaseId \
              --jq '.[] | select(.displayTitle | contains("autonomy:'"$action_id"'")) | select(.status != "completed") | .databaseId' \
              | head -n 1)"
            if [ -n "$active_run" ]; then
              echo "Approval workflow already active for $action_id (run=$active_run)."
              continue
            fi
            gh workflow run fhd-deploy.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f environment=production \
              -f action="$workflow_action" \
              -f action_id="$action_id"
            payload="$(jq -nc \
              --arg action_id "$action_id" \
              --arg approval_id "$GITHUB_RUN_ID" \
              '{action_id:$action_id,approval_id:$approval_id,approver:"github-actions",decision:"approval_requested"}')"
            curl --fail-with-body --silent --show-error \
              -X POST "$AUTONOMY_CALLBACK_URL" \
              -H "Authorization: Bearer $AUTONOMY_WEBHOOK_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload"
          done
