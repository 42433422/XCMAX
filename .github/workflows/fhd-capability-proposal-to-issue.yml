# CI SSOT: generated from FHD/.github/workflows/capability-proposal-to-issue.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Capability Proposal to Issue

# 进化状态闭环（2026-07-20）：
#   1. intent_confirmation_service 仅在 skill_proposal 时写 capability_proposal.jsonl
#   2. 主路径由 MODstore 本地 capability_proposal_relay 调度并写 processed 收据
#   3. 创建脱敏治理 issue，不直接触发任意代码生成
#   4. 能力边界/风险/验收通过后，再进入受控实现与 MODstore 上架链
#
# 本 workflow 仅保留为已同步提案的手动 CI 兜底；GitHub runner 看不到桌面本地 JSONL。

on:
  workflow_dispatch:
    inputs:
      max_issues:
        description: "单次最多创建 issue 数"
        required: false
        default: "5"

permissions:
  issues: write
  contents: read


defaults:
  run:
    working-directory: FHD

jobs:
  create-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements-server-api.txt

      - name: Read proposals and create issues
        working-directory: FHD
        env:
          MAX_ISSUES: ${{ github.event.inputs.max_issues || '5' }}
        run: |
          python scripts/dev/capability_proposal_to_issue.py \
            --repo "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --max-issues "$MAX_ISSUES" \
            --apply

      - name: Upload proposal log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-proposal-log
          path: FHD/test_reports/capability_proposal.jsonl
          if-no-files-found: ignore
