# CI SSOT: generated from FHD/.github/workflows/ci-cd.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, master ]
    tags:
      - "FHD/v*"
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Release channel (stable=prod, staging)"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - staging
      push_to_cvm:
        description: "Push release artifacts to CVM update server"
        required: false
        default: false
        type: boolean
      push_image_tar:
        description: "Also push the optional 600MB+ offline image archive"
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME_FHD_API: ${{ github.repository }}/xcagi-fhd-api


defaults:
  run:
    working-directory: FHD

jobs:
  # Guard against temporary scripts in business directories
  guard-temp-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 保留 HEAD~1 给手动运行；PR/base 与 push/before 在下方精确补取。
          fetch-depth: 2

      - name: Block new temporary scripts
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "${BASE_REF}" --depth=1
            ADDED_FILES="$(git diff --name-only --diff-filter=A "origin/${BASE_REF}"...HEAD || true)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual rerun: scan only files newly added in the tip commit (not entire tree).
            ADDED_FILES="$(git diff --name-only --diff-filter=A HEAD~1 HEAD 2>/dev/null || true)"
          else
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              ADDED_FILES="$(git diff --name-only --diff-filter=A HEAD~1 HEAD 2>/dev/null || true)"
            else
              git fetch origin "${BEFORE_SHA}" --depth=1 || true
              ADDED_FILES="$(git diff --name-only --diff-filter=A "${BEFORE_SHA}" "${{ github.sha }}" || true)"
            fi
          fi

          echo "Added files:"
          echo "${ADDED_FILES}"

          python3 scripts/ci/guard_temp_scripts.py --all-tracked
          printf '%s\n' "${ADDED_FILES}" | python3 scripts/ci/guard_temp_scripts.py --added-from-stdin
          echo "✅ Temporary script location guard passed."

  # Backend Tests & Quality
  backend-test:
    needs: guard-temp-scripts
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements-server-api.txt
          pip install -r deploy/requirements-dev.txt

      - name: Verify requirements lock is in sync
        run: |
          python scripts/dev/check_requirements_lock.py

      - name: Validate coverage SSOT metadata
        run: python scripts/ci/check_coverage_ssot.py

      - name: Run Ruff lint
        run: ruff check app/ tests/

      - name: Run Ruff format check
        run: ruff format --check app/ tests/

      - name: Run mypy type checking
        run: mypy app/ --no-error-summary

      - name: Type/SQL debt ratchet
        run: |
          python scripts/dev/count_type_debt.py --max-type-ignore 69 --max-ts-nocheck 0 --max-any 99999
          python scripts/dev/count_raw_sql.py

      - name: "[观察期] Schema drift check（模型 vs 迁移链）"
        continue-on-error: true
        run: python scripts/dev/check_schema_drift.py

      - name: Big files ratchet (巨文件只减不增)
        run: python scripts/dev/count_big_files.py

      - name: Route integrity tests
        env:
          XCAGI_SKIP_LEGACY_COMPAT_ROUTES: "1"
        run: python -m pytest tests/test_routes/test_route_registry.py tests/test_routes/test_registry_unit.py tests/test_routes/test_route_golden.py -x -q

      - name: Run tests with coverage
        env:
          XCAGI_SKIP_LEGACY_COMPAT_ROUTES: "1"
          INTENT_BENCHMARK_RUN: "1"
        run: |
          mkdir -p coverage
          # 行 floor SSOT = pyproject.toml [tool.coverage.report] fail_under（铁律1 全量 source=[app]）。
          # 开启 branch=true 后 coverage 自带门禁按"行+分支合并"指标拦截，故 --cov-fail-under=0，
          # 把行/分支门禁交给 coverage_ratchet.py --check（分支/前端 floor 见
          # metrics/coverage_ratchet_baseline.json）。禁止再硬编码窄包阈值。
          python -m pytest tests/ -v \
            --cov --cov-branch --cov-fail-under=0 \
            --cov-report=xml --cov-report=json:coverage.json \
            --cov-report=html --cov-report=term-missing

      - name: Coverage floor guard (下调必须有 ADR)
        if: github.event_name == 'pull_request'
        run: |
          # PR checkout 是 merge commit，工作区==HEAD，必须对比目标分支才能识别下调。
          git fetch --depth=1 origin "${{ github.base_ref }}"
          python scripts/dev/guard_coverage_floor.py --base FETCH_HEAD

      - name: coverage_ramp stub quota (只减不增)
        run: python scripts/dev/count_coverage_ramp_stubs.py --check

      - name: test-bloat gate (P1-2 测试膨胀门禁)
        run: python scripts/dev/test_bloat_report.py --check

      - name: Coverage ratchet check (行/分支只升不降)
        env:
          XCAGI_SKIP_LEGACY_COMPAT_ROUTES: "1"
        run: python scripts/dev/coverage_ratchet.py --check --require-backend --record
        # 注意：暂不追加 --peak-floor —— 历史峰值与当前实测差距 > 0.5pt，启用即全红；
        # 启用条件见 scripts/dev/guard_coverage_floor.py docstring。

      # Codecov policy: optional until CODECOV_TOKEN is in repo secrets
      # (Settings → Secrets and variables → Actions). Without token this step is
      # best-effort (continue-on-error); coverage.xml + htmlcov/ remain local SSOT.
      - name: Upload coverage report
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          name: xcagi-backend
          fail_ci_if_error: false

      # 行为覆盖率诚实化（Delta A）：排除 coverage_ramp 注水 stub 后的真实行为口径。
      # 这是后端覆盖率门禁的唯一硬 gate（--behavior --require-backend），回退即阻断。
      - name: Behavior coverage gate (排除 coverage_ramp stub，硬门禁)
        env:
          XCAGI_SKIP_LEGACY_COMPAT_ROUTES: "1"
        run: |
          python -m pytest tests/ -q -m 'not coverage_ramp' \
            --cov --cov-branch --cov-report=json:coverage-behavior.json \
            --cov-fail-under=0
          python scripts/dev/coverage_ratchet.py --check --behavior --require-backend --record

  frontend-test:
    needs: guard-temp-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Install dependencies
        working-directory: FHD/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: FHD/frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: FHD/frontend
        run: npm run test

      - name: Run unit tests with coverage
        working-directory: FHD/frontend
        run: npm run test:coverage

      # 前端覆盖率诚实化（Delta B）：以 coverage_ratchet.py 为硬门禁，回退即阻断。
      - name: Frontend coverage ratchet gate
        working-directory: FHD/frontend
        run: python ../scripts/dev/coverage_ratchet.py --check --require-frontend

      - name: Run vue-tsc
        working-directory: FHD/frontend
        run: |
          set +e
          npm run type-check
          if [ "$?" -ne 0 ]; then
            echo "::warning::vue-tsc reported errors (advisory; strict build uses tsconfig.build.json)"
          fi

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # PR/push E2E: mock API (E2E_VITE_MOCK_API=1) — npm run test:e2e:p0 → 8 pass / 6 skip
  # (smoke 3 pass + 1 skip, critical-paths 5 pass, plan2026-skeleton 5 skip w/o E2E_FULL_STACK).
  # Full-stack 14/14: root e2e.yml on schedule or workflow_dispatch (see e2e-playwright-reusable.yml).
  frontend-e2e:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Install Playwright and start dev server
        working-directory: FHD/frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run dev -- --host 127.0.0.1 --port 5001 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5001/ >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:5001/ >/dev/null

      - name: Run P0 E2E (mock API)
        working-directory: FHD/frontend
        env:
          E2E_VITE_MOCK_API: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5001
        run: npm run test:e2e:p0 -- --reporter=line

  # Architecture Fitness Check
  arch-fitness:
    needs: guard-temp-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run architecture fitness checks
        run: python scripts/arch_fitness.py

      - name: arch-fitness-legacy-check (P1-4 双轨边界)
        run: |
          python - <<'PY'
          import subprocess, sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), "scripts"))
          import arch_fitness
          r = subprocess.run(["python", "scripts/arch_fitness.py"], capture_output=True, text=True)
          baselined = arch_fitness._load_baseline_keys()
          # 只拦「新增」的 legacy/compat 散落；基线内已知项放行（与 arch_fitness.py 判定一致）。
          blocked = [l for l in (r.stdout + r.stderr).splitlines()
                     if "[legacy-boundary]" in l and "must live under app/legacy/" in l
                     and arch_fitness._violation_key(l) not in baselined]
          if blocked:
              print("::error::新增 legacy/compat 文件散落到 app/legacy/ 之外：")
              print("\n".join(blocked))
              sys.exit(1)
          print("arch-fitness-legacy-check OK")
          PY

      - name: docs-ssot-lint
        run: python scripts/dev/docs_ssot_lint.py --strict

  # Security & Dependency Scanning
  security-scan:
    needs: guard-temp-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run security checks
        run: |
          # Security gate policy (see docs/CI_SSOT.md → Security scanning):
          #  - HARD gate for CRITICAL/HIGH = container-scan job (Trivy, exit-code 1).
          #  - safety (dependency CVE advisories) is ADVISORY here (needs triage), non-blocking.
          #  - bandit broad scan (--exit-zero) is ADVISORY; the focused B608 (SQL injection)
          #    pass below is BLOCKING.
          pip install safety bandit
          safety check -r deploy/requirements-server-api.txt --full-report || {
            echo "::warning::safety reported advisories (non-blocking); see full-report above"
          }
          bandit -r app/ -lll --skip B101,B601,B110 --exit-zero
          # B608=SQLi (blocking scan below skips it); B324/B413=cache-key hash & legacy wechat crypto (non-exploit)
          bandit -r app/ -lll -s B608,B324,B413

  # Container image vulnerability scan (built image from CI Dockerfile)
  container-scan:
    needs: [backend-test, frontend-test, frontend-e2e, security-scan, pack-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download immutable server release
        uses: actions/download-artifact@v4
        with:
          name: fhd-server-release
          path: FHD/dist/deploy

      - name: Restore CI-built admin console into scan context
        run: |
          set -euo pipefail
          artifact="$(find dist/deploy -maxdepth 1 -name 'fhd-full-*.tar.gz' -print -quit)"
          test -n "$artifact"
          tar -xzf "$artifact" ./templates/admin-vue-dist
          python3 scripts/deploy/lib/verify_admin_console.py \
            --root templates/admin-vue-dist \
            --expected-git-sha "${{ github.sha }}"

      - name: Build image for scanning
        run: docker build --target production -f docker/Dockerfile.fhd-api -t xcagi-ci-scan:local .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: xcagi-ci-scan:local
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # FHD 服务器 API 发布包（tarball + manifest；不含生产 SSH 部署）
  pack-verify:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js for immutable admin console
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Install admin console build dependencies
        working-directory: FHD/frontend
        run: npm ci

      - name: Verify stable version anchors
        run: python scripts/dev/verify_version_anchors.py

      - name: Pack FHD server release tarball
        run: bash scripts/deploy/fhd-pack-release.sh

      - name: Upload server release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fhd-server-release
          path: |
            FHD/dist/deploy/fhd-full-*.tar.gz
            FHD/dist/deploy/fhd-manifest.json
          if-no-files-found: error
          retention-days: 14

  # FHD API 生产镜像（xcagi-fhd-api → GHCR；manifest v2 含 image_digest）
  docker-build-fhd-api:
    needs: [backend-test, frontend-test, frontend-e2e, security-scan, container-scan, pack-verify, arch-fitness]
    runs-on: ubuntu-latest
    # image_tag = the exact tag metadata-action produced (rely on outputs.version, not a
    # hand-rolled short sha — see docker/metadata-action#479).
    outputs:
      image_tag: ${{ steps.meta_fhd.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write      # cosign keyless (Sigstore OIDC) + provenance
      attestations: write  # actions/attest-build-provenance (SLSA)

    steps:
      - uses: actions/checkout@v4

      # GHCR repo paths must be lowercase; github.repository here is 42433422/XCMAX (mixed case).
      # metadata-action lowercases its own tags, but the manual cosign/SBOM/provenance refs below
      # need an explicit lowercase name to avoid "repository name must be lowercase" failures.
      - name: Compute lowercase FHD API image name
        id: imgref
        run: |
          name="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FHD_API }}"
          echo "name=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download server release manifest
        uses: actions/download-artifact@v4
        with:
          name: fhd-server-release
          path: FHD/dist/deploy

      - name: Restore CI-built admin console into image context
        run: |
          set -euo pipefail
          artifact="$(find dist/deploy -maxdepth 1 -name 'fhd-full-*.tar.gz' -print -quit)"
          test -n "$artifact"
          tar -xzf "$artifact" ./templates/admin-vue-dist
          python3 scripts/deploy/lib/verify_admin_console.py \
            --root templates/admin-vue-dist \
            --expected-git-sha "${{ github.sha }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract FHD API image metadata
        id: meta_fhd
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.imgref.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/FHD/v') }}

      - name: Build and push xcagi-fhd-api
        id: build_fhd
        uses: docker/build-push-action@v5
        with:
          context: FHD
          file: FHD/docker/Dockerfile.fhd-api
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/FHD/v') }}
          tags: ${{ steps.meta_fhd.outputs.tags }}
          labels: ${{ steps.meta_fhd.outputs.labels }}
          build-args: |
            XCAGI_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=xcagi-fhd-api
          cache-to: type=gha,mode=max,scope=xcagi-fhd-api

      # ── Supply-chain trust (only when image was pushed → digest present) ──
      - name: Install Cosign
        if: steps.build_fhd.outputs.digest != ''
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign xcagi-fhd-api image (keyless / Sigstore OIDC)
        if: steps.build_fhd.outputs.digest != ''
        env:
          IMAGE_DIGEST_REF: ${{ steps.imgref.outputs.name }}@${{ steps.build_fhd.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST_REF}"

      - name: Generate SBOM (SPDX-JSON) for xcagi-fhd-api
        if: steps.build_fhd.outputs.digest != ''
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.imgref.outputs.name }}@${{ steps.build_fhd.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/fhd-api-sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM to image (cosign)
        if: steps.build_fhd.outputs.digest != ''
        env:
          IMAGE_DIGEST_REF: ${{ steps.imgref.outputs.name }}@${{ steps.build_fhd.outputs.digest }}
          SBOM_FILE: ${{ runner.temp }}/fhd-api-sbom.spdx.json
        run: cosign attest --yes --predicate "${SBOM_FILE}" --type spdxjson "${IMAGE_DIGEST_REF}"

      - name: Generate SLSA build provenance attestation
        if: steps.build_fhd.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.imgref.outputs.name }}
          subject-digest: ${{ steps.build_fhd.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM artifact
        if: steps.build_fhd.outputs.digest != ''
        uses: actions/upload-artifact@v4
        with:
          name: fhd-api-sbom
          path: ${{ runner.temp }}/fhd-api-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14

      - name: Merge image digest into manifest
        if: steps.build_fhd.outputs.digest != ''
        env:
          FHD_IMAGE_REF: ${{ steps.imgref.outputs.name }}
          FHD_IMAGE_DIGEST: ${{ steps.build_fhd.outputs.digest }}
        run: bash scripts/deploy/fhd-merge-manifest-image.sh

      - name: Export image tarball for server bootstrap
        if: steps.build_fhd.outputs.digest != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/FHD/v'))
        env:
          FHD_IMAGE_DIGEST: ${{ steps.build_fhd.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/deploy
          ref="${{ steps.imgref.outputs.name }}"
          # build-push-action 只推送到 GHCR，本地 daemon 无镜像；先 pull 再 save
          docker pull "${ref}@${FHD_IMAGE_DIGEST}"
          docker save "${ref}@${FHD_IMAGE_DIGEST}" -o dist/deploy/fhd-api-image.tar
          gzip -f dist/deploy/fhd-api-image.tar

      - name: Upload manifest with image digest
        if: steps.build_fhd.outputs.digest != ''
        uses: actions/upload-artifact@v4
        with:
          name: fhd-server-release-with-image
          path: |
            FHD/dist/deploy/fhd-manifest.json
            FHD/dist/deploy/fhd-full-*.tar.gz
            FHD/dist/deploy/fhd-api-image.tar.gz
          if-no-files-found: error
          retention-days: 14

  # gitops-image-bump 已随假 k8s/GitOps 路径退役（2026-07-01 运维根治）——
  # 生产 CD 的唯一正道是下方 cvm-push-release + 服务器端 fhd-auto-update.sh。

  # CVM 拉取式自动 CD（main 成功 + secrets 就绪时 scp manifest/tarball；无 secrets 则跳过）
  cvm-push-release:
    needs: [docker-build-fhd-api]
    if: |
      needs.docker-build-fhd-api.result == 'success' &&
      (
        (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (startsWith(github.ref, 'refs/tags/FHD/v') && github.event_name == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.push_to_cvm == true)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: cvm-push-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || (contains(github.ref, '-rc') && 'staging' || 'stable') }}
      # The CVM link needs tens of minutes. Cancelling a runner does not
      # reliably terminate its remote rsync receiver, so serialize releases
      # instead of leaving orphan transfers that compete with the next SHA.
      cancel-in-progress: false
    # 正常发布只推必需 tarball + manifest；离线镜像归档仅手动显式启用。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: fhd-server-release-with-image
          path: FHD/dist/deploy

      - name: Push to CVM update server
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
          FHD_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel || (contains(github.ref, '-rc') && 'staging' || 'stable') }}
          FHD_CVM_PUSH_STRICT: "true"
          FHD_PUSH_IMAGE_TAR: ${{ github.event_name == 'workflow_dispatch' && inputs.push_image_tar && '1' || '0' }}
          # Stable artifacts are uploaded atomically, then await the audited
          # fhd-deploy workflow approval. Staging remains immediate.
          FHD_PUSH_APPLY_NOW: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_channel || (contains(github.ref, '-rc') && 'staging' || 'stable')) == 'staging' && '1' || '0' }}
          # The production link currently needs roughly 42-50 minutes for the
          # normal release tarball. Keep a measured transfer margin while the
          # rsync .part file preserves progress across interrupted runs.
          FHD_CVM_PUSH_TIMEOUT: "75m"
        run: |
          set -euo pipefail
          if [ -z "${FHD_PUSH_HOST:-}" ] || [ -z "${FHD_PUSH_SSH_KEY_RAW:-}" ]; then
            if [ "${FHD_CVM_PUSH_STRICT:-false}" = "true" ]; then
              echo "::error::CVM push required (strict mode: tag release or workflow_dispatch) but FHD_PUSH_HOST/FHD_PUSH_SSH_KEY secrets missing. Configure secrets or the production server will serve stale artifacts."
              exit 1
            fi
            echo "::notice::Skipping CVM push — configure FHD_PUSH_HOST and FHD_PUSH_SSH_KEY in repo secrets."
            exit 0
          fi
          mkdir -p ~/.ssh
          KEY_FILE="${RUNNER_TEMP}/fhd_push_key"
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export FHD_SKIP_PACK=1
          export FHD_PUSH_SSH_KEY="$KEY_FILE"
          export FHD_PUSH_HOST="$FHD_PUSH_HOST"
          export FHD_PUSH_USER="${FHD_PUSH_USER:-root}"
          export FHD_RELEASE_CHANNEL="${FHD_RELEASE_CHANNEL:-stable}"
          set +e
          timeout "${FHD_CVM_PUSH_TIMEOUT:-12m}" bash scripts/deploy/fhd-push-release.sh
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "${FHD_CVM_PUSH_STRICT:-false}" = "true" ]; then
            echo "::error::CVM push failed with status ${status}."
            exit "$status"
          fi
          if [ "$status" -eq 124 ]; then
            echo "::warning::CVM push timed out after ${FHD_CVM_PUSH_TIMEOUT:-12m}; keeping main CI green. Use workflow_dispatch with push_to_cvm=true for a strict retry."
          else
            echo "::warning::CVM push failed with status ${status}; keeping main CI green. Use workflow_dispatch with push_to_cvm=true for a strict retry."
          fi

  # Bot-token workflow_dispatch does not reliably emit a downstream workflow_run
  # event. Dispatch Evolution with the repository PAT only after the exact CVM
  # release and DR receipt have succeeded.
  dispatch-evolution-after-cvm:
    needs: [cvm-push-release]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.push_to_cvm == true &&
      needs.cvm-push-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Evolution Orchestrator after exact production receipt
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh workflow run fhd-evolution-orchestrator.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f force_run=false

  # Docker Build & Push（全仓镜像）已于 2026-07-20 退役：推 <repo>:sha-xxx 无人引用，
  # 实际制品由 docker-build-fhd-api（GHCR fhd-api 镜像）与 pack-verify（tarball）承担。
  # 2026-08-01 移除残留 job 定义（无下游 needs，branch protection 未引用）。

  release-verify:
    name: release-verify
    needs: [backend-test, frontend-test, frontend-e2e, pack-verify, arch-fitness]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERIFY_SKIP_E2E: "1"
      RELEASE_VERIFY_SKIP_PACK: "0"
      RELEASE_VERIFY_SKIP_DESKTOP: "0"
      XCAGI_SKIP_LEGACY_COMPAT_ROUTES: "1"
      XCAGI_TENANT_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Install backend test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/requirements-server-api.txt -r deploy/requirements-dev.txt

      - name: Install frontend deps
        working-directory: FHD/frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: FHD/desktop
        run: npm ci

      - name: Run release_verify.sh
        run: bash scripts/dev/release_verify.sh

  desktop-build-smoke:
    name: desktop-build-smoke
    needs: [frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/desktop/package-lock.json
      - name: Desktop tsc build
        working-directory: FHD/desktop
        run: |
          npm ci
          npm run build

  desktop-test:
    name: desktop-test
    needs: [frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/desktop/package-lock.json
      - name: Install desktop deps
        working-directory: FHD/desktop
        run: npm ci
      - name: Run full desktop unit-test suite
        working-directory: FHD/desktop
        run: npm test

  desktop-windows-release-script-smoke:
    name: desktop-windows-release-script-smoke
    needs: [guard-temp-scripts]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/desktop/package-lock.json
      - name: Parse Windows release scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/package/build-installer.ps1',
            'scripts/package/pre-release-security.ps1',
            'scripts/package/verify-windows-signature.ps1',
            'scripts/package/verify-windows-installed-runtime.ps1'
          )) {
            $content = Get-Content -LiteralPath $path -Raw
            $null = [scriptblock]::Create($content)
            Write-Host "PowerShell parse OK: $path"
          }
      - name: Parse SSL.com electron-builder signing hook
        shell: pwsh
        run: node --check desktop/build/windows-sign.cjs
      - name: Install SSL.com CodeSignTool smoke
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: --version
          environment_name: PROD
          signing_method: v2
      - name: Verify SSL.com CodeSignTool exports
        shell: pwsh
        run: |
          if (-not $env:CODE_SIGN_TOOL_PATH) {
            throw 'SSL.com action did not export CODE_SIGN_TOOL_PATH'
          }
          if (-not $env:JAVA_HOME) {
            throw 'SSL.com action did not provide or retain JAVA_HOME'
          }
          $jar = Join-Path $env:CODE_SIGN_TOOL_PATH 'jar/code_sign_tool-1.3.0.jar'
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          foreach ($path in @($jar, $java)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "SSL.com CodeSignTool smoke path missing: $path"
            }
          }
          & $java -Xmx1024M -jar $jar --version
          if ($LASTEXITCODE -ne 0) {
            throw "SSL.com CodeSignTool version probe failed with exit code $LASTEXITCODE"
          }
      - name: Test Windows full rollback helper
        shell: pwsh
        working-directory: FHD/desktop
        run: |
          npm ci
          $env:XCAGI_DESKTOP_TEST = '1'
          npx vitest run rollback-windows.test.ts updater-install.test.ts rollback.test.ts

  # SSOT drift gate (blocking): drift in any registered SSOT domain fails the pipeline.
  # deps/k8s drift cleared + employee-roster/db-schema registered 2026-06-23 + service-topology 2026-06-24.
  # dev-inventory / dev-guards (统一入口) registered 2026-08-07 — 收编分散规范性守卫/棘轮脚本入 SSOT 工程。
  ssot-drift-gate:
    name: SSOT Drift Gate
    needs: guard-temp-scripts
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyYAML
        run: pip install pyyaml

      - name: SSOT drift gate
        working-directory: FHD
        run: python scripts/dev/ssot_cli.py gate

      - name: Workflow sync drift gate
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          # 校验根仓 .github/workflows/ 与 FHD/MODstore 源一致
          # 编辑源必须改 FHD/.github/workflows/ 或 MODstore_deploy/.github/workflows/，
          # 然后跑 python scripts/dev/publish_ci_workflows_to_root.py 同步
          python scripts/dev/publish_ci_workflows_to_root.py --check
