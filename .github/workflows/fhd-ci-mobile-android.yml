# CI SSOT: generated from FHD/.github/workflows/ci-mobile-android.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
# Archived Kotlin mobile-android CI — kept as a thin pointer so old path filters
# still fail closed toward the Flutter mainline.
name: ci-mobile-android

on:
  push:
    paths:
      - "FHD/mobile-android/**"
      - "FHD/mobile-flutter-poc/**"
      - ".github/workflows/fhd-ci-mobile-android.yml"
  pull_request:
    paths:
      - "FHD/mobile-android/**"
      - "FHD/mobile-flutter-poc/**"
      - ".github/workflows/fhd-ci-mobile-android.yml"

concurrency:
  group: ci-mobile-android-${{ github.ref }}
  cancel-in-progress: true


defaults:
  run:
    working-directory: FHD

jobs:
  redirect-to-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD/mobile-flutter-poc
    steps:
      - uses: actions/checkout@v4
      - name: Notice
        run: |
          echo "::notice::mobile-android is archived. CI mainline is mobile-flutter-poc (see ci-mobile-flutter.yml)."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get + test
        run: |
          flutter pub get
          flutter test
      - name: Flutter build apk (debug)
        run: flutter build apk --debug
