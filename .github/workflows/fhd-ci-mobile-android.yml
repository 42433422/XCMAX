# CI SSOT: generated from FHD/.github/workflows/ci-mobile-android.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: ci-mobile-android

on:
  push:
    paths:
      - "FHD/mobile-flutter-poc/**"
      - ".github/workflows/fhd-ci-mobile-android.yml"
  pull_request:
    paths:
      - "FHD/mobile-flutter-poc/**"
      - ".github/workflows/fhd-ci-mobile-android.yml"

permissions:
  contents: read

concurrency:
  group: ci-mobile-android-${{ github.ref }}
  cancel-in-progress: true


defaults:
  run:
    working-directory: FHD

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FHD/mobile-flutter-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=4

      - name: Build enterprise debug APK
        run: flutter build apk --debug

      - name: Verify debug package identity
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "${apk}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "${build_tools}/aapt" dump badging "${apk}" | grep -F "package: name='com.xiuci.xcagi.mobile.enterprise'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-flutter-enterprise-debug
          path: FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
