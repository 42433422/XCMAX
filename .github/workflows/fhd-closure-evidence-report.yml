# CI SSOT: generated from FHD/.github/workflows/closure-evidence-report.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release closure evidence reports
run-name: ${{ inputs.acceptance_profile || 'release-closure' }} reports ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      acceptance_profile:
        description: Existing 90-day release closure or independent WG11 K01-K10 evidence audit
        required: true
        default: release-closure
        type: choice
        options: [release-closure, agent-stability]
      release_sha:
        description: Exact deployed release SHA already merged into main
        required: true
        type: string
      product_version:
        description: Catalog version under observation; blank selects the catalog's current version
        required: false
        type: string
      convergence_run_id:
        description: Fresh successful release-convergence-readback workflow run ID
        required: false
        type: string
      security_scan_run_id:
        description: Fresh all-source zero-finding scan workflow run ID
        required: false
        type: string
      previous_security_scan_run_id:
        description: Optional extra scan for the same SHA; blank reuses the required current scan
        required: false
        type: string
      upgrade_rollback_run_id:
        description: Registered upgrade/rollback evidence run; submitted claims do not certify acceptance
        required: false
        type: string
      desktop_soak_run_id:
        description: Successful native eight-hour desktop soak run with Windows x64 and both macOS architectures
        required: false
        type: string
      stability_evidence_run_id:
        description: Completed same-SHA main run containing independently signed xcagi-independent-operating-evidence
        required: false
        type: string

permissions:
  actions: read
  contents: read


defaults:
  run:
    working-directory: FHD

jobs:
  build-reports:
    if: github.ref == 'refs/heads/main' && inputs.acceptance_profile != 'agent-stability'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate requested identity
        id: identity
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          version="$(python scripts/release/build_closure_reports.py version --product-version "$PRODUCT_VERSION")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Require the original release closure sources
        env:
          CONVERGENCE_RUN: ${{ inputs.convergence_run_id }}
          SECURITY_RUN: ${{ inputs.security_scan_run_id }}
          ROLLBACK_RUN: ${{ inputs.upgrade_rollback_run_id }}
          SOAK_RUN: ${{ inputs.desktop_soak_run_id }}
        run: |
          set -euo pipefail
          for source_run in "$CONVERGENCE_RUN" "$SECURITY_RUN" "$ROLLBACK_RUN" "$SOAK_RUN"; do
            [[ "$source_run" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Release closure requires all four original run IDs'; exit 1; }
          done
      - name: Read original successful workflow attempts and immutable artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_RUNS_JSON: >-
            {"convergence":"${{ inputs.convergence_run_id }}",
            "security/current":"${{ inputs.security_scan_run_id }}",
            "security/previous":"${{ inputs.previous_security_scan_run_id || inputs.security_scan_run_id }}",
            "rollback":"${{ inputs.upgrade_rollback_run_id }}",
            "desktop_soak":"${{ inputs.desktop_soak_run_id }}"}
        run: |
          python scripts/release/build_closure_reports.py collect \
            --release-sha "$RELEASE_SHA" --output-dir "${RUNNER_TEMP}/closure-sources"
      - name: Re-verify current security, SLO and rollback evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ID: xcagi-${{ steps.identity.outputs.version }}-${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python scripts/security/verify_security_scan_pair.py \
            --previous-dir "${RUNNER_TEMP}/closure-sources/security/previous" \
            --current-dir "${RUNNER_TEMP}/closure-sources/security/current" \
            --release-sha "$RELEASE_SHA" \
            --output "${RUNNER_TEMP}/security-verification.json" || echo 'Security verification did not pass; retain its blockers.'
          python scripts/observability/verify_production_slo_window.py \
            --evidence-dir metrics/slo-production \
            --release-id "$RELEASE_ID" \
            --required-days 90 \
            --output "${RUNNER_TEMP}/slo-verification.json" || echo 'SLO verification did not pass; retain its blockers.'
          python scripts/release/verify_upgrade_rollback_evidence.py \
            --evidence "${RUNNER_TEMP}/closure-sources/rollback/upgrade-rollback-raw.json" \
            --release-sha "$RELEASE_SHA" \
            --output "${RUNNER_TEMP}/rollback-verification.json" || echo 'Rollback verification did not pass; retain its scope and blockers.'
      - name: Fetch fresh redacted customer lifecycle evidence
        env:
          ADMIN_API_BASE: ${{ secrets.MODSTORE_ADMIN_API_BASE }}
          ADMIN_TOKEN: ${{ secrets.MODSTORE_ADMIN_BEARER_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_API_BASE:-}"
          test -n "${ADMIN_TOKEN:-}"
          curl --fail-with-body --silent --show-error --retry 3 \
            --connect-timeout 10 --max-time 45 \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            "${ADMIN_API_BASE%/}/api/admin/customer-value/evidence?window_days=3650&release_sha=${RELEASE_SHA}" \
            -o "${RUNNER_TEMP}/customer-value.json"
      - name: Build four hashed redacted reports
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCT_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          convergence="${RUNNER_TEMP}/closure-sources/convergence/release-convergence.json"
          test -s "$convergence"
          python scripts/release/build_closure_reports.py \
            --release-convergence "$convergence" \
            --security "${RUNNER_TEMP}/security-verification.json" \
            --slo "${RUNNER_TEMP}/slo-verification.json" \
            --upgrade-rollback "${RUNNER_TEMP}/rollback-verification.json" \
            --desktop-soak-dir "${RUNNER_TEMP}/closure-sources/desktop_soak" \
            --provenance "${RUNNER_TEMP}/closure-sources/provenance.json" \
            --customer-value "${RUNNER_TEMP}/customer-value.json" \
            --release-sha "$RELEASE_SHA" \
            --product-version "$PRODUCT_VERSION" \
            --output-dir "${RUNNER_TEMP}/closure-reports"
      - name: Upload final closure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-closure-reports-${{ inputs.release_sha }}
          path: |
            ${{ runner.temp }}/closure-reports
            ${{ runner.temp }}/closure-sources/provenance.json
          retention-days: 120
          if-no-files-found: error

  agent-stability:
    if: >-
      github.repository == 'xcagi/XCMAX' && github.ref == 'refs/heads/main' &&
      github.ref_protected && inputs.acceptance_profile == 'agent-stability'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Independently controlled audit key; the product/runtime must never have it.
    # Configure main-only deployments and required reviewers before provisioning.
    environment: xcmax-independent-acceptance
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Bind the original evidence run and deployed source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_RUN_ID: ${{ inputs.stability_evidence_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/stability-source-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'stability-source-run.json').read_bytes())
          if not (
              type(run.get('id')) is int and run['id'] == int(os.environ['SOURCE_RUN_ID'])
              and run.get('repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']
              and run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']
              and run.get('head_branch') == 'main'
              and run.get('head_sha') == os.environ['RELEASE_SHA']
              and run.get('status') == 'completed'
              and run.get('event') in {'push', 'workflow_dispatch'}
              and type(run.get('run_attempt')) is int and run['run_attempt'] >= 1
          ):
              raise SystemExit('BLOCKED: original evidence run/source provenance mismatch')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_attempt={run['run_attempt']}\n")
          PY
      - name: Download the independently signed original bundle
        uses: actions/download-artifact@v8
        with:
          name: xcagi-independent-operating-evidence
          run-id: ${{ inputs.stability_evidence_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/agent-stability-evidence
      - name: Recheck the source attempt after download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.stability_evidence_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/stability-source-after.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          directory = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((directory / 'stability-source-run.json').read_bytes())
          after = json.loads((directory / 'stability-source-after.json').read_bytes())
          keys = ('id', 'run_attempt', 'head_sha', 'head_branch', 'event', 'status', 'run_started_at')
          if any(before.get(key) != after.get(key) for key in keys):
              raise SystemExit('BLOCKED: source run changed during artifact download')
          PY
      - name: Recompute K01-K10 from original evidence
        env:
          XCAGI_INDEPENDENT_AUDIT_HMAC_KEY: ${{ secrets.XCAGI_INDEPENDENT_AUDIT_HMAC_KEY }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_RUN_ID: ${{ inputs.stability_evidence_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
        run: |
          python scripts/dev/autonomy_operating_gate.py \
            --profile agent-stability \
            --evidence-dir "$RUNNER_TEMP/agent-stability-evidence" \
            --source-sha "$RELEASE_SHA" \
            --ci-run-id "$SOURCE_RUN_ID" --ci-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --report "$RUNNER_TEMP/agent-stability-report.json"
      - name: Preserve the redacted verdict, including blocked evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-agent-stability-verdict-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/agent-stability-report.json
          retention-days: 120
          if-no-files-found: error
