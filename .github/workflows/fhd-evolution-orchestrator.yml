# CI SSOT: generated from FHD/.github/workflows/evolution-orchestrator.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Evolution Orchestrator

# 演化闭环编排：
#   - schedule: 每周一 04:00 UTC 扫描信号 → LLM 提议 → 开 issue → 安全源码 PR
#   - push: 编排器自身修复合并后启动一次 bootstrap 扫描
#   - workflow_run: Actions bot 合并抑制 push 时，由 main CI/CD 成功回执补发 bootstrap
#   - workflow_dispatch: 手动触发
#   - pull_request (closed): PR 合并后构建 employee_pack + 注册 catalog + 审核
#
# 生成器只允许创建 manifest.json / prompt.txt / skills.json 三个文件；
# 源码、制品和生产部署分别经过独立 PR / CI / 审核 / 回执门禁。

on:
  schedule:
    - cron: '0 4 * * 1'  # 每周一 04:00 UTC
  push:
    branches: [main]
    paths:
      - '.github/workflows/fhd-evolution-orchestrator.yml'
      - '成都修茈科技有限公司/MODstore_deploy/modstore_server/employee_pack_proposal.py'
      - '成都修茈科技有限公司/MODstore_deploy/modstore_server/employee_pack_proposal_scaffold.py'
      - '成都修茈科技有限公司/MODstore_deploy/modstore_server/evolution_signal_collector.py'
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run signal scan even if no new signals'
        required: false
        default: 'false'
        type: string
  pull_request:
    types: [closed]
    paths:
      - '成都修茈科技有限公司/MODstore_deploy/modstore_server/catalog_data/files/**'

permissions:
  contents: write
  issues: write
  pull-requests: write

defaults:
  run:
    working-directory: FHD

jobs:
  scan-and-propose:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REPO: ${{ github.repository }}
      XCAGI_LLM_API_KEY: ${{ secrets.XCAGI_LLM_API_KEY }}
      XCAGI_LLM_BASE_URL: ${{ secrets.XCAGI_LLM_BASE_URL }}
      XCAGI_LLM_MODEL: ${{ secrets.XCAGI_LLM_MODEL }}
      XCAGI_LLM_ENDPOINT: ${{ secrets.XCAGI_LLM_ENDPOINT }}
      MODSTORE_EVOLUTION_LEDGER_PATH: ${{ github.workspace }}/FHD/evolution_decisions.jsonl
      MODSTORE_REPO_ROOT: ${{ github.workspace }}
      MODSTORE_ENABLE_CATALOG_GAP_SCAN: 'true'
      MODSTORE_LEGACY_REPORT_PATH: ${{ github.workspace }}/FHD/metrics/legacy-usage-168h.json
      MODSTORE_INTENT_REPORT_PATH: ${{ github.workspace }}/FHD/metrics/intent_benchmark_latest.json
      MODSTORE_SLO_REPORT_PATH: ${{ github.workspace }}/FHD/metrics/slo-latest.json
      EVOLUTION_PROPOSAL_PATH: ${{ github.workspace }}/.evolution-proposal.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          token: ${{ secrets.CI_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether workflow-run bootstrap should scan
        id: scan_scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${WORKFLOW_HEAD_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${WORKFLOW_HEAD_SHA}^" 2>/dev/null; then
            echo "::warning::workflow_run commit ancestry unavailable; scanning conservatively"
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_paths="$(git diff-tree --no-commit-id --name-only -r \
            "${WORKFLOW_HEAD_SHA}^" "$WORKFLOW_HEAD_SHA")"
          if grep -Fqx \
            -e '.github/workflows/fhd-evolution-orchestrator.yml' \
            -e '成都修茈科技有限公司/MODstore_deploy/modstore_server/employee_pack_proposal.py' \
            -e '成都修茈科技有限公司/MODstore_deploy/modstore_server/employee_pack_proposal_scaffold.py' \
            -e '成都修茈科技有限公司/MODstore_deploy/modstore_server/evolution_signal_collector.py' \
            <<< "$changed_paths"; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Evolution Orchestrator bootstrap paths changed; skipping scan."
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.scan_scope.outputs.should_scan == 'true'
        with:
          python-version: '3.11'

      - name: Install deps
        if: steps.scan_scope.outputs.should_scan == 'true'
        working-directory: 成都修茈科技有限公司/MODstore_deploy
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Resolve latest committed SLO report
        if: steps.scan_scope.outputs.should_scan == 'true'
        working-directory: .
        run: |
          latest=$(ls FHD/metrics/slo-measured-*.json 2>/dev/null | sort | tail -1 || true)
          if [ -n "${latest:-}" ]; then
            cp "$latest" FHD/metrics/slo-latest.json
            echo "Using SLO report: $latest"
          else
            echo "No committed SLO report found; SLO signal stays healthy."
          fi

      - name: Aggregate evolution signals + LLM propose + open issue
        if: steps.scan_scope.outputs.should_scan == 'true'
        working-directory: 成都修茈科技有限公司/MODstore_deploy
        id: scan
        run: |
          python -c "
          import os, sys, json
          from modstore_server.evolution_signal_collector import aggregate_signals
          from modstore_server.employee_pack_proposal import propose_employee_pack
          from modstore_server.gap_to_issue import open_issue_for_proposal
          from modstore_server.evolution_ledger import append_event

          signals = aggregate_signals()
          print(f'Aggregated signals: {signals}')
          if not signals.get('signals_to_propose'):
              print('No signals to propose, exiting.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('issue_url=\n')
              sys.exit(0)

          append_event({'event_type': 'signal_detected', 'signals': signals, 'final_status': 'signal_detected'})

          proposal = propose_employee_pack(signals)
          if not proposal:
              print('No validated proposal was produced, exiting.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write('issue_url=\n')
              sys.exit(0)

          print(f'Proposal: {proposal}')
          with open(os.environ['EVOLUTION_PROPOSAL_PATH'], 'w', encoding='utf-8') as fh:
              json.dump(proposal, fh, ensure_ascii=False, sort_keys=True)
          try:
              # The bounded source generator below replaces the generic patch workflow.
              issue_url = open_issue_for_proposal(proposal, add_implement_label=False)
              print(f'Opened issue: {issue_url}')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
                  fh.write(f'issue_url={issue_url}\n')
          except Exception as e:
              print(f'Failed to open issue: {e}', file=sys.stderr)
              append_event({'event_type': 'issue_open_failed', 'error': str(e), 'final_status': 'needs_human'})
              sys.exit(1)
          "

      - name: Generate bounded employee-pack source and open PR
        if: steps.scan.outputs.issue_url != ''
        working-directory: .
        env:
          ISSUE_URL: ${{ steps.scan.outputs.issue_url }}
          PYTHONPATH: ${{ github.workspace }}/成都修茈科技有限公司/MODstore_deploy
        run: |
          set -euo pipefail
          python -m modstore_server.employee_pack_proposal_scaffold \
            --proposal-file "$EVOLUTION_PROPOSAL_PATH" \
            --repo-root "$GITHUB_WORKSPACE" \
            > "$RUNNER_TEMP/evolution-scaffold.json"
          source_dir="$(jq -r '.source_dir' "$RUNNER_TEMP/evolution-scaffold.json")"
          package_id="$(jq -r '.package_id' "$RUNNER_TEMP/evolution-scaffold.json")"
          version="$(jq -r '.version' "$RUNNER_TEMP/evolution-scaffold.json")"
          test -n "$source_dir"
          test -d "$source_dir"
          test "$(find "$source_dir" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"

          branch="automation/evolution-source-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "xcmax-evolution-bot"
          git config user.email "xcmax-evolution-bot@users.noreply.github.com"
          git add -- "$source_dir"
          git diff --cached --check
          git commit -m "feat(evolution): add ${package_id} ${version} source"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "feat(evolution): add ${package_id} ${version} source" \
            --body "Closes ${ISSUE_URL}. Autonomously generated from a repository-derived capability gap. The change is restricted to three employee-pack source files. CI, protected review, artifact packaging, MODstore deployment, production readback, and veto remain independent gates.")"
          gh pr merge "$pr_url" --auto --merge
          python FHD/scripts/dev/append_evolution_event.py \
            --event proactive_evolution_source_pr_opened || true

      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-ledger-scan
          path: FHD/evolution_decisions.jsonl
          if-no-files-found: ignore

  build-on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
      MODSTORE_EVOLUTION_LEDGER_PATH: ${{ github.workspace }}/FHD/evolution_decisions.jsonl
      MODSTORE_CATALOG_PACKAGES_PATH: 成都修茈科技有限公司/MODstore_deploy/modstore_server/catalog_data/packages.json
      MODSTORE_CATALOG_FILES_ROOT: 成都修茈科技有限公司/MODstore_deploy/modstore_server/catalog_data/files
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_COMMIT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build employee_pack from merge commit
        id: build
        working-directory: .
        env:
          SOURCE_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          python -c "
          import os, sys, json
          sys.path.insert(0, '成都修茈科技有限公司/MODstore_deploy')
          from modstore_server.build_employee_pack import build_pack_from_commit
          from pathlib import Path
          result = build_pack_from_commit(
              commit_sha=os.environ['SOURCE_MERGE_SHA'], repo_root=Path('.')
          )
          print(json.dumps(result, indent=2, default=str))
          Path('/tmp/evolution-build-result.json').write_text(
              json.dumps(result, ensure_ascii=False, sort_keys=True), encoding='utf-8'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('approved=' + ('true' if result.get('approved') else 'false') + '\n')
              fh.write('skipped=' + ('true' if result.get('skipped') else 'false') + '\n')
              fh.write('package_id=' + str(result.get('package_id') or '') + '\n')
              fh.write('version=' + str(result.get('version') or '') + '\n')
              fh.write('stored_filename=' + str(result.get('stored_filename') or '') + '\n')
          if result.get('approved'):
              print('::notice::Employee pack listed: ' + result.get('pack_id', ''))
          elif result.get('skipped'):
              print('No employee_pack files in this merge, skipping.')
          else:
              print(f'::warning::Pack not approved: {result.get(\"reason\")}')
              sys.exit(1)
          "

      - name: Open catalog artifact PR and enable auto-merge
        if: steps.build.outputs.approved == 'true'
        working-directory: .
        env:
          PACKAGE_ID: ${{ steps.build.outputs.package_id }}
          PACKAGE_VERSION: ${{ steps.build.outputs.version }}
          STORED_FILENAME: ${{ steps.build.outputs.stored_filename }}
        run: |
          set -euo pipefail
          branch="automation/evolution-catalog-${GITHUB_RUN_ID}"
          packages="成都修茈科技有限公司/MODstore_deploy/modstore_server/catalog_data/packages.json"
          archive="成都修茈科技有限公司/MODstore_deploy/modstore_server/catalog_data/files/${STORED_FILENAME}"
          test -f "$archive"
          git checkout -b "$branch"
          git config user.name "xcmax-evolution-bot"
          git config user.email "xcmax-evolution-bot@users.noreply.github.com"
          git add -- "$packages" "$archive"
          git diff --cached --quiet && {
            echo "Catalog artifact already matches main; no follow-up PR needed."
            exit 0
          }
          git commit -m "feat(evolution): publish ${PACKAGE_ID} ${PACKAGE_VERSION}"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "feat(evolution): publish ${PACKAGE_ID} ${PACKAGE_VERSION}" \
            --body "Autonomously built deterministic employee_pack artifact after source-pack merge. Catalog registration, package digest, CI, review, merge, deployment, and production readback remain independently gated.")"
          gh pr merge "$pr_url" --auto --merge
          python FHD/scripts/dev/append_evolution_event.py --event pack_artifact_pr_opened || true

      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-ledger-build
          path: FHD/evolution_decisions.jsonl
          if-no-files-found: ignore
