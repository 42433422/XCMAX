# Break-glass: SSH into single CVM and force-run one self-maintenance loop.
name: fhd-force-self-maintenance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target channel on the single CVM
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      reason:
        description: Reason recorded on the loop run
        required: false
        type: string
        default: "gha-force-realrun"

concurrency:
  group: fhd-force-self-maintenance-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  force-loop:
    name: Force self-maintenance (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require CVM SSH secrets
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_SSH_KEY: ${{ secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FHD_PUSH_HOST:-}" ] || [ -z "${FHD_PUSH_SSH_KEY:-}" ]; then
            echo "::error::FHD_PUSH_HOST and FHD_PUSH_SSH_KEY are required."
            exit 1
          fi

      - name: SSH force-run self-maintenance loop
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
          TARGET_ENV: ${{ inputs.environment }}
          LOOP_REASON: ${{ inputs.reason }}
          OPS_TOKEN: ${{ secrets.MODSTORE_OPS_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${FHD_PUSH_HOST:-119.27.178.147}"
          USER="${FHD_PUSH_USER:-root}"
          KEY_FILE="${RUNNER_TEMP}/fhd_force_loop_key"
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if [ "$TARGET_ENV" = "staging" ]; then
            HEALTH_PORT="5101"
            ROOTS="/opt/fhd-staging:/root/XCMAX:/root/XCMAX/成都修茈科技有限公司/MODstore_deploy"
          else
            HEALTH_PORT="5100"
            ROOTS="/opt/fhd-full:/root/XCMAX:/root/XCMAX/成都修茈科技有限公司/MODstore_deploy"
          fi

          REMOTE_SCRIPT="${RUNNER_TEMP}/force_loop_remote.sh"
          cat > "$REMOTE_SCRIPT" <<'REMOTE'
#!/usr/bin/env bash
set -euo pipefail
PORT="${1:?port}"
REASON="${2:?reason}"
TOKEN="${3:-}"
base="http://127.0.0.1:${PORT}"
echo "Health:"
curl --noproxy '*' -sf --max-time 8 "${base}/api/health" | head -c 400 || true
echo
echo "Loop status (pre):"
curl --noproxy '*' -sS --max-time 20 "${base}/api/ops/self-maintenance/status?limit=5" | head -c 1500 || true
echo
code="$(curl --noproxy '*' -sS --max-time 180 -o /tmp/loop-run.json -w '%{http_code}' \
  -X POST "${base}/api/ops/self-maintenance/run" \
  -H "Authorization: Bearer ${TOKEN}" \
  -H "Content-Type: application/json" \
  -d "{\"reason\":\"${REASON}\"}" || true)"
echo "POST /run HTTP ${code}"
head -c 2000 /tmp/loop-run.json || true
echo
if [[ "${code}" == 2* ]]; then
  echo "Loop force-run via HTTP succeeded"
  exit 0
fi
echo "HTTP /run unavailable (${code}); trying in-process python"
export LOOP_REASON="$REASON"
python3 - <<'PY'
import json, os, sys
for root in os.environ.get("LOOP_PYTHONPATHS", "").split(":"):
    root = root.strip()
    if root:
        sys.path.insert(0, root)
try:
    from modstore_server.self_maintenance_loop_runner import run_self_maintenance_loop
except Exception as exc:
    print("import_failed", repr(exc))
    sys.exit(2)
result = run_self_maintenance_loop(
    triggered_by="gha-force-self-maintenance",
    force=True,
    reason=os.environ.get("LOOP_REASON") or "gha-force-realrun",
)
print(json.dumps(result, ensure_ascii=False, default=str)[:4000])
PY
REMOTE

          scp -i "$KEY_FILE" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$REMOTE_SCRIPT" "${USER}@${HOST}:/tmp/force_loop_remote.sh"

          ssh -i "$KEY_FILE" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${USER}@${HOST}" \
            "chmod +x /tmp/force_loop_remote.sh && LOOP_PYTHONPATHS='${ROOTS}' /tmp/force_loop_remote.sh '${HEALTH_PORT}' '${LOOP_REASON}' '${OPS_TOKEN}'"
