# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Intent Accuracy Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write


defaults:
  run:
    working-directory: FHD

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_COMMIT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-server-api.txt pytest

      - name: Run intent golden set benchmark
        env:
          XCAGI_SKIP_INTENT_LLM: "1"
        run: |
          python -m pytest tests/benchmarks/test_intent_accuracy.py -v --tb=short

      - name: Run task-level golden set benchmark (tau-bench methodology)
        env:
          XCAGI_SKIP_INTENT_LLM: "1"
          TASK_BENCHMARK_RUN: "1"
          TASK_BENCHMARK_TRIALS: "1"
        run: |
          python -m pytest tests/benchmarks/test_task_success.py -v --tb=short

      - name: Commit intent benchmark report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ ! -f FHD/test_reports/intent_benchmark_latest.json ]; then
            echo "No intent report produced; skipping commit"
            exit 0
          fi
          mkdir -p FHD/metrics
          cp FHD/test_reports/intent_benchmark_latest.json FHD/metrics/intent_benchmark_latest.json
          if [ -f FHD/test_reports/task_benchmark_report.json ]; then
            cp FHD/test_reports/task_benchmark_report.json FHD/metrics/task_benchmark_report.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FHD/metrics/
          if git diff --staged --quiet; then
            echo "No intent report changes"
            exit 0
          fi
          git commit -m "chore(metrics): update intent & task benchmark reports"
          git push

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-benchmark-report
          path: |
            FHD/test_reports/intent_benchmark_latest.json
            FHD/test_reports/task_benchmark_report.json
          if-no-files-found: ignore
