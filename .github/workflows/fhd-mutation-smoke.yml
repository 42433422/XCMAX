# CI SSOT: generated from FHD/.github/workflows/mutation-smoke.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
# 变异测试 — PR gate（作用域 app/di + app/contexts，阈值 kill rate ≥ 80%）
# 2026-07-21：收紧 source_paths 并补测后加回 pull_request gate。
# 2026-08-05：mutation-smoke 是 required status check。此前 pull_request 用 paths 过滤，
#   未命中路径的 PR 不会创建该 check → 永久 BLOCKED。改为 pull_request 无条件触发，
#   用步骤级路径检测决定是否真正跑 mutmut；未命中时快速成功以满足 required check。
# 2026-09-09：修复手动触发（workflow_dispatch）漏跑——此前 dispatch 不产出 run_mutation，
#   所有 mutmut 步骤条件均不满足，整条流水线静默跳过。现 dispatch 强制跑。
#   同时修复 N01 同类路径 bug：根仓 git diff 输出带 FHD/ 前缀，剥掉后再匹配 FHD 目录口径，
#   否则 PR/push 的路径检测永远不命中、变异测试在 gate 上也一直在静默跳过。
name: mutation-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read


defaults:
  run:
    working-directory: FHD

jobs:
  mutation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect mutation-scope path changes (PR / push / dispatch)
        id: paths
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: FHD
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发 = 明确要求跑变异测试，不做路径过滤
            echo "run_mutation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # push main：merge 后新 HEAD 必须有 required check；未命中变异路径时快速成功
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            case "$base" in
              ''|0000000000000000000000000000000000000000) base="${head}~1" ;;
            esac
          fi
          # 根仓 git diff 输出是仓库根相对路径（FHD/app/...），剥掉前缀后按 FHD 目录口径匹配
          changed="$(git diff --name-only "$base" "$head" 2>/dev/null | sed 's|^FHD/||' || true)"
          if printf '%s\n' "$changed" | grep -qE '^(app/di/|app/contexts/|tests/test_di/|tests/test_contexts/|tests/test_scripts/test_mutation_kill_report\.py|scripts/dev/mutation_kill_report\.py|pyproject\.toml|\.github/workflows/(fhd-)?mutation-smoke\.yml)'; then
            echo "run_mutation=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_mutation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no mutation-scope changes)
        if: github.event_name != 'schedule' && steps.paths.outputs.run_mutation != 'true'
        run: echo "No mutation-scope path changes; required check satisfied without running mutmut."

      - name: Setup Python
        if: github.event_name == 'schedule' || steps.paths.outputs.run_mutation == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: github.event_name == 'schedule' || steps.paths.outputs.run_mutation == 'true'
        run: pip install uv

      - name: Sync dependencies
        if: github.event_name == 'schedule' || steps.paths.outputs.run_mutation == 'true'
        working-directory: FHD
        run: uv sync --frozen --extra server-api --group dev

      - name: Install mutmut
        if: github.event_name == 'schedule' || steps.paths.outputs.run_mutation == 'true'
        working-directory: FHD
        run: uv pip install mutmut

      - name: Run mutmut
        if: github.event_name == 'schedule' || steps.paths.outputs.run_mutation == 'true'
        working-directory: FHD
        run: uv run mutmut run 2>&1 | tee mutmut-run.log

      - name: Generate kill report
        if: github.event_name == 'schedule' || steps.paths.outputs.run_mutation == 'true'
        working-directory: FHD
        # mutmut 3.x ``results`` 默认跳过 killed；优先解析 run 日志里的 progress 摘要
        run: python scripts/dev/mutation_kill_report.py --threshold 80 --from-file mutmut-run.log

      - name: Upload mutation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-history
          path: FHD/metrics/mutation-history.jsonl
          if-no-files-found: warn
