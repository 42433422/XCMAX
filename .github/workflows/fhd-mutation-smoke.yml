# CI SSOT: generated from FHD/.github/workflows/mutation-smoke.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
# 变异测试 — PR gate（作用域 app/di + app/contexts，阈值 kill rate ≥ 80%）
# 2026-07-21：收紧 source_paths 并补测后加回 pull_request gate。
name: mutation-smoke

on:
  pull_request:
    paths:
      - "FHD/app/di/**"
      - "FHD/app/contexts/**"
      - "FHD/tests/test_di/**"
      - "FHD/tests/test_contexts/**"
      - "FHD/tests/test_scripts/test_mutation_kill_report.py"
      - "FHD/scripts/dev/mutation_kill_report.py"
      - "FHD/pyproject.toml"
      - "FHD/.github/workflows/fhd-mutation-smoke.yml"
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read


defaults:
  run:
    working-directory: FHD

jobs:
  mutation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        working-directory: FHD
        run: uv sync --frozen --extra server-api

      - name: Install mutmut
        working-directory: FHD
        run: uv pip install mutmut

      - name: Run mutmut
        working-directory: FHD
        run: uv run mutmut run 2>&1 | tee mutmut-run.log

      - name: Generate kill report
        working-directory: FHD
        # mutmut 3.x ``results`` 默认跳过 killed；优先解析 run 日志里的 progress 摘要
        run: python scripts/dev/mutation_kill_report.py --threshold 80 --from-file mutmut-run.log

      - name: Upload mutation history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-history
          path: FHD/metrics/mutation-history.jsonl
          if-no-files-found: warn
