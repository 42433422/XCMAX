# CI SSOT: generated from FHD/.github/workflows/observation-history.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: FHD observation history integrity
"on":
  pull_request:
    branches: [main, develop]
    paths:
      - "FHD/app/domain/enterprise_cognition/world_observation.py"
      - "FHD/tests/test_application/test_world_observation_history_order.py"
      - ".github/workflows/fhd-observation-history.yml"
  workflow_dispatch:

permissions:
  contents: read


defaults:
  run:
    working-directory: FHD

jobs:
  scoped-source-regressions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    env:
      DATABASE_URL: sqlite:////tmp/xcmax_erp_authority_regression.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server-api.txt -e ".[server-api,dev]"
      - name: Test scoped authority and negative controls
        run: |
          python -m pytest -q \
            tests/test_application/test_world_observation_history_order.py
