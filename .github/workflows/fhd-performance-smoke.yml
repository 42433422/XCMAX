# CI SSOT: generated from FHD/.github/workflows/performance-smoke.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Performance Smoke Test

on:
  schedule:
    # 每周日 15:00 UTC（23:00 北京时间）；PR 触发保留
    - cron: "0 15 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "FHD/scripts/loadtest/**"
      - "FHD/scripts/observability/k6_7d_contract.js"
      - "FHD/scripts/observability/run_staging_7d_acceptance.sh"
      - "FHD/tests/stability/**"
      - "FHD/app/application/agent_orchestrator/**"
      - "FHD/app/application/chat_stream_replay.py"
      - "FHD/app/application/task_conversation_store.py"
      - "成都修茈科技有限公司/MODstore_deploy/chaos/**"
      - "FHD/frontend/e2e/sla-perf.spec.ts"
      - "FHD/frontend/e2e/helpers.ts"
      - "FHD/frontend/e2e/performance-budget.ts"
      - "FHD/frontend/playwright.config.ts"
      - "FHD/frontend/src/components/chat/ChatMessageList.vue"
      - "FHD/frontend/src/components/chat/ChatMessageList.teleport.test.ts"
      - "FHD/frontend/tests/performance-budget.test.ts"
      - "FHD/tests/test_ci/test_performance_evidence.py"
      - "FHD/tests/test_sla_health_probe.py"
      - "FHD/.github/workflows/performance-*.yml"
      - ".github/workflows/fhd-performance-smoke.yml"

permissions:
  contents: read

concurrency:
  group: perf-smoke-${{ github.ref }}
  cancel-in-progress: true


defaults:
  run:
    working-directory: FHD

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install checksummed native k6 and Toxiproxy
        run: |
          curl --fail --location --retry 3 --max-time 120 https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/k6.tar.gz"
          printf '%s  %s\n' c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589 "$RUNNER_TEMP/k6.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          curl --fail --location --retry 3 --max-time 120 https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64 -o "$RUNNER_TEMP/toxiproxy-server"
          printf '%s  %s\n' 556d891134a3c582dc1e1a3f7335fd55142e5965769855a00b944e13e48302fc "$RUNNER_TEMP/toxiproxy-server" | sha256sum --check -
          sudo install -m 755 "$RUNNER_TEMP/k6-v0.54.0-linux-amd64/k6" "$RUNNER_TEMP/toxiproxy-server" /usr/local/bin/
          mkdir -p performance-results
          k6 version > performance-results/k6-version.txt
          toxiproxy-server -version > performance-results/toxiproxy-version.txt

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install locked test dependencies
        run: |
          uv sync --frozen --extra server-api --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify transport faults and durable continuity
        env:
          REQUIRE_RESILIENCE_TOOLS: "1"
          XCAGI_SKIP_INTENT_LLM: "1"
        run: |
          python -m pytest tests/stability \
            tests/test_application/test_tool_idempotency.py \
            tests/test_application/test_chat_stream_replay.py \
            tests/test_application/test_conversation_turn_receipts.py \
            tests/test_application/test_task_conversation_store.py::test_task_conversation_survives_store_recreation_and_lists_metadata \
            tests/test_application/test_native_task_recovery.py::test_process_exit_real_startup_resumes_native_checkpoint_without_repeating_receipt \
            tests/test_application/test_native_task_recovery.py::test_restart_preserves_exact_queued_approval_before_first_write \
            tests/test_application/test_native_task_recovery.py::test_concurrent_retry_preserves_original_write_receipt_and_atomically_requeues_same_run \
            tests/test_desktop/test_startup_schema_migration_real_db.py \
            -q --junitxml=performance-results/resilience.xml

      - name: Start API
        run: |
          export XCAGI_DEBUG=1
          export XCAGI_UVICORN_RELOAD=0
          export XCAGI_SKIP_LEGACY_COMPAT_ROUTES=1
          export SECRET_KEY=test-secret-key-for-perf-smoke-at-least-32-chars
          export DATABASE_URL=sqlite:///./perf_smoke.db
          export FASTAPI_PORT=5000
          python run.py > performance-results/api.log 2>&1 &
          echo $! > performance-results/api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready on :5000"
          exit 1

      - name: Check synthetic business work and memory bounds
        run: python scripts/loadtest/business_regression.py

      - name: Measure real HTTP samples with strict budgets
        env:
          BASE_URL: http://127.0.0.1:5000
        run: k6 run --out json=performance-results/k6-samples.jsonl scripts/loadtest/smoke.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Build production UI and run budget negative controls
        working-directory: FHD/frontend
        env:
          VITE_XCAGI_GIT_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm test -- tests/performance-budget.test.ts
          npm run build
          npx playwright install chromium

      - name: Install Playwright system deps (bounded retry)
        working-directory: FHD/frontend
        run: |
          set -uo pipefail
          rc=1
          for attempt in 1 2 3; do
            echo "[deps] attempt ${attempt}/3"
            if npx playwright install-deps chromium; then
              rc=0
              break
            fi
            echo "::warning::playwright install-deps attempt ${attempt} failed; refreshing apt lists"
            sudo apt-get clean || true
            sudo rm -rf /var/lib/apt/lists/*
            # Limit mirror fallback to APT source files; preserve keys and trust settings.
            for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -e "$source" ] || continue
              if [ ! -f "$source" ] || [ -L "$source" ]; then
                echo "::error::Refusing non-regular APT source: $source"; exit 1
              fi
              if ! sudo sed -i -E 's@(^|[[:space:]])(https?://)azure\.archive\.ubuntu\.com(/|[[:space:]]|$)@\1\2archive.ubuntu.com\3@g' "$source"; then
                echo "::error::APT mirror fallback failed: $source"; exit 1
              fi
            done
            sudo apt-get update
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::playwright system deps failed after 3 attempts (环境阻断，需人工排查，不得跳过)"
            exit 1
          fi


      - name: Start production UI preview
        working-directory: FHD/frontend
        run: |
          node --version > ../performance-results/node-version.txt
          npm run preview -- --host 127.0.0.1 --port 5001 > ../performance-results/preview.log 2>&1 &
          echo $! > ../performance-results/preview.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5001/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Measure UI readiness and real HTTP percentiles
        working-directory: FHD/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5001
          E2E_API_BASE_URL: http://127.0.0.1:5000
          E2E_FULL_STACK: "0"
          XCAGI_SLA_READY_MS: "3000"
          XCAGI_SLA_HEALTH_MS: "500"
        run: npx playwright test e2e/sla-perf.spec.ts --reporter=json > ../performance-results/frontend.json

      - name: Reject missing or failed evidence
        if: always()
        run: python scripts/loadtest/validate_evidence.py performance-results --source-sha "$GITHUB_SHA"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: |
            FHD/performance-results/
            FHD/frontend/test-results/
          if-no-files-found: error

      - name: Teardown
        if: always()
        run: |
          for pidfile in performance-results/api.pid performance-results/preview.pid; do
            if [ -f "$pidfile" ]; then kill "$(cat "$pidfile")" 2>/dev/null || true; fi
          done
