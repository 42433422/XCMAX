name: XCMAX RBAC Employee Inflight Handoff

on:
  push:
    branches: [fix/employee-org-dispatch-guard-20261125]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [fix/p0-rbac-atomic-revocation-20261125]

permissions:
  contents: read

jobs:
  integrated-revoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: employee-ci-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      XCAGI_TEST_POSTGRES_URL: postgresql+psycopg://postgres:employee-ci-only@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: FHD
    steps:
      - name: Checkout exact integrated SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Source identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          pins="$(python scripts/dev/check_requirements_lock.py --test-toolchain-pins)"
          read -r -a requirements <<< "$pins"
          uv pip install --system --python "$(command -v python)" \
            -r requirements-server-api.txt -r ops/deploy/requirements-dev.txt "${requirements[@]}"
          uv pip check --system --python "$(command -v python)"

      - name: Ruff auth and employee regression
        run: |
          ruff check app/application/rbac_app_service.py app/security/web_jwt.py \
            tests/test_application/test_employee_handoff_durability.py \
            tests/test_application/test_employee_projection_identity_binding.py \
            tests/test_application/test_group_chat_organization_dispatch_guards.py \
            tests/test_security/test_web_jwt_revocation.py

      - name: Cross-domain original execution and PG readback
        run: |
          python -m pytest -q --tb=short \
            tests/test_application/test_rbac_atomic_revocation.py \
            tests/test_security/test_web_jwt_revocation.py \
            tests/test_application/test_employee_handoff_durability.py::test_inflight_handoff_rechecks_original_session_after_role_revocation \
            tests/test_application/test_employee_handoff_durability.py::test_sealed_actor_mod_scope_is_preserved_and_revocation_rechecked \
            tests/test_application/test_employee_projection_identity_binding.py \
            tests/test_application/test_group_chat_organization_dispatch_guards.py \
            --junitxml=rbac-employee-handoff.xml

      - name: Reject skipped cross-domain checks
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          path = Path("rbac-employee-handoff.xml")
          if not path.is_file():
              raise SystemExit("BLOCKED: no integrated JUnit")
          cases = ET.parse(path).findall(".//testcase")
          for required in (
              "test_postgres_two_processes_observe_same_committed_revocation",
              "test_inflight_handoff_rechecks_original_session_after_role_revocation",
          ):
              matched = [case for case in cases if case.get("name") == required]
              if len(matched) != 1 or any(
                  matched[0].find(tag) is not None for tag in ("skipped", "error", "failure")
              ):
                  raise SystemExit("BLOCKED: missing/failed cross-domain check: " + required)
          print("PASS: same HEAD PostgreSQL revocation + in-flight employee handoff")
          PY

      - name: Upload original JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rbac-employee-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: FHD/rbac-employee-handoff.xml
          if-no-files-found: warn
          retention-days: 14
