# CI SSOT: generated from FHD/.github/workflows/release-android.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Enterprise Mobile

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (manual dispatch only)
        required: false
        type: string
        default: "10.0.0"
      harmony_artifact:
        description: Enterprise HarmonyOS .hap/.hsp path. If empty, packaging fails unless an artifact is already staged.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fhd-release-android-${{ github.ref }}
  cancel-in-progress: true


defaults:
  run:
    working-directory: FHD

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FHD/mobile-flutter-poc
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      version_code: ${{ steps.release_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Resolve monotonic release version
        id: release_version
        shell: bash
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "${raw}" == "main" || "${raw}" == "master" || -z "${raw}" ]]; then
            raw="10.0.0"
          fi
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          if [[ ! "${raw}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Android release version: ${raw}" >&2
            exit 1
          fi
          version_code="$(date +%s)"
          if (( version_code <= 1783711620 || version_code > 2147483647 )); then
            echo "Generated versionCode ${version_code} is not monotonic or exceeds Android limits" >&2
            exit 1
          fi
          echo "version=${raw}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"

      - name: Require and configure production signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production signing secret: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/xcagi-release.jks
          chmod 600 android/xcagi-release.jks
          {
            printf 'storeFile=xcagi-release.jks\n'
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
          } > android/keystore.properties
          chmod 600 android/keystore.properties

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=4

      - name: Build signed enterprise APK and AAB
        env:
          XCAGI_ANDROID_VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
          XCAGI_ANDROID_VERSION_NAME: ${{ steps.release_version.outputs.version }}
          XCAGI_REQUIRE_RELEASE_SIGNING: "1"
        run: |
          flutter build apk --release \
            --build-name "${{ steps.release_version.outputs.version }}" \
            --build-number "${{ steps.release_version.outputs.version_code }}"
          flutter build appbundle --release \
            --build-name "${{ steps.release_version.outputs.version }}" \
            --build-number "${{ steps.release_version.outputs.version_code }}"

      - name: Verify package identity, version and production signature
        shell: bash
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          aab="build/app/outputs/bundle/release/app-release.aab"
          test -s "${apk}"
          test -s "${aab}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          badging="$("${build_tools}/aapt" dump badging "${apk}")"
          printf '%s\n' "${badging}" | grep -F "package: name='com.xiuci.xcagi.mobile.enterprise'"
          printf '%s\n' "${badging}" | grep -F "versionCode='${{ steps.release_version.outputs.version_code }}'"
          printf '%s\n' "${badging}" | grep -F "versionName='${{ steps.release_version.outputs.version }}'"
          if printf '%s\n' "${badging}" | grep -q "application-debuggable"; then
            echo "Release APK is debuggable" >&2
            exit 1
          fi
          certs="$("${build_tools}/apksigner" verify --verbose --print-certs "${apk}")"
          printf '%s\n' "${certs}"
          if printf '%s\n' "${certs}" | grep -qi "Android Debug"; then
            echo "Release APK uses the Android debug certificate" >&2
            exit 1
          fi

      - name: Generate and verify atomic OTA manifest
        shell: bash
        run: |
          staged="build/ota/enterprise"
          mkdir -p "${staged}"
          apk="${staged}/XCAGI-Enterprise-Android-${{ steps.release_version.outputs.version }}.apk"
          manifest="${staged}/android_release_manifest.json"
          cp -f "build/app/outputs/flutter-apk/app-release.apk" "${apk}"
          python3 "../../成都修茈科技有限公司/MODstore_deploy/scripts/android_release_manifest.py" write \
            --sku enterprise \
            --apk "${apk}" \
            --output "${manifest}" \
            --version-code "${{ steps.release_version.outputs.version_code }}" \
            --version-name "${{ steps.release_version.outputs.version }}" \
            --min-version-code 10 \
            --download-url "https://xiu-ci.com/download/enterprise/XCAGI-Enterprise-Android-${{ steps.release_version.outputs.version }}.apk"
          python3 "../../成都修茈科技有限公司/MODstore_deploy/scripts/android_release_manifest.py" check \
            --sku enterprise \
            --manifest "${manifest}"

      - name: Stage enterprise distribution package
        run: |
          bash ../mobile-harmony/scripts/stage-release-packages.sh \
            --version "${{ steps.release_version.outputs.version }}" \
            --android-version "${{ steps.release_version.outputs.version }}" \
            --apk-path "$(pwd)/build/ota/enterprise/XCAGI-Enterprise-Android-${{ steps.release_version.outputs.version }}.apk" \
            --android-manifest "$(pwd)/build/ota/enterprise/android_release_manifest.json" \
            --harmony-artifact "${{ github.event.inputs.harmony_artifact || '' }}"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-${{ steps.release_version.outputs.version_code }}
          path: |
            FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/app-release.apk
            FHD/mobile-flutter-poc/build/app/outputs/bundle/release/app-release.aab
            release/packages-v${{ steps.release_version.outputs.version }}/enterprise/
            release/packages-v${{ steps.release_version.outputs.version }}/企业版/
            release/XCAGI-Enterprise-Mobile-Packages-v${{ steps.release_version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: assemble-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-${{ needs.assemble-release.outputs.version_code }}
          path: artifacts
      - name: Upload verified mobile packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          overwrite_files: true
          append_body: true
