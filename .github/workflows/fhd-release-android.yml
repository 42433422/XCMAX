# CI SSOT: generated from FHD/.github/workflows/release-android.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Enterprise Mobile

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (manual dispatch only)
        required: false
        type: string
        default: "1.0.0.1"
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml (gated on
  # verify-version-anchors, then dispatches this workflow) — avoids the double-run.

permissions:
  contents: write

concurrency:
  group: fhd-release-android-${{ github.ref }}
  cancel-in-progress: true


defaults:
  run:
    working-directory: FHD

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD/mobile-flutter-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve release version
        id: release_version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "${raw}" == "main" || "${raw}" == "master" || "${raw}" == "feature"* || -z "${raw}" ]]; then
            raw="1.0.0.1"
          fi
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          if [[ -z "${raw}" ]]; then
            raw="1.0.0.1"
          fi
          echo "version=${raw}" >> "${GITHUB_OUTPUT}"
          echo "toolchain_version=$(printf '%s' "${raw}" | cut -d. -f1-3)" >> "${GITHUB_OUTPUT}"
      - name: Flutter pub get + test
        run: |
          flutter pub get
          flutter test
      - name: Configure release signing (required)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error::${required} is required for a stable Android release"
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/xcagi-release.jks
          chmod 600 android/app/xcagi-release.jks
          echo "configured=true" >> "${GITHUB_OUTPUT}"
      - name: Flutter build apk (release)
        id: assemble
        env:
          XCAGI_ANDROID_VERSION_NAME: ${{ steps.release_version.outputs.version }}
          XCAGI_ANDROID_KEYSTORE: app/xcagi-release.jks
          XCAGI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XCAGI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XCAGI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          XCAGI_REQUIRE_RELEASE_SIGNING: "1"
        run: |
          VCODE=$(date +%s)
          echo "android_version_code=$VCODE" >> "$GITHUB_OUTPUT"
          flutter build apk --release \
            --build-number="$VCODE" \
            --build-name="${{ steps.release_version.outputs.toolchain_version }}"
          {
            echo "### 📱 Flutter Android versionCode = \`$VCODE\`"
            echo ""
            echo "部署时**必须**把服务器 \`.env\` 设为同一个数:"
            echo '```'
            echo "XCAGI_ANDROID_LATEST_VERSION_CODE=$VCODE"
            echo "XCAGI_ANDROID_MIN_VERSION_CODE=10"
            echo "XCAGI_ANDROID_LATEST_VERSION_NAME=${{ steps.release_version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Android release signature and version
        env:
          EXPECTED_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -f "${apk}"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -1)"
          test -x "${build_tools}/apksigner"
          test -x "${build_tools}/aapt"
          "${build_tools}/apksigner" verify --verbose --print-certs "${apk}" | tee "${RUNNER_TEMP}/apksigner.txt"
          if grep -qi 'Android Debug' "${RUNNER_TEMP}/apksigner.txt"; then
            echo "::error::Stable Android APK is signed with the debug certificate"
            exit 1
          fi
          badging="$("${build_tools}/aapt" dump badging "${apk}" | head -1)"
          printf '%s\n' "${badging}"
          grep -Fq "package: name='com.xiuci.xcagi.mobile.enterprise'" <<< "${badging}"
          grep -Fq "versionName='${EXPECTED_VERSION}'" <<< "${badging}"
      - name: Stage mobile package distribution
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          args=(
            --version "${{ steps.release_version.outputs.version }}"
            --android-version "${{ steps.release_version.outputs.version }}"
            --apk-path "${{ github.workspace }}/FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/app-release.apk"
          )
          bash FHD/scripts/mobile/stage-release-packages.sh "${args[@]}"
      - name: Upload mobile package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-packages
          path: |
            FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/*.apk
            release/packages-v${{ steps.release_version.outputs.version }}/enterprise/
            release/packages-v${{ steps.release_version.outputs.version }}/企业版/
            release/XCAGI-Enterprise-Mobile-Packages-v${{ steps.release_version.outputs.version }}.zip
          if-no-files-found: error

  publish-release:
    needs: assemble-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-packages
          path: artifacts
      - name: Upload mobile packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          overwrite_files: true
          append_body: true
