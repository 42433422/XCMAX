# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release convergence readback
run-name: Release convergence ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed read-only upload observation or existing convergence check
        required: true
        default: convergence
        type: choice
        options: [convergence, upload-readback-9a7e4cc0, startup-readback-9a7e4cc0]
      release_sha:
        description: Exact 40-character release SHA expected everywhere
        required: true
        type: string
      product_version:
        description: Visible product version
        required: true
        default: "1.0.0.3"
        type: string

permissions:
  contents: read


defaults:
  run:
    working-directory: FHD

jobs:
  readback:
    if: ${{ inputs.mode == 'convergence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for every configured source and unrevoked device receipt
        id: convergence
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.RELEASE_CONVERGENCE_ADMIN_TOKEN }}
          ENDPOINT: ${{ vars.RELEASE_CONVERGENCE_URL || 'https://xiu-ci.com/api/admin/release-convergence' }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          expected_release_id="xcagi-${PRODUCT_VERSION}-${RELEASE_SHA}"
          for attempt in $(seq 1 40); do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 15 --max-time 45 \
              -H "Authorization: Bearer ${ADMIN_TOKEN}" \
              "${ENDPOINT}?release-readback=${GITHUB_RUN_ID}-${attempt}" \
              -o "${RUNNER_TEMP}/release-convergence.json"; then
              if jq -e --arg sha "$RELEASE_SHA" --arg rid "$expected_release_id" '
                .ok == true and
                .data.release_sha == $sha and
                .data.release_id == $rid and
                .data.converged == true and
                (.data.blockers | length) == 0
              ' "${RUNNER_TEMP}/release-convergence.json" >/dev/null; then
                exit 0
              fi
            fi
            sleep 30
          done
          jq . "${RUNNER_TEMP}/release-convergence.json" || true
          exit 1

      - name: Upload anonymized convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-release-convergence
          path: ${{ runner.temp }}/release-convergence.json
          retention-days: 120
          if-no-files-found: error

      - name: Keep convergence fail closed
        if: steps.convergence.outcome != 'success'
        run: exit 1

  upload-readback:
    if: ${{ inputs.mode == 'upload-readback-9a7e4cc0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe only the fixed candidate upload twice
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${FHD_PUSH_HOST:-}"
          test -n "${FHD_PUSH_SSH_KEY_RAW:-}"
          umask 077
          key="${RUNNER_TEMP}/fixed-upload-readback-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$key"
          unset FHD_PUSH_SSH_KEY_RAW
          timeout --kill-after=5s 90s ssh -T -i "$key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "${FHD_PUSH_USER:-root}@${FHD_PUSH_HOST}" 'python3 -' \
            < scripts/deploy/read_upload_9a7e4cc0.py

  startup-readback:
    if: ${{ inputs.mode == 'startup-readback-9a7e4cc0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read only sanitized failed-startup evidence
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${FHD_PUSH_HOST:-}"
          test -n "${FHD_PUSH_SSH_KEY_RAW:-}"
          umask 077
          key="${RUNNER_TEMP}/fixed-upload-readback-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$key"
          unset FHD_PUSH_SSH_KEY_RAW
          timeout --kill-after=5s 90s ssh -T -i "$key" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "${FHD_PUSH_USER:-root}@${FHD_PUSH_HOST}" 'python3 -' \
            < scripts/deploy/read_startup_9a7e4cc0.py
