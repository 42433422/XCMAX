# CI SSOT: generated from FHD/.github/workflows/release-desktop-mac-ota.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
# macOS-only stable OTA republish.
# Use when Windows SSL.com / publisher secrets are unavailable but Apple + update
# Ed25519 + CVM push secrets are present. Does not modify Windows latest.yml.
name: Release Desktop macOS OTA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0.1"
        type: choice
        options:
          - "1.0.0.1"
          - "1.0.0.0"
      release_sha:
        description: "Immutable 40-character source SHA"
        required: true
        type: string
      security_scan_run_id:
        description: "Most recent completed all-source zero-finding scan run ID"
        required: true
        type: string
      previous_security_scan_run_id:
        description: "Prior-day all-source zero-finding scan run ID for the same SHA"
        required: true
        type: string

permissions:
  contents: write
  actions: read

defaults:
  run:
    working-directory: FHD

env:
  XCAGI_BUILD_SHA: ${{ inputs.release_sha }}

jobs:
  macos-ota:
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_TEAM_ID }}
      XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Download normalized security evidence
        uses: actions/download-artifact@v4
        with:
          name: xcagi-security-release-reports
          path: ${{ runner.temp }}/security-reports/current
          run-id: ${{ inputs.security_scan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prior-day normalized security evidence
        uses: actions/download-artifact@v4
        with:
          name: xcagi-security-release-reports
          path: ${{ runner.temp }}/security-reports/previous
          run-id: ${{ inputs.previous_security_scan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce exact-SHA two-day security clearance
        run: >-
          python scripts/security/verify_security_scan_pair.py
          --previous-dir "${RUNNER_TEMP}/security-reports/previous"
          --current-dir "${RUNNER_TEMP}/security-reports/current"
          --release-sha "${XCAGI_BUILD_SHA}"

      - name: Preflight macOS OTA secrets
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 \
            CSC_LINK CSC_KEY_PASSWORD XCAGI_UPDATE_ED25519_PRIVATE_KEY
          do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ -z "${APPLE_TEAM_ID:-}" ] && [ -z "${IOS_TEAM_ID:-}" ]; then
            missing+=("APPLE_TEAM_ID|IOS_TEAM_ID")
          fi
          if [ -z "${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}" ]; then
            missing+=("SERVER_SSH_KEY|FHD_PUSH_SSH_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::macOS OTA preflight missing: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "macOS OTA preflight passed."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            FHD/frontend/package-lock.json
            FHD/desktop/package-lock.json

      - name: Import Developer ID certificate (CSC_LINK p12)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package/import_mac_developer_id_p12.sh
          scripts/package/import_mac_developer_id_p12.sh

      - name: Build macOS enterprise installer
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_NAME:-}" ]; then
            CSC_NAME="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | sed -n 's/.*"\(.*\)"/\1/p' || true)"
          fi
          CSC_NAME="${CSC_NAME#Developer ID Application: }"
          CSC_NAME="${CSC_NAME#Developer ID Application:}"
          if [ -z "${CSC_NAME}" ]; then
            echo "::error::Developer ID Application certificate missing after CSC_LINK import"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          export CSC_NAME
          v="${{ github.event.inputs.version }}"
          PYTHON=python3 scripts/package/build-installer.sh "$v" enterprise

      - name: Notarize and staple macOS enterprise DMG
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          toolchain_version="$(printf '%s' "${v}" | cut -d. -f1-3)"
          dmg="$(find "release/xcagi-v${v}/enterprise" -name '*.dmg' -print -quit)"
          test -n "${dmg}"
          chmod +x scripts/package/finalize-macos-dmg.sh
          scripts/package/finalize-macos-dmg.sh "${dmg}" "${v}" "${toolchain_version}"

      - name: Verify packaged identity and ZIP feed
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          src="release/xcagi-v${v}/enterprise"
          test -f "${src}/latest-mac.yml"
          test -f "${src}/XCAGI-Enterprise-${v}-mac-arm64.zip" || \
            test -n "$(find "${src}" -maxdepth 1 -name 'XCAGI-*-mac-*.zip' -print -quit)"
          grep -Fxq "buildSha: ${XCAGI_BUILD_SHA}" "${src}/latest-mac.yml"
          grep -Eq "^releaseDate: ['\"]?[0-9]{4}-[0-9]{2}-[0-9]{2}T" "${src}/latest-mac.yml"
          grep -Eq '^signature: ed25519:[A-Za-z0-9+/=]+$' "${src}/latest-mac.yml"

      # Upload the signed artifacts to the run so a flaky CVM publish can never
      # lose them: operators can download and deploy them manually via local SSH.
      - name: Upload macOS OTA artifacts for recovery
        uses: actions/upload-artifact@v4
        with:
          name: mac-ota-enterprise-${{ github.event.inputs.version }}
          path: FHD/release/xcagi-v${{ github.event.inputs.version }}/enterprise
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS OTA artifacts to CVM (official + stable)
        timeout-minutes: 180
        working-directory: .
        env:
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          HOST="${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${DESKTOP_SSH_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$HOME/.ssh/id_ci" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          v="${{ github.event.inputs.version }}"
          sku=enterprise
          src_dir="${GITHUB_WORKSPACE}/FHD/release/xcagi-v${v}/${sku}"
          test -d "$src_dir"
          test -f "$src_dir/latest-mac.yml"
          dmg_name="$(basename "$(find "$src_dir" -maxdepth 1 -name '*.dmg' -print -quit)")"
          zip_name="$(basename "$(find "$src_dir" -maxdepth 1 -name '*.zip' -print -quit)")"
          test -n "${dmg_name}" && test -n "${zip_name}"

          # The GitHub-runner -> CVM link is slow and flaky (observed ~40-150 KB/s
          # with intermittent drops), so a 45-minute timeout and 3 blind retries is
          # not enough: each retry restarted every file from zero. This step now
          # (1) gives rsync a 3-hour Actions budget, (2) keeps partial files
          # (--partial + --delay-updates) so interrupted transfers RESUME instead
          # of restarting, and (3) verifies remote file sizes after each pass
          # before declaring success.
          publish_mac_payload() {
            local dest="$1"
            local attempt=1
            while [ "${attempt}" -le 12 ]; do
              echo "[publish] attempt ${attempt}: ${dest}"
              if ssh "${SSH_OPTS[@]}" "root@${HOST}" "mkdir -p '$dest'" && \
                 rsync -avz --partial --delay-updates --timeout=120 \
                   --include='*.dmg' \
                   --include='*.dmg.blockmap' \
                   --include='*.zip' \
                   --include='*.zip.blockmap' \
                   --include='latest-mac.yml' \
                   --exclude='*' \
                   -e "ssh ${SSH_OPTS[*]}" "$src_dir/" "root@${HOST}:$dest/"; then
                if ssh "${SSH_OPTS[@]}" "root@${HOST}" \
                    "test -f '$dest/latest-mac.yml' && test -s '$dest/${dmg_name}' && test -s '$dest/${zip_name}' && chmod a+rx '$dest'"; then
                  echo "[publish] verified: ${dest}"
                  return 0
                fi
                echo "[publish] rsync exited 0 but remote size check failed for ${dest}, re-checking..." >&2
              else
                echo "[publish] attempt ${attempt} incomplete for ${dest}, resuming in 30s..." >&2
              fi
              attempt=$((attempt + 1))
              sleep 30
            done
            return 1
          }

          official_root="/var/www/xcagi-v${v}"
          stable_root="/var/www/update/releases/stable"
          publish_mac_payload "${official_root}/${sku}"
          publish_mac_payload "${stable_root}/${sku}"
          echo "macOS OTA published to official and stable paths."

      - name: Verify public latest-mac.yml identity
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          tmp="$(mktemp)"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
            "https://xiu-ci.com/releases/stable/enterprise/latest-mac.yml" -o "$tmp"
          grep -Fxq "productVersion: ${v}" "$tmp"
          grep -Fxq "buildSha: ${XCAGI_BUILD_SHA}" "$tmp"
          grep -Eq "^releaseDate: ['\"]?[0-9]{4}-[0-9]{2}-[0-9]{2}T" "$tmp"
          grep -Eq '^signature: ed25519:[A-Za-z0-9+/=]+$' "$tmp"
          echo "Public macOS OTA feed verified for ${XCAGI_BUILD_SHA}"

      - name: Publish download center metadata and changelog
        working-directory: FHD
        shell: bash
        env:
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
          FHD_PUSH_HOST: ${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          chmod +x scripts/package/publish-macos-download-center.sh
          scripts/package/publish-macos-download-center.sh \
            "$v" \
            "${XCAGI_BUILD_SHA}" \
            "${GITHUB_WORKSPACE}/FHD/release/xcagi-v${v}/enterprise"
