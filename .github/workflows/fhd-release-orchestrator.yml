# CI SSOT: generated from FHD/.github/workflows/release-orchestrator.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Orchestrator

on:
  push:
    tags:
      - "FHD/v10.*"
      - "FHD/v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write


defaults:
  run:
    working-directory: FHD

jobs:
  verify-version-anchors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify stable version anchors
        run: python scripts/dev/verify_version_anchors.py

  # 前端唯一构建：产出共享 templates/vue-dist，作为 Web 与桌面端「单次构建、双端共用」的 SSOT 产物。
  # 桌面/网页流水线各自下载该 artifact 并复用，不再各自重建（避免网页≠桌面、每次打包漂移/回退）。
  build-frontend:
    needs: verify-version-anchors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FHD/frontend/package-lock.json
      - name: Build shared vue-dist (enterprise/full)
        run: |
          set -euo pipefail
          bash scripts/package/build-frontend.sh enterprise
          test -f templates/vue-dist/index.html
          echo "index=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' templates/vue-dist/index.html | head -1)"
      - name: Upload shared vue-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-vue-dist
          path: FHD/templates/vue-dist
          retention-days: 7
          if-no-files-found: error

  github-release:
    needs: verify-version-anchors
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/FHD/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}

  # dispatch-k8s-deploy 已随假 k8s 路径退役（2026-07-01 运维根治）。
  # 服务器部署由 fhd-ci-cd.yml 的 cvm-push-release 承担——它在 FHD/v* tag push
  # 时同样触发（含 sha256 manifest → 服务器端健康门/自动回滚），无需在此二次分发。

  dispatch-client-releases:
    needs: [verify-version-anchors, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Root workflow filenames: `gh workflow run` targets the repo-root
        # .github/workflows/, where these client workflows are published as
        # fhd-release-*.yml. Keep the fhd- prefix or dispatch 404s.
        workflow:
          - fhd-release-desktop.yml
          - fhd-release-web.yml
          - fhd-release-android.yml
    steps:
      - name: Trigger ${{ matrix.workflow }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          raw="${{ github.ref_name }}"
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          version="${raw:-1.0.0.0}"
          # 把本次 run 的 build-frontend artifact run_id 传给桌面/网页流水线，供其下载共享 vue-dist。
          case "${{ matrix.workflow }}" in
            fhd-release-desktop.yml|fhd-release-web.yml)
              gh workflow run "${{ matrix.workflow }}" --ref "${{ github.ref_name }}" \
                -f "version=${version}" -f "frontend_run_id=${{ github.run_id }}"
              ;;
            *)
              gh workflow run "${{ matrix.workflow }}" --ref "${{ github.ref_name }}"
              ;;
          esac
