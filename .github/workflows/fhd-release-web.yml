# CI SSOT: generated from FHD/.github/workflows/release-web.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Web Images
run-name: Release Web ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0.1"
      frontend_run_id:
        description: "Run ID of the orchestrator's build-frontend job producing the shared xcagi-vue-dist artifact"
        required: true
        default: ""
        type: string
      release_sha:
        description: "Immutable 40-character source SHA"
        required: true
        type: string
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml (gated on
  # verify-version-anchors, then dispatches this workflow) — avoids the double-run.

permissions:
  contents: read
  packages: write
  # 跨 run 下载 xcagi-vue-dist artifact（run-id + download-artifact@v4）必需 actions: read
  actions: read

env:
  REGISTRY: ghcr.io


defaults:
  run:
    working-directory: FHD

jobs:
  # 网页端实际服务路径：把共享 vue-dist（与桌面端内嵌同一份）发布到 update 站。
  # 生效后网页端与桌面端是同一份前端产物，彻底消除"网页≠桌面"。
  publish-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Lock web checkout to the immutable release SHA
        run: |
          set -euo pipefail
          printf '%s' "${{ inputs.release_sha }}" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
      - name: Download shared vue-dist
        uses: actions/download-artifact@v4
        with:
          name: xcagi-vue-dist
          path: FHD/templates/vue-dist
          run-id: ${{ inputs.frontend_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert shared vue-dist present (fail closed)
        run: |
          # defaults.run.working-directory=FHD：相对路径相对 FHD/，artifact 落在 workspace/FHD/templates/vue-dist
          test -f templates/vue-dist/index.html || {
            echo "::error::Shared vue-dist missing from artifact (frontend_run_id=${{ inputs.frontend_run_id }})."
            exit 1
          }
          echo "index=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' templates/vue-dist/index.html | head -1)"
      - name: Publish shared vue-dist to update 站
        shell: bash
        env:
          FHD_VUE_DIST: ${{ github.workspace }}/FHD/templates/vue-dist
          FHD_PUSH_HOST: ${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}
          FHD_PUSH_USER: ${{ vars.FHD_PUSH_USER || 'root' }}
          FHD_PUSH_SSH_KEY: ${{ secrets.FHD_PUSH_SSH_KEY || secrets.SERVER_SSH_KEY }}
          FHD_RELEASE_CHANNEL: ${{ contains(github.ref, '-rc') && 'staging' || 'stable' }}
        run: |
          set -euo pipefail
          if [ -z "${FHD_PUSH_SSH_KEY:-}" ]; then
            echo "::error::FHD_PUSH_SSH_KEY/SERVER_SSH_KEY is required for release publication."
            exit 1
          fi
          # secret 是私钥内容；push 脚本要求 -i 可用的密钥文件路径（与 ci-cd cvm-push 同模式）
          key_file="${RUNNER_TEMP}/fhd_push_frontend_key"
          printf '%s\n' "$FHD_PUSH_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          FHD_PUSH_SSH_KEY="$key_file" bash scripts/deploy/fhd-push-frontend-dist.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Lock image checkout to the immutable release SHA
        run: |
          set -euo pipefail
          printf '%s' "${{ inputs.release_sha }}" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
      - name: Download shared vue-dist (for frontend image)
        uses: actions/download-artifact@v4
        with:
          name: xcagi-vue-dist
          path: FHD/templates/vue-dist
          run-id: ${{ inputs.frontend_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Compute lowercase release tag
        run: |
          # docker tag 不允许大写与斜杠；FHD/v1.0.0.1 → v1.0.0.1
          echo "RELEASE_TAG=$(echo '${{ github.event.inputs.version || github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's|.*/||')" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          # 生产镜像统一走 FHD/Dockerfile（server-api 锁定依赖）。此前 context=FHD/XCAGI
          # 会把含 `-e ..` 本地 editable 引用的 XCAGI/requirements.txt 带进构建并失败。
          context: FHD
          file: FHD/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ inputs.release_sha }}
            ${{ env.IMAGE_PREFIX }}/backend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          # 上下文为 FHD/：镜像内直接 COPY 共享 templates/vue-dist（不再 vite build）。
          # 非 tag 触发的 workflow_dispatch（无共享产物）时，改用上下文 FHD（含已构建 vue-dist 或退化为空）。
          context: FHD
          file: FHD/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ inputs.release_sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
