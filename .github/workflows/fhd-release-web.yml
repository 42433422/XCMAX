# CI SSOT: generated from FHD/.github/workflows/release-web.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Web Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0.0"
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml (gated on
  # verify-version-anchors, then dispatches this workflow) — avoids the double-run.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io


defaults:
  run:
    working-directory: FHD

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install governance dependency
        run: pip install pyyaml
      - name: SSOT registry and drift gate
        run: python scripts/dev/ssot_cli.py gate
      - name: Generated workflow drift gate
        working-directory: .
        run: python scripts/dev/publish_ci_workflows_to_root.py --check
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: FHD/XCAGI
          file: FHD/XCAGI/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.event.inputs.version || github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: FHD/frontend
          file: FHD/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.event.inputs.version || github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
