# CI SSOT: generated from FHD/.github/workflows/security-full-scan.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Security full release scan

on:
  schedule:
    - cron: "20 14 * * *"   # 每日 14:20 UTC = 22:20 北京时间，夜间窗口内全仓安全检查
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character release SHA; 留空则扫描 main 当前 HEAD"
        required: false
        type: string

permissions:
  contents: read
  security-events: read
  actions: read
  issues: write

jobs:
  scan-and-gate:
    name: ${{ github.event_name == 'schedule' && 'security-trend-check' || 'security-release-gate' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Lock scan checkout to exact SHA
        id: scan-source
        env:
          RELEASE_SHA: ${{ inputs.release_sha || '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if [ -n "$RELEASE_SHA" ]; then
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid release SHA'; exit 1; }
            sha="$RELEASE_SHA"
          else
            sha="$(git rev-parse HEAD)"
          fi
          test "$(git rev-parse HEAD)" = "$sha"
          test "$(git rev-parse --is-shallow-repository)" = false
          origin="$(git remote get-url origin)"
          test "${origin%.git}" = "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/security-native" "${RUNNER_TEMP}/security-reports"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Export open and manually dismissed CodeQL and Dependabot alerts
        continue-on-error: true
        env:
          # GITHUB_TOKEN cannot read Dependabot alerts in this repository.
          # The existing CI token is read-only here and keeps the scanner from
          # silently treating an HTTP 403 envelope as a zero-alert report.
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || github.token }}
        run: |
          set +e
          for state in open dismissed; do
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=${state}&per_page=100" \
              > "${RUNNER_TEMP}/security-native/codeql-${state}.json"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=${state}&per_page=100" \
              > "${RUNNER_TEMP}/security-native/dependabot-${state}.json"
          done
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=refs/heads/main&tool_name=CodeQL&per_page=100" \
            > "${RUNNER_TEMP}/security-native/codeql-analyses.json"
          jq -s '[.[][][]]' \
            "${RUNNER_TEMP}/security-native/codeql-open.json" \
            "${RUNNER_TEMP}/security-native/codeql-dismissed.json" \
            > "${RUNNER_TEMP}/security-native/codeql.json"
          jq -s '[.[][][]]' \
            "${RUNNER_TEMP}/security-native/dependabot-open.json" \
            "${RUNNER_TEMP}/security-native/dependabot-dismissed.json" \
            > "${RUNNER_TEMP}/security-native/dependabot.json"

      - name: Run gitleaks without hiding findings
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --config /repo/.github/gitleaks-config.toml \
            --log-opts="--full-history HEAD" \
            --report-format sarif \
            --report-path /repo/gitleaks-release.sarif --no-banner --redact
          test -s gitleaks-release.sarif && mv gitleaks-release.sarif "${RUNNER_TEMP}/security-native/gitleaks.sarif"
      - name: Run Trivy filesystem scan including unfixed findings
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: ${{ runner.temp }}/security-native/trivy-filesystem.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Build production admin console for image context
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci --prefix FHD/frontend
          VITE_XCAGI_GIT_SHA="${{ steps.scan-source.outputs.sha }}" npm --prefix FHD/admin-console run build

      - name: Build and scan final FHD production image
        continue-on-error: true
        working-directory: .
        run: docker build --target production -f FHD/ops/docker/Dockerfile.fhd-api -t xcagi-release-scan:${{ steps.scan-source.outputs.sha }} FHD
      - name: Scan final FHD production image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xcagi-release-scan:${{ steps.scan-source.outputs.sha }}
          format: json
          output: ${{ runner.temp }}/security-native/trivy-image.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Audit locked Python dependencies
        continue-on-error: true
        run: |
          set +e
          python -m pip install --quiet pip-audit uv
          (cd FHD && uv export --frozen --all-extras --no-dev \
            --no-emit-project --no-emit-local --no-hashes \
            --output-file "${RUNNER_TEMP}/fhd-production-requirements.txt")
          pip-audit -r "${RUNNER_TEMP}/fhd-production-requirements.txt" -f json \
            -o "${RUNNER_TEMP}/security-native/python-dependencies.json"

      - name: Audit every shipped Node lockfile
        continue-on-error: true
        run: |
          set +e
          for directory in FHD/frontend FHD/desktop FHD/XCAGI \
            "成都修茈科技有限公司/MODstore_deploy/desktop-shell" \
            "成都修茈科技有限公司/MODstore_deploy/market"
          do
            safe="$(printf '%s' "$directory" | tr '/ ' '__')"
            (cd "$directory" && npm audit --json) > "${RUNNER_TEMP}/security-native/npm-${safe}.json"
          done
          jq -s '.' "${RUNNER_TEMP}"/security-native/npm-*.json \
            > "${RUNNER_TEMP}/security-native/node-dependencies.json"

      - name: Run desktop prerelease Electron scan
        continue-on-error: true
        env:
          ELECTRONEGATIVITY_REPORT_DIR: ${{ runner.temp }}/desktop-security
        run: |
          set +e
          bash FHD/desktop/scripts/security-scan.sh --gate-severity high
          test -s "${RUNNER_TEMP}/desktop-security/electronegativity.sarif" && \
            cp "${RUNNER_TEMP}/desktop-security/electronegativity.sarif" \
              "${RUNNER_TEMP}/security-native/desktop-prerelease.sarif"

      - name: Scan production host packages read-only
        continue-on-error: true
        env:
          HOST: ${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}
          SSH_KEY: ${{ secrets.FHD_PUSH_SSH_KEY || secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}"
          key="${RUNNER_TEMP}/production-host-scan-key"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          ssh_opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          ssh "${ssh_opts[@]}" "root@${HOST}" 'cat /etc/os-release' \
            > "${RUNNER_TEMP}/security-native/production-host-os-release"
          ssh "${ssh_opts[@]}" "root@${HOST}" 'uname -r' \
            > "${RUNNER_TEMP}/security-native/production-host-running-kernel"
          ssh "${ssh_opts[@]}" "root@${HOST}" \
            'dnf -q repoquery --installed --latest-limit 1 \
             --qf "%{version}-%{release}.%{arch}" kernel-core' \
            > "${RUNNER_TEMP}/security-native/production-host-installed-kernel"
          ssh "${ssh_opts[@]}" "root@${HOST}" \
            'set -euo pipefail
             scan_dir=$(mktemp -d /tmp/xcmax-security-scan.XXXXXX)
             trap '\''rm -rf -- "$scan_dir"'\'' EXIT
             LC_ALL=C dnf -q --refresh \
               --setopt=cachedir="$scan_dir/cache" \
               --setopt=persistdir="$scan_dir/persist" \
               --setopt=logdir="$scan_dir/log" \
               updateinfo list --security updates' \
            > "${RUNNER_TEMP}/security-native/production-host-updateinfo.txt"
          python FHD/scripts/security/collect_dnf_updateinfo.py \
            --input "${RUNNER_TEMP}/security-native/production-host-updateinfo.txt" \
            --os-release "${RUNNER_TEMP}/security-native/production-host-os-release" \
            --running-kernel "${RUNNER_TEMP}/security-native/production-host-running-kernel" \
            --installed-kernel "${RUNNER_TEMP}/security-native/production-host-installed-kernel" \
            --output "${RUNNER_TEMP}/security-native/production-host.json"

      - name: Normalize all scanner reports
        if: always() && steps.scan-source.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          normalize() {
            python FHD/scripts/security/normalize_security_report.py \
              --scanner "$1" --kind "$2" --input "$3" \
              --release-sha "${{ steps.scan-source.outputs.sha }}" \
              --output "${RUNNER_TEMP}/security-reports/$1.json"
          }
          python FHD/scripts/security/normalize_security_report.py \
            --scanner codeql --kind codeql \
            --input "${RUNNER_TEMP}/security-native/codeql.json" \
            --provenance-input "${RUNNER_TEMP}/security-native/codeql-analyses.json" \
            --required-codeql-category /language:python \
            --required-codeql-category /language:javascript-typescript \
            ${{ github.event_name == 'schedule' && '--allow-ancestor-codeql' || '' }} \
            --release-sha "${{ steps.scan-source.outputs.sha }}" \
            --output "${RUNNER_TEMP}/security-reports/codeql.json"
          normalize dependabot dependabot "${RUNNER_TEMP}/security-native/dependabot.json"
          normalize trivy-filesystem trivy "${RUNNER_TEMP}/security-native/trivy-filesystem.json"
          normalize trivy-image trivy "${RUNNER_TEMP}/security-native/trivy-image.json"
          normalize python-dependencies pip-audit "${RUNNER_TEMP}/security-native/python-dependencies.json"
          normalize node-dependencies npm-audit "${RUNNER_TEMP}/security-native/node-dependencies.json"
          normalize desktop-prerelease sarif "${RUNNER_TEMP}/security-native/desktop-prerelease.sarif"
          normalize gitleaks sarif "${RUNNER_TEMP}/security-native/gitleaks.sarif"
          normalize credential-rotation credential-incidents ".github/security/credential-incidents.json"
          normalize production-host dnf-updateinfo "${RUNNER_TEMP}/security-native/production-host.json"

      - name: Check scheduled trend or enforce release clearance
        if: always() && steps.scan-source.outcome == 'success'
        id: release-gate
        continue-on-error: true
        env:
          RELEASE_SHA: ${{ steps.scan-source.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python FHD/scripts/security/security_release_gate.py \
              --reports-dir "${RUNNER_TEMP}/security-reports" \
              --release-sha "$RELEASE_SHA" \
              --baseline FHD/config/security_baseline.json \
              --output "${RUNNER_TEMP}/security-release-gate.json"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python FHD/scripts/security/verify_security_scan_pair.py \
              --current-dir "${RUNNER_TEMP}/security-reports" \
              --release-sha "$RELEASE_SHA" \
              --output "${RUNNER_TEMP}/security-release-gate.json"
          else
            echo '::error::Unsupported security scan event'
            exit 1
          fi

      - name: Upload auditable security evidence even when gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'schedule' && 'xcagi-security-trend-reports' || 'xcagi-security-release-reports' }}
          path: ${{ runner.temp }}/security-reports/*.json
          retention-days: 120
          if-no-files-found: error

      - name: Upload native scanner payloads and gate decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'schedule' && 'xcagi-security-trend-native' || 'xcagi-security-release-native' }}
          path: |
            ${{ runner.temp }}/security-native/*
            ${{ runner.temp }}/security-release-gate.json
          retention-days: 120
          if-no-files-found: error

      - name: Open or update the security follow-up issue
        if: always() && steps.scan-source.outcome == 'success' && steps.release-gate.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ steps.scan-source.outputs.sha }}
        run: |
          set +e
          title="[security] 全量安全检查未通过"
          body="$(printf '安全检查门禁未通过。\n\n- SHA: `%s`\n- 运行记录: %s\n- 证据: 该运行的 security reports / native artifacts\n\n定时趋势检查不构成发布验收；历史风险 baseline 仅用于趋势检查。正式发布须修复风险或取得有效独立误报复核后，以目标 release_sha 手动重跑并通过与部署相同的严格判定。\n' "$SHA" "$RUN_URL")"
          number="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          assignee="${{ vars.SECURITY_ISSUE_ASSIGNEE }}"
          if [ -z "$assignee" ] && [ -f .github/CODEOWNERS ]; then
            assignee="$(grep -m1 '^/.github/' .github/CODEOWNERS | awk '{print $1}' | tr -d '@')"
          fi
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          elif [ -n "$assignee" ]; then
            gh issue create --repo "$REPO" --title "$title" --body "$body" --assignee "$assignee"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Keep security-release-gate fail closed
        if: ${{ always() && steps.release-gate.outcome != 'success' }}
        run: exit 1
