# CI SSOT: generated from FHD/.github/workflows/slo-metrics-collect.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: SLO metrics collect (daily)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      window:
        description: "Prometheus window"
        required: false
        default: "30d"

permissions:
  contents: write
  actions: read

concurrency:
  group: slo-metrics-collect
  cancel-in-progress: false


defaults:
  run:
    working-directory: FHD

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect SLO from Prometheus
        env:
          PROMETHEUS_URL: ${{ secrets.STAGING_PROMETHEUS_URL || 'http://127.0.0.1:9091' }}
        run: |
          WINDOW="${{ github.event.inputs.window || '30d' }}"
          python3 scripts/observability/collect_slo_metrics.py --window "$WINDOW" || {
            echo "Prometheus unreachable; writing seed slo-measured from sla-snapshot"
            python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          snap = json.loads(Path("metrics/sla-snapshot.json").read_text())
          out = {
              "generated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "prometheus_url": "unavailable",
              "window": "seed",
              "readings": {s["id"]: {"reading": s.get("baseline"), "meets_target": None} for s in snap.get("slos", [])},
              "note": "Prometheus unreachable; bootstrap from sla-snapshot.json",
          }
          Path(f"metrics/slo-measured-{datetime.now(timezone.utc):%Y%m%d}.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          PY
          }

      - name: Fetch authoritative production deploy events
        id: dora_source
        continue-on-error: true
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FHD_PUSH_HOST:-}" ] || [ -z "${FHD_PUSH_SSH_KEY_RAW:-}" ]; then
            echo "::error::FHD_PUSH_HOST and FHD_PUSH_SSH_KEY are required for authoritative DORA collection."
            exit 1
          fi
          key_file="${RUNNER_TEMP}/fhd_dora_metrics_key"
          tmp_events="${RUNNER_TEMP}/dora-deploy-events.jsonl"
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$key_file"
          chmod 600 "$key_file"
          ssh -i "$key_file" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${FHD_PUSH_USER:-root}@${FHD_PUSH_HOST}" \
            "test -r /var/lib/xcagi/autonomy/dora-deploy-events.jsonl && cat /var/lib/xcagi/autonomy/dora-deploy-events.jsonl" \
            > "$tmp_events"
          python3 - "$tmp_events" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = [line for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if not lines:
              raise SystemExit("production DORA event source is empty")
          for line in lines:
              event = json.loads(line)
              for key in ("deploy_id", "deployed_at", "status", "environment", "git_sha"):
                  if not event.get(key):
                      raise SystemExit(f"invalid DORA event: missing {key}")
          print(f"validated {len(lines)} production deployment events")
          PY
          mv "$tmp_events" metrics/deploy_events.jsonl

      - name: Collect DORA metrics
        if: steps.dora_source.outcome == 'success'
        run: |
          python3 scripts/observability/collect_dora.py \
            --window-days 7 \
            --environment production

      - name: Report unavailable DORA source
        if: steps.dora_source.outcome != 'success'
        run: |
          echo "::warning::Production deployment evidence was unavailable; preserving the last DORA snapshot instead of publishing a false zero."

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/slo-measured-*.json metrics/sla-snapshot.json metrics/deploy_events.jsonl metrics/dora-*.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(metrics): measured snapshot $(date -u +%Y%m%d)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
