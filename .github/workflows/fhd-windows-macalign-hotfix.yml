# CI SSOT: generated from FHD/.github/workflows/windows-macalign-hotfix.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Windows Mac-Align Hotfix

# Unsigned enterprise Windows installer for Mac-parity hotfix delivery.
# Official Release Desktop remains blocked without SSL.com signing secrets;
# this path builds on windows-latest, publishes a distinctly named exe, and
# updates a separate website pointer without touching stable auto-update metadata.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version (SSOT four-part)"
        required: true
        default: "1.0.0.1"
      publish_cvm:
        description: "Upload exe to CVM public download paths"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: FHD

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # Explicitly do NOT require Authenticode for this hotfix lane.
      XCAGI_REQUIRE_WINDOWS_SIGNING: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            FHD/frontend/package-lock.json
            FHD/desktop/package-lock.json
      - name: Build Windows enterprise installer (unsigned hotfix)
        shell: pwsh
        env:
          XCAGI_BUILD_SHA: ${{ github.sha }}
        run: |
          $v = "${{ github.event.inputs.version }}".TrimStart('v','V')
          scripts/package/build-installer.ps1 -Version $v -ProductSku enterprise -SkipUiInstaller
      - name: Rename artifact for mac-align hotfix channel
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".TrimStart('v','V')
          $dir = "release/xcagi-v$v/enterprise"
          $src = Join-Path $dir "XCAGI-Enterprise-Setup-$v-x64.exe"
          if (-not (Test-Path $src)) { throw "Installer missing: $src" }
          $dst = Join-Path $dir "XCAGI-Enterprise-Setup-$v-x64-macalign.exe"
          Copy-Item -Force $src $dst
          Get-FileHash $dst -Algorithm SHA256 | Format-List
          Get-Item $dst | Select-Object FullName, Length, LastWriteTimeUtc | Format-List
          "SHA256=$((Get-FileHash $dst -Algorithm SHA256).Hash)" | Out-File -Encoding utf8 (Join-Path $dir "XCAGI-Enterprise-Setup-$v-x64-macalign.exe.sha256")
          @"
          WINDOWS MAC-ALIGN HOTFIX
          ProductVersion: $v
          Build SHA: ${{ github.sha }}
          File: XCAGI-Enterprise-Setup-$v-x64-macalign.exe
          Authenticode: unsigned (hotfix lane; SSL.com secrets unavailable)
          Contains Mac-parity chat/desktop fixes from this ref.
          "@ | Out-File -Encoding utf8 (Join-Path $dir "MACALIGN-HOTFIX.txt")
      - name: Generate Windows interim download pointer
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".TrimStart('v','V')
          $dir = "release/xcagi-v$v/enterprise"
          $artifact = Join-Path $dir "XCAGI-Enterprise-Setup-$v-x64-macalign.exe"
          python scripts/package/generate-windows-hotfix-pointer.py `
            --version $v `
            --git-sha "${{ github.sha }}" `
            --artifact $artifact `
            --public-url "https://xiu-ci.com/xcagi-v$v/enterprise/XCAGI-Enterprise-Setup-$v-x64-macalign.exe" `
            --release-metadata-source config/download_release.json `
            --output (Join-Path $dir "download-windows-hotfix.json")
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-windows-macalign-hotfix
          if-no-files-found: error
          retention-days: 7
          path: |
            FHD/release/xcagi-v*/enterprise/XCAGI-Enterprise-Setup-*-macalign.exe
            FHD/release/xcagi-v*/enterprise/XCAGI-Enterprise-Setup-*-macalign.exe.sha256
            FHD/release/xcagi-v*/enterprise/MACALIGN-HOTFIX.txt
            FHD/release/xcagi-v*/enterprise/download-windows-hotfix.json
            FHD/release/xcagi-v*/enterprise/latest.yml

  publish:
    if: ${{ github.event.inputs.publish_cvm == 'true' }}
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download Windows interim build artifact
        uses: actions/download-artifact@v4
        with:
          name: xcagi-windows-macalign-hotfix
          path: FHD/release/windows-interim
      - name: Publish mac-align hotfix to CVM
        timeout-minutes: 300
        working-directory: .
        shell: bash
        env:
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_SSH_KEY:-}" ]; then
            echo "::error::publish_cvm=true but SERVER_SSH_KEY/FHD_PUSH_SSH_KEY missing"
            exit 1
          fi
          HOST="${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}"
          v="${{ github.event.inputs.version }}"
          v="${v#v}"; v="${v#V}"
          artifact="XCAGI-Enterprise-Setup-${v}-x64-macalign.exe"
          artifact_path="$(find FHD/release/windows-interim -type f -name "$artifact" -print -quit)"
          test -n "$artifact_path"
          src="$(dirname "$artifact_path")"
          test -f "${src}/${artifact}.sha256"
          test -f "${src}/MACALIGN-HOTFIX.txt"
          test -f "${src}/download-windows-hotfix.json"
          mkdir -p ~/.ssh
          printf '%s\n' "${DESKTOP_SSH_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$HOME/.ssh/id_ci" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          remote_stage="/var/tmp/xcagi-macalign-${GITHUB_SHA}"
          ssh "${SSH_OPTS[@]}" "root@${HOST}" "mkdir -p '$remote_stage'"

          # The runner -> CVM link can remain below 100 KB/s for a 230+ MiB
          # installer. Keep a SHA-scoped non-public partial between attempts so
          # an interrupted transfer resumes instead of restarting from byte 0.
          upload_hotfix_payload() {
            local attempt=1
            while [ "$attempt" -le 24 ]; do
              echo "[publish] resumable upload attempt ${attempt}/24"
              if rsync --archive --partial --append-verify --timeout=180 \
                --include="$artifact" \
                --include="${artifact}.sha256" \
                --include="MACALIGN-HOTFIX.txt" \
                --include="download-windows-hotfix.json" \
                --exclude='*' \
                -e "ssh ${SSH_OPTS[*]}" \
                "${src}/" "root@${HOST}:${remote_stage}/"; then
                return 0
              fi
              echo "[publish] attempt ${attempt} interrupted; partial retained for resume" >&2
              attempt=$((attempt + 1))
              sleep 20
            done
            return 1
          }
          upload_hotfix_payload

          # Validate in the non-public staging directory, then fan out through
          # atomic local renames so no route exposes a partially uploaded EXE.
          ssh "${SSH_OPTS[@]}" "root@${HOST}" \
            "bash -s -- '$remote_stage' '$v' '${GITHUB_SHA}'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          stage="$1"
          version="$2"
          build_sha="$3"
          [[ "$stage" == /var/tmp/xcagi-macalign-* ]]
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]]

          artifact="XCAGI-Enterprise-Setup-${version}-x64-macalign.exe"
          checksum_file="${artifact}.sha256"
          receipt="MACALIGN-HOTFIX.txt"
          pointer="download-windows-hotfix.json"
          cleanup() { rm -rf -- "$stage"; }
          trap cleanup EXIT

          expected="$(grep -Eo '[A-Fa-f0-9]{64}' "$stage/$checksum_file" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum "$stage/$artifact" | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          python3 - "$stage/$pointer" "$version" "$artifact" "$expected" "$build_sha" <<'PY'
          import json
          import pathlib
          import sys

          path, version, artifact, checksum, git_sha = sys.argv[1:]
          payload = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          assert payload["schema"] == "xcagi.windows_interim_release/v1"
          assert payload["version"] == version
          assert payload["git_sha"] == git_sha
          assert payload["signature_status"] == "unsigned"
          assert payload["artifact"]["filename"] == artifact
          assert payload["artifact"]["sha256"] == checksum
          assert payload["release"]["version"] == version
          PY

          destinations=(
            "/var/www/xcagi-v${version}"
            "/var/www/xcagi-v${version}/enterprise"
            "/var/www/update/releases/stable/enterprise"
            "/var/www/html/xcagi-hotfixes"
          )
          for destination in "${destinations[@]}"; do
            mkdir -p "$destination"
            suffix=".part-$$"
            cp -f "$stage/$artifact" "$destination/$artifact$suffix"
            published="$(sha256sum "$destination/$artifact$suffix" | awk '{print $1}')"
            test "$published" = "$expected"
            chmod 0644 "$destination/$artifact$suffix"
            mv -f "$destination/$artifact$suffix" "$destination/$artifact"
            for metadata in "$checksum_file" "$receipt" "$pointer"; do
              cp -f "$stage/$metadata" "$destination/$metadata$suffix"
              chmod 0644 "$destination/$metadata$suffix"
              mv -f "$destination/$metadata$suffix" "$destination/$metadata"
            done
          done

          root_target="/root/成都修茈科技有限公司/$pointer"
          mkdir -p "$(dirname "$root_target")"
          cp -f "$stage/$pointer" "${root_target}.part-$$"
          chmod 0644 "${root_target}.part-$$"
          mv -f "${root_target}.part-$$" "$root_target"
          for target in \
            "/root/成都修茈科技有限公司/MODstore_deploy/market/public/$pointer" \
            "/root/成都修茈科技有限公司/MODstore_deploy/market/dist/$pointer" \
            "/root/成都修茈科技有限公司/corp-butler/$pointer"
          do
            if [ -d "$(dirname "$target")" ]; then
              cp -f "$root_target" "${target}.part-$$"
              chmod 0644 "${target}.part-$$"
              mv -f "${target}.part-$$" "$target"
            fi
          done
          REMOTE_SCRIPT
          echo "Published:"
          echo "  https://xiu-ci.com/xcagi-v${v}/XCAGI-Enterprise-Setup-${v}-x64-macalign.exe"
          echo "  https://xiu-ci.com/xcagi-v${v}/enterprise/XCAGI-Enterprise-Setup-${v}-x64-macalign.exe"
          echo "  https://xiu-ci.com/releases/stable/enterprise/XCAGI-Enterprise-Setup-${v}-x64-macalign.exe"
          echo "  https://xiu-ci.com/download-windows-hotfix.json"
      - name: Verify public interim installer, download center, and changelog
        timeout-minutes: 30
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          v="${v#v}"; v="${v#V}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
              "https://xiu-ci.com/download-windows-hotfix.json?run=${GITHUB_RUN_ID}-${attempt}" \
              -o "$tmpdir/pointer.json" && \
              jq -e \
                --arg version "$v" \
                --arg sha "${GITHUB_SHA}" \
                '.schema == "xcagi.windows_interim_release/v1"
                 and .version == $version
                 and .git_sha == $sha
                 and .signature_status == "unsigned"
                 and .download_allowed == true
                 and .release.version == $version
                 and (.warning | type == "string" and length > 0)' \
                "$tmpdir/pointer.json" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::public Windows interim pointer did not converge"
              jq . "$tmpdir/pointer.json" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          url="$(jq -er '.artifact.url' "$tmpdir/pointer.json")"
          expected_size="$(jq -er '.artifact.size' "$tmpdir/pointer.json")"
          expected_sha="$(jq -er '.artifact.sha256' "$tmpdir/pointer.json")"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 \
            "$url" -o "$tmpdir/installer.exe"
          test "$(wc -c < "$tmpdir/installer.exe" | tr -d ' ')" = "$expected_size"
          test "$(sha256sum "$tmpdir/installer.exe" | awk '{print $1}')" = "$expected_sha"
          curl -fsSL --connect-timeout 15 --max-time 60 \
            "https://xiu-ci.com/download?run=${GITHUB_RUN_ID}" -o "$tmpdir/download.html"
          curl -fsSL --connect-timeout 15 --max-time 60 \
            "https://xiu-ci.com/download/releases?run=${GITHUB_RUN_ID}" -o "$tmpdir/releases.html"
          grep -Fq "fetch('/download-windows-hotfix.json'" "$tmpdir/download.html"
          grep -Fq "fetch('/download-windows-hotfix.json'" "$tmpdir/releases.html"
          grep -Fq "Windows 临时交付" "$tmpdir/releases.html"
