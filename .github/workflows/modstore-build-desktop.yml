# CI SSOT: generated from MODstore_deploy/.github/workflows/build-desktop.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Build MODstore Thin Desktop (artifact only)

# MODstore 精简 Web 壳仅用于 CI/诊断 artifact，不包含 FHD 内嵌后端与管理端。
# 禁止从此 workflow 发布到 XCMAX/FHD 正式 stable 目录；正式桌面发布只走 fhd-release-desktop.yml。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (v10 锁，恒 10.0.0)"
        required: false
        default: "10.0.0"

permissions:
  contents: read


defaults:
  run:
    working-directory: 成都修茈科技有限公司/MODstore_deploy

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 成都修茈科技有限公司/MODstore_deploy/desktop-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build signed Windows installers (NSIS · x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requiredSigningVars = @(
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "AZURE_CLIENT_SECRET",
            "AZURE_TRUSTED_SIGNING_ENDPOINT",
            "AZURE_TRUSTED_SIGNING_ACCOUNT",
            "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE"
          )
          $missingSigningVars = @($requiredSigningVars | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missingSigningVars.Count -gt 0) {
            throw "Windows signing required, but missing: $($missingSigningVars -join ', ')"
          }
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          foreach ($sku in @("personal", "enterprise")) {
            Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
            $env:XCAGI_PRODUCT_SKU = $sku
            $env:XCAGI_REQUIRE_WINDOWS_SIGNING = "1"
            if (-not $env:XCAGI_WINDOWS_PUBLISHER_NAME) {
              $env:XCAGI_WINDOWS_PUBLISHER_NAME = "成都修茈科技有限公司"
            }
            npm run dist:win
            if ($LASTEXITCODE -ne 0) { throw "electron-builder failed for $sku (exit $LASTEXITCODE)" }
            $exe = Get-ChildItem dist -Filter "*.exe" | Select-Object -First 1
            if (-not $exe) { throw "No installer produced for $sku" }
            powershell -ExecutionPolicy Bypass -File scripts/verify-windows-signature.ps1 -Path $exe.FullName -ExpectedPublisher $env:XCAGI_WINDOWS_PUBLISHER_NAME
            New-Item -ItemType Directory -Force -Path "upload/$sku" | Out-Null
            Copy-Item dist/*.exe,dist/*.blockmap,dist/latest.yml -Destination "upload/$sku" -ErrorAction SilentlyContinue
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          XCAGI_WINDOWS_PUBLISHER_NAME: ${{ vars.XCAGI_WINDOWS_PUBLISHER_NAME }}
      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse upload
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-modstore-thin-shell-win
          path: |
            成都修茈科技有限公司/MODstore_deploy/desktop-shell/upload/**/*.exe
            成都修茈科技有限公司/MODstore_deploy/desktop-shell/upload/**/latest.yml
            成都修茈科技有限公司/MODstore_deploy/desktop-shell/upload/**/*.blockmap
          if-no-files-found: error
