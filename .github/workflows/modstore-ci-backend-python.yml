# CI SSOT: generated from MODstore_deploy/.github/workflows/ci-backend-python.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: CI - Backend Python

on:
  push:
    branches: [main, develop, master]
    paths:
      - "成都修茈科技有限公司/MODstore_deploy/**"
  pull_request:
    branches: [main, develop, master]
    paths:
      - "成都修茈科技有限公司/MODstore_deploy/**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


defaults:
  run:
    working-directory: 成都修茈科技有限公司/MODstore_deploy

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Release gate subset (hard)
        run: python -m pytest -m release_gate -q --tb=short

  modstore-backend-test:
    runs-on: ubuntu-latest
    needs: [release-gate]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Set up the real private Mod frontend compiler
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Install runtime Mod compiler dependencies
        run: npm ci --prefix "$GITHUB_WORKSPACE/FHD/frontend" --no-audit --no-fund

      - name: Run Black formatter check
        run: black --check --diff modman/ modstore_server/ tests/

      - name: Run isort check
        run: isort --check-only --diff modman/ modstore_server/ tests/

      - name: Run Flake8 linting
        run: pip install flake8 && flake8 modman/ modstore_server/ tests/

      - name: Run mypy type checking
        run: |
          # 与 pyproject.toml 的开发工具版本一致。
          pip install mypy==2.4.0 types-redis types-requests types-pyyaml types-paramiko types-passlib types-psutil types-pytz
          mypy --no-error-summary

      - name: Run tests with coverage (global floor — ratchet)
        env:
          # Ratchet floor; keep aligned with the site backend workflow and coverage-gates.md.
          MODSTORE_PY_COVERAGE_FLOOR: '40'
          MODSTORE_EMAIL_DEBUG: '1'
        run: |
          python -m pytest tests/ -v --cov=modman --cov=modstore_server \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=${MODSTORE_PY_COVERAGE_FLOOR}
      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: backend
          name: modstore-backend
          fail_ci_if_error: false

  java-payment-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 成都修茈科技有限公司/MODstore_deploy/java_payment_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: 成都修茈科技有限公司/MODstore_deploy/java_payment_service/pom.xml

      - name: Run Java payment tests and package
        run: mvn -B test package
