# CI SSOT: generated from MODstore_deploy/.github/workflows/ci-backend-python.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: CI - Backend Python
run-name: CI - Backend Python ${{ inputs.release_sha || github.sha }}${{ inputs.delivery_request_id && format(' [delivery:{0}]', inputs.delivery_request_id) || '' }}

on:
  push:
    branches: [main, develop, master]
    paths:
      - "成都修茈科技有限公司/MODstore_deploy/**"
      - "packages/xcagi_common/**"
      - "packages/retort_engine/**"
      - "FHD/mods/_employees/**"
  pull_request:
    branches: [main, develop, master]
    paths:
      - "成都修茈科技有限公司/MODstore_deploy/**"
      - "packages/xcagi_common/**"
      - "packages/retort_engine/**"
      - "FHD/mods/_employees/**"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit to validate after a protected merge
        required: false
        default: ""
        type: string
      delivery_request_id:
        description: Original post-merge CI request identity
        required: false
        default: ""
        type: string

env:
  PYTHON_VERSION: "3.11"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Candidate tests never inherit repository-wide write permissions.
permissions:
  contents: read


defaults:
  run:
    working-directory: 成都修茈科技有限公司/MODstore_deploy

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - name: Validate dispatched main commit
        if: github.event_name == 'workflow_dispatch' && inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA'; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pytest_pin="$(python "$GITHUB_WORKSPACE/FHD/scripts/dev/check_requirements_lock.py" --pytest-pin)"
          [[ "$pytest_pin" =~ ^pytest==[0-9]+(\.[0-9]+){2}$ ]]
          python -m pip install --upgrade pip
          pip install "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_core" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_checkpoint" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_checkpoint_backends/checkpoint-sqlite" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_checkpoint_backends/checkpoint-postgres" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_prebuilt" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_sdk" \
            -e "$GITHUB_WORKSPACE/packages/retort_engine" \
            -e "$GITHUB_WORKSPACE/packages/xcagi_common" -e ".[web,dev,governance]" "$pytest_pin"

      - name: Release gate subset (hard)
        run: python -m pytest -m release_gate -q --tb=short

  modstore-backend-test:
    runs-on: ubuntu-latest
    needs: [release-gate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: component-test-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RETORT_TEST_POSTGRES_DSN: postgresql+psycopg://postgres:component-test-only@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pytest_pin="$(python "$GITHUB_WORKSPACE/FHD/scripts/dev/check_requirements_lock.py" --pytest-pin)"
          [[ "$pytest_pin" =~ ^pytest==[0-9]+(\.[0-9]+){2}$ ]]
          python -m pip install --upgrade pip
          pip install "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_core" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_checkpoint" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_checkpoint_backends/checkpoint-sqlite" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_checkpoint_backends/checkpoint-postgres" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_prebuilt" \
            "$GITHUB_WORKSPACE/FHD/packages/xcagi_langgraph_sdk" \
            -e "$GITHUB_WORKSPACE/packages/retort_engine" \
            -e "$GITHUB_WORKSPACE/packages/xcagi_common" -e ".[web,dev,governance,llm-router]" "$pytest_pin"

      - name: Test shared employee archive builds
        run: python -m pytest "$GITHUB_WORKSPACE/packages/xcagi_common/tests" -q

      - name: Set up the real private Mod frontend compiler
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json

      - name: Install runtime Mod compiler dependencies
        run: bash "$GITHUB_WORKSPACE/FHD/scripts/ci/npm_ci_with_network_retry.sh" --prefix "$GITHUB_WORKSPACE/FHD/frontend" --no-audit --no-fund

      - name: Install the pinned experiment evaluator
        run: |
          mkdir -p "$RUNNER_TEMP/xcagi-promptfoo"
          cp "$GITHUB_WORKSPACE/FHD/scripts/autonomy/runtime_tools/capability_trainer_deps/"{package.json,package-lock.json} "$RUNNER_TEMP/xcagi-promptfoo/"
          bash "$GITHUB_WORKSPACE/FHD/scripts/ci/npm_ci_with_network_retry.sh" --prefix "$RUNNER_TEMP/xcagi-promptfoo" --ignore-scripts --no-audit --no-fund
          echo "PROMPTFOO_CLI=$RUNNER_TEMP/xcagi-promptfoo/node_modules/.bin/promptfoo" >> "$GITHUB_ENV"

      - name: Install the pinned native report consumer
        run: |
          mkdir -p "$RUNNER_TEMP/xcagi-report"
          cp "$GITHUB_WORKSPACE/FHD/scripts/autonomy/runtime_tools/github_executor_deps/opencode/"{package.json,package-lock.json} "$RUNNER_TEMP/xcagi-report/"
          bash "$GITHUB_WORKSPACE/FHD/scripts/ci/npm_ci_with_network_retry.sh" --prefix "$RUNNER_TEMP/xcagi-report" --ignore-scripts --include=optional --no-audit --no-fund
          echo "PARA_TEST_OPENCODE_BINARY=$RUNNER_TEMP/xcagi-report/node_modules/opencode-linux-x64-baseline/bin/opencode" >> "$GITHUB_ENV"

      - name: Run Black formatter check
        run: black --check --diff modman/ modstore_server/ tests/

      - name: Run isort check
        run: isort --check-only --diff modman/ modstore_server/ tests/

      - name: Run Flake8 linting
        run: pip install flake8 && flake8 modman/ modstore_server/ tests/

      - name: Run mypy type checking
        run: |
          # 与 pyproject.toml 的开发工具版本一致。
          pip install mypy==2.4.1 types-redis types-requests types-pyyaml types-paramiko types-passlib types-psutil types-pytz
          mypy --no-error-summary

      - name: Run tests with coverage (global floor — ratchet)
        env:
          # Ratchet floor; keep aligned with the site backend workflow and coverage-gates.md.
          MODSTORE_PY_COVERAGE_FLOOR: '40'
          MODSTORE_EMAIL_DEBUG: '1'
        run: |
          python -m pytest tests/ -v --cov=modman --cov=modstore_server \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=${MODSTORE_PY_COVERAGE_FLOOR}
      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: backend
          name: modstore-backend
          fail_ci_if_error: false

  java-payment-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 成都修茈科技有限公司/MODstore_deploy/java_payment_service

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: 成都修茈科技有限公司/MODstore_deploy/java_payment_service/pom.xml

      - name: Run Java payment tests and package
        run: mvn -B test package
