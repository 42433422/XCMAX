# CI SSOT: generated from MODstore_deploy/.github/workflows/prod-deploy.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Deploy MODstore Production
run-name: >-
  Deploy MODstore ${{ inputs.git_sha }}

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact 40-character main commit frozen by the release gate
        required: true
        type: string
      preserve_release_history:
        description: Keep all local and DR release history for this invocation
        type: boolean
        default: true
      require_platform_key:
        description: Fail when platform LLM key is missing
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      self_maintenance_run_id:
        description: Optional exact self-maintenance run id for merge/deploy correlation
        required: false
        type: string
        default: ""
      product_version:
        description: Visible product version associated with the immutable SHA
        required: false
        type: string
        default: "1.0.0.1"
      security_scan_run_id:
        description: Most recent completed all-source zero-finding scan run ID
        required: true
        type: string
      previous_security_scan_run_id:
        description: Legacy compatibility input; the current single scan is authoritative
        required: true
        type: string
      ci_run_id:
        description: Successful complete CI run for the exact approved SHA
        required: true
        type: string

concurrency:
  group: modstore-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve exact tested SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.git_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SECURITY_SCAN_RUN_ID: ${{ inputs.security_scan_run_id }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          SELF_MAINTENANCE_RUN_ID: ${{ inputs.self_maintenance_run_id }}
        run: python scripts/ci/verify_modstore_release_approval.py

      - name: Download normalized security evidence
        uses: actions/download-artifact@v8
        with:
          name: xcagi-security-release-reports
          path: ${{ runner.temp }}/security-reports/current
          run-id: ${{ inputs.security_scan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce exact-SHA single-scan security clearance
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: >-
          python FHD/scripts/security/verify_security_scan_pair.py
          --current-dir "${RUNNER_TEMP}/security-reports/current"
          --release-sha "${TARGET_SHA}"

      - name: Upload deployment correlation
        uses: actions/upload-artifact@v4
        with:
          name: modstore-deployment-correlation
          path: ${{ runner.temp }}/modstore-deployment-correlation.json
          if-no-files-found: error
          retention-days: 7

      - name: Deploy immutable release and verify exact runtime identity
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CONTROLLER_SHA: ${{ github.sha }}
          STRICT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.require_platform_key == 'false' && '0' || '1' }}
          REPOSITORY_SLUG: ${{ github.repository }}
          PRODUCT_VERSION: ${{ inputs.product_version || '1.0.0.1' }}
        with:
          host: ${{ secrets.FHD_PUSH_HOST }}
          username: root
          key: ${{ secrets.FHD_PUSH_SSH_KEY }}
          command_timeout: 45m
          envs: TARGET_SHA,STRICT_KEY,REPOSITORY_SLUG,PRODUCT_VERSION,CONTROLLER_SHA
          script: |
            set -euo pipefail
            export XCMAX_PRESERVE_RELEASE_HISTORY="${{ inputs.preserve_release_history && '1' || '0' }}"
            SOURCE_ROOT="${XCMAX_REMOTE_ROOT:-/root/XCMAX}"
            git -C "$SOURCE_ROOT" fetch --quiet origin main
            git -C "$SOURCE_ROOT" cat-file -e "${TARGET_SHA}^{commit}"
            BOOTSTRAP="$(mktemp -d /tmp/xcmax-release-controller.XXXXXX)"
            trap 'rm -rf -- "$BOOTSTRAP"' EXIT
            ( set -a; . /etc/xcmax-ops.env; set +a; \
              git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:ops/backup/xcmax_backup.sh" | \
              bash -s -- --modstore-release "$TARGET_SHA" )
            git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:成都修茈科技有限公司/MODstore_deploy/scripts/xcmax-immutable-release.sh" > "$BOOTSTRAP/immutable.sh"
            for file in xcmax_release_sync.sh xcmax_release_sync_prune.py; do
              git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:ops/dr/$file" > "$BOOTSTRAP/$file"
            done
            XCMAX_SOURCE_ROOT="$SOURCE_ROOT" XCMAX_TARGET_SHA="$TARGET_SHA" \
              XCMAX_RELEASE_CONTROLLER_SHA="$CONTROLLER_SHA" \
              XCMAX_PRODUCT_VERSION="$PRODUCT_VERSION" \
              XCMAX_GITHUB_REPOSITORY="$REPOSITORY_SLUG" bash "$BOOTSTRAP/immutable.sh"
            CURRENT_DEPLOY="/opt/xcmax/current/成都修茈科技有限公司/MODstore_deploy"
            STRICT_PLATFORM_KEY="$STRICT_KEY" MODSTORE_DEPLOY_DIR="$CURRENT_DEPLOY" \
              XCMAX_MONOREPO_ROOT=/opt/xcmax/current bash "$CURRENT_DEPLOY/scripts/diagnose_production_landing.sh"
            bash "$BOOTSTRAP/xcmax_release_sync.sh" --component modstore --sha "$TARGET_SHA"

      - name: Summary
        run: echo "MODstore exact-SHA production deploy succeeded at ${{ steps.target.outputs.sha }}"
