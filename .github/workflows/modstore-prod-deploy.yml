# CI SSOT: generated from MODstore_deploy/.github/workflows/prod-deploy.yml — DO NOT edit here.
# Edit that source, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Deploy MODstore Production
run-name: >-
  Deploy MODstore ${{ inputs.git_sha }}

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Exact 40-character main commit frozen by the release gate
        required: true
        type: string
      preserve_release_history:
        description: Keep all local and DR release history for this invocation
        type: boolean
        default: false
      require_platform_key:
        description: Fail when platform LLM key is missing
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      self_maintenance_run_id:
        description: Optional exact self-maintenance run id for merge/deploy correlation
        required: false
        type: string
        default: ""
      product_version:
        description: Visible product version associated with the immutable SHA
        required: false
        type: string
        default: "1.0.0.1"
      security_scan_run_id:
        description: Most recent completed all-source zero-finding scan run ID
        required: true
        type: string
      previous_security_scan_run_id:
        description: Legacy compatibility input; the current single scan is authoritative
        required: true
        type: string
      ci_run_id:
        description: Successful complete CI run for the exact approved SHA
        required: true
        type: string

concurrency:
  group: modstore-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      artifact_sha256: ${{ steps.signature.outputs.artifact_sha256 }}
      signed_run_attempt: ${{ steps.signature.outputs.signed_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact tested SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.git_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SECURITY_SCAN_RUN_ID: ${{ inputs.security_scan_run_id }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          SELF_MAINTENANCE_RUN_ID: ${{ inputs.self_maintenance_run_id }}
        run: python scripts/ci/verify_modstore_release_approval.py

      - name: Validate security scan run id
        env:
          SECURITY_SCAN_RUN_ID: ${{ inputs.security_scan_run_id }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${SECURITY_SCAN_RUN_ID}" | grep -Eq '^[0-9]+$'; then
            echo "::error::security_scan_run_id must be a numeric GitHub Actions run id; got '${SECURITY_SCAN_RUN_ID}'."
            exit 1
          fi

      - name: Download normalized security evidence
        uses: actions/download-artifact@v8
        with:
          name: xcagi-security-release-reports
          path: ${{ runner.temp }}/security-reports/current
          run-id: ${{ inputs.security_scan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce exact-SHA single-scan security clearance
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: >-
          python FHD/scripts/security/verify_security_scan_pair.py
          --current-dir "${RUNNER_TEMP}/security-reports/current"
          --release-sha "${TARGET_SHA}"

      - name: Freeze the exact Git source archive
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/modstore-source.tar"
          git -c tar.umask=0002 archive --format=tar "$TARGET_SHA" > "$archive"
          test "$(git get-tar-commit-id < "$archive")" = "$TARGET_SHA"

      - name: Sign the approved source archive using GitHub artifact attestations
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/modstore-source.tar

      - name: Verify the signature and freeze the approved digest
        id: signature
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/modstore-source.tar"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --bundle "$BUNDLE_PATH" --deny-self-hosted-runners \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/modstore-prod-deploy.yml@refs/heads/main"
          digest="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          [[ "$ATTESTATION_ID" =~ ^[1-9][0-9]*$ ]]
          jq --arg digest "$digest" --arg id "$ATTESTATION_ID" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '. + {artifact_sha256:$digest,signature_verified:true,signature_verifier:"github-artifact-attestations",attestation_id:$id,workflow_run_id:$run,signed_run_attempt:$attempt}' \
            "${RUNNER_TEMP}/modstore-deployment-correlation.json" \
            > "${RUNNER_TEMP}/modstore-release-admission.json"
          printf 'artifact_sha256=%s\nsigned_run_attempt=%s\n' "$digest" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload signed release admission for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: modstore-release-admission-${{ steps.signature.outputs.signed_run_attempt }}
          path: ${{ runner.temp }}/modstore-release-admission.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download signed release admission
        uses: actions/download-artifact@v8
        with:
          name: modstore-release-admission-${{ needs.admission.outputs.signed_run_attempt }}
          path: ${{ runner.temp }}

      - name: Deploy immutable release and verify exact runtime identity
        uses: appleboy/ssh-action@v1.2.5
        env:
          TARGET_SHA: ${{ needs.admission.outputs.sha }}
          SIGNED_ARTIFACT_SHA256: ${{ needs.admission.outputs.artifact_sha256 }}
          CONTROLLER_SHA: ${{ github.sha }}
          STRICT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.require_platform_key == 'false' && '0' || '1' }}
          REPOSITORY_SLUG: ${{ github.repository }}
          PRODUCT_VERSION: ${{ inputs.product_version || '1.0.0.1' }}
        with:
          host: ${{ secrets.FHD_PUSH_HOST }}
          username: root
          key: ${{ secrets.FHD_PUSH_SSH_KEY }}
          command_timeout: 45m
          envs: TARGET_SHA,SIGNED_ARTIFACT_SHA256,STRICT_KEY,REPOSITORY_SLUG,PRODUCT_VERSION,CONTROLLER_SHA
          script: |
            set -euo pipefail
            [[ "$SIGNED_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            export XCMAX_PRESERVE_RELEASE_HISTORY="${{ inputs.preserve_release_history && '1' || '0' }}"
            SOURCE_ROOT="${XCMAX_REMOTE_ROOT:-/root/XCMAX}"
            git -C "$SOURCE_ROOT" fetch --quiet origin main
            git -C "$SOURCE_ROOT" cat-file -e "${TARGET_SHA}^{commit}"
            BOOTSTRAP="$(mktemp -d /tmp/xcmax-release-controller.XXXXXX)"
            trap 'rm -rf -- "$BOOTSTRAP"' EXIT
            ( set -a; . /etc/xcmax-ops.env; set +a; \
              git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:ops/backup/xcmax_backup.sh" | \
              bash -s -- --modstore-release "$TARGET_SHA" )
            git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:成都修茈科技有限公司/MODstore_deploy/scripts/xcmax-immutable-release.sh" > "$BOOTSTRAP/immutable.sh"
            git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:成都修茈科技有限公司/MODstore_deploy/scripts/sync_site_download_release.py" > "$BOOTSTRAP/sync_site_download_release.py"
            for file in xcmax_release_sync.sh xcmax_release_sync_prune.py; do
              git -C "$SOURCE_ROOT" show "${CONTROLLER_SHA}:ops/dr/$file" > "$BOOTSTRAP/$file"
            done
            XCMAX_SOURCE_ROOT="$SOURCE_ROOT" XCMAX_TARGET_SHA="$TARGET_SHA" \
              XCMAX_RELEASE_CONTROLLER_SHA="$CONTROLLER_SHA" \
              XCMAX_PRODUCT_VERSION="$PRODUCT_VERSION" \
              XCMAX_SIGNED_ARTIFACT_SHA256="$SIGNED_ARTIFACT_SHA256" \
              XCMAX_GITHUB_REPOSITORY="$REPOSITORY_SLUG" bash "$BOOTSTRAP/immutable.sh"
            CURRENT_DEPLOY="/opt/xcmax/current/成都修茈科技有限公司/MODstore_deploy"
            STRICT_PLATFORM_KEY="$STRICT_KEY" MODSTORE_DEPLOY_DIR="$CURRENT_DEPLOY" \
              XCMAX_MONOREPO_ROOT=/opt/xcmax/current bash "$CURRENT_DEPLOY/scripts/diagnose_production_landing.sh"
            bash "$BOOTSTRAP/xcmax_release_sync.sh" --component modstore --sha "$TARGET_SHA"

      - name: Verify independent public runtime readback
        env:
          APPROVED_ARTIFACT_SHA256: ${{ needs.admission.outputs.artifact_sha256 }}
          SIGNED_RUN_ATTEMPT: ${{ needs.admission.outputs.signed_run_attempt }}
        run: |
          set -euo pipefail
          curl --proto '=https' --fail --silent --show-error --max-time 20 \
            --header 'Cache-Control: no-cache' \
            "https://xiu-ci.com/api/health?release_acceptance=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "${RUNNER_TEMP}/modstore-release-health.json"
          python scripts/ci/verify_modstore_release_approval.py --finalize

      - name: Upload formal deployment acceptance
        uses: actions/upload-artifact@v4
        with:
          name: modstore-deployment-correlation
          path: ${{ runner.temp }}/modstore-deployment-correlation.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
