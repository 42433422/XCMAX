# Cursor cloud-agent tokens can repository_dispatch (contents: write) but cannot
# workflow_dispatch (actions: write). Forward only the owner-standing L4-03 calls
# into the official workflows so those runs stay workflow_dispatch.
name: L4-03 dispatch relay

on:
  repository_dispatch:
    types: [l4-03-modstore-prod-deploy, l4-03-force-self-maintenance]

permissions:
  actions: write
  contents: read

jobs:
  relay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the official workflow
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.action }}
          GIT_SHA: ${{ github.event.client_payload.git_sha }}
          PRODUCT_VERSION: ${{ github.event.client_payload.product_version }}
          CI_RUN_ID: ${{ github.event.client_payload.ci_run_id }}
          SECURITY_SCAN_RUN_ID: ${{ github.event.client_payload.security_scan_run_id }}
          PREVIOUS_SECURITY_SCAN_RUN_ID: ${{ github.event.client_payload.previous_security_scan_run_id }}
          PRESERVE_RELEASE_HISTORY: ${{ github.event.client_payload.preserve_release_history }}
          REQUIRE_PLATFORM_KEY: ${{ github.event.client_payload.require_platform_key }}
          TARGET_ENV: ${{ github.event.client_payload.environment }}
          REASON: ${{ github.event.client_payload.reason }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            l4-03-modstore-prod-deploy)
              test "$GIT_SHA" = "d58b3559268977f95869a15d56868dd5386ed333"
              test "$PRODUCT_VERSION" = "1.0.0.7"
              test "$CI_RUN_ID" = "41852706376"
              test "$SECURITY_SCAN_RUN_ID" = "41862046410"
              test "$PREVIOUS_SECURITY_SCAN_RUN_ID" = "41862046410"
              test "$PRESERVE_RELEASE_HISTORY" = "true"
              test "$REQUIRE_PLATFORM_KEY" = "true"
              gh workflow run modstore-prod-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f "git_sha=${GIT_SHA}" \
                -f "preserve_release_history=${PRESERVE_RELEASE_HISTORY}" \
                -f "require_platform_key=${REQUIRE_PLATFORM_KEY}" \
                -f "product_version=${PRODUCT_VERSION}" \
                -f "security_scan_run_id=${SECURITY_SCAN_RUN_ID}" \
                -f "previous_security_scan_run_id=${PREVIOUS_SECURITY_SCAN_RUN_ID}" \
                -f "ci_run_id=${CI_RUN_ID}"
              ;;
            l4-03-force-self-maintenance)
              test "$TARGET_ENV" = "production"
              test "$REASON" = "l4-03-force-realrun"
              gh workflow run fhd-force-self-maintenance.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f "environment=${TARGET_ENV}" \
                -f "reason=${REASON}"
              ;;
            *)
              echo "::error::unsupported L4-03 relay event: ${EVENT}"
              exit 1
              ;;
          esac
