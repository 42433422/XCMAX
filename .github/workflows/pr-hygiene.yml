name: pr-hygiene

# 自治循环产出治理（P1-3）：PR / 分支卫生闭环
# ----------------------------------------------------------------------------
# AI 员工与自动化会持续产出 PR 与分支，若无人认领/合并/回收，垃圾分支会污染
# 主线。本 workflow 每 6 小时执行一次：
#   1. PR TTL：open 且 21 天无活动 → 评论提示后自动关闭（可再打开）
#   2. 并发上限：同一 author 超过 5 个 open PR → 打 `blocked-pr-limit` 标签
#   3. 无人认领：无 assignee 的 open PR → 打 `unclaimed` 标签
#   4. 删除已合并分支（默认分支与受保护分支除外）
#   5. 删除机器来源僵尸分支（无 open PR 时）：
#      - devfleet/：24 小时无新提交即删（DevFleet 每个 sub 任务一条分支，
#        跑完不再推进，24 小时足以确认任务已结束）
#      - autonomy/ codex/ ai-impl/ automation/ auto/daily- cursor/ trae/：
#        30 天无提交才删（这些可能承载待评审工作，口径保守）
#
# 设计取舍：
#   - 仅用 runner 自带 `gh` CLI + GITHUB_TOKEN，无第三方依赖。
#   - 删除前逐项打印日志，便于审计；受保护分支一律跳过。
#   - 提交日期直接取 branches 列表 API 返回值，不逐分支再查，避免 rate limit。
# ----------------------------------------------------------------------------

on:
  schedule:
    - cron: "0 */6 * * *"  # 每 6 小时
  workflow_dispatch:

permissions:
  contents: write       # 删除分支
  pull-requests: write  # 关闭 PR / 打标签 / 评论

concurrency:
  group: pr-hygiene
  cancel-in-progress: false

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run PR & branch hygiene
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import collections
          import datetime
          import json
          import os
          import subprocess
          import urllib.parse

          REPO = os.environ["GITHUB_REPOSITORY"]
          NOW = datetime.datetime.now(datetime.timezone.utc)
          PR_TTL_DAYS = 21
          MAX_OPEN_PRS_PER_AUTHOR = 5
          ZOMBIE_DAYS = 30
          # DevFleet 每个 sub 任务都会推一条 devfleet/<agent>/sub-1-<hash> 分支，
          # 跑完不再推进；24 小时无新提交即可判定任务已结束，直接回收。
          DEVFLEET_TTL_HOURS = 24
          DEVFLEET_PREFIX = "devfleet/"
          ZOMBIE_PREFIXES = (
              "autonomy/",
              "codex/",
              "ai-impl/",
              "automation/",
              "auto/daily-",
              "cursor/",
              "trae/",
          )

          def gh_api(path, method="GET", body=None):
              cmd = ["gh", "api", "-X", method, f"/repos/{REPO}/{path}"]
              if method == "GET":
                  cmd.append("--paginate")
              if body is not None:
                  cmd += ["--input", "-"]
                  r = subprocess.run(cmd, input=json.dumps(body), capture_output=True, text=True)
              else:
                  r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"  !! gh api {method} {path} failed: {r.stderr.strip()[:200]}")
                  return None
              return json.loads(r.stdout) if r.stdout.strip() else None

          def parse_dt(s):
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          # ---------- 1-3. open PR 治理 ----------
          prs = gh_api("pulls?state=open&per_page=100") or []
          print(f"open PRs: {len(prs)}")

          open_heads = {pr["head"]["ref"] for pr in prs}
          by_author = collections.Counter(pr["user"]["login"] for pr in prs)

          for pr in prs:
              number = pr["number"]
              labels = {l["name"] for l in pr.get("labels", [])}

              # 1) TTL：21 天无活动 → 评论 + 关闭
              idle_days = (NOW - parse_dt(pr["updated_at"])).days
              if idle_days >= PR_TTL_DAYS:
                  print(f"  close PR #{number} ({pr['title'][:40]}) idle {idle_days}d")
                  gh_api(f"issues/{number}/comments", "POST", {"body": (
                      f"PR 已超过 {PR_TTL_DAYS} 天无活动，pr-hygiene 自动关闭。"
                      "如仍需推进，请重新打开并更新。"
                  )})
                  gh_api(f"pulls/{number}", "PATCH", {"state": "closed"})
                  continue

              # 2) 并发上限：同一 author > 5 个 open PR
              if by_author[pr["user"]["login"]] > MAX_OPEN_PRS_PER_AUTHOR \
                      and "blocked-pr-limit" not in labels:
                  print(f"  label PR #{number} blocked-pr-limit (author {pr['user']['login']})")
                  gh_api(f"issues/{number}/labels", "POST", {"labels": ["blocked-pr-limit"]})

              # 3) 无人认领
              if not pr.get("assignees") and "unclaimed" not in labels:
                  print(f"  label PR #{number} unclaimed")
                  gh_api(f"issues/{number}/labels", "POST", {"labels": ["unclaimed"]})

          # ---------- 4-5. 分支清理 ----------
          repo = gh_api("") or {}
          default_branch = repo.get("default_branch", "main")
          branches = gh_api("branches?per_page=100") or []
          print(f"branches: {len(branches)} (default: {default_branch})")

          merged = gh_api("pulls?state=closed&per_page=100") or []
          merged_refs = {p["head"]["ref"] for p in merged if p.get("merged_at")}

          deleted = 0
          for b in branches:
              name = b["name"]
              if name == default_branch or b.get("protected"):
                  continue
              encoded = urllib.parse.quote(name, safe="")

              # 4) 已合并分支（跳过仍有 open PR 引用的分支——同一分支可在合并后
              #    继续承载新提交并开启新 PR，误删会导致 GitHub 连锁关闭该 PR，
              #    2026-09-03 PR #1702 即因此被杀）
              if name in merged_refs and name not in open_heads:
                  print(f"  delete merged branch {name}")
                  gh_api(f"git/refs/heads/{encoded}", "DELETE")
                  deleted += 1
                  continue

              # 5) 机器来源僵尸分支（无 open PR）
              if name not in open_heads and (
                  name.startswith(DEVFLEET_PREFIX) or name.startswith(ZOMBIE_PREFIXES)
              ):
                  # 提交日期优先取 branches 列表返回值，缺失才单独查询。
                  try:
                      last = parse_dt(b["commit"]["commit"]["committer"]["date"])
                  except (KeyError, TypeError, ValueError):
                      detail = gh_api(f"branches/{encoded}")
                      if not detail:
                          continue
                      last = parse_dt(detail["commit"]["commit"]["committer"]["date"])
                  idle = NOW - last
                  ttl = (
                      datetime.timedelta(hours=DEVFLEET_TTL_HOURS)
                      if name.startswith(DEVFLEET_PREFIX)
                      else datetime.timedelta(days=ZOMBIE_DAYS)
                  )
                  if idle >= ttl:
                      print(f"  delete zombie branch {name} (idle {idle}, ttl {ttl})")
                      gh_api(f"git/refs/heads/{encoded}", "DELETE")
                      deleted += 1

          print(f"done. branches deleted: {deleted}")
          PYEOF
