name: retort-engine
on:
  pull_request:
    paths: ["packages/retort_engine/**", ".github/workflows/retort-engine.yml"]
  push:
    paths: ["packages/retort_engine/**", ".github/workflows/retort-engine.yml"]
jobs:
  retort_engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e 'packages/retort_engine[web]' pytest ruff mypy
      - run: python -m ruff check --target-version py310 packages/retort_engine
      - run: python -m ruff format --check --target-version py310 packages/retort_engine
      - run: python -m mypy packages/retort_engine/retort_engine --no-error-summary
      - run: PYTHONPATH=packages/retort_engine python -m pytest packages/retort_engine/tests -q -W error
