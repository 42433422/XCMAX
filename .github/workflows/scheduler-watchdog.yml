# root 原生 workflow（非 fhd-/modstore- 前缀，不经 CI SSOT publisher）——直接编辑此处。
# 与 ops-uptime.yml 同级：站外拨测 + 自动处置。
#
# 目的：防止 APScheduler 卡死（collector 实例堆积 / 线程池耗尽）导致整个
# modstore-scheduler.service 停摆。每 10 分钟探测一次 /api/xcmax/scheduler/health，
# 失败即 SSH 进 CVM 重启 modstore-scheduler.service。
#
# 适用范围：生产 CVM（119.27.178.147）的 systemd modstore-scheduler.service。
# 本地 macOS launchd modstore-daily 不在此 workflow 范围内（GitHub Actions 无法 SSH 到
# 笔记本）；如需本地 watchdog，复制本脚本到 ~/bin/scheduler-watchdog.sh 并注册为
# launchd plist（每 10 分钟跑一次，curl 失败时 launchctl kickstart -k <service>）。
name: Scheduler Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只探测，不重启服务'
        required: false
        type: boolean
        default: false

concurrency:
  group: scheduler-watchdog
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

env:
  # modstore-scheduler 监听 127.0.0.1:9990（无公网 nginx 转发），必须从 CVM 本机 curl
  HEALTH_URL: http://127.0.0.1:9990/api/xcmax/scheduler/health
  SERVICE_NAME: modstore-scheduler
  # 探测容忍秒数：超过此值未响应视为卡死
  CURL_TIMEOUT: 20

jobs:
  probe-and-restart:
    name: Probe scheduler health, restart if stuck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CVM SSH secrets
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_SSH_KEY: ${{ secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FHD_PUSH_HOST:-}" ] || [ -z "${FHD_PUSH_SSH_KEY:-}" ]; then
            echo "::error::FHD_PUSH_HOST and FHD_PUSH_SSH_KEY are required for scheduler-watchdog."
            echo "::error::Configure repo Secrets (default host 119.27.178.147)."
            exit 1
          fi

      - name: SSH probe + restart on failure
        id: probe
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          CURL_TIMEOUT: ${{ env.CURL_TIMEOUT }}
        run: |
          set -uo pipefail
          HOST="${FHD_PUSH_HOST:-119.27.178.147}"
          USER="${FHD_PUSH_USER:-root}"
          KEY_FILE="${RUNNER_TEMP}/scheduler_watchdog_key"
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # 远端命令：curl health endpoint，解析 JSON，判定完整注册 + 运行 + 待执行任务
          # 任一不满足 → 视为卡死，重启服务（除非 dry_run=true）
          # 远端通过 echo "::MARKER::value" 输出，runner 端解析后写入 $GITHUB_OUTPUT
          REMOTE_CMD=$(cat <<'EOF'
          set -uo pipefail
          URL="${HEALTH_URL:-http://127.0.0.1:9990/api/xcmax/scheduler/health}"
          SVC="${SERVICE_NAME:-modstore-scheduler}"
          TIMEOUT="${CURL_TIMEOUT:-20}"
          DRY="${DRY_RUN:-false}"

          resp="$(curl -sS --max-time "$TIMEOUT" -w '\n__HTTP_CODE__%{http_code}' "$URL" 2>/dev/null || true)"
          code="$(printf '%s' "$resp" | sed -n 's/.*__HTTP_CODE__//p' | tail -n1)"
          body="$(printf '%s' "$resp" | sed 's/__HTTP_CODE__[0-9]*$//')"

          echo "--- raw response ---"
          echo "http_code=$code"
          printf '%s' "$body" | head -c 4000
          echo
          echo "--- end raw ---"

          ok=0
          reason=""
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            reason="curl failed (service unreachable on $URL)"
          elif [ "$code" != "200" ]; then
            reason="http=$code (expected 200)"
          else
            # 解析 JSON（python3 在 CVM 上一定有）
            running="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str((d.get("data") or {}).get("scheduler_running", False)).lower())' 2>/dev/null || echo "parse_fail")"
            healthy="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("ok", False)).lower())' 2>/dev/null || echo "parse_fail")"
            complete="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str((d.get("data") or {}).get("registration_complete", False)).lower())' 2>/dev/null || echo "parse_fail")"
            runtime_healthy="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str((d.get("data") or {}).get("runtime_healthy", False)).lower())' 2>/dev/null || echo "parse_fail")"
            pending="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("data") or {}).get("pending_job_count", -1))' 2>/dev/null || echo "-1")"
            missing="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len((d.get("data") or {}).get("missing_required_jobs") or []))' 2>/dev/null || echo "-1")"
            stale="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len((d.get("data") or {}).get("unhealthy_runtime_jobs") or []))' 2>/dev/null || echo "-1")"
            echo "healthy=$healthy scheduler_running=$running registration_complete=$complete runtime_healthy=$runtime_healthy pending_job_count=$pending missing_required_jobs=$missing unhealthy_runtime_jobs=$stale"
            if [ "$healthy" = "true" ] && [ "$running" = "true" ] && [ "$complete" = "true" ] && [ "$runtime_healthy" = "true" ] && [ "$pending" -ge 1 ] && [ "$missing" -eq 0 ] && [ "$stale" -eq 0 ] 2>/dev/null; then
              ok=1
            else
              reason="healthy=$healthy scheduler_running=$running registration_complete=$complete runtime_healthy=$runtime_healthy pending_job_count=$pending missing_required_jobs=$missing unhealthy_runtime_jobs=$stale"
            fi
          fi

          if [ "$ok" = "1" ]; then
            echo "HEALTHY"
            echo "::restart_triggered::false"
            echo "::reason::"
            exit 0
          fi

          echo "UNHEALTHY: $reason"
          echo "::restart_triggered::true"
          echo "::reason::$reason"

          if [ "$DRY" = "true" ]; then
            echo "[dry-run] would have run: systemctl restart $SVC"
            exit 0
          fi

          echo "[restart] systemctl restart $SVC"
          systemctl restart "$SVC"
          code2="000"
          ok2="false"
          for _attempt in $(seq 1 24); do
            sleep 5
            resp2="$(curl -sS --max-time "$TIMEOUT" -w '\n__HTTP_CODE__%{http_code}' "$URL" 2>/dev/null || true)"
            code2="$(printf '%s' "$resp2" | sed -n 's/.*__HTTP_CODE__//p' | tail -n1)"
            body2="$(printf '%s' "$resp2" | sed 's/__HTTP_CODE__[0-9]*$//')"
            ok2="$(printf '%s' "$body2" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(d.get("ok", False)).lower())' 2>/dev/null || echo "parse_fail")"
            if [ "$code2" = "200" ] && [ "$ok2" = "true" ]; then
              break
            fi
          done
          echo "post-restart http=$code2 ok=$ok2"
          if [ "$code2" = "200" ] && [ "$ok2" = "true" ]; then
            echo "RECOVERED"
          else
            echo "STILL_UNHEALTHY after restart (http=$code2 ok=$ok2) — needs human investigation"
          fi
          EOF
          )

          # 通过 SSH 在 CVM 上执行；环境变量通过 ssh 命令前置 export 传入
          # 注意：不用 ssh -tt（不需要 TTY），让远端 stdout 直接喂给本步的 stdout
          ssh_output="$(ssh -i "$KEY_FILE" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${USER}@${HOST}" \
            "HEALTH_URL='$HEALTH_URL' SERVICE_NAME='$SERVICE_NAME' CURL_TIMEOUT='$CURL_TIMEOUT' DRY_RUN='$DRY_RUN' bash -s" <<< "$REMOTE_CMD" 2>&1 || true)"

          echo "$ssh_output"

          # 解析远端输出的 ::marker:: 行，写入 $GITHUB_OUTPUT
          restart_triggered="$(printf '%s\n' "$ssh_output" | sed -n 's/^::restart_triggered:://p' | tail -n1)"
          reason="$(printf '%s\n' "$ssh_output" | sed -n 's/^::reason:://p' | tail -n1)"
          [ -n "$restart_triggered" ] || restart_triggered="false"
          [ -n "$reason" ] || reason="unknown (marker not found in ssh output)"

          {
            echo "restart_triggered=${restart_triggered}"
            echo "reason<<EOF"
            printf '%s\n' "$reason"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "final: restart_triggered=$restart_triggered reason=$reason"

      - name: Open or update incident issue
        if: steps.probe.outputs.restart_triggered == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REASON: ${{ steps.probe.outputs.reason }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
        run: |
          set -uo pipefail
          gh label create scheduler-watchdog --description "调度器卡死自动重启事故" --color B60205 --force || true
          BODY="$(printf 'modstore-scheduler 探测失败，已自动重启。\n\n- **服务**: %s\n- **原因**: %s\n- **健康端点**: %s\n- **运行**: %s/%s/actions/runs/%s\n\n处置手册: 见 docs/runbooks/release-checklist.md 调度器章节' \
            "$SERVICE_NAME" "$REASON" "${HEALTH_URL}" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")"
          EXISTING="$(gh issue list --label scheduler-watchdog --state open --json number --jq '.[0].number // ""')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "仍在故障 ($(date -u '+%Y-%m-%d %H:%M UTC')): $REASON"
          else
            gh issue create \
              --title "🔴 modstore-scheduler 卡死已自动重启" \
              --label scheduler-watchdog \
              --body "$BODY"
          fi

      - name: Close incident on recovery
        if: steps.probe.outputs.restart_triggered != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          EXISTING="$(gh issue list --label scheduler-watchdog --state open --json number --jq '.[0].number // ""')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "✅ 调度器恢复健康 ($(date -u '+%Y-%m-%d %H:%M UTC'))，自动关闭。"
            gh issue close "$EXISTING"
          fi
