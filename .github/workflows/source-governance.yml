name: Source Governance

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Approved release admission tests
        run: python -m unittest scripts.ci.test_modstore_release_approval
      - name: Install source-rule test runner
        run: python -m pip install pytest
      - name: Test source governance rules
        run: python -m pytest -q scripts/dev/test_source_governance.py scripts/dev/test_source_size_policy.py
      - name: Test unified change classifier
        run: python -m unittest scripts.dev.test_change_classifier
      - name: Check cross-stack source debt
        run: python scripts/dev/source_governance.py --top 10
      - name: Test private-data admission rules
        run: python scripts/ci/test_private_data.py
      - name: Reject customer data and embedded runtime snapshots
        run: python scripts/ci/check_private_data.py
      - name: Check operational exception boundaries
        run: python scripts/ci/check_operational_errors_gate.py
      - name: Check broad exception ratchet
        run: python scripts/ci/check_broad_except_gate.py

  sunbird-source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FHD/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix FHD/frontend
      - name: Rebuild Sunbird console from source
        run: npm --prefix FHD/sunbird-console run build
      - name: Verify generated entrypoint
        run: |
          test -s FHD/templates/sunbird-vue-dist/index.html
          grep -q '/sunbird/assets/' FHD/templates/sunbird-vue-dist/index.html
