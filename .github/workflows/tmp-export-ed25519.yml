# 一次性任务：导出 XCAGI_UPDATE_ED25519_PRIVATE_KEY 为加密 artifact（取回后立即删除本 workflow 与 artifact）
name: tmp-export-ed25519-key
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Export key as base64 artifact
        env:
          KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          mkdir -p /tmp/out
          printf '%s' "$KEY" | base64 -w0 > /tmp/out/key.b64
          echo "bytes: $(printf '%s' "$KEY" | wc -c | tr -d ' ')"
      - uses: actions/upload-artifact@v4
        with:
          name: ed25519-key-export
          path: /tmp/out/key.b64
          retention-days: 1
          if-no-files-found: error
