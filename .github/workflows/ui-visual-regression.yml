name: UI visual regression
on:
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'FHD/frontend/**'
      - 'FHD/mobile-flutter-poc/**'
      - 'FHD/desktop/**'
      - 'FHD/config/*design*'
      - 'FHD/config/visual_regression_approvals.json'
      - 'FHD/scripts/design/**'
      - 'FHD/scripts/dev/compare_visual_regression.py'
      - '成都修茈科技有限公司/MODstore_deploy/market/**'
      - '.github/workflows/ui-visual-regression.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  visual:
    name: Visual regression (${{ matrix.surface }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        surface: [desktop, market, flutter]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SURFACE: ${{ matrix.surface }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned comparator and fonts
        run: |
          python -m pip install 'Pillow==12.3.0'
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/visual/baseline" "$RUNNER_TEMP/visual/candidate"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          python candidate/FHD/scripts/dev/compare_visual_regression.py --self-test
      - uses: actions/setup-node@v7
        if: matrix.surface != 'flutter'
        with:
          node-version: '22.22.2'
      - name: Capture both browser revisions with identical tests
        if: matrix.surface != 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          case "$SURFACE" in
            desktop) app=FHD/frontend ;;
            market) app='成都修茈科技有限公司/MODstore_deploy/market' ;;
            *) exit 1 ;;
          esac
          cp "candidate/$app/playwright.visual.config.ts" "baseline/$app/"
          mkdir -p "baseline/$app/visual-regression"
          cp -R "candidate/$app/visual-regression/." "baseline/$app/visual-regression/"
          if [[ "$SURFACE" == desktop ]]; then
            cp "candidate/$app/e2e/startup-readiness-fixture.ts" "baseline/$app/e2e/"
          fi
          for side in baseline candidate; do
            (
              cd "$side/$app"
              npm ci --no-audit --no-fund
              npx playwright install --with-deps chromium
              npx playwright --version > "$RUNNER_TEMP/visual/$side/playwright-version.txt"
              VISUAL_CAPTURE_DIR="$RUNNER_TEMP/visual/$side" npx playwright test --config playwright.visual.config.ts
            )
          done
      - name: Read candidate Flutter SDK pin
        if: matrix.surface == 'flutter'
        id: flutter_sdk
        run: echo "version=$(cat candidate/FHD/mobile-flutter-poc/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: matrix.surface == 'flutter'
        with:
          flutter-version: ${{ steps.flutter_sdk.outputs.version }}
          cache: true
      - name: Capture both Flutter revisions with identical tests
        if: matrix.surface == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          app=FHD/mobile-flutter-poc
          mkdir -p "baseline/$app/visual_regression"
          cp -R "candidate/$app/visual_regression/." "baseline/$app/visual_regression/"
          cp "candidate/$app/test/employee_workspace_screen_test.dart" "baseline/$app/test/"
          export VISUAL_FONT_PATH=/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -s "$VISUAL_FONT_PATH"
          for side in baseline candidate; do
            (
              cd "$side/$app"
              flutter pub get
              flutter --version > "$RUNNER_TEMP/visual/$side/flutter-version.txt"
              # Ephemeral capture only; no automatic baseline commits.
              flutter test --no-pub --update-goldens visual_regression/visual_test.dart
              cp visual_regression/goldens/*.png "$RUNNER_TEMP/visual/$side/"
            )
          done
      - name: Compare exact pixels against the checked-out base
        run: |
          python candidate/FHD/scripts/dev/compare_visual_regression.py \
            --root "$RUNNER_TEMP/visual" --surface "$SURFACE" \
            --base-sha "$BASE_SHA" --candidate-sha "$(git -C candidate rev-parse HEAD)" \
            --approvals candidate/FHD/config/visual_regression_approvals.json
      - name: Upload synthetic baseline, candidate, differences and source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual/
          if-no-files-found: error
          retention-days: 14
