name: XCAGI read-only source snapshot
on:
  push:
    branches: [validation/xcagi-source-snapshot-20261022]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2cb0c77dca3913955aa5cdcb8505fc0c8d496fe3
          fetch-depth: 1
          persist-credentials: false
      - name: Export tracked source and small test fixtures without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2cb0c77dca3913955aa5cdcb8505fc0c8d496fe3
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, tarfile
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'xcagi-source'
          out.mkdir()
          omitted, included = [], []
          entries = subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD']).split(b'\0')
          with tarfile.open(out / 'source.tar.gz', 'w:gz') as archive:
              for entry in entries:
                  if not entry:
                      continue
                  meta, raw_path = entry.split(b'\t', 1)
                  mode, kind, blob = meta.decode().split()
                  name = raw_path.decode()
                  path = pathlib.Path(name)
                  if kind != 'blob' or not path.is_file() or path.is_symlink():
                      omitted.append({'path': name, 'reason': 'non-regular', 'blob': blob})
                      continue
                  size = path.stat().st_size
                  if size > 8 * 1024 * 1024:
                      omitted.append({'path': name, 'reason': 'large-asset', 'bytes': size, 'blob': blob})
                      continue
                  data = path.read_bytes()
                  try:
                      data.decode('utf-8')
                      text = b'\0' not in data
                  except UnicodeDecodeError:
                      text = False
                  fixture = ('/tests/' in '/' + name or '/fixtures/' in '/' + name) and size <= 2 * 1024 * 1024
                  if not text and not fixture:
                      omitted.append({'path': name, 'reason': 'binary-asset', 'bytes': size, 'blob': blob})
                      continue
                  archive.add(path, arcname=name, recursive=False)
                  included.append({'path': name, 'blob': blob, 'bytes': size, 'mode': mode})
          manifest = {'source_sha': '2cb0c77dca3913955aa5cdcb8505fc0c8d496fe3', 'tree_sha': '89cb6266d8f8571d5f33107db61a3500a167fe47', 'scope': 'tracked text <=8MiB and test fixtures <=2MiB; not a full checkout', 'included': included, 'omitted': omitted}
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          archive_path = out / 'source.tar.gz'
          digest = hashlib.file_digest(archive_path.open('rb'), 'sha256').hexdigest()
          (out / 'SHA256SUMS').write_text(digest + '  source.tar.gz\n')
          print(json.dumps({'included': len(included), 'omitted': len(omitted), 'archive_bytes': archive_path.stat().st_size, 'sha256': digest}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-source-text-2cb0c77d
          path: ${{ runner.temp }}/xcagi-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
