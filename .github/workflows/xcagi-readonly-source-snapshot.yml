name: XCAGI read-only source snapshot
on:
  push:
    branches: [validation/xcagi-source-snapshot-20261022]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2cb0c77dca3913955aa5cdcb8505fc0c8d496fe3
          fetch-depth: 1
          persist-credentials: false
      - name: Archive exact tracked source without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2cb0c77dca3913955aa5cdcb8505fc0c8d496fe3
          mkdir -p "$RUNNER_TEMP/xcagi-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/xcagi-source/source.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/xcagi-source/identity.txt"
          sha256sum "$RUNNER_TEMP/xcagi-source/source.tar.gz" > "$RUNNER_TEMP/xcagi-source/SHA256SUMS"
          du -h "$RUNNER_TEMP/xcagi-source/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-source-2cb0c77d
          path: ${{ runner.temp }}/xcagi-source/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
