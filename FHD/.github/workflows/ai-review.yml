# CI SSOT: generated from FHD/.github/workflows/ai-review.yml
# 编辑源：FHD/.github/workflows/ai-review.yml（根仓 .github/workflows/ai-review.yml 为同步副本）
name: AI Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      # 显式覆盖官网（成都修茈科技有限公司）静态资源 + nginx 配置 + 自动更新脚本
      - '成都修茈科技有限公司/**'
      # FHD 全栈（Python/Vue/Electron/MOD SDK）
      - 'FHD/**'
      # MODstore 部署 + market 前端
      - '成都修茈科技有限公司/MODstore_deploy/**'
      # 共享包
      - 'packages/**'
      # 根仓 CI 配置
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR 编号（手动触发用）"
        required: true
        default: "0"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      XCAGI_LLM_API_KEY: ${{ secrets.XCAGI_LLM_API_KEY }}
      XCAGI_LLM_BASE_URL: ${{ secrets.XCAGI_LLM_BASE_URL }}
      XCAGI_LLM_MODEL: ${{ secrets.XCAGI_LLM_MODEL }}
      XCAGI_LLM_ENDPOINT: ${{ secrets.XCAGI_LLM_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 审查脚本通过 GitHub API 获取 PR diff，不需要下载整个大仓历史。
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FHD/scripts/ci/requirements-ai-review.txt

      - name: Install dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ci/requirements-ai-review.txt

      - name: Run ai-review
        working-directory: FHD
        run: |
          python scripts/ci/ai_review.py \
            --pr-number "${PR_NUMBER}" \
            --commit-id "${{ github.event.pull_request.head.sha }}"
