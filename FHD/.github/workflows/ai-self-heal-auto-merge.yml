# CI SSOT: generated from FHD/.github/workflows/ai-self-heal-auto-merge.yml
# 编辑源：FHD/.github/workflows/ai-self-heal-auto-merge.yml（根仓 .github/workflows/fhd-ai-self-heal-auto-merge.yml 为同步副本）
name: AI Self-Heal Auto-Merge SLA

on:
  schedule:
    # 每 30 分钟：普通 PR auto-merge 三重门禁闭环 + ai-self-heal/ai-generated SLA
    # （原 6h 间隔对普通 PR 延迟过大，2026-07-20 收紧到 30min）
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅打印动作不实际合并/关闭"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      scan_regular_prs:
        description: "扫描普通 PR（无 ai-self-heal / ai-generated label）"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-self-heal-sla
  cancel-in-progress: false

defaults:
  run:
    working-directory: FHD

jobs:
  process-prs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Process ai-self-heal PRs by SLA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT 仅用于 update-branch，使 synchronize 产生的新 head 自动运行 PR checks。
          # merge 仍使用 GITHUB_TOKEN，并由脚本显式派发主干发布，避免双重部署。
          BRANCH_UPDATE_TOKEN: ${{ secrets.CI_COMMIT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          # schedule 触发默认启用 scan-regular-prs；workflow_dispatch 可手动关
          SCAN_REGULAR="--scan-regular-prs"
          if [[ "${{ github.event.inputs.scan_regular_prs }}" == "false" ]]; then
            SCAN_REGULAR=""
          fi
          python scripts/ci/ai_self_heal_sla.py \
            --auto-merge-r0-hours 12 \
            --auto-merge-r1-hours 48 \
            --stale-r2-days 7 \
            --close-r2-days 14 \
            --stale-r3-days 7 \
            --close-r3-days 30 \
            $SCAN_REGULAR \
            $DRY_RUN_FLAG

      - name: Commit stale log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/ai-self-heal-stale.jsonl || true
          git diff --staged --quiet || git commit -m "chore(self-heal): sla stale log $(date -u +%Y%m%d)"
          git push || true
