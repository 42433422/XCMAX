# CI SSOT: generated from FHD/.github/workflows/ai-self-heal.yml
# 编辑源：FHD/.github/workflows/ai-self-heal.yml（根仓 .github/workflows/fhd-ai-self-heal.yml 为同步副本）
name: AI Self-Heal

on:
  workflow_run:
    workflows: ["CI/CD Pipeline", "Smoke Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "失败 workflow run id（手动触发用）"
        required: false
        default: ""
      workflow_name:
        description: "失败 workflow 名称"
        required: false
        default: ""
      branch:
        description: "失败 workflow 所在分支"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  self-heal:
    # 仅当 workflow_run 失败时触发；workflow_dispatch 手动触发不受此条件限制
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      XCAGI_LLM_API_KEY: ${{ secrets.XCAGI_LLM_API_KEY }}
      XCAGI_LLM_BASE_URL: ${{ secrets.XCAGI_LLM_BASE_URL }}
      XCAGI_LLM_MODEL: ${{ secrets.XCAGI_LLM_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FHD/scripts/ci/requirements-self-heal.txt

      - name: Install dependencies
        working-directory: FHD
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ci/requirements-self-heal.txt
          pip install ruff black

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run ai-self-heal (workflow_run trigger)
        if: ${{ github.event_name == 'workflow_run' }}
        working-directory: FHD
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python scripts/ci/ai_self_heal.py \
            --workflow "${{ github.event.workflow_run.name }}" \
            --branch "${{ github.event.workflow_run.head_branch }}"

      - name: Run ai-self-heal (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: FHD
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python scripts/ci/ai_self_heal.py \
            --run-id ${{ inputs.run_id }} \
            --workflow "${{ inputs.workflow_name }}" \
            --branch "${{ inputs.branch }}"
