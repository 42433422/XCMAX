name: Audit remediation source snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: audit-remediation-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/audit-a01-a14-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Archive tracked source with exact identity (no .git or credentials)
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/xcmax-audit-source"
          mkdir -p "$destination"
          git rev-parse HEAD > "$destination/source-sha.txt"
          git rev-parse HEAD^{tree} > "$destination/tree-sha.txt"
          git ls-tree -rz HEAD > "$destination/tracked-tree.bin"
          git archive --format=tar.gz --output="$destination/source.tar.gz" HEAD
          sha256sum "$destination/source.tar.gz" > "$destination/SHA256SUMS.txt"
      - name: Retain source snapshot for this audit only
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/xcmax-audit-source/
          retention-days: 1
          if-no-files-found: error
