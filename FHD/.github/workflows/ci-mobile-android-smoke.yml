# CI SSOT: edit this file, then run: python scripts/dev/publish_ci_workflows_to_root.py
# 真机冒烟验证：Android 模拟器安装并启动企业版 APK。
#
# 与 ci-mobile-flutter.yml（编译 + 单元/Widget 测试）互补：本工作流验证
# 「构建产物在真实 Android 运行时上能装、能起、进程存活」，覆盖
# MethodChannel 注册、插件初始化等纯 JVM/Widget 测试触不到的启动路径。
#
# 2026-09-08 首跑教训：
# - 禁止 rm -rf /usr/local/lib/android —— 那是 ANDROID_HOME，删了 emulator
#   runner 重装 SDK 会因 root 属主 EACCES 直接失败（磁盘本就不紧张）。
# - ubuntu-latest 的 /dev/kvm 默认非 runner 用户可读写，必须显式开权限，
#   否则 x86_64 镜像纯软件模拟必然 boot timeout。
name: ci-mobile-android-smoke

on:
  push:
    paths:
      - "mobile-flutter-poc/**"
      - ".github/workflows/ci-mobile-android-smoke.yml"
  pull_request:
    paths:
      - "mobile-flutter-poc/**"
      - ".github/workflows/ci-mobile-android-smoke.yml"
  schedule:
    # 每日 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-mobile-android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_PACKAGE: com.xiuci.xcagi.mobile.enterprise
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: mobile-flutter-poc
        run: flutter pub get

      - name: Build debug APK
        working-directory: mobile-flutter-poc
        run: flutter build apk --debug

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install emulator runtime deps
        # 2026-09-08 二跑教训：emulator 37.x 的 qemu 动态链接 libpulse，
        # 当前 ubuntu-latest 镜像不再预装，缺失时进程秒崩且 -noaudio 绕不过。
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Boot headless emulator (API 34 x86_64) + install + launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          # 三跑教训：本输入会整体覆盖 action 默认项，漏掉 -no-window 会让
          # emulator 37.x 在无显示的 runner 上初始化 Qt xcb 插件直接 abort。
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          working-directory: mobile-flutter-poc
          script: |
            APK=$(find build/app/outputs/flutter-apk -name 'app-debug.apk' | head -1)
            test -n "$APK"
            adb install -r -g "$APK"
            # 冷启动主 Activity，等待首帧渲染
            adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 15
            # 存活断言：进程仍在 = 启动路径（含 MethodChannel/插件初始化）未崩溃
            if ! adb shell pidof "$APP_PACKAGE" > /dev/null; then
              echo "::error::app process not alive after launch"
              exit 1
            fi
            adb exec-out screencap -p > /tmp/android-smoke-screen.png
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-evidence
          path: /tmp/android-smoke-screen.png
          if-no-files-found: error

      - name: Crash log dump
        if: failure()
        timeout-minutes: 2
        # 二跑教训：无设备时 adb logcat 会阻塞等设备上线，白烧 job 超时预算。
        run: timeout 60 adb logcat -d -t 800 || true
