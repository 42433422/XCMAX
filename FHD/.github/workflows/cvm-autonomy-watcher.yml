# CI SSOT: generated from FHD/.github/workflows/cvm-autonomy-watcher.yml
# Phase 2：服务器端自治 watcher（cron 每 10 分钟 SSH 触发）
# 与 fhd-deploy.yml break-glass 模式一致：SSH 到 CVM 执行 watcher，不常驻 systemd
name: cvm-autonomy-watcher

on:
  schedule:
    # 每 10 分钟触发一次（初始频率；稳定后可降频到每 30 分钟以节省 Actions 配额）
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只采集 + 派生 + 决策，不执行 action'
        required: false
        type: boolean
        default: false

concurrency:
  group: cvm-autonomy-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watcher-tick:
    name: CVM autonomy watcher tick
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require CVM SSH secrets
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_SSH_KEY: ${{ secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FHD_PUSH_HOST:-}" ] || [ -z "${FHD_PUSH_SSH_KEY:-}" ]; then
            echo "::error::FHD_PUSH_HOST and FHD_PUSH_SSH_KEY are required for cvm-autonomy-watcher."
            echo "::error::Configure repo Secrets (default host 119.27.178.147)."
            exit 1
          fi

      - name: SSH trigger watcher tick
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          HOST="${FHD_PUSH_HOST:-119.27.178.147}"
          USER="${FHD_PUSH_USER:-root}"
          KEY_FILE="${RUNNER_TEMP}/cvm_autonomy_key"
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          DEPLOY_ROOT="/opt/fhd-full"
          MANIFEST="/var/www/update/releases/stable/server/fhd-manifest.json"
          AUDIT_DIR="${DEPLOY_ROOT}/autonomy"

          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          REMOTE_CMD=$(cat <<EOF
          set -euo pipefail
          cd "${DEPLOY_ROOT}"
          python3 "${DEPLOY_ROOT}/scripts/autonomy/cvm_autonomy_watcher.py" \
            --deploy-root "${DEPLOY_ROOT}" \
            --manifest-path "${MANIFEST}" \
            --audit-dir "${AUDIT_DIR}" \
            ${DRY_FLAG}
          EOF
          )

          ssh -i "$KEY_FILE" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "${USER}@${HOST}" \
            "bash -s" <<< "$REMOTE_CMD"
