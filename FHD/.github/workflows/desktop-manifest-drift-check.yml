# 桌面下载中心 manifest 漂移日检（审计 R03 制度化）
#
# 背景：2026-09-04 macOS OTA 发布在上传步骤被取消，制品与 latest-mac.yml 已更新、
# 但 xcagi-v<version>/manifest.json 未再生，导致 manifest 声称的 sha256/size 与线上
# 实际 dmg/zip 脱节（同版本多构建并存）。本 workflow 每日只读核对，漂移即失败留证。
name: Desktop Manifest Drift Check

on:
  schedule:
    - cron: "30 2 * * *"  # 每日 02:30 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "产品版本（默认 1.0.0.2）"
        required: false
        default: "1.0.0.2"
        type: string
      full_sha256:
        description: "下载制品核对 sha256（高带宽，默认仅 HEAD 尺寸）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-manifest-drift-check
  cancel-in-progress: true

jobs:
  drift-check:
    name: verify download manifest vs live artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check declared size vs live Content-Length
        id: size
        run: |
          set -euo pipefail
          python scripts/dev/verify_desktop_manifest_drift.py \
            --version "${{ inputs.version || '1.0.0.2' }}" \
            --output "${RUNNER_TEMP}/drift-size.json" \
            | tee "${GITHUB_STEP_SUMMARY}"
      - name: Check sha256 when requested
        if: ${{ inputs.full_sha256 == true }}
        run: |
          set -euo pipefail
          python scripts/dev/verify_desktop_manifest_drift.py \
            --version "${{ inputs.version || '1.0.0.2' }}" \
            --full-sha256 \
            --output "${RUNNER_TEMP}/drift-full.json" \
            | tee "${GITHUB_STEP_SUMMARY}"
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-manifest-drift-report
          path: ${{ runner.temp }}/drift-*.json
          if-no-files-found: ignore
          retention-days: 90
