# 桌面下载中心 manifest 漂移日检（审计 R03 制度化）
#
# 背景：2026-09-04 macOS OTA 发布在上传步骤被取消，制品与 latest-mac.yml 已更新、
# 但 xcagi-v<version>/manifest.json 未再生，导致 manifest 声称的 sha256/size 与线上
# 实际 dmg/zip 脱节（同版本多构建并存）。本 workflow 每日只读核对，漂移即失败留证。
name: Desktop Manifest Drift Check

on:
  schedule:
    - cron: "30 14 * * *"  # 当前公开版本每天核验（22:30 北京时间）
    - cron: "55 15 * * 0"  # 每周核验完整 SHA-256（周日 23:55 北京时间）
  workflow_dispatch:
    inputs:
      version:
        description: "历史版本可选；留空检查当前公开指针"
        required: false
        default: ""
        type: string
      full_sha256:
        description: "下载制品核对 sha256（高带宽，默认仅 HEAD 尺寸）"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: desktop-manifest-drift-check
  cancel-in-progress: true

jobs:
  drift-check:
    name: verify download manifest vs live artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check declared size vs live Content-Length
        id: size
        run: |
          set -euo pipefail
          python scripts/dev/verify_desktop_manifest_drift.py \
            --version "${{ inputs.version || '' }}" \
            --output "${RUNNER_TEMP}/drift-size.json" \
            | tee "${GITHUB_STEP_SUMMARY}"
      - name: Check sha256 when requested
        if: ${{ github.event.schedule == '55 15 * * 0' || inputs.full_sha256 == true }}
        run: |
          set -euo pipefail
          python scripts/dev/verify_desktop_manifest_drift.py \
            --version "${{ inputs.version || '' }}" \
            --full-sha256 \
            --output "${RUNNER_TEMP}/drift-full.json" \
            | tee "${GITHUB_STEP_SUMMARY}"
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-manifest-drift-report
          path: ${{ runner.temp }}/drift-*.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Open or update the drift follow-up issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          title="[release] 桌面下载清单与线上产物不一致"
          body="$(printf '下载中心 manifest 与线上制品核对失败。\n\n- 运行记录: %s\n- 证据: artifact `desktop-manifest-drift-report`\n\n处置方式：重新生成 manifest.json 并上传，或回滚发布指针；修复后重跑本 workflow 验证。\n' "$RUN_URL")"
          number="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          assignee="${{ vars.SECURITY_ISSUE_ASSIGNEE }}"
          if [ -z "$assignee" ] && [ -f "${GITHUB_WORKSPACE}/.github/CODEOWNERS" ]; then
            assignee="$(grep -m1 '^/.github/' "${GITHUB_WORKSPACE}/.github/CODEOWNERS" | awk '{print $1}' | tr -d '@')"
          fi
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          elif [ -n "$assignee" ]; then
            gh issue create --repo "$REPO" --title "$title" --body "$body" --assignee "$assignee"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
