name: Employee Smoke Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "FHD/app/application/employee_runtime/**"
      - "FHD/app/domain/autonomy/**"
      - "FHD/config/risk_actions.registry.json"
      - "FHD/config/autonomy_boundaries.yaml"
  push:
    branches: [main]
    paths:
      - "FHD/app/application/employee_runtime/**"
      - "FHD/app/domain/autonomy/**"
      - "FHD/config/risk_actions.registry.json"
      - "FHD/config/autonomy_boundaries.yaml"
  workflow_dispatch:

permissions:
  contents: read

# CI 提速：同一 PR 新推送取消旧运行；push/schedule/dispatch 按 run_id 独占，不取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  employee-smoke-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FHD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install server and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server-api.txt
          pip install -r deploy/requirements-dev.txt
      - name: Run employee risk smoke
        run: |
          python -m pytest -q \
            tests/application/test_employee_runtime_write_approval.py \
            tests/test_application/test_write_approval_flow.py \
            tests/domain/test_autonomy_guard.py
