# 紧急修复：以正式下载目录中的既有 ZIP 为准，原子恢复 stable/official 元数据一致性。
name: Fix macOS update feed

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version (four-part)
        required: true
        default: "1.0.0.0"
      zip_name:
        description: ZIP filename on CDN enterprise dir
        required: true
        default: "XCAGI-Enterprise-1.0.0.0-mac-arm64.zip"
      build_sha:
        description: Optional buildSha override (40-char git sha); empty = read from ZIP build-info.json
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: FHD

jobs:
  republish-mac-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cryptography
        run: pip install --quiet cryptography
      - name: Verify canonical ZIP identity and atomically repair both feed paths
        env:
          XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
          ZIP_NAME: ${{ github.event.inputs.zip_name }}
          PRODUCT_VERSION: ${{ github.event.inputs.version }}
          BUILD_SHA: ${{ github.event.inputs.build_sha }}
        run: |
          set -euo pipefail
          if [ -z "${XCAGI_UPDATE_ED25519_PRIVATE_KEY:-}" ]; then
            echo "::error::XCAGI_UPDATE_ED25519_PRIVATE_KEY missing"
            exit 1
          fi
          if [ -z "${DESKTOP_SSH_KEY:-}" ]; then
            echo "::error::SERVER_SSH_KEY or FHD_PUSH_SSH_KEY missing"
            exit 1
          fi
          if [[ ! "${PRODUCT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid four-part product version: ${PRODUCT_VERSION}"
            exit 1
          fi
          case "${ZIP_NAME}" in
            "XCAGI-Enterprise-${PRODUCT_VERSION}-mac-arm64.zip"|"XCAGI-Enterprise-${PRODUCT_VERSION}-mac-x64.zip") ;;
            *)
              echo "::error::ZIP_NAME must be the canonical enterprise macOS ZIP for ${PRODUCT_VERSION}."
              exit 1
              ;;
          esac
          if [ -n "${BUILD_SHA:-}" ] && [[ ! "${BUILD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::build_sha must be a full 40-character Git SHA."
            exit 1
          fi
          HOST="${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}"
          STABLE_DEST="/var/www/update/releases/stable/enterprise"
          OFFICIAL_DEST="/var/www/xcagi-v${PRODUCT_VERSION}/enterprise"
          mkdir -p ~/.ssh
          printf '%s\n' "${DESKTOP_SSH_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$HOME/.ssh/id_ci" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20)

          scp "${SSH_OPTS[@]}" scripts/deploy/hash_file_sha512.py "root@${HOST}:/tmp/hash_file_sha512.py"
          scp "${SSH_OPTS[@]}" scripts/deploy/extract_zip_build_sha.py "root@${HOST}:/tmp/extract_zip_build_sha.py"
          ssh "${SSH_OPTS[@]}" "root@${HOST}" \
            "test -f '${OFFICIAL_DEST}/${ZIP_NAME}' && mkdir -p '${STABLE_DEST}' '${OFFICIAL_DEST}'"
          META="$(ssh "${SSH_OPTS[@]}" "root@${HOST}" "python3 /tmp/hash_file_sha512.py '${OFFICIAL_DEST}/${ZIP_NAME}'")"
          SIZE="$(printf '%s\n' "$META" | sed -n '1p')"
          SHA512="$(printf '%s\n' "$META" | sed -n '2p')"
          echo "Canonical ZIP size=${SIZE} sha512=${SHA512}"

          ZIP_BUILD_SHA="$(ssh "${SSH_OPTS[@]}" "root@${HOST}" "python3 /tmp/extract_zip_build_sha.py '${OFFICIAL_DEST}/${ZIP_NAME}'")"
          RESOLVED_SHA="${ZIP_BUILD_SHA:-}"
          if [ -z "${RESOLVED_SHA}" ]; then
            echo "::error::Canonical ZIP has no build-info.json Git identity."
            exit 1
          fi
          if [ -n "${BUILD_SHA:-}" ] && [ "${BUILD_SHA}" != "${ZIP_BUILD_SHA}" ]; then
            echo "::error::build_sha override differs from the canonical ZIP identity."
            exit 1
          fi

          MANIFEST="$(curl -fsSL --retry 3 --retry-all-errors \
            "https://xiu-ci.com/xcagi-v${PRODUCT_VERSION}/manifest.json")"
          MANIFEST_VERSION="$(printf '%s' "${MANIFEST}" | jq -er '.version')"
          MANIFEST_SHA="$(printf '%s' "${MANIFEST}" | jq -er '.git_sha')"
          if [ "${MANIFEST_VERSION}" != "${PRODUCT_VERSION}" ] || [ "${MANIFEST_SHA}" != "${RESOLVED_SHA}" ]; then
            echo "::error::Canonical ZIP identity does not match the published release manifest. Run the full desktop release instead."
            exit 1
          fi
          echo "Verified canonical release identity: ${PRODUCT_VERSION} @ ${RESOLVED_SHA}"

          WORK="$(mktemp -d)"
          : > "${WORK}/${ZIP_NAME}"
          TOOLCHAIN="$(printf '%s' "${PRODUCT_VERSION}" | cut -d. -f1-3)"
          export XCAGI_PRODUCT_VERSION="${PRODUCT_VERSION}"
          export XCAGI_BUILD_SHA="${RESOLVED_SHA}"
          node scripts/package/generate-update-metadata.mjs "${WORK}/${ZIP_NAME}" "${TOOLCHAIN}" mac
          python3 scripts/deploy/patch_latest_mac_yml_hashes.py "${WORK}/latest-mac.yml" "${SHA512}" "${SIZE}"
          python scripts/dev/sign_update_metadata.py "${WORK}/latest-mac.yml"

          # Repair the stable ZIP from the canonical official copy without uploading
          # the large archive through the runner. Metadata is published last.
          ssh "${SSH_OPTS[@]}" "root@${HOST}" \
            "cp -f '${OFFICIAL_DEST}/${ZIP_NAME}' '${STABLE_DEST}/${ZIP_NAME}.part' && \
             if [ -f '${OFFICIAL_DEST}/${ZIP_NAME}.blockmap' ]; then \
               cp -f '${OFFICIAL_DEST}/${ZIP_NAME}.blockmap' '${STABLE_DEST}/${ZIP_NAME}.blockmap.part'; \
             fi"
          scp "${SSH_OPTS[@]}" "${WORK}/latest-mac.yml" "root@${HOST}:${STABLE_DEST}/latest-mac.yml.part"
          scp "${SSH_OPTS[@]}" "${WORK}/latest-mac.yml" "root@${HOST}:${OFFICIAL_DEST}/latest-mac.yml.part"
          ssh "${SSH_OPTS[@]}" "root@${HOST}" \
            "set -eu; \
             cmp -s '${STABLE_DEST}/latest-mac.yml.part' '${OFFICIAL_DEST}/latest-mac.yml.part'; \
             mv -f '${STABLE_DEST}/${ZIP_NAME}.part' '${STABLE_DEST}/${ZIP_NAME}'; \
             if [ -f '${STABLE_DEST}/${ZIP_NAME}.blockmap.part' ]; then \
               mv -f '${STABLE_DEST}/${ZIP_NAME}.blockmap.part' '${STABLE_DEST}/${ZIP_NAME}.blockmap'; \
             fi; \
             mv -f '${OFFICIAL_DEST}/latest-mac.yml.part' '${OFFICIAL_DEST}/latest-mac.yml'; \
             mv -f '${STABLE_DEST}/latest-mac.yml.part' '${STABLE_DEST}/latest-mac.yml'; \
             cmp -s '${STABLE_DEST}/latest-mac.yml' '${OFFICIAL_DEST}/latest-mac.yml'; \
             test \"\$(python3 /tmp/hash_file_sha512.py '${STABLE_DEST}/${ZIP_NAME}' | sed -n '1p')\" = '${SIZE}'; \
             test \"\$(python3 /tmp/hash_file_sha512.py '${STABLE_DEST}/${ZIP_NAME}' | sed -n '2p')\" = '${SHA512}'; \
             head -20 '${OFFICIAL_DEST}/latest-mac.yml'"
          echo "Repaired identical latest-mac.yml at stable and official paths."
