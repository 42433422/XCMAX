name: Intent Accuracy Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements-server-api.txt pytest

      - name: Run intent golden set benchmark
        env:
          XCAGI_SKIP_INTENT_LLM: "1"
          INTENT_BENCHMARK_RUN: "1"
        run: |
          python -m pytest tests/benchmarks/test_intent_accuracy.py -v --tb=short

      - name: Run task-level golden set benchmark (tau-bench methodology)
        env:
          XCAGI_SKIP_INTENT_LLM: "1"
          TASK_BENCHMARK_RUN: "1"
          TASK_BENCHMARK_TRIALS: "3"
          TASK_BENCHMARK_MODE: "gate"
          TASK_BENCHMARK_MIN_PASS: "1.0"
        run: |
          python -m pytest tests/benchmarks/test_task_success.py -v --tb=short

      - name: Verify current-source benchmark evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/dev/benchmark_evidence.py --require-reports --source-sha "$SOURCE_SHA"

      # Evidence stays attached to the tested SHA. Committing reports to main
      # would change HEAD and also require bypassing protected-branch delivery.
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intent-benchmark-report
          path: |
            FHD/test_reports/intent_benchmark_latest.json
            FHD/test_reports/task_benchmark_report.json
            FHD/test_reports/task_benchmark_trial_*.jsonl
          if-no-files-found: error
