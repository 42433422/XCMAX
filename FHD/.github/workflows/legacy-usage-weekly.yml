name: Legacy usage weekly

on:
  schedule:
    # 每周一 00:45 UTC（08:45 北京时间）
    - cron: "45 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_COMMIT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Legacy usage report (168h)
        run: |
          mkdir -p metrics
          python scripts/dev/legacy_usage_report.py --since 168 --json > metrics/legacy-usage-168h.json 2>legacy-usage-168h.err || true
          echo "--- report ---"
          cat metrics/legacy-usage-168h.json
          echo "--- stderr ---"
          head -80 legacy-usage-168h.err

      - name: Open report PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CI_COMMIT_TOKEN is required to publish the legacy report on protected main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/legacy-usage-168h.json
          if git diff --staged --quiet; then
            echo "No legacy report changes"
            exit 0
          fi
          # 与 slo-metrics-collect 同一模式：受保护 main 不接受直推，改走 PR + auto-merge。
          branch="automation/legacy-usage-${GITHUB_RUN_ID}"
          title="chore(metrics): update legacy usage weekly report"
          git switch -c "$branch"
          git commit -m "$title"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "$title" \
            --body "Weekly legacy-usage snapshot generated by workflow run ${GITHUB_RUN_ID}. strategy_bets.py reads FHD/metrics/legacy-usage-168h.json as the legacy_ratio evidence.")"
          gh pr merge "$pr_url" --auto --squash --delete-branch

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: legacy-usage-168h
          path: FHD/metrics/legacy-usage-168h.json
