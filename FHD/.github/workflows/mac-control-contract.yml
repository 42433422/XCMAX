name: Control and tool runtime contract
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly 全量（每日 16:30 UTC = 北京 00:30）；日常 PR 仅在 runtime 相关改动时跑。
    - cron: "30 16 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Classify changed paths (unified classifier)
        id: c
        # 非 PR（push/schedule）时 base/head 为空 → 分类器 fail-open 返回 run=true。
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" "$PR_HEAD_SHA" || true
          fi
          python ../scripts/dev/change_classifier.py --category runtime_contract \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
  runtime-contract:
    needs: classify
    if: needs.classify.outputs.run != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-26.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime contract dependencies with the locked pytest
        shell: python
        run: |
          import os, re, subprocess, sys
          pin = subprocess.check_output([
              sys.executable,
              os.path.join(os.environ["GITHUB_WORKSPACE"], "FHD/scripts/dev/check_requirements_lock.py"),
              "--pytest-pin",
          ], text=True).strip()
          if not re.fullmatch(r"pytest==[0-9]+(?:\.[0-9]+){2}", pin):
              raise SystemExit("invalid locked pytest requirement")
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", "-r", "requirements-server-api.txt",
              "-e", ".[server-api]",
              pin, "pytest-asyncio", "psutil",
          ])
      - name: Verify isolated E2E service supervision on native POSIX runners
        if: matrix.os != 'windows-2022'
        run: python -m pytest --noconftest -o addopts= tests/test_ci/test_isolated_e2e_credentials.py -q -rP
      - name: Verify native process collection and reject incomplete desktop evidence
        run: python -m pytest --noconftest -o addopts= tests/release_gate/test_desktop_soak_runner.py tests/release_gate/test_desktop_soak_evidence.py -q -rP
      - run: python -m pytest --noconftest -o addopts= tests/test_application/test_tool_process.py -q -rP
        env:
          SECRET_KEY: isolated-process-contract-not-production
          DATABASE_URL: sqlite://
      - run: python -m pytest --noconftest -o addopts= tests/test_application/test_shipment_excel_etl_production_ready.py tests/test_application/test_shipment_etl_component_boundaries.py -k "etl_output_writer or etl_output_resolver or etl_input or batch_scan" -q -rP
        env:
          SECRET_KEY: isolated-elt-output-contract-not-production
          DATABASE_URL: sqlite://
      - run: node --test scripts/autonomy/runtime_tools/control_receipt_outbox.test.mjs scripts/autonomy/runtime_tools/control_git_handoff.test.mjs scripts/autonomy/runtime_tools/e2e_agent_runtime_policy.test.mjs scripts/autonomy/runtime_tools/pushed_branch_pr.test.mjs scripts/autonomy/runtime_tools/codex_model_gateway.test.mjs scripts/autonomy/runtime_tools/cli_output_stream.test.mjs scripts/autonomy/runtime_tools/para_codex_execution.test.mjs
      - name: Verify OpenCode host admission and native isolation
        if: matrix.os != 'windows-2022'
        env:
          PARA_TEST_OPENCODE_HOST: ${{ matrix.os == 'ubuntu-26.04' && 'unsupported' || 'supported' }}
        run: |
          if [[ "${RUNNER_OS}" == Linux && "$PARA_TEST_OPENCODE_HOST" == supported ]]; then
            # Exercise the real secret-free worker installer and native CLI on 22.04.
            DEVFLEET_FORCE_OPENCODE=1 PARA_PLATFORM_POOL=1 PARA_PLATFORM_GATEWAY_URL=https://example.invalid/v1 \
              bash scripts/autonomy/runtime_tools/prepare_github_executor.sh
            sandbox_root="$RUNNER_TEMP/para-worker"
          else
            if [[ "${RUNNER_OS}" == Linux ]]; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
            elif ! command -v rg >/dev/null; then
              brew install ripgrep
            fi
            sandbox_root="$RUNNER_TEMP/para-opencode-contract"
            npm install --prefix "$sandbox_root" --no-audit --no-fund "@anthropic-ai/sandbox-runtime@0.0.83"
          fi
          PARA_TEST_SANDBOX_ENTRY="$sandbox_root/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js" \
            node --test scripts/autonomy/runtime_tools/opencode_agent.test.mjs scripts/autonomy/runtime_tools/opencode_sandbox_controller.test.mjs scripts/autonomy/runtime_tools/report_only_target_branch.test.mjs
      - name: Install the existing business replay dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          python -m pip install -e "$GITHUB_WORKSPACE/packages/retort_engine" \
            -e "$GITHUB_WORKSPACE/packages/xcagi_common" \
            -e "$GITHUB_WORKSPACE/成都修茈科技有限公司/MODstore_deploy[governance]"
      - name: Verify private training with the real CLI and native sandbox
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p "$RUNNER_TEMP/promptfoo-contract"
          cp scripts/autonomy/runtime_tools/capability_trainer_deps/{package.json,package-lock.json} "$RUNNER_TEMP/promptfoo-contract/"
          bash scripts/ci/npm_ci_with_network_retry.sh --prefix "$RUNNER_TEMP/promptfoo-contract" --ignore-scripts --no-audit --no-fund
          PROMPTFOO_CLI="$RUNNER_TEMP/promptfoo-contract/node_modules/.bin/promptfoo" \
          PROMPTFOO_SANDBOX_ENTRY="$RUNNER_TEMP/para-worker/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js" \
          PROMPTFOO_PYTHON="$(command -v python)" PROMPTFOO_TEST_NATIVE_SANDBOX=1 \
            node --test --test-reporter=junit scripts/autonomy/runtime_tools/promptfoo_sandbox.test.mjs \
              > "$RUNNER_TEMP/native-trainer.xml"
      - name: Verify original business replay inside the native sandbox
        if: matrix.os == 'ubuntu-22.04'
        env:
          PROMPTFOO_SANDBOX_ENTRY: ${{ runner.temp }}/para-worker/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js
          PROMPTFOO_CLI: ${{ runner.temp }}/promptfoo-contract/node_modules/.bin/promptfoo
        run: |
          cd "$GITHUB_WORKSPACE/成都修茈科技有限公司/MODstore_deploy"
          python -m pytest -o addopts= tests/test_workflow_training_replay.py \
            tests/test_workflow_training_replay_capture.py tests/test_workflow_business_promptfoo.py \
            --junitxml="$RUNNER_TEMP/native-business-replay.xml" -q
      - name: Reject missing or skipped native business replay evidence
        if: ${{ always() && matrix.os == 'ubuntu-22.04' }}
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          reports = {"native-business-replay.xml": {
              'test_real_native_employee_and_independent_file_check[csv]',
              'test_real_native_employee_and_independent_file_check[excel]',
              'test_successful_native_run_with_wrong_cells_fails_business_assertion',
              'test_native_replay_cannot_read_host_oracle_write_outside_or_use_network[seal]',
              'test_native_replay_cannot_read_host_oracle_write_outside_or_use_network[cli]',
              'test_native_replay_without_sandbox_cannot_be_verified',
              'test_production_freezes_original_source_and_oracle_before_delivery',
              'test_running_delivery_reuses_its_original_optional_training_snapshot[delete]',
              'test_running_delivery_reuses_its_original_optional_training_snapshot[replace]',
              'test_running_delivery_reuses_its_original_optional_training_snapshot[disable_policy]',
              'test_frozen_training_snapshot_still_rejects_changed_business_input[ready]',
              'test_frozen_training_snapshot_still_rejects_changed_business_input[missing_reference]',
              'test_frozen_training_snapshot_still_rejects_changed_business_input[changed_reference]',
              'test_missing_training_snapshot_cannot_be_recaptured_during_delivery',
              'test_delivery_recheck_does_not_add_a_late_training_snapshot',
              'test_actual_promptfoo_excel_results_revalidate_and_seal_independent_holdout[direct]',
              'test_actual_promptfoo_excel_results_revalidate_and_seal_independent_holdout[deferred]',
              'test_timeout_reaps_worker_descendants',
          }, "native-trainer.xml": {
              'real promptfoo uses the approved model through the official SRT proxy',
              'real promptfoo uses the approved model inside native SRT',
          }}
          for report, required in reports.items():
              cases = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / report).iter("testcase"))
              if not required <= {case.get("name") for case in cases}:
                  raise SystemExit(f"mandatory native scenarios are missing from {report}")
              if any(case.find(tag) is not None for case in cases for tag in ("skipped", "failure", "error")):
                  raise SystemExit(f"{report} contains skips or failures")
              print(f"Verified {len(cases)} contracts in {report}; zero skipped")
      - uses: actions/checkout@v4
        if: matrix.os == 'ubuntu-26.04'
        with:
          repository: 42433422/devfleet
          ref: b2c99fd999016a673b0eadeadf1e3e3ae2d47f24
          path: para-test-deps
      - run: npm ci --prefix ../para-test-deps
        if: matrix.os == 'ubuntu-26.04'
      - run: node --test scripts/autonomy/runtime_tools/provision_para_control.test.mjs scripts/autonomy/runtime_tools/merge_worker.test.mjs
        if: matrix.os == 'ubuntu-26.04'
        env:
          PARA_TEST_PACKAGE_ROOT: ${{ github.workspace }}/para-test-deps
