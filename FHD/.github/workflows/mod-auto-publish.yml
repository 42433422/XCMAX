name: Mod Auto Publish

# Standard main host plus independently versioned, explicitly public Mods.
# Private customer artifacts use the owner-bound production-center channel.
on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "FHD/mods/**"
      - "FHD/XCAGI/mods/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character commit in main history with successful required checks"
        required: true
      mod_id:
        description: "One Mod id; blank discovers changes at source_sha"
        required: false
        default: ""

permissions:
  contents: read
  checks: read
  statuses: read

# A pending release for a different Mod must never be cancelled by this workflow.
defaults:
  run:
    working-directory: .

env:
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || inputs.source_sha }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve exact main sources, version bumps and successful checks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_MOD_ID: ${{ inputs.mod_id }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          matrix=$(python FHD/scripts/dev/mod_publish_plan.py \
            --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" \
            --mod-id "$REQUESTED_MOD_ID" --wait-seconds 1800 \
            --output FHD/test_reports/modstore_publish/source-plan.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-source-plan
          path: FHD/test_reports/modstore_publish/source-plan.json
          if-no-files-found: warn

  package-and-publish:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require signing configuration before building
        env:
          MODSTORE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.MODSTORE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          test -n "${MODSTORE_SIGNING_PRIVATE_KEY_PEM:-}" || {
            echo "::error::MODSTORE_SIGNING_PRIVATE_KEY_PEM is not configured; refusing unsigned publication."
            exit 1
          }
      - name: Detect runtime Mod frontend
        id: runtime
        env:
          MOD_SOURCE: ${{ matrix.source }}
        run: |
          required=$(python -c 'import json,os; print("true" if json.load(open(os.environ["MOD_SOURCE"]+"/manifest.json")).get("frontend", {}).get("runtime", {}).get("source") else "false")')
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.runtime.outputs.required == 'true'
        with:
          node-version: "24"
      - name: Compile runtime Mod frontend before signing
        if: steps.runtime.outputs.required == 'true'
        env:
          MOD_SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          npm ci --prefix FHD/frontend
          node FHD/scripts/dev/build-runtime-mod-frontend.mjs "$MOD_SOURCE"
      - name: Build exact source and publish an immutable reviewed version
        env:
          MODSTORE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.MODSTORE_SIGNING_PRIVATE_KEY_PEM }}
          MOD_SOURCE: ${{ matrix.source }}
          MOD_ID: ${{ matrix.id }}
          MOD_VERSION: ${{ matrix.version }}
          MODSTORE_AUTO_PUBLISH_TOKEN: ${{ secrets.MODSTORE_AUTO_PUBLISH_TOKEN }}
          MODSTORE_BASE_URL: ${{ vars.MODSTORE_BASE_URL || 'https://xiu-ci.com' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "${MODSTORE_SIGNING_PRIVATE_KEY_PEM:-}" || {
            echo "::error::MODSTORE_SIGNING_PRIVATE_KEY_PEM is not configured; no signed release can be published."
            exit 1
          }
          crypto_version=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("FHD/uv.lock", "rb"))["package"] if p["name"] == "cryptography"))')
          python -m pip install "cryptography==$crypto_version"
          key_path="${RUNNER_TEMP}/mod-signing-${GITHUB_RUN_ID}-${MOD_ID}.pem"
          trap 'rm -f "$key_path"' EXIT
          umask 077
          printf '%s' "$MODSTORE_SIGNING_PRIVATE_KEY_PEM" > "$key_path"
          unset MODSTORE_SIGNING_PRIVATE_KEY_PEM
          python FHD/scripts/build_mod.py --src "$MOD_SOURCE" --out FHD/dist/mod-publish \
            --sign --private-key "$key_path"
          artifact=$(python -c 'import json,os; print(json.load(open(os.environ["MOD_SOURCE"]+"/manifest.json")).get("artifact", "mod"))')
          suffix=xcmod
          if [ "$artifact" = employee_pack ]; then suffix=xcemp; fi
          package="FHD/dist/mod-publish/${MOD_ID}-${MOD_VERSION}.${suffix}"
          test -f "$package"
          python FHD/scripts/dev/publish_modstore.py "$package" \
            --base-url "$MODSTORE_BASE_URL" --token "$MODSTORE_AUTO_PUBLISH_TOKEN" \
            --source-repository "$GITHUB_REPOSITORY" --source-sha "$SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" --duty-roster FHD/config/duty_roster.json \
            --receipt "FHD/test_reports/modstore_publish/${MOD_ID}.receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-package-${{ matrix.id }}
          path: |
            FHD/dist/mod-publish/*
            FHD/test_reports/modstore_publish/*.receipt.json
          if-no-files-found: error
