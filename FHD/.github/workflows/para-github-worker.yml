name: Para GitHub Worker
run-name: para-workspace-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "管理端派工回执标识"
        required: true

permissions:
  contents: read

# A dedicated Para device token may have only one connected worker at a time.
concurrency:
  group: para-github-worker
  cancel-in-progress: false

jobs:
  employee-workspace:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # The agent program comes from trusted main, never the candidate artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare existing Para executor
        env:
          PARA_CODEX_VERSION: ${{ vars.PARA_CODEX_VERSION }}
          PARA_CODEX_AUTH_JSON: ${{ secrets.PARA_CODEX_AUTH_JSON }}
          PARA_CODEX_CONFIG_TOML: ${{ secrets.PARA_CODEX_CONFIG_TOML }}
          PARA_CODEX_API_KEY: ${{ secrets.PARA_CODEX_API_KEY }}
        run: bash scripts/autonomy/runtime_tools/prepare_github_executor.sh
      - name: Run original Para tasks without publication credentials
        env:
          PARA_GITHUB_STAGE: execute
          PARA_GITHUB_REQUEST_ID: ${{ inputs.request_id }}
          PARA_GITHUB_CANDIDATE_DIR: ${{ runner.temp }}/para-candidate
          PARA_GITHUB_EVIDENCE_DIR: ${{ runner.temp }}/para-evidence
          DEVFLEET_API_URL: ${{ vars.PARA_GITHUB_API_URL }}
          DEVFLEET_DEVICE_TOKEN: ${{ secrets.PARA_GITHUB_DEVICE_TOKEN }}
          DEVFLEET_CODEX_AGENT: ${{ runner.temp }}/para-worker/node_modules/.bin/codex
          DEVFLEET_WORKSPACE_ROOT: ${{ runner.temp }}/para-workspaces
          XCMAX_CONTROL_REPORTS_ENABLED: "1"
          DEVFLEET_CODEX_MODEL_CANDIDATES: ${{ vars.PARA_CODEX_MODEL_CANDIDATES }}
          CODEX_API_KEY: ${{ secrets.PARA_CODEX_API_KEY }}
          MODSTORE_PARA_DISPATCH_TOKEN: ${{ secrets.MODSTORE_PARA_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }} # job permissions are contents:read only
        run: node "$RUNNER_TEMP/para-worker/github_para_executor.mjs"
      - name: Hand off immutable candidate data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: para-candidate-${{ inputs.request_id }}
          path: |
            ${{ runner.temp }}/para-candidate/manifest.json
            ${{ runner.temp }}/para-candidate/candidate.bundle
          if-no-files-found: error
          retention-days: 7
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: para-execution-${{ inputs.request_id }}
          path: ${{ runner.temp }}/para-evidence/execution.json
          if-no-files-found: warn

  publish-candidate:
    needs: employee-workspace
    outputs:
      original_pr: ${{ steps.publish.outputs.original_pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      # A fresh VM contains no model process, candidate checkout, config or hooks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate original dispatch and publish inert Git objects
        id: publish
        env:
          PARA_GITHUB_REQUEST_ID: ${{ inputs.request_id }}
          MODSTORE_PARA_DISPATCH_TOKEN: ${{ secrets.MODSTORE_PARA_DISPATCH_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/FHD
          # This existing credential allows ordinary PR CI to start automatically.
          GH_TOKEN: ${{ secrets.CI_COMMIT_TOKEN }}
        run: python scripts/autonomy/publish_para_candidate.py
      - name: Retain publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: para-publication-${{ inputs.request_id }}
          path: ${{ runner.temp }}/para-publication.json
          if-no-files-found: warn

  resume-verification:
    needs: publish-candidate
    if: needs.publish-candidate.outputs.original_pr != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # The agent program comes from trusted main, never the candidate artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare existing Para executor
        env:
          PARA_CODEX_VERSION: ${{ vars.PARA_CODEX_VERSION }}
          PARA_CODEX_AUTH_JSON: ${{ secrets.PARA_CODEX_AUTH_JSON }}
          PARA_CODEX_CONFIG_TOML: ${{ secrets.PARA_CODEX_CONFIG_TOML }}
          PARA_CODEX_API_KEY: ${{ secrets.PARA_CODEX_API_KEY }}
        run: bash scripts/autonomy/runtime_tools/prepare_github_executor.sh
      - name: Run original Para tasks without publication credentials
        env:
          PARA_GITHUB_STAGE: resume
          PARA_GITHUB_REQUEST_ID: ${{ inputs.request_id }}
          PARA_GITHUB_CANDIDATE_DIR: ${{ runner.temp }}/para-candidate
          PARA_GITHUB_EVIDENCE_DIR: ${{ runner.temp }}/para-evidence
          DEVFLEET_API_URL: ${{ vars.PARA_GITHUB_API_URL }}
          DEVFLEET_DEVICE_TOKEN: ${{ secrets.PARA_GITHUB_DEVICE_TOKEN }}
          DEVFLEET_CODEX_AGENT: ${{ runner.temp }}/para-worker/node_modules/.bin/codex
          DEVFLEET_WORKSPACE_ROOT: ${{ runner.temp }}/para-workspaces
          XCMAX_CONTROL_REPORTS_ENABLED: "1"
          DEVFLEET_CODEX_MODEL_CANDIDATES: ${{ vars.PARA_CODEX_MODEL_CANDIDATES }}
          CODEX_API_KEY: ${{ secrets.PARA_CODEX_API_KEY }}
          MODSTORE_PARA_DISPATCH_TOKEN: ${{ secrets.MODSTORE_PARA_DISPATCH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }} # job permissions are contents:read only
        run: node "$RUNNER_TEMP/para-worker/github_para_executor.mjs"
      - name: Retain original team receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: para-verification-${{ inputs.request_id }}
          path: ${{ runner.temp }}/para-evidence/execution.json
          if-no-files-found: warn

  independent-verification:
    needs: resume-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: verifier
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read approved verification protocol
        id: protocol
        working-directory: verifier
        env:
          PARA_GITHUB_REQUEST_ID: ${{ inputs.request_id }}
          MODSTORE_PARA_DISPATCH_TOKEN: ${{ secrets.MODSTORE_PARA_DISPATCH_TOKEN }}
        run: |
          python -m pip install ./packages/retort_engine 'jsonschema>=4.23,<5'
          python FHD/scripts/autonomy/prepare_retort_verification.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.protocol.outputs.retort == 'true'
        with:
          ref: ${{ github.sha }}
          path: before
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.protocol.outputs.retort == 'true'
        with:
          ref: ${{ steps.protocol.outputs.target_sha }}
          path: after
          persist-credentials: false
      - name: Compare exact commits in isolated test containers
        if: steps.protocol.outputs.retort == 'true'
        working-directory: verifier
        env:
          RETORT_IMAGE: ${{ steps.protocol.outputs.image }}
          RETORT_TARGET_SHA: ${{ steps.protocol.outputs.target_sha }}
        run: |
          docker pull "$RETORT_IMAGE"
          python -m retort_engine.evolution_evidence \
            --protocol "$RUNNER_TEMP/retort-protocol.json" \
            --before "$GITHUB_WORKSPACE/before" --after "$GITHUB_WORKSPACE/after" \
            --output "$RUNNER_TEMP/retort-verification" \
            --run-id "$GITHUB_RUN_ID" --target-sha "$RETORT_TARGET_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.protocol.outputs.retort == 'true'
        with:
          name: retort-verification-${{ inputs.request_id }}
          path: ${{ runner.temp }}/retort-verification/
          if-no-files-found: error
          retention-days: 90
