name: Production observability configuration

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact release SHA whose production SLO targets are being installed
        required: true
        type: string
      alert_drill:
        description: Run the controlled alert drill (inject -> fire -> notify -> resolve) after install
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: xcagi-production-observability
  cancel-in-progress: false

jobs:
  install-and-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Lock observability source to the release SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
          printf '%s' "${{ inputs.release_sha }}" | grep -Eq '^[0-9a-f]{40}$'
      - name: Install, validate, and read back production targets
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
          FHD_PUSH_SSH_KEY_RAW: ${{ secrets.FHD_PUSH_SSH_KEY }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "${FHD_PUSH_HOST:-}"
          test -n "${FHD_PUSH_SSH_KEY_RAW:-}"
          test -n "${OPS_ALERT_WEBHOOK_URL:-}" || {
            echo "::error::OPS_ALERT_WEBHOOK_URL secret (ops channel accepting Alertmanager webhooks) is required."
            exit 1
          }
          key="${RUNNER_TEMP}/production-observability-key"
          remote_dir="/tmp/xcmax-production-observability-${GITHUB_RUN_ID}"
          printf '%s\n' "$FHD_PUSH_SSH_KEY_RAW" > "$key"
          chmod 600 "$key"
          ssh_opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          remote="${FHD_PUSH_USER:-root}@${FHD_PUSH_HOST}"
          ssh "${ssh_opts[@]}" "$remote" "install -d -m 700 '${remote_dir}'"
          scp "${ssh_opts[@]}" \
            ops/monitoring/prometheus.production.yml \
            ops/monitoring/production-alerts.yml \
            ops/monitoring/alertmanager.production.yml \
            scripts/observability/ensure_production_prometheus.sh \
            scripts/observability/install_production_prometheus_config.sh \
            scripts/observability/run_alert_drill.sh \
            "${remote}:${remote_dir}/"
          printf '%s' "$OPS_ALERT_WEBHOOK_URL" | ssh "${ssh_opts[@]}" "$remote" \
            "IFS= read -r OPS_ALERT_WEBHOOK_URL || true; export OPS_ALERT_WEBHOOK_URL; bash '${remote_dir}/install_production_prometheus_config.sh' '${remote_dir}' '${RELEASE_SHA}'" \
            | tee "${RUNNER_TEMP}/production-observability-readback.log"
      - name: Controlled alert drill
        if: inputs.alert_drill
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "${RUNNER_TEMP}/production-observability-key" -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 "${FHD_PUSH_USER:-root}@${FHD_PUSH_HOST}" \
            "bash '/tmp/xcmax-production-observability-${GITHUB_RUN_ID}/run_alert_drill.sh' 'run-${GITHUB_RUN_ID}'" \
            | tee "${RUNNER_TEMP}/alert-drill-timeline.json"
      - name: Remove only this run's remote temporary files
        if: always()
        env:
          FHD_PUSH_HOST: ${{ secrets.FHD_PUSH_HOST }}
          FHD_PUSH_USER: ${{ secrets.FHD_PUSH_USER }}
        run: |
          set -u
          key="${RUNNER_TEMP}/production-observability-key"
          remote_dir="/tmp/xcmax-production-observability-${GITHUB_RUN_ID}"
          if [ -n "${FHD_PUSH_HOST:-}" ] && [ -s "$key" ]; then
            ssh -i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "${FHD_PUSH_USER:-root}@${FHD_PUSH_HOST}" \
              "cd '${remote_dir}' 2>/dev/null && rm -f prometheus.production.yml production-alerts.yml alertmanager.production.yml ensure_production_prometheus.sh install_production_prometheus_config.sh run_alert_drill.sh; rmdir '${remote_dir}' 2>/dev/null || true" \
              || true
          fi
      - name: Upload target readback and rollback pointer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-production-observability-readback
          path: |
            ${{ runner.temp }}/production-observability-readback.log
            ${{ runner.temp }}/alert-drill-timeline.json
          retention-days: 120
          if-no-files-found: error
