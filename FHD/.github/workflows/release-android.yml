# CI SSOT: edit this file, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Enterprise Mobile

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (manual dispatch only)
        required: false
        type: string
        default: "10.0.0"
      harmony_artifact:
        description: Optional enterprise HarmonyOS .hap/.hsp path. Empty publishes an Android-only package.
        required: false
        type: string
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml (gated on
  # verify-version-anchors, then dispatches this workflow) — avoids the double-run.

permissions:
  contents: write

concurrency:
  group: fhd-release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve release version
        id: release_version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "${raw}" == "main" || "${raw}" == "master" || "${raw}" == "feature"* || -z "${raw}" ]]; then
            raw="10.0.0"
          fi
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          if [[ -z "${raw}" ]]; then
            raw="10.0.0"
          fi
          echo "version=${raw}" >> "${GITHUB_OUTPUT}"
      - name: Flutter pub get + test
        run: |
          flutter pub get
          flutter test
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} 未配置；正式移动版禁止回退到 debug 签名"
              exit 1
            fi
          done
          mkdir -p android/signing
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/signing/xcagi-release.jks
          chmod 600 android/signing/xcagi-release.jks
          echo "configured=true" >> "${GITHUB_OUTPUT}"
      - name: Verify release signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/signing/xcagi-release.jks \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" >/dev/null
          echo "Android release keystore: OK"
      - name: Flutter build apk (release)
        id: assemble
        env:
          XCAGI_ANDROID_KEYSTORE: signing/xcagi-release.jks
          XCAGI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XCAGI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XCAGI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          XCAGI_REQUIRE_RELEASE_SIGNING: "1"
        run: |
          VCODE=$(date +%s)
          echo "android_version_code=$VCODE" >> "$GITHUB_OUTPUT"
          flutter build apk --release \
            --build-number="$VCODE" \
            --build-name="${{ steps.release_version.outputs.version }}"
          {
            echo "### 📱 Flutter Android versionCode = \`$VCODE\`"
            echo ""
            echo "部署时**必须**把服务器 \`.env\` 设为同一个数:"
            echo '```'
            echo "XCAGI_ANDROID_LATEST_VERSION_CODE=$VCODE"
            echo "XCAGI_ANDROID_MIN_VERSION_CODE=10"
            echo "XCAGI_ANDROID_LATEST_VERSION_NAME=${{ steps.release_version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage mobile package distribution
        working-directory: ${{ github.workspace }}
        run: |
          args=(
            --version "${{ steps.release_version.outputs.version }}"
            --android-version "${{ steps.release_version.outputs.version }}"
            --apk-path "${{ github.workspace }}/FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/app-release.apk"
          )
          harmony_artifact="${{ github.event.inputs.harmony_artifact || '' }}"
          if [[ -n "${harmony_artifact}" ]]; then
            args+=(--harmony-artifact "${harmony_artifact}")
          else
            args+=(--allow-missing-harmony)
          fi
          bash FHD/mobile-harmony/scripts/stage-release-packages.sh "${args[@]}"
      - name: Upload mobile package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-packages
          path: |
            FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/*.apk
            release/packages-v${{ steps.release_version.outputs.version }}/enterprise/
            release/packages-v${{ steps.release_version.outputs.version }}/企业版/
            release/XCAGI-Enterprise-Mobile-Packages-v${{ steps.release_version.outputs.version }}.zip
          if-no-files-found: error

  publish-release:
    needs: assemble-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-packages
          path: artifacts
      - name: Upload mobile packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          overwrite_files: true
          append_body: true
