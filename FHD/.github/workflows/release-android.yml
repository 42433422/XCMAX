# CI SSOT: edit this file, then run: python scripts/dev/publish_ci_workflows_to_root.py
name: Release Enterprise Mobile

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (manual dispatch only)
        required: false
        type: string
        default: "1.0.0.0"
      harmony_artifact:
        description: Enterprise HarmonyOS .hap/.hsp path. If empty, scan mobile-harmony/artifacts then mobile-harmony; packaging fails if none is found.
        required: false
        type: string
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml (gated on
  # verify-version-anchors, then dispatches this workflow) — avoids the double-run.

permissions:
  contents: write

concurrency:
  group: fhd-release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve release version
        id: release_version
        run: |
          raw="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "${raw}" == "main" || "${raw}" == "master" || "${raw}" == "feature"* || -z "${raw}" ]]; then
            raw="1.0.0.0"
          fi
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          if [[ -z "${raw}" ]]; then
            raw="1.0.0.0"
          fi
          echo "version=${raw}" >> "${GITHUB_OUTPUT}"
          echo "toolchain_version=$(printf '%s' "${raw}" | cut -d. -f1-3)" >> "${GITHUB_OUTPUT}"
      - name: Flutter pub get + test
        run: |
          flutter pub get
          flutter test
      - name: Configure release signing (optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置；Flutter release 当前使用 debug 签名（仅测试分发）"
          else
            mkdir -p android/app
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/xcagi-release.jks
            chmod 600 android/app/xcagi-release.jks
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Flutter build apk (release)
        id: assemble
        env:
          XCAGI_ANDROID_VERSION_NAME: ${{ steps.release_version.outputs.version }}
        run: |
          VCODE=$(date +%s)
          echo "android_version_code=$VCODE" >> "$GITHUB_OUTPUT"
          flutter build apk --release \
            --build-number="$VCODE" \
            --build-name="${{ steps.release_version.outputs.toolchain_version }}"
          {
            echo "### 📱 Flutter Android versionCode = \`$VCODE\`"
            echo ""
            echo "部署时**必须**把服务器 \`.env\` 设为同一个数:"
            echo '```'
            echo "XCAGI_ANDROID_LATEST_VERSION_CODE=$VCODE"
            echo "XCAGI_ANDROID_MIN_VERSION_CODE=10"
            echo "XCAGI_ANDROID_LATEST_VERSION_NAME=${{ steps.release_version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage mobile package distribution
        working-directory: ${{ github.workspace }}
        run: |
          bash FHD/mobile-harmony/scripts/stage-release-packages.sh \
            --version "${{ steps.release_version.outputs.version }}" \
            --android-version "${{ steps.release_version.outputs.version }}" \
            --apk-path "${{ github.workspace }}/FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/app-release.apk" \
            --harmony-artifact "${{ github.event.inputs.harmony_artifact || '' }}"
      - name: Upload mobile package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-packages
          path: |
            FHD/mobile-flutter-poc/build/app/outputs/flutter-apk/*.apk
            release/packages-v${{ steps.release_version.outputs.version }}/enterprise/
            release/packages-v${{ steps.release_version.outputs.version }}/企业版/
            release/XCAGI-Enterprise-Mobile-Packages-v${{ steps.release_version.outputs.version }}.zip
          if-no-files-found: error

  publish-release:
    needs: assemble-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-enterprise-mobile-release-packages
          path: artifacts
      - name: Upload mobile packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          overwrite_files: true
          append_body: true
