name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "10.0.0"
      publish:
        description: "Publish verified artifacts to the production download server"
        required: true
        type: boolean
        default: false
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml, which gates on
  # verify-version-anchors and then dispatches this workflow. Removing the direct tag
  # trigger here eliminates the double-run on tag push.

permissions:
  contents: write

defaults:
  run:
    working-directory: FHD

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Windows Authenticode certificate (PFX path/URL/base64 accepted by
      # electron-builder). Never reuse the macOS Developer ID CSC_LINK.
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        sku: [personal, enterprise]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            FHD/frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows ${{ matrix.sku }} installer
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            Write-Error "::error::WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD are required for a production desktop release."
            exit 1
          }
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $raw = $raw -replace '^FHD/', ''
          $v = $raw.TrimStart('v','V')
          scripts/package/build-installer.ps1 -Version $v -ProductSku ${{ matrix.sku }} -SkipUiInstaller
      - name: Verify Windows ${{ matrix.sku }} installer
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $raw = $raw -replace '^FHD/', ''
          $v = $raw.TrimStart('v','V')
          scripts/package/pre-release-security.ps1 -Phase post -Version $v -ProductSku ${{ matrix.sku }}
      - name: Require valid Windows Authenticode signature (${{ matrix.sku }})
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $raw = $raw -replace '^FHD/', ''
          $v = $raw.TrimStart('v','V')
          $label = if ("${{ matrix.sku }}" -eq "enterprise") { "Enterprise" } else { "Personal" }
          $setup = Get-ChildItem "release/xcagi-v$v/${{ matrix.sku }}" -Filter "XCAGI-$label-Setup-$v-x64.exe" -File | Select-Object -First 1
          if (-not $setup) {
            Write-Error "::error::Windows installer missing before Authenticode verification."
            exit 1
          }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            Write-Error "::error::Invalid or missing Authenticode signature: $($signature.Status)"
            exit 1
          }
          Write-Host "Authenticode valid: $($signature.SignerCertificate.Subject)"
      - name: Assert critical resources packaged (${{ matrix.sku }})
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $raw = $raw -replace '^FHD/', ''
          $v = $raw.TrimStart('v','V')
          $sku = "${{ matrix.sku }}"
          $dir = "release/xcagi-v$v/$sku/win-unpacked/resources"
          foreach ($p in @(
            "backend/xcagi-backend.exe",
            "product-sku.json",
            "backend/_internal/mods"
          )) {
            if (-not (Test-Path "$dir/$p")) {
              Write-Error "::error::Missing critical resource for ${sku}: $p (expected at $dir/$p)"
              exit 1
            }
            Write-Host "OK $sku resource: $p"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-desktop-windows-${{ matrix.sku }}
          path: |
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.exe
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.exe.blockmap
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.zip
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.zip.blockmap
            FHD/release/xcagi-v*/${{ matrix.sku }}/latest*.yml

  macos:
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        sku: [personal, enterprise]
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      # Prefer ASC API key notarization. Do NOT set APPLE_ID here without
      # APPLE_APP_SPECIFIC_PASSWORD — electron-builder will fail mid-sign.
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.IOS_TEAM_ID }}
      XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "npm"
          cache-dependency-path: |
            FHD/frontend/package-lock.json
            FHD/desktop/package-lock.json
      - name: Import Developer ID certificate (CSC_LINK p12)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package/import_mac_developer_id_p12.sh
          scripts/package/import_mac_developer_id_p12.sh
      - name: Build macOS ${{ matrix.sku }} installer
        shell: bash
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_NAME:-}" ]; then
            CSC_NAME="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | sed -n 's/.*"\(.*\)"/\1/p' || true)"
          fi
          # electron-builder rejects names that still include the certificate type prefix
          CSC_NAME="${CSC_NAME#Developer ID Application: }"
          CSC_NAME="${CSC_NAME#Developer ID Application:}"
          if [ -z "${CSC_NAME}" ]; then
            echo "::error::Developer ID Application certificate missing after CSC_LINK import"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          export CSC_NAME
          echo "Using CSC_NAME=${CSC_NAME}"
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#FHD/}"
          v="${v#v}"
          v="${v#V}"
          PYTHON=python3 scripts/package/build-installer.sh "$v" ${{ matrix.sku }}
      - name: Verify macOS codesign (${{ matrix.sku }})
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#FHD/}"
          v="${v#v}"
          v="${v#V}"
          sku="${{ matrix.sku }}"
          dmg="$(find "release/xcagi-v${v}/${sku}" -name '*.dmg' -print -quit)"
          test -n "${dmg}"
          echo "Verifying ${dmg}"
          codesign -dv --verbose=4 "${dmg}" 2>&1 | tee /tmp/codesign.txt
          if grep -q 'Signature=adhoc' /tmp/codesign.txt; then
            echo "::error::DMG is still adhoc-signed"
            exit 1
          fi
          hdiutil attach -nobrowse -quiet "${dmg}"
          app="$(find /Volumes -maxdepth 2 -name 'XCAGI.app' -print -quit)"
          test -n "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          spctl -a -vv --type install "${app}" || echo "::warning::spctl assess may require stapled notarization ticket"
          hdiutil detach "$(dirname "${app}")" -quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-desktop-macos-${{ matrix.sku }}
          path: |
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.dmg
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.dmg.blockmap
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.zip
            FHD/release/xcagi-v*/${{ matrix.sku }}/*.zip.blockmap
            FHD/release/xcagi-v*/${{ matrix.sku }}/latest*.yml

  generate-manifest:
    needs: [windows, macos]
    # Never publish a partial desktop release. The old eager Windows deploy could
    # replace installers hours before the all-platform manifest was generated.
    if: always() && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: xcagi-desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sign all update metadata (Ed25519)
        env:
          XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${XCAGI_UPDATE_ED25519_PRIVATE_KEY:-}" ]; then
            echo "::error::XCAGI_UPDATE_ED25519_PRIVATE_KEY is required for release metadata signing."
            exit 1
          fi
          pip install --quiet cryptography
          count=0
          while IFS= read -r -d '' f; do
            echo "Signing: $f"
            python "${GITHUB_WORKSPACE}/FHD/scripts/dev/sign_update_metadata.py" "$f"
            count=$((count + 1))
          done < <(find "${RUNNER_TEMP}/artifacts" -name 'latest*.yml' -type f -print0)
          if [ "$count" -lt 4 ]; then
            echo "::error::Expected signed update metadata for personal/enterprise on Windows/macOS; found $count files."
            exit 1
          fi
      - name: Reconstruct release directory from artifacts
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.version || github.ref_name }}"
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          version="${raw:-10.0.0}"
          mkdir -p "release/xcagi-v${version}"
          BASE="${RUNNER_TEMP}/artifacts"
          for sku in personal enterprise; do
            src_dir="$(find "$BASE" -type d -path "*/xcagi-v${version}/$sku" -print -quit || true)"
            if [ -z "$src_dir" ]; then src_dir="$BASE"; fi
            if [ -d "$src_dir" ]; then
              mkdir -p "release/xcagi-v${version}/$sku"
              cp -v "$src_dir"/*.exe "$src_dir"/*.exe.blockmap "$src_dir"/*.dmg "$src_dir"/*.dmg.blockmap "$src_dir"/latest*.yml "release/xcagi-v${version}/$sku/" 2>/dev/null || true
            fi
          done
          ls -la "release/xcagi-v${version}"/personal "release/xcagi-v${version}"/enterprise 2>/dev/null || true
      - name: Generate manifest.json + download-release.json
        working-directory: FHD
        run: |
          set -euo pipefail
          raw="${{ github.event.inputs.version || github.ref_name }}"
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          version="${raw:-10.0.0}"
          python scripts/package/generate-download-manifest.py \
            --version "$version" \
            --release-dir release \
            --release-subdir "xcagi-v${version}" \
            --git-sha "${{ github.sha }}" \
            --output "${RUNNER_TEMP}/manifest.json" \
            --download-release-output "${RUNNER_TEMP}/download-release.json"
      - name: Upload manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-download-manifest
          path: |
            ${{ runner.temp }}/manifest.json
            ${{ runner.temp }}/download-release.json
      - name: Publish installers first, then manifests atomically
        if: ${{ inputs.publish }}
        timeout-minutes: 30
        working-directory: .
        env:
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_SSH_KEY:-}" ]; then
            echo "::error::SERVER_SSH_KEY or FHD_PUSH_SSH_KEY is required to publish a desktop release."
            exit 1
          fi
          HOST="${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${DESKTOP_SSH_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$HOME/.ssh/id_ci" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          raw="${{ github.event.inputs.version || github.ref_name }}"
          raw="${raw#FHD/}"; raw="${raw#v}"; raw="${raw#V}"
          version="${raw:-10.0.0}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $version"
            exit 1
          fi
          # Publish payloads to both URL trees before changing any manifest. rsync
          # --delay-updates keeps each SKU's visible transition as small as possible.
          for sku in personal enterprise; do
            src_dir="$(find "${RUNNER_TEMP}/artifacts" -type d -path "*/xcagi-v${version}/$sku" -print -quit || true)"
            if [ ! -d "$src_dir" ]; then
              echo "::error::Missing reconstructed artifact directory for $sku"
              exit 1
            fi
            if ! find "$src_dir" -maxdepth 1 -type f -name '*.exe' -print -quit | grep -q . || \
               ! find "$src_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit | grep -q .; then
              echo "::error::Incomplete $sku payload: both Windows EXE and macOS DMG are required."
              exit 1
            fi
            for dest in "/var/www/update/releases/stable/$sku" "/var/www/xcagi-v${version}/$sku"; do
              ssh "${SSH_OPTS[@]}" "root@${HOST}" "mkdir -p '$dest'"
              rsync -avz --timeout=120 \
                --delay-updates \
                --include='*/' \
                --include='*.exe' \
                --include='*.exe.blockmap' \
                --include='*.dmg' \
                --include='*.dmg.blockmap' \
                --include='latest*.yml' \
                --exclude='*' \
                -e "ssh ${SSH_OPTS[*]}" "$src_dir/" "root@${HOST}:$dest/"
            done
          done
          # Manifests are the commit point: upload to unique temporary names and
          # rename only after every installer and platform metadata file is present.
          run_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for root in "/var/www/update/releases/stable" "/var/www/xcagi-v${version}"; do
            scp "${SSH_OPTS[@]}" "${RUNNER_TEMP}/manifest.json" "root@${HOST}:$root/.manifest.json.$run_key"
            ssh "${SSH_OPTS[@]}" "root@${HOST}" "mv '$root/.manifest.json.$run_key' '$root/manifest.json'"
          done
          scp "${SSH_OPTS[@]}" "${RUNNER_TEMP}/download-release.json" "root@${HOST}:/var/www/xcagi-v${version}/.download-release.json.$run_key"
          ssh "${SSH_OPTS[@]}" "root@${HOST}" "mv '/var/www/xcagi-v${version}/.download-release.json.$run_key' '/var/www/xcagi-v${version}/download-release.json'"
          echo "Installers and manifests published consistently to both download paths"

  verify-download:
    needs: [generate-manifest]
    if: always() && needs.generate-manifest.result == 'success' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-download-manifest
          path: ${{ runner.temp }}/manifest
      - name: Verify download URLs (HTTP 200 + SHA256 + size)
        run: |
          set -euo pipefail
          bash scripts/deploy/verify-download.sh "${RUNNER_TEMP}/manifest/manifest.json"

  github-release:
    needs: [windows, macos, verify-download]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && needs.verify-download.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.blockmap
            artifacts/**/*.dmg
            artifacts/**/*.dmg.blockmap
            artifacts/**/*.zip
            artifacts/**/*.zip.blockmap
            artifacts/**/latest*.yml
            artifacts/**/manifest.json
            artifacts/**/download-release.json
