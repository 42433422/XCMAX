name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "10.0.0"
  # Tag (FHD/v*) entry is centralized in fhd-release-orchestrator.yml, which gates on
  # verify-version-anchors and then dispatches this workflow. Removing the direct tag
  # trigger here eliminates the double-run on tag push.

permissions:
  contents: write

defaults:
  run:
    working-directory: FHD

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            FHD/frontend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows enterprise installer
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $raw = $raw -replace '^FHD/', ''
          $v = $raw.TrimStart('v','V')
          scripts/package/build-installer.ps1 -Version $v -ProductSku enterprise -SkipUiInstaller
      - name: Verify Windows enterprise installer
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version || github.ref_name }}"
          $raw = $raw -replace '^FHD/', ''
          $v = $raw.TrimStart('v','V')
          scripts/package/pre-release-security.ps1 -Phase post -Version $v -ProductSku enterprise
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-desktop-windows
          path: |
            FHD/release/xcagi-v*/enterprise/*.exe
            FHD/release/xcagi-v*/enterprise/*.exe.blockmap
            FHD/release/xcagi-v*/enterprise/*.zip
            FHD/release/xcagi-v*/enterprise/*.zip.blockmap
            FHD/release/xcagi-v*/enterprise/latest*.yml

  deploy-windows:
    needs: [windows]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-desktop-windows
          path: ${{ runner.temp }}/artifacts
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            FHD/scripts/dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cryptography
        run: pip install --quiet cryptography
      - name: Sign update metadata (Ed25519)
        env:
          XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${XCAGI_UPDATE_ED25519_PRIVATE_KEY:-}" ]; then
            echo "::error::XCAGI_UPDATE_ED25519_PRIVATE_KEY is required for release metadata signing."
            exit 1
          fi
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          find "$ARTIFACTS_DIR" -name 'latest*.yml' -type f -print0 | while IFS= read -r -d '' f; do
            echo "Signing: $f"
            python "${GITHUB_WORKSPACE}/FHD/scripts/dev/sign_update_metadata.py" "$f"
          done
      - name: Upload installers to update server
        timeout-minutes: 30
        working-directory: .
        env:
          # Unified desktop-upload key: SERVER_SSH_KEY (preferred) with FHD_PUSH_SSH_KEY
          # fallback so a single SSH secret covers both desktop + CVM tarball pushes.
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_SSH_KEY:-}" ]; then
            echo "::notice::No SERVER_SSH_KEY / FHD_PUSH_SSH_KEY secret — skipping desktop upload."
            exit 0
          fi
          HOST="${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${DESKTOP_SSH_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$HOME/.ssh/id_ci" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          BASE="${RUNNER_TEMP}/artifacts"
          raw="${{ github.event.inputs.version || github.ref_name }}"
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          version="${raw:-10.0.0}"
          for sku in enterprise; do
            dir="$(find "$BASE" -type d -path "*/xcagi-v${version}/$sku" -print -quit)"
            if [ ! -d "$dir" ]; then dir="${BASE}/$sku"; fi
            if [ ! -d "$dir" ]; then echo "[skip] no $sku dir"; continue; fi
            dest="/var/www/update/releases/stable/$sku"
            timeout 1800 rsync -avz --timeout=120 \
              --include='*/' \
              --include='*.exe' \
              --include='*.exe.blockmap' \
              --include='*.dmg' \
              --include='*.dmg.blockmap' \
              --include='latest*.yml' \
              --exclude='*' \
              -e "ssh ${SSH_OPTS[*]}" "$dir/" "root@${HOST}:$dest/"
          done

  macos:
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            FHD/frontend/package-lock.json
            FHD/desktop/package-lock.json
      - name: Install macOS signing dependencies
        run: pip install PyJWT requests cryptography
      - name: Provision Developer ID certificate
        run: python scripts/package/provision_mac_developer_id.py
      - name: Build macOS enterprise installer
        shell: bash
        run: |
          set -euo pipefail
          CSC_NAME="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | sed -n 's/.*"\(.*\)"/\1/p' || true)"
          if [ -z "${CSC_NAME}" ]; then
            echo "::error::Developer ID Application certificate missing after provision step"
            security find-identity -v -p codesigning || true
            exit 1
          fi
          export CSC_NAME
          echo "Using CSC_NAME=${CSC_NAME}"
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#FHD/}"
          v="${v#v}"
          v="${v#V}"
          PYTHON=python3 scripts/package/build-installer.sh "$v" enterprise
      - name: Verify macOS codesign
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version || github.ref_name }}"
          v="${v#FHD/}"
          v="${v#v}"
          v="${v#V}"
          dmg="$(find "release/xcagi-v${v}/enterprise" -name '*.dmg' -print -quit)"
          test -n "${dmg}"
          echo "Verifying ${dmg}"
          codesign -dv --verbose=4 "${dmg}" 2>&1 | tee /tmp/codesign.txt
          if grep -q 'Signature=adhoc' /tmp/codesign.txt; then
            echo "::error::DMG is still adhoc-signed"
            exit 1
          fi
          hdiutil attach -nobrowse -quiet "${dmg}"
          app="$(find /Volumes -maxdepth 2 -name 'XCAGI.app' -print -quit)"
          test -n "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          spctl -a -vv --type install "${app}" || echo "::warning::spctl assess may require stapled notarization ticket"
          hdiutil detach "$(dirname "${app}")" -quiet || true
      - uses: actions/upload-artifact@v4
        with:
          name: xcagi-desktop-macos
          path: |
            FHD/release/xcagi-v*/enterprise/*.dmg
            FHD/release/xcagi-v*/enterprise/*.dmg.blockmap
            FHD/release/xcagi-v*/enterprise/*.zip
            FHD/release/xcagi-v*/enterprise/*.zip.blockmap
            FHD/release/xcagi-v*/enterprise/latest*.yml

  deploy-macos:
    needs: [macos]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcagi-desktop-macos
          path: ${{ runner.temp }}/artifacts
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            FHD/scripts/dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cryptography
        run: pip install --quiet cryptography
      - name: Sign update metadata (Ed25519)
        env:
          XCAGI_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.XCAGI_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${XCAGI_UPDATE_ED25519_PRIVATE_KEY:-}" ]; then
            echo "::error::XCAGI_UPDATE_ED25519_PRIVATE_KEY is required for release metadata signing."
            exit 1
          fi
          ARTIFACTS_DIR="${RUNNER_TEMP}/artifacts"
          find "$ARTIFACTS_DIR" -name 'latest*.yml' -type f -print0 | while IFS= read -r -d '' f; do
            echo "Signing: $f"
            python "${GITHUB_WORKSPACE}/FHD/scripts/dev/sign_update_metadata.py" "$f"
          done
      - name: Upload macOS installers to update server
        timeout-minutes: 30
        working-directory: .
        env:
          DESKTOP_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.FHD_PUSH_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_SSH_KEY:-}" ]; then
            echo "::notice::No SERVER_SSH_KEY / FHD_PUSH_SSH_KEY secret — skipping macOS upload."
            exit 0
          fi
          HOST="${{ vars.FHD_PUSH_HOST || '119.27.178.147' }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${DESKTOP_SSH_KEY}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$HOME/.ssh/id_ci" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          BASE="${RUNNER_TEMP}/artifacts"
          raw="${{ github.event.inputs.version || github.ref_name }}"
          raw="${raw#FHD/}"
          raw="${raw#v}"
          raw="${raw#V}"
          version="${raw:-10.0.0}"
          for sku in enterprise; do
            dir="$(find "$BASE" -type d -path "*/xcagi-v${version}/$sku" -print -quit)"
            if [ ! -d "$dir" ]; then dir="${BASE}/$sku"; fi
            if [ ! -d "$dir" ]; then echo "[skip] no $sku dir"; continue; fi
            dest="/var/www/update/releases/stable/$sku"
            timeout 1800 rsync -avz --timeout=120 \
              --include='*/' \
              --include='*.exe' \
              --include='*.exe.blockmap' \
              --include='*.dmg' \
              --include='*.dmg.blockmap' \
              --include='latest*.yml' \
              --exclude='*' \
              -e "ssh ${SSH_OPTS[*]}" "$dir/" "root@${HOST}:$dest/"
          done

  github-release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.blockmap
            artifacts/**/*.dmg
            artifacts/**/*.dmg.blockmap
            artifacts/**/*.zip
            artifacts/**/*.zip.blockmap
            artifacts/**/latest*.yml
