name: Release gate CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  release-gate:
    name: Release gate (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths (unified classifier)
        id: paths
        if: github.event_name == 'pull_request'
        run: |
          # 统一分类器（scripts/dev/change_classifier.py）——禁止此处再写死路径正则。
          python ../scripts/dev/change_classifier.py --category release \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Skip notice (no release-relevant changes)
        if: steps.paths.outputs.skip == 'true'
        run: echo "No release-relevant path changes; Release gate satisfied without running contract tests."

      - uses: actions/setup-python@v5
        if: steps.paths.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        if: steps.paths.outputs.skip != 'true'
        run: |
          python -m pip install -U pip
          pip install -r requirements-server-api.txt
          pip install -r deploy/requirements-dev.txt
      - name: Release contract tests (isolated conftest)
        if: steps.paths.outputs.skip != 'true'
        run: |
          if [ -d tests/release ]; then
            python -m pytest tests/release/ --confcutdir=tests/release -q --tb=short
          else
            echo "tests/release/ 不存在，跳过 isolated contract tests"
          fi
      - name: Release gate manifest
        if: steps.paths.outputs.skip != 'true'
        run: python -m pytest tests/release_gate/ -q --tb=short
