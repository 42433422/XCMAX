name: Release gate CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  release-gate:
    name: Release gate (hard block)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test deps
        run: |
          python -m pip install -U pip
          pip install -r deploy/requirements-server-api.txt
          pip install -r deploy/requirements-dev.txt
      - name: SSOT registry and drift gate
        run: python scripts/dev/ssot_cli.py gate
      - name: Generated workflow drift gate
        working-directory: .
        run: python scripts/dev/publish_ci_workflows_to_root.py --check
      - name: Release contract tests (isolated conftest)
        run: |
          if [ -d tests/release ]; then
            python -m pytest tests/release/ --confcutdir=tests/release -q --tb=short
          else
            echo "tests/release/ 不存在，跳过 isolated contract tests"
          fi
      - name: Release gate manifest
        run: python -m pytest tests/release_gate/ -q --tb=short
