# Lightweight smoke CI for FHD (published to root as fhd-test.yml).
# Full pipeline: ci-cd.yml → fhd-ci-cd.yml
name: Smoke Tests

on:
  push:
    branches: [main, develop, master]
    paths:
      - "app/**"
      - "tests/**"
      - "assets/evals/**"
      - "frontend/**"
      - "ops/deploy/requirements*.txt"
      - "requirements-server-api.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "packages/**"
      - "metrics/coverage-dual-summary.json"
      - "metrics/coverage_ratchet_baseline.json"
      - "FHD/scripts/ci/check_coverage_ssot.py"
      - "FHD/scripts/ci/guard_temp_scripts.py"
      - "FHD/scripts/ci/check_repo_hygiene.sh"
      - "FHD/scripts/dev/verify_version_anchors.py"
      - "FHD/scripts/dev/check_requirements_lock.py"
      - "FHD/.github/workflows/test.yml"
      - "scripts/dev/publish_ci_workflows_to_root.py"
      - ".github/workflows/fhd-test.yml"
  pull_request:
    branches: [main, develop, master]
    paths:
      - "app/**"
      - "tests/**"
      - "assets/evals/**"
      - "frontend/**"
      - "ops/deploy/requirements*.txt"
      - "requirements-server-api.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "packages/**"
      - "metrics/coverage-dual-summary.json"
      - "metrics/coverage_ratchet_baseline.json"
      - "FHD/scripts/ci/check_coverage_ssot.py"
      - "FHD/scripts/ci/guard_temp_scripts.py"
      - "FHD/scripts/ci/check_repo_hygiene.sh"
      - "FHD/scripts/dev/verify_version_anchors.py"
      - "FHD/scripts/dev/check_requirements_lock.py"
      - "FHD/.github/workflows/test.yml"
      - "scripts/dev/publish_ci_workflows_to_root.py"
      - ".github/workflows/fhd-test.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Candidate tests never inherit repository-wide write permissions.
permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on tracked secrets or dependency caches
        shell: bash
        run: bash scripts/ci/check_repo_hygiene.sh

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up cached uv installer
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            FHD/requirements-server-api.txt
            FHD/ops/deploy/requirements-dev.txt
            FHD/uv.lock
            FHD/pyproject.toml
            FHD/packages/**/pyproject.toml

      - name: Install dependencies
        run: |
          set -euo pipefail
          pytest_pin="$(python "$GITHUB_WORKSPACE/FHD/scripts/dev/check_requirements_lock.py" --pytest-pin)"
          [[ "$pytest_pin" =~ ^pytest==[0-9]+(\.[0-9]+){2}$ ]]
          uv pip install --system --python "$(command -v python)" -r requirements-server-api.txt -r ops/deploy/requirements-dev.txt "$pytest_pin"
          uv pip check --system --python "$(command -v python)"

      - name: Verify stable version anchors
        run: python scripts/dev/verify_version_anchors.py

      - name: Validate coverage SSOT metadata
        run: python scripts/ci/check_coverage_ssot.py

      - name: Layer debt ratchet (services/ frozen, routes→application only)
        run: python scripts/dev/check_layer_ratchet.py

      - name: Ruff lint (app + tests)
        run: ruff check app/ tests/

      - name: Pytest smoke (route registry + health)
        env:
          XCAGI_SKIP_LEGACY_COMPAT_ROUTES: "1"
        run: |
          python -m pytest tests/test_routes/test_route_registry.py \
            tests/test_routes/test_registry_unit.py -x -q --tb=short

      - name: Fixed local runtime contracts
        env:
          XCAGI_PRODUCT_SKU: enterprise
        run: |
          set -euo pipefail
          python -m pip install 'openai-codex==0.171.0'
          python -m pytest tests/test_application/test_codex_*.py \
            tests/test_infrastructure/test_codex_transport_contract.py \
            tests/test_routes/test_codex_control.py -q --tb=short --junitxml=codex-runtime-results.xml
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          cases = ET.parse("codex-runtime-results.xml").findall(".//testcase")
          real = [case for case in cases if case.get("classname", "").endswith("test_codex_gateway_integration") and case.get("name") == "test_real_pinned_cli_private_gateway_clarification_resume_and_billing"]
          assert len(real) == 1 and not any(real[0].find(tag) is not None for tag in ("skipped", "failure", "error")), "Pinned Codex SDK/CLI process smoke must execute and pass"
          PYCODE

      - name: Offline Agent contract fixtures (process boundary tested separately)
        env:
          SECRET_KEY: "ci-agent-eval-secret-at-least-32-bytes"
        run: python assets/evals/run_agent_eval.py --junitxml agent-eval-results/junit.xml

      - name: Preserve offline Agent contract diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-contracts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: FHD/agent-eval-results/junit.xml
          if-no-files-found: warn
          retention-days: 7
