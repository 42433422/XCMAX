name: Upgrade and rollback evidence
run-name: Upgrade rollback evidence ${{ inputs.release_sha }}

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character release SHA exercised in production and on controlled real devices
        required: true
        type: string
      evidence_json:
        description: Submitted rollback claims; registration validates their structure, not physical acceptance
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Register rollback claims without certifying physical acceptance
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          printf '%s\n' "$EVIDENCE_JSON" > "${RUNNER_TEMP}/upgrade-rollback-raw.json"
          python scripts/release/verify_upgrade_rollback_evidence.py \
            --evidence "${RUNNER_TEMP}/upgrade-rollback-raw.json" \
            --release-sha "$RELEASE_SHA" \
            --register-claims \
            --output "${RUNNER_TEMP}/upgrade-rollback-verification.json"
      - name: Upload verification and restricted raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcagi-upgrade-rollback-evidence
          path: |
            ${{ runner.temp }}/upgrade-rollback-raw.json
            ${{ runner.temp }}/upgrade-rollback-verification.json
          retention-days: 120
          if-no-files-found: error
