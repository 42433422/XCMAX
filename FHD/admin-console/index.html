<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="xcmax-release-git-sha" content="%VITE_XCAGI_GIT_SHA%" />
    <link rel="icon" type="image/svg+xml" href="/admin/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef6fd" />
    <title>XCMAX 服务器后台</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #eef6fd;
        color: #19324d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .admin-bootstrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.94), rgba(238, 246, 253, 0.72) 42%),
          #eef6fd;
      }

      .admin-bootstrap__card {
        display: flex;
        align-items: center;
        gap: 16px;
        width: min(360px, calc(100vw - 48px));
        padding: 18px 20px;
        box-sizing: border-box;
        border: 1px solid rgba(63, 127, 191, 0.14);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 16px 42px rgba(46, 91, 137, 0.12);
      }

      .admin-bootstrap__mark {
        position: relative;
        display: grid;
        flex: 0 0 48px;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(145deg, #3478c9, #175cae);
        color: #fff;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: -0.04em;
        box-shadow: 0 8px 20px rgba(34, 105, 181, 0.24);
      }

      .admin-bootstrap__spinner {
        position: absolute;
        inset: -5px;
        border: 2px solid transparent;
        border-top-color: #73afea;
        border-right-color: rgba(115, 175, 234, 0.45);
        border-radius: 50%;
        animation: admin-bootstrap-spin 1.1s linear infinite;
      }

      .admin-bootstrap__title {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 700;
      }

      .admin-bootstrap__hint {
        margin: 0;
        color: #6f8499;
        font-size: 13px;
        line-height: 1.5;
      }

      @keyframes admin-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .admin-bootstrap__spinner {
          animation: none;
          border-color: rgba(115, 175, 234, 0.55);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="admin-bootstrap" aria-label="XCMAX 管理端启动中">
        <section class="admin-bootstrap__card" role="status" aria-live="polite">
          <div class="admin-bootstrap__mark" aria-hidden="true">
            XC
            <span class="admin-bootstrap__spinner"></span>
          </div>
          <div>
            <p class="admin-bootstrap__title">XCMAX 管理中心</p>
            <p class="admin-bootstrap__hint">正在加载管理页面，请稍候…</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
