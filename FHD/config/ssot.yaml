# XCMAX SSOT 注册表 — 唯一真相源登记
# 由 ssot_cli.py 读取；新增域在此声明后经 ssot enable 启用。
# MVP 只跑 check（调用各域 check 命令）；sync 命令在对应 P 批次落地后才被调用。
version: 1

domains:
  # ===== MVP enabled 域（包装现有 5 个脚本）=====
  - name: mods
    owner: FHD/mod_sdk
    enabled: true
    ssot: FHD/mods/
    derived:
      - FHD/XCAGI/mods/
    mode: sync
    check: python scripts/dev/mods_ssot.py check
    sync: python scripts/dev/mods_ssot.py sync

  - name: ci-workflows
    owner: ci
    enabled: true
    ssot: FHD/.github/workflows/
    derived:
      - .github/workflows/
    mode: generate
    # publish 脚本无 --check 模式；check = 只读 header 检查（ci_workflows.py）
    check: python scripts/dev/ssot_plugins/ci_workflows.py check
    sync: python scripts/dev/publish_ci_workflows_to_root.py

  - name: coverage
    owner: qa
    enabled: true
    ssot: FHD/metrics/coverage_ratchet_baseline.json
    derived:
      - FHD/pyproject.toml#[tool.coverage.report]fail_under
      - FHD/frontend/vitest.config.js#thresholds
      - FHD/metrics/coverage-dual-summary.json
    mode: ratchet+verify
    check: python scripts/dev/coverage_ratchet.py --check
    # --bump 会同步更新 vitest.config.js thresholds（除非 --no-vitest）
    sync: python scripts/dev/coverage_ratchet.py --bump

  - name: version
    owner: release
    enabled: true
    ssot: FHD/VERSION.md
    derived:
      - FHD/pyproject.toml#[project]version
      - FHD/XCAGI/pyproject.toml#[project]version
      - FHD/frontend/package.json#version
      - FHD/desktop/package.json#version
      - FHD/package.json#version
      - FHD/XCAGI/package.json#version
      - FHD/admin-console/package.json#version
      - FHD/sunbird-console/package.json#version
      - FHD/app/fastapi_app/factory.py#FastAPI(version=)
      - FHD/app/infrastructure/mods/manifest.py#current_version
      - FHD/mobile-flutter-poc/android/app/build.gradle.kts#versionName
      - FHD/mobile-flutter-poc/pubspec.yaml#version
      - FHD/mobile-flutter-poc/ios/Flutter/Version.xcconfig#FLUTTER_BUILD_NAME
      - FHD/desktop/resources/build-info.json#version
      - FHD/mobile-flutter-poc/lib/src/api/mobile_api.dart#versionName
      - FHD/config/download_release.json#marketing_version
      - FHD/config/release_train.json#product_version
      - 成都修茈科技有限公司/FHD/config/release_train.json#product_version
      - FHD/contracts/openapi.json#info.version
      - FHD/setup.iss#MyAppVersion
      - FHD/tools/XcagiDownloader/Models/AppSettings.cs#fallback-version
      - FHD/scripts/package/build-installer.sh#default-version
      - FHD/scripts/package/build-installer.ps1#default-version
      - FHD/release/VERSION
    mode: sync+verify
    check: python scripts/dev/verify_version_anchors.py
    # --apply 真写；ssot sync version 默认 dry-run，--apply 透传给脚本
    sync: python scripts/dev/version_sync.py --apply

  - name: docs-ssot
    owner: docs
    enabled: true
    ssot: FHD/docs/SSOT_INDEX.md
    derived: []
    mode: lint
    check: python scripts/dev/docs_ssot_lint.py --strict
    sync: null

  - name: account-system
    owner: product-platform
    enabled: true
    ssot: FHD/docs/account_system_ssot.md
    derived:
      - FHD/config/saas_plans.json
      - FHD/config/industry_presets.json
      - FHD/config/industry_baseline.json
      - FHD/config/industry_mod_aliases.json
      - FHD/app/application/account_tier_derivation.py
      - FHD/frontend/src/api/auth.ts
      - FHD/frontend/src/api/modelPayment.ts
      - FHD/frontend/src/views/RegisterView.vue
      - FHD/frontend/src/views/AdminEntitlementsView.vue
    mode: lint
    check: python scripts/dev/ssot_plugins/account_system.py check
    sync: null

  # ===== 已启用域（lint/verify，统一 blocking gate）=====
  - name: test-files
    owner: qa
    enabled: true
    ssot: FHD/tests/
    derived: []
    mode: lint
    check: python scripts/dev/ssot_plugins/test_files.py check
    sync: null

  - name: deploy-scripts
    owner: devops
    enabled: true
    ssot: FHD/scripts/deploy/
    derived: []
    mode: lint
    check: python scripts/dev/ssot_plugins/deploy_scripts.py check
    sync: null

  - name: deps
    owner: backend
    enabled: true
    ssot: FHD/pyproject.toml
    derived:
      - FHD/requirements.txt
      - FHD/requirements-ml.txt
    mode: sync+verify
    check: python scripts/dev/ssot_plugins/deps.py check
    sync: null

  - name: error-codes
    owner: backend
    enabled: true
    ssot: FHD/app/http/error_codes.py
    derived: []
    mode: lint
    check: python scripts/dev/ssot_plugins/error_codes.py check
    sync: null

  - name: registry-crosscheck
    owner: platform-governance
    enabled: true
    # L1：ssot.yaml ↔ SSOT_INDEX.md 机器注册表互校验，防止双脑漂移。
    ssot: FHD/docs/SSOT_INDEX.md
    derived:
      - FHD/config/ssot.yaml
    mode: verify
    check: python scripts/dev/ssot_registry_contract.py
    sync: null

  # k8s-manifests 域已随假 k8s 路径整体退役（2026-07-01 运维根治）：清单从未指向
  # 真实集群，生产 = 单 CVM（FHD/scripts/deploy 发布链 + 仓库根 ops/）。恢复看 git 历史。

  # ===== 此前游离于注册表外的真相源（2026-06-23 补登记）=====
  - name: employee-roster
    owner: hr-platform
    enabled: true
    # 员工/部门花名册 SSOT；生成器在仓库根 scripts/dev/（非 FHD/scripts/）。
    # check 脚本以 Path(__file__) 自解析路径，cwd=FHD 时用 ../ 引用即可。
    ssot: FHD/config/duty_roster.json
    derived:
      - 成都修茈科技有限公司/MODstore_deploy/modstore_server/duty_roster.py
      - FHD/app/mod_sdk/duty_roster.py
      - FHD/frontend/src/domain/yuangonDutyRoster.ts
      - 成都修茈科技有限公司/MODstore_deploy/market/src/domain/yuangonDutyRoster.ts
      - FHD/app/infrastructure/mods/catalog_visibility.py
      - FHD/frontend/src/constants/enterpriseWorkflowEstablishment.ts
      - FHD/mobile-flutter-poc/lib/src/data/duty_roster_ssot.dart
    mode: sync
    check: python ../scripts/dev/sync_duty_roster.py --check
    sync: python ../scripts/dev/sync_duty_roster.py --generate

  - name: db-schema
    owner: backend
    enabled: true
    # DB schema 已收口：Alembic 是生产/桌面主库唯一结构写入源。
    # 此处 check = 纯 stdlib 结构守卫（单 head / 无悬挂 down_revision），无重依赖、随处可跑。
    # 完整 ORM-parity（alembic upgrade head == models）由主 CI 的
    # schema-ssot-gate 同时在 SQLite / PostgreSQL 上 blocking 把关。
    ssot: FHD/alembic/versions/
    derived:
      - FHD/app/db/
    mode: verify
    check: python ../scripts/guard_alembic_single_head.py
    sync: null

  - name: service-topology
    owner: devops
    enabled: true
    # 服务拓扑 SSOT（第 11 域）：把散落的服务器事实（xiu-ci.com 硬编码 71 文件 / 端口散 100+ 文件）
    # 收口成单一真相源 FHD/config/service_topology.yaml；派生后端、前端、Flutter 常量与健康探针 JSON。
    ssot: FHD/config/service_topology.yaml
    derived:
      - FHD/app/infrastructure/topology.py
      - FHD/frontend/src/constants/topology.ts
      - FHD/mobile-flutter-poc/lib/src/data/service_topology_ssot.dart
      - FHD/config/topology.generated.json
    mode: sync+verify
    check: python scripts/dev/service_topology_ssot.py check
    sync: python scripts/dev/service_topology_ssot.py generate --apply

  - name: deployment-modes
    owner: platform-runtime
    enabled: true
    # AI 部署模式 SSOT：统一内网/外网、手机局域网直连、性能模式三档策略。
    ssot: FHD/config/deployment_modes.yaml
    derived:
      - FHD/config/deployment_modes.generated.json
      - FHD/frontend/src/constants/deploymentModes.generated.ts
      - FHD/mobile-flutter-poc/lib/src/data/deployment_modes_ssot.dart
    mode: sync+verify
    check: python3 scripts/dev/deployment_modes_ssot.py check
    sync: python3 scripts/dev/deployment_modes_ssot.py generate --apply

  - name: database-storage
    owner: platform-runtime
    enabled: true
    # 数据库存储 SSOT：SQLite/PG 模式、SQLite -> PG 同步计划、桌面 database.json profile 策略。
    ssot: FHD/config/database_storage_modes.yaml
    derived:
      - FHD/config/database_storage_modes.generated.json
      - FHD/frontend/src/constants/databaseStorageModes.generated.ts
    mode: sync+verify
    check: python3 scripts/dev/database_storage_ssot.py check
    sync: python3 scripts/dev/database_storage_ssot.py generate --apply

  - name: mobile-tri-platform
    owner: mobile-platform
    enabled: true
    # 移动统一 SSOT：Flutter 前端、OpenAPI 契约、FastAPI 后端业务、设计 token、端侧性能监控。
    ssot: FHD/docs/mobile_tri_platform_ssot.md
    derived:
      - FHD/config/mobile_design_tokens.json
      - FHD/contracts/openapi.json
      - FHD/app/fastapi_routes/mobile_api.py
      - FHD/app/fastapi_routes/mobile_api_extensions.py
      - FHD/app/fastapi_routes/mobile_extensions/routes_ai_groups.py
      - FHD/mobile-flutter-poc/README.md
      - FHD/mobile-flutter-poc/FLUTTER_UNIFICATION.md
      - FHD/mobile-flutter-poc/lib/src/api/mobile_api.dart
      - FHD/mobile-flutter-poc/lib/src/api/mobile_models.dart
      - FHD/mobile-flutter-poc/lib/src/data/mobile_repository.dart
      - FHD/mobile-flutter-poc/lib/src/theme/app_theme.dart
    mode: lint
    check: python scripts/dev/ssot_plugins/mobile_tri_platform.py check
    sync: null

  - name: neuro-bus-events
    owner: neuro-platform
    enabled: true
    # NeuroBus 事件契约 SSOT:统一三流(NeuroBus 域事件 + AgentRun 事件 + 应用桥接)。
    # canonical 命名 = code 中实际 emit 的字符串(dataclass 默认值即 canonical);
    # 派生 Python 常量(非 Enum,字节级零破坏 string-equality 调用) + TS 类型 + OpenAPI schema。
    # check 含 4 道校验:派生一致 + dataclass 默认值在 SSOT + orchestrator 字符串在 SSOT + OpenAPI schema 一致。
    ssot: FHD/config/neuro_bus_events.yaml
    derived:
      - FHD/app/neuro_bus/event_types_generated.py
      - FHD/frontend/src/types/agentRunEvents.generated.ts
      - FHD/contracts/openapi.json#components.schemas.AgentRunEvent
    mode: generate+verify
    check: python scripts/dev/neuro_bus_events_ssot.py check
    sync: python scripts/dev/neuro_bus_events_ssot.py generate --apply

  - name: runtime-inventory
    owner: devops
    enabled: true
    # 运行时真相 SSOT：desired（拓扑）× actual（端口/进程/systemd/health）→ 单一可消费清单。
    # check 校验拓扑声明完整 + 派生 schema；live 探针由 scripts/ops/runtime_inventory.py probe。
    ssot: FHD/config/service_topology.yaml
    derived:
      - FHD/config/topology.generated.json
      - FHD/scripts/ops/runtime_inventory.py
    mode: verify
    check: python scripts/ops/runtime_inventory.py check
    sync: null
