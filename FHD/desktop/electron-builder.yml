appId: com.xcagi.desktop
productName: XCAGI
copyright: Copyright © 2026 XCAGI
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
beforePack: build/before-pack.cjs
afterPack: build/after-pack.cjs
# 正式产物仅写入 release/xcagi-v{version}/{personal|enterprise}/（build-installer.ps1 -ProductSku 必填）
directories:
  output: ../release/_electron-staging
files:
  - dist/**
  - package.json
  - resources/icon.ico
  - resources/icon.png
  - resources/splash.html
extraResources:
  - from: ../dist/xcagi-backend
    to: backend
    filter:
      - "**/*"
  # 前端 vue-dist 已由 PyInstaller 内嵌进 backend/_internal/templates/vue-dist，
  # 且运行时由后端 HTTP 提供(main.ts desktopInitialUrl→FastAPI mount)，
  # 这里不再单独再打一份 frontend(原先重复 ~56MB)。main.ts:337 的 cache-hash
  # 兜底会优雅降级到后端内嵌副本。切勿恢复成单独 frontend extraResource。
  - from: resources/product-sku.json
    to: product-sku.json
  - from: resources/build-info.json
    to: build-info.json
  - from: resources/splash.html
    to: splash.html
publish:
  provider: generic
  url: https://xiu-ci.com/releases/stable/
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: resources/icon.ico
  signAndEditExecutable: true
nsis:
  artifactName: XCAGI-Setup-${version}-${arch}.${ext}
  shortcutName: XCAGI
  uninstallDisplayName: XCAGI 桌面版
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  displayLanguageSelector: false
  installerLanguages:
    - zh_CN
  language: "2052"
  unicode: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  menuCategory: XCAGI
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeader: resources/installer-header.bmp
  installerSidebar: resources/installer-sidebar.bmp
  include: build/installer.nsh
  license: ../LICENSE
  warningsAsErrors: false
mac:
  target:
    - dmg
    - pkg
    - zip
  category: public.app-category.business
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # Explicit URL avoids the macOS codesign default resolving to an unavailable
  # timestamp endpoint on proxied networks. Apple Developer ID signatures need
  # a trusted timestamp for notarization and long-term validity.
  timestamp: http://timestamp.apple.com/ts01
  # @electron/osx-sign otherwise invokes codesign for every resource file.
  # Data files are sealed by their containing bundle signature and must not
  # receive standalone code signatures (which also multiplies TSA requests).
  signIgnore:
    - "\\.(asar|pak|json|jsonl|gz|zip|tar|dat|bin|wasm|onnx|pt|exe|png|jpe?g|gif|webp|svg|ico|icns|txt|strings|md|html?|css|m?js|cjs|map|py|pyc|pyo|ya?ml|toml|ini|cfg|csv|tsv|xml|plist|nib|car|woff2?|ttf|otf|eot|wav|mp3|m4a|aac|ogg|flac|mp4|mov|webm|pdf|docx?|xlsx?|pptx?|db|sqlite|db-shm|db-wal)$"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # npm/Electron requires a three-part SemVer, while XCAGI releases use a
    # four-part product version. Keep Finder and the app bundle aligned with
    # the product release that users install.
    CFBundleShortVersionString: ${env.XCAGI_PRODUCT_VERSION}
    CFBundleVersion: ${env.XCAGI_PRODUCT_VERSION}
    NSMicrophoneUsageDescription: XCAGI 需要使用麦克风进行语音输入和语音转写。
dmg:
  sign: true
afterSign: build/notarize.cjs
