<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XCAGI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #f4f7fb 0%, #e8eef8 100%);
        color: #1a2b4a;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-app-region: drag;
      }
      .card {
        text-align: center;
        padding: 2.5rem 3rem 2.25rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 40px rgba(26, 43, 74, 0.08);
        min-width: 360px;
        max-width: 420px;
        -webkit-app-region: no-drag;
      }
      h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.02em; }
      .subtitle {
        margin-top: 0.35rem;
        font-size: 0.8rem;
        color: #8a9bb5;
        letter-spacing: 0.04em;
      }
      #status {
        margin-top: 1.15rem;
        font-size: 0.95rem;
        color: #5a6d8c;
        min-height: 1.4em;
      }
      .progress-wrap {
        margin-top: 1.35rem;
        text-align: left;
      }
      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 0.45rem;
        font-size: 0.78rem;
        color: #7a8ba8;
      }
      #pct { font-variant-numeric: tabular-nums; font-weight: 600; color: #3b6fd9; }
      .track {
        height: 8px;
        border-radius: 999px;
        background: #dce5f4;
        overflow: hidden;
        position: relative;
      }
      .bar {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #3b6fd9 0%, #5b8aef 55%, #7aa2f7 100%);
        transition: width 0.35s ease-out;
        position: relative;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.45) 50%,
          transparent 100%
        );
        transform: translateX(-100%);
        animation: shimmer 1.4s ease-in-out infinite;
      }
      .bar.is-error {
        background: linear-gradient(90deg, #c0392b 0%, #e74c3c 100%);
      }
      .bar.is-error::after { animation: none; }
      .hint {
        margin-top: 0.85rem;
        font-size: 0.75rem;
        color: #9aa8bf;
        line-height: 1.4;
      }
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar { transition: none; }
        .bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>XCAGI</h1>
      <div class="subtitle">企业桌面版</div>
      <p id="status">正在准备界面…</p>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span>启动进度</span>
          <span id="pct">0%</span>
        </div>
        <div
          class="track"
          id="track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="启动进度"
        >
          <div class="bar" id="bar"></div>
        </div>
      </div>
      <p class="hint" id="hint">首次启动可能需要初始化本地数据库，请稍候</p>
    </div>
    <script>
      (function () {
        var bar = document.getElementById('bar');
        var pct = document.getElementById('pct');
        var statusEl = document.getElementById('status');
        var track = document.getElementById('track');
        var hint = document.getElementById('hint');
        var current = 0;
        var drivenByHost = false;
        var autoTimer = null;
        var startedAt = Date.now();

        function clamp(n) {
          n = Number(n);
          if (!isFinite(n)) return 0;
          return Math.max(0, Math.min(100, Math.round(n)));
        }

        function applyProgress(n, isError) {
          current = clamp(n);
          if (bar) {
            bar.style.width = current + '%';
            bar.classList.toggle('is-error', !!isError);
          }
          if (pct) pct.textContent = current + '%';
          if (track) track.setAttribute('aria-valuenow', String(current));
        }

        function tickAutoProgress() {
          if (drivenByHost) return;
          var elapsed = Date.now() - startedAt;
          // 无宿主推送时也缓爬到 70%，避免用户误以为卡死
          var target = Math.min(70, 4 + Math.pow(elapsed / 90000, 0.65) * 66);
          if (target > current) applyProgress(target);
          var sec = Math.floor(elapsed / 1000);
          if (statusEl && sec >= 2 && !drivenByHost) {
            statusEl.textContent = '正在启动本地服务…（已等待 ' + sec + 's）';
          }
          if (hint && sec >= 20) {
            hint.textContent = '首次启动初始化较慢属正常现象，请继续等待';
          }
        }

        window.xcagiSetSplashStatus = function (text) {
          if (statusEl && text) statusEl.textContent = text;
        };

        /** @param {number} percent @param {string=} text @param {{error?: boolean}=} opts */
        window.xcagiSetSplashProgress = function (percent, text, opts) {
          drivenByHost = true;
          if (autoTimer) {
            clearInterval(autoTimer);
            autoTimer = null;
          }
          applyProgress(percent, opts && opts.error);
          if (statusEl && text) statusEl.textContent = text;
          if (opts && opts.error && hint) {
            hint.textContent = '若长时间无响应，可从菜单导出诊断包后联系支持';
          }
        };

        window.xcagiGetSplashProgress = function () {
          return current;
        };

        applyProgress(4);
        autoTimer = setInterval(tickAutoProgress, 400);
      })();
    </script>
  </body>
</html>
