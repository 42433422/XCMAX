# Production release images — requires .env: SECRET_KEY, REDIS_PASSWORD

services:
  backend:
    image: ${XCAGI_BACKEND_IMAGE:-xcagi/backend}:${XCAGI_IMAGE_TAG:-latest}
    container_name: xcagi-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - XCAGI_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_PATH=/app/data
      - UPLOAD_FOLDER=/app/uploads
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - xcagi-data:/app/data
      - xcagi-uploads:/app/uploads
      - xcagi-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - xcagi-network

  celery-worker:
    image: ${XCAGI_CELERY_IMAGE:-xcagi/celery-worker}:${XCAGI_IMAGE_TAG:-latest}
    container_name: xcagi-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      - XCAGI_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DATABASE_PATH=/app/data
      - UPLOAD_FOLDER=/app/uploads
      - CACHE_REDIS_URL=${CACHE_REDIS_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - xcagi-data:/app/data
      - xcagi-uploads:/app/uploads
      - xcagi-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - xcagi-network

  redis:
    image: redis:7-alpine
    container_name: xcagi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xcagi-network

  frontend:
    image: ${XCAGI_FRONTEND_IMAGE:-xcagi/frontend}:${XCAGI_IMAGE_TAG:-latest}
    container_name: xcagi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - xcagi-network

  # --- 监控栈（生产）---
  # 后端 /metrics 由 app/utils/metrics.py + register_prometheus_metrics 暴露
  prometheus:
    image: prom/prometheus:latest
    container_name: xcagi-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - backend
    networks:
      - xcagi-network

  grafana:
    image: grafana/grafana:latest
    container_name: xcagi-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - xcagi-network

  alertmanager:
    image: prom/alertmanager:latest
    container_name: xcagi-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - xcagi-network

volumes:
  xcagi-data:
    driver: local
  xcagi-uploads:
    driver: local
  xcagi-logs:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

networks:
  xcagi-network:
    driver: bridge
