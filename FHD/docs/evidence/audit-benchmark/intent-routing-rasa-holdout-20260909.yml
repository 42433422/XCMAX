version: "3.1"

nlu:
- intent: order_create
  examples: |
    - 开一张新的采购单据
    - 帮我录个单子
    - 建销售单，数量二十
    - 下个订单买[螺丝](item)
    - 创建一张新单据
- intent: stock_outbound
  examples: |
    - 这批[铝材](item)做出库
    - 帮我扣库存发出去
    - 仓库出库处理一下
    - 办理发货出库
    - 物料出库登记
- intent: payment_receive
  examples: |
    - 登记一笔货款到账
    - 客户已经付了，做收款
    - 回款入账处理
    - 把这笔到账核销
    - 录入银行收款
- intent: erp_reversal
  examples: |
    - 冲销这张录错的单子
    - 帮我红冲这笔
    - 把出库单冲回
    - 这笔要冲销处理
    - 反冲这张凭证
- intent: system_config
  examples: |
    - 更改系统审批配置
    - 调整税率参数
    - 修改默认币种设置
    - 更新权限配置
    - 改单据编号规则
- intent: refund
  examples: |
    - 退钱给客户
    - 做一笔退款
    - 这单申请退款
    - 把款退回原账户
    - 部分退款处理
- intent: chitchat
  examples: |
    - 你好呀
    - 你是谁
    - 谢谢你
- intent: out_of_scope
  examples: |
    - 帮我写篇作文
    - 明天会下雨吗
    - 推荐一部电影
