apiVersion: v1
kind: Service
metadata:
  name: xcagi
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "xcagi-fhd-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "xcagi-fhd-api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-api
      port: {{ .Values.service.port }}
      targetPort: http-api
      protocol: TCP
