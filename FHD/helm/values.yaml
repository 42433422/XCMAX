# Default values for xcagi-fhd-api Helm chart.
# These values render byte-equivalent to FHD/k8s/*.yaml after __DEPLOY_BACKEND_IMAGE__ substitution.
# This file is intentionally documented for ops customization.

# Namespace (override per-environment: staging / production)
namespace: default

# Image
image:
  repository: ghcr.io/42433422/xcmax/xcagi-fhd-api
  tag: sha-latest  # override at deploy time, e.g. sha-<git_sha>
  pullPolicy: IfNotPresent

# Deployment
replicas: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Container port (gunicorn binds 0.0.0.0:5000 inside container)
containerPort: 5000

# Service
service:
  type: ClusterIP
  port: 5100  # external port (host-compatible)

# Resources
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Probes
livenessProbe:
  httpGet:
    path: /api/health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/health
  periodSeconds: 10
  failureThreshold: 30

# HPA
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# PDB
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ConfigMap (non-sensitive env vars)
configMap:
  XCAGI_ENV: production
  FHD_ENV: production
  XCAGI_DEBUG: "0"
  XCAGI_DESKTOP_MODE: "0"
  XCAGI_VERSION: "1.0.0.0"
  LOG_LEVEL: INFO
  WORKSPACE_ROOT: /app
  PYTHONPATH: /app
  SESSION_COOKIE_SECURE: "1"
  SESSION_COOKIE_SAMESITE: Lax
  XCAGI_GUNICORN_WORKERS: ""
  FHD_SKIP_ALEMBIC: "0"
  FHD_SKIP_ADMIN_BOOTSTRAP: "0"
  XCAGI_NEURO_BUS_DEDUP: "1"
  XCAGI_NEURO_BUS_CIRCUIT: "1"
  XCAGI_NEURO_BUS_RATE_LIMIT: "1"
  XCAGI_NEURO_BUS_TRACE: "1"
  XCAGI_NEURO_BUS_TRACE_SAMPLE_RATE: "0.1"
  XCAGI_NEURO_BUS_LIFELINE: "1"
  XCAGI_NEURO_BUS_DLQ_AUTO: "1"
  XCAGI_NEURO_BUS_SLA_LOG: "1"
  PGCONNECT_TIMEOUT: "5"

# Secret (placeholder — actual values via `kubectl create secret` or SealedSecrets)
secret:
  name: xcagi-secrets

# Ingress
ingress:
  enabled: true
  className: nginx
  host: xiu-ci.com
  path: /fhd-api
  tls:
    enabled: true
    secretName: xiu-ci-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"

# NetworkPolicy
networkPolicy:
  enabled: true
  allowNamespaces:
    - ingress-nginx
    - kube-system

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Termination grace period
terminationGracePeriodSeconds: 60
