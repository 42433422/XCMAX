# CI SSOT: K8s ConfigMap for xcagi-fhd-api (non-sensitive env vars).
# Sensitive vars (SECRET_KEY / DATABASE_URL / CACHE_REDIS_URL / DEEPSEEK_API_KEY etc.) go in Secret via `kubectl create secret`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: xcagi-config
  namespace: __NAMESPACE__
  labels:
    app: xcagi
    component: fhd-api
data:
  # Application
  XCAGI_ENV: "production"
  FHD_ENV: "production"
  XCAGI_DEBUG: "0"
  XCAGI_DESKTOP_MODE: "0"
  XCAGI_VERSION: "10.0.0"
  LOG_LEVEL: "INFO"
  WORKSPACE_ROOT: "/app"
  PYTHONPATH: "/app"

  # Session / Cookie
  SESSION_COOKIE_SECURE: "1"
  SESSION_COOKIE_SAMESITE: "Lax"

  # Gunicorn workers (default: cpu*2+1)
  XCAGI_GUNICORN_WORKERS: ""

  # Alembic / admin bootstrap toggles (entrypoint runs them when 0)
  FHD_SKIP_ALEMBIC: "0"
  FHD_SKIP_ADMIN_BOOTSTRAP: "0"

  # Neuro Bus production hardening (SSOT: cicd-e2e-prompt.md)
  XCAGI_NEURO_BUS_DEDUP: "1"
  XCAGI_NEURO_BUS_CIRCUIT: "1"
  XCAGI_NEURO_BUS_RATE_LIMIT: "1"
  XCAGI_NEURO_BUS_TRACE: "1"
  XCAGI_NEURO_BUS_TRACE_SAMPLE_RATE: "0.1"
  XCAGI_NEURO_BUS_LIFELINE: "1"
  XCAGI_NEURO_BUS_DLQ_AUTO: "1"
  XCAGI_NEURO_BUS_SLA_LOG: "1"

  # DB connection tuning
  PGCONNECT_TIMEOUT: "5"
