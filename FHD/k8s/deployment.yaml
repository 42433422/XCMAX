# CI SSOT: K8s manifest for xcagi-fhd-api workload.
# Apply with: sed "s|__DEPLOY_BACKEND_IMAGE__|${IMAGE}|g; s|__NAMESPACE__|${NS}|g" k8s/deployment.yaml | kubectl apply -f -
# Image placeholder is replaced by fhd-deploy.yml workflow or manual sed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xcagi
  namespace: __NAMESPACE__
  labels:
    app: xcagi
    component: fhd-api
    version: "1.0.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xcagi
      component: fhd-api
  template:
    metadata:
      labels:
        app: xcagi
        component: fhd-api
        version: "1.0.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: xcagi-api
          image: __DEPLOY_BACKEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: xcagi-config
            - secretRef:
                name: xcagi-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http-api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http-api
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
