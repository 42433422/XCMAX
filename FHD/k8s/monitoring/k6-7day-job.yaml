apiVersion: batch/v1
kind: Job
metadata:
  name: k6-7day
  namespace: xcagi-staging
  labels:
    app: k6
    component: slo-contract
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 605400  # 168h + 10min buffer
  template:
    metadata:
      labels:
        app: k6
        component: slo-contract
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:0.50.0
        command: ["k6", "run", "/scripts/k6_7d_contract.js"]
        env:
        - name: XCAGI_BASE_URL
          value: "http://xcagi-service:80"
        - name: K6_DURATION
          value: "168h"
        - name: E2E_USER
          valueFrom:
            secretKeyRef:
              name: xcagi-e2e-creds
              key: username
        - name: E2E_PASSWORD
          valueFrom:
            secretKeyRef:
              name: xcagi-e2e-creds
              key: password
        volumeMounts:
        - name: k6-script
          mountPath: /scripts
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: k6-script
        configMap:
          name: k6-7day-contract
