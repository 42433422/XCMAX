# CI SSOT: NetworkPolicy for xcagi-fhd-api.
# Ingress: only same-namespace pods + ingress-nginx namespace.
# Egress: allow all (DB/Redis/external APIs are outside cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xcagi-network-policy
  namespace: __NAMESPACE__
  labels:
    app: xcagi
    component: fhd-api
spec:
  podSelector:
    matchLabels:
      app: xcagi
      component: fhd-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from same namespace
    - from:
        - podSelector: {}
    # Allow traffic from ingress-nginx namespace (controller)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    # Allow health checks from kube-system namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow all egress (DB/Redis/external APIs)
    - {}
