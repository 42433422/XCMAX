# CI SSOT: K8s Service for xcagi-fhd-api.
# Service port 5100 (host-compatible) -> targetPort 5000 (gunicorn containerPort).
apiVersion: v1
kind: Service
metadata:
  name: xcagi
  namespace: __NAMESPACE__
  labels:
    app: xcagi
    component: fhd-api
spec:
  type: ClusterIP
  selector:
    app: xcagi
    component: fhd-api
  ports:
    - name: http-api
      port: 5100
      targetPort: http-api
      protocol: TCP
