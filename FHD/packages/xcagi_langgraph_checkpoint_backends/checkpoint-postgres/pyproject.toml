[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-postgres"
version = "3.1.1+xcagi.1"
description = "XCAGI fork of LangGraph Postgres checkpoint 3.1.1 with the upstream direct-batch namespace validation backport."
authors = []
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ['LICENSE']
# 基于上游 3.1.1 的 XCAGI fork；单独回补 PR #9217 的 direct-batch namespace validation，
# 不声称包含其余 3.1.2/3.1.3 代码变更。
# langgraph-checkpoint 经
# [tool.uv.sources] 重定向到 XCAGI vendored 兄弟包。其余依赖保持上游 registry。
dependencies = [
    "langgraph-checkpoint>=4.1.0,<5.0.0",
    "orjson>=3.11.5",
    "psycopg>=3.2.0",
    "psycopg-pool>=3.2.0",
]

[project.urls]
Source = "https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint-postgres"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"
# 本地吸收副本来源：langgraph commit fcdf520938469c8e0992ca2075d6a9582c33260f

[dependency-groups]
test = [
    "pytest",
    "anyio",
    "pytest-asyncio",
    "pytest-mock",
    "psycopg[binary]",
    "langgraph-checkpoint",
    "pytest-watcher",
]
lint = [
    "ruff",
    "codespell",
    "ty",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.uv]
default-groups = ['dev']

# 依赖来源锁定到 XCAGI vendored 兄弟包（替代上游 libs/checkpoint）。
[tool.uv.sources]
langgraph-checkpoint = { path = "../../xcagi_langgraph_checkpoint", editable = true }

[tool.hatch.build.targets.wheel]
include = ["langgraph"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 -vv"
asyncio_mode = "auto"

[tool.ruff]
lint.select = ["E", "F", "I", "TID251", "UP"]
lint.ignore = ["E501", "TID251"]
target-version = "py310"

[tool.ty.rules]
call-non-callable = "ignore"
deprecated = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-await = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unused-type-ignore-comment = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"

[tool.pytest-watcher]
now = true
delay = 0.1
runner_args = ["--ff", "-v", "--tb", "short"]
patterns = ["*.py"]
