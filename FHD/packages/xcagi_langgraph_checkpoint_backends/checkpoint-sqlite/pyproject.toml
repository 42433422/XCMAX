[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-sqlite"
version = "3.1.0"
description = "Library with a SQLite implementation of LangGraph checkpoint saver. XCAGI vendored fork (LG-W0-04)."
authors = []
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ['LICENSE']
# 依赖声明与上游一致（langgraph-checkpoint-sqlite 3.1.0）。langgraph-checkpoint 经
# [tool.uv.sources] 重定向到 XCAGI vendored 兄弟包。其余依赖保持上游 registry。
dependencies = [
    "langgraph-checkpoint>=4.1.0,<5.0.0",
    "aiosqlite>=0.20",
    "sqlite-vec>=0.1.6",
]

[project.urls]
Source = "https://github.com/langchain-ai/langgraph/tree/main/libs/checkpoint-sqlite"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"
# 本地吸收副本来源：langgraph tag v1.2.10 @ commit 41341457342327166d72fc11952ab28fb61ec0bf

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-watcher",
    "langgraph-checkpoint",
    "pytest-retry>=1.7.0",
]
lint = [
    "ruff",
    "codespell",
    "ty",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.uv]
default-groups = ['dev']

# 依赖来源锁定到 XCAGI vendored 兄弟包（替代上游 libs/checkpoint）。
[tool.uv.sources]
langgraph-checkpoint = { path = "../../xcagi_langgraph_checkpoint", editable = true }

[tool.hatch.build.targets.wheel]
include = ["langgraph"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 -vv"
asyncio_mode = "auto"

[tool.ruff]
lint.select = ["E", "F", "I", "TID251", "UP"]
lint.ignore = ["E501", "TID251"]
target-version = "py310"

[tool.ty.rules]
call-non-callable = "ignore"
deprecated = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-await = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unused-type-ignore-comment = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"

[tool.pytest-watcher]
now = true
delay = 0.1
runner_args = ["--ff", "-v", "--tb", "short"]
patterns = ["*.py"]