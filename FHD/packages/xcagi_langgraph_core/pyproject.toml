[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph"
version = "1.2.10"
description = "Building stateful, multi-actor applications with LLMs. XCAGI vendored fork (LG-W0-02)."
authors = []
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ['LICENSE']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dependencies = [
    "langchain-core>=1.4.7,<2",
    "langgraph-checkpoint>=4.1.0,<5.0.0",
    "langgraph-sdk>=0.4.2,<0.5.0",
    "langgraph-prebuilt>=1.1.0,<1.2.0",
    "xxhash>=3.5.0",
    "pydantic>=2.7.4",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-watcher",
    "syrupy",
    "langchain-core",
    "langgraph-checkpoint",
    "langgraph-sdk",
]
lint = [
    "ruff",
    "codespell",
    "ty",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[project.urls]
Homepage = "https://docs.langchain.com/oss/python/langgraph/overview"
Documentation = "https://reference.langchain.com/python/langgraph/"
Source = "https://github.com/langchain-ai/langgraph/tree/main/libs/langgraph"
Changelog = "https://github.com/langchain-ai/langgraph/releases"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"

# 依赖来源全部锁定到 XCAGI vendored 兄弟包（替代上游）。
[tool.uv]
default-groups = ['dev']

[tool.uv.sources]
langgraph-prebuilt = { path = "../xcagi_langgraph_prebuilt", editable = true }
langgraph-checkpoint = { path = "../xcagi_langgraph_checkpoint", editable = true }
langgraph-sdk = { path = "../xcagi_langgraph_sdk", editable = true }
langgraph-checkpoint-sqlite = { path = "../xcagi_langgraph_checkpoint_backends/checkpoint-sqlite", editable = true }
langgraph-checkpoint-postgres = { path = "../xcagi_langgraph_checkpoint_backends/checkpoint-postgres", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["langgraph"]

[tool.pytest.ini_options]
addopts = "--full-trace --strict-markers --strict-config --durations=5 --snapshot-warn-unused"

[tool.ruff]
lint.select = [ "E", "F", "I", "TID251", "UP" ]
lint.ignore = [ "E501" ]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ty.rules]
call-non-callable = "ignore"
deprecated = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-await = "ignore"
invalid-method-override = "ignore" # LangChain callback/Runnable overloads vary by compatible minor release.
invalid-paramspec = "ignore" # Executor control kwargs intentionally sit outside the forwarded callable kwargs.
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unused-type-ignore-comment = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-base = "ignore"
unsupported-operator = "ignore"
