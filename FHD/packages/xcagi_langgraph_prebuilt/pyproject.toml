[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-prebuilt"
version = "1.1.0"
description = "Library with high-level APIs for creating and executing LangGraph agents and tools. XCAGI vendored fork (LG-W0-05)."
authors = []
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ['LICENSE']
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Programming Language :: Python',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dependencies = [
    "langgraph-checkpoint>=2.1.0,<5.0.0",
    "langchain-core>=1.3.1",
]

[project.urls]
Source = "https://github.com/langchain-ai/langgraph/tree/main/libs/prebuilt"
Twitter = "https://x.com/langchain_oss"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-watcher",
    "langgraph",
    "langchain-core",
    "langgraph-checkpoint",
    "langgraph-checkpoint-sqlite",
    "langgraph-checkpoint-postgres",
    "langgraph-sdk",
    "syrupy",
    "psycopg-binary",
]
lint = [
    "ruff",
    "codespell",
    "ty",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

# 依赖来源全部锁定到 XCAGI vendored 兄弟包（替代上游）。兄弟包自身以非 editable path 声明，
# 此处保持一致（非 editable），避免与兄弟包 sources 产生 URL 冲突；langchain-core / langgraph-sdk
# 无 vendored 版本，保持上游 registry。
# langgraph-prebuilt 自引用为 path "."（非 editable），与 core 对 langgraph-prebuilt 的 path 声明一致，
# 打破 langgraph(core) <-> langgraph-prebuilt 的循环 URL 冲突。
[tool.uv]
default-groups = ['dev']

[tool.uv.sources]
langgraph = { path = "../xcagi_langgraph_core" }
langgraph-prebuilt = { path = "." }
langgraph-checkpoint = { path = "../xcagi_langgraph_checkpoint" }
langgraph-checkpoint-sqlite = { path = "../xcagi_langgraph_checkpoint_backends/checkpoint-sqlite" }
langgraph-checkpoint-postgres = { path = "../xcagi_langgraph_checkpoint_backends/checkpoint-postgres" }

[tool.hatch.build.targets.wheel]
include = ["langgraph"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 -vv"
asyncio_mode = "auto"

[tool.ruff]
lint.select = [ "E", "F", "I", "TID251", "UP" ]
lint.ignore = [ "E501", "TID251" ]
target-version = "py310"

[tool.ty.rules]
call-non-callable = "ignore"
deprecated = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-await = "ignore"
invalid-return-type = "ignore"
no-matching-overload = "ignore"
unused-type-ignore-comment = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"

[tool.pytest-watcher]
now = true
delay = 0.1
runner_args = ["--ff", "-v", "--tb", "short"]
patterns = ["*.py"]