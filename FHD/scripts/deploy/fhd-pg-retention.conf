# Postgres 行级保留策略（table|time_column|retain_days|batch_size）
# 安装脚本会复制到 /etc/fhd/pg-retention.conf。按业务需要调整天数后无需改代码。

# 调用日志：保留 90 天
llm_call_logs|created_at|90|5000
openapi_call_logs|created_at|90|5000

# 客服审计与事件：保留 180 天
customer_service_audit_logs|created_at|180|5000
incident_events|created_at|180|2000

# 通知与风险事件：通知 90 天，风险事件按合规保留 365 天
notifications|created_at|90|5000
risk_events|created_at|365|2000
