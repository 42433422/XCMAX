# XCMAX / MODstore 日志轮转（安装到 /etc/logrotate.d/xcmax）
# 由 logrotate 自带能力完成压缩与过期删除，替代应用内自研日志清理。

/var/log/xcmax/*.log /opt/xcmax/logs/*.log /var/log/modstore/*.log {
    daily
    rotate 14
    maxage 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 root adm
}
