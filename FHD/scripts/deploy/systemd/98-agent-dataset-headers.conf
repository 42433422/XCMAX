# Managed drop-in for fhd-full.service — codified from production
# /etc/systemd/system/fhd-full.service.d/98-agent-dataset-headers.conf (2026-09-09).
#
# 1. XCAGI_DESKTOP_FAST_START=0 — register all routes synchronously in the main thread.
#    Fixes the deferred-registration import deadlock that silently prevented AI route
#    mounting (AIOPEN /api/aiopen/* never mounted; surfaced as ModuleNotFoundError when
#    production lacked reportlab). Sync registration makes any import failure loud and
#    deterministic instead of a silent stall.
#
# 2. XCAGI_TRUST_DATASET_ACCESS_HEADERS=1 — allows service identities (agents) to present
#    X-Dataset-* headers for knowledge-base shared-memory read/write. Security boundary
#    remains the LAN CIDR guard: public requests are rejected (403 lan_blocked) before
#    reaching the app; only LAN-whitelisted peers can set trusted headers.
#
# See docs/architecture/agent-shared-memory.md
[Service]
Environment=XCAGI_DESKTOP_FAST_START=0
Environment=XCAGI_TRUST_DATASET_ACCESS_HEADERS=1
