[project]
name = "lg-w0-08-hitl-probe-env"
version = "0.1.0"
description = "LG-W0-08 探针的包本地锁定 uv 环境：仅安装 XCAGI vendored langgraph 兄弟包，pytest 从该环境运行（无 sys.path 变异、无 PYTHONPATH）。"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.10,<1.3.0",
    "langgraph-checkpoint>=4.1.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "langgraph-prebuilt>=1.1.0,<1.2.0",
    "sqlalchemy",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.uv]
package = false

# 显式锁定 vendored 兄弟包为 editable 路径来源（指向 FHD/packages/xcagi* 现有兄弟包
# 目录），保证 langgraph 模块解析到仓库 XCAGI 源码而非 site-packages 原版。
[tool.uv.sources]
langgraph = { path = "../../packages/xcagi_langgraph_core", editable = true }
langgraph-checkpoint = { path = "../../packages/xcagi_langgraph_checkpoint", editable = true }
langgraph-checkpoint-sqlite = { path = "../../packages/xcagi_langgraph_checkpoint_backends/checkpoint-sqlite", editable = true }
langgraph-prebuilt = { path = "../../packages/xcagi_langgraph_prebuilt", editable = true }