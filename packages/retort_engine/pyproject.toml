[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retort-engine"
version = "0.4.0"
description = "Retort blackhole external evolution engine"
requires-python = ">=3.10"
dependencies = ["cryptography>=50,<51"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
evolution = [
    "langgraph==1.2.14",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langgraph-checkpoint-postgres==3.1.1+xcagi.1",
    "psycopg[binary]>=3.2,<4",
    "gepa==0.1.4",
    "jsonschema>=4.23,<5",
]

[project.scripts]
retort = "retort_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retort_engine*"]

[tool.setuptools.package-data]
retort_engine = ["frontend/*"]

[tool.pytest.ini_options]
markers = [
  "keep_self_depth_gate: do not mock external_improvement_gate (assert real blocked/allowed paths)",
]
