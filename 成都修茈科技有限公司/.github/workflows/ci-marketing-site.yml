# 组件级 CI：营销官网静态页（根层 *.html + site/ + new/ + assets 等）
#
# 责任边界：仅校验静态营销页改动；无需 Vue 构建或 Playwright。
# 未拆仓前，此工作流保证营销页变更不会触发 Vue/Python/Java 的全量流水线。

name: CI - Marketing Site

on:
  pull_request:
    paths:
      - '*.html'
      - 'capabilities/**'
      - 'data/capabilities/**'
      - 'scripts/build_capability_center.py'
      - 'styles.css'
      - 'main.js'
      - 'assets/**'
      - 'new/**'
      - 'site/**'
      - 'FHD/docs/evidence/**'
      - '.github/workflows/ci-marketing-site.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'capabilities/**'
      - 'data/capabilities/**'
      - 'scripts/build_capability_center.py'
      - 'styles.css'
      - 'main.js'
      - 'assets/**'
      - 'new/**'
      - 'site/**'
      - 'FHD/docs/evidence/**'
      - '.github/workflows/ci-marketing-site.yml'
  workflow_dispatch:

concurrency:
  group: ci-marketing-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  marketing-site-ci:
    name: Marketing site (static pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 能力中心 --check 需用 git log 重算证据 commit/verified_at，
          # 浅克隆（默认 1）只能命中 merge commit，必须完整历史（同 ssot-drift-gate）。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install HTML validator
        run: npm install --global html-validate@9 htmlhint@1

      # 只校验根层与 site/、new/ 下的静态页；忽略 MODstore_deploy 与 market 下的模板
      - name: HTML validate (root)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.html site/*.html new/*.html )
          filtered=()
          for file in "${files[@]}"; do
            # 百度站点所有权验证文件按协议必须是裸 token，并不是 HTML 文档。
            [[ "$(basename "$file")" == baidu_verify_* ]] && continue
            filtered+=("$file")
          done
          files=("${filtered[@]}")
          if [ ${#files[@]} -eq 0 ]; then
            echo "No static HTML files to validate."
            exit 0
          fi
          echo "Validating ${#files[@]} marketing HTML file(s) with htmlhint..."
          htmlhint "${files[@]}"

      # 能力中心 HTML 校验（生成页 + 详情页）
      - name: HTML validate (capabilities)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( capabilities/*.html capabilities/feature/*.html )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No capability HTML files to validate."
            exit 0
          fi
          echo "Validating ${#files[@]} capability HTML file(s) with htmlhint..."
          htmlhint "${files[@]}"

      # No Evidence, No Claim：目录与已提交页面必须一致，公开数字无法手写
      # 注：发布副本带 defaults.run.working-directory=本目录，源文件亦按该语义书写相对路径
      - name: Capability status, evidence, and page integrity gate
        run: python3 scripts/build_capability_center.py --check

      # 官网「当前版本」只有一个来源：发布清单 /download-release.json（发布流程在 Windows/macOS
      # 双平台产物通过验证后原子写入）。页面里写死的版本兜底值会与指针冲突，并让本门禁在每次
      # 发版后持续变红——因此这里直接禁止写死，而不是要求人工跟着每次发版改页面。
      - name: Current version single-sourced from release manifest
        run: |
          set -euo pipefail
          pub="$(curl -fsS --retry 3 --retry-delay 5 -m 20 https://xiu-ci.com/download-release.json \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["download_version"])')" \
            || { echo "::error::无法从线上发布指针获取已发布版本"; exit 1; }
          grep -F -q "fetch('/download-release.json'" download.html \
            || { echo "::error::download.html 未从发布清单读取当前版本"; exit 1; }
          grep -F -q "fetchJson('/download-release.json')" download-releases.html \
            || { echo "::error::download-releases.html 未从发布清单读取版本时间线"; exit 1; }
          if grep -E -q "DEFAULT_VERSION *= *['\"][0-9]" download.html; then
            echo "::error::download.html 仍写死版本兜底值；当前版本只能来自发布清单"; exit 1
          fi
          if grep -E -q 'id="summary-version">[v0-9]' download-releases.html; then
            echo "::error::download-releases.html 仍写死当前版本；当前版本只能来自发布清单"; exit 1
          fi
          next="$(sed -n 's/.*XCAGI 稳定产品版本[^`]*`\([0-9.]*\)`.*/\1/p' ../FHD/VERSION.md | head -1)"
          [ -z "$next" ] || [ "$next" = "$pub" ] || echo "::warning::VERSION.md 稳定版本 ${next} 尚未对外发布（当前已发布 ${pub}）；官网按已发布版本对齐"
          echo "官网当前版本单一来源校验通过：已发布 ${pub}"
