[project]
name = "modstore"
version = "0.2.0"
description = "MODstore：XCAGI Mod 库、制作、调试沙箱与同步"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.6",
    "httpx[socks]>=0.27",
    "socksio>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.16,<2",
    "psycopg2-binary>=2.9",
    "PyJWT>=2.8",
    "passlib[bcrypt]>=1.7",
    "python-dotenv>=1.0",
    "python-alipay-sdk>=3.4",
    "python-pptx>=0.6.23",
    "PyYAML>=6.0",
    "paramiko>=3.4",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "pika>=1.3",
    "edge-tts>=6.1",
    # 数字管家 QQ 官方机器人桥接：Ed25519 验签 + op=13 回调握手。
    # 仅在配置了 BUTLER_QQ_* env 后真正启用；未安装则 butler_qq_bridge 路由跳过注册。
    "pynacl>=1.5",
    "qq-botpy>=1.2.1",
]
knowledge = [
    "chromadb>=0.5",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
    "pypdf>=4.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "rank-bm25>=0.2.2",
    "redis>=5.0",
    "redisvl>=0.3.0",
]
employee-docs = [
    "pypdf>=4.0",
    "python-docx>=1.0",
]
evolution-metrics = [
    # MODstore scheduler imports FHD's production autonomy evaluator, whose
    # operating-metrics module uses pandas.  Keep the runtime extra complete
    # so daily 30/90-day snapshots cannot silently degrade to stale evidence.
    "pandas>=2.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
aliyun-tts = [
    "dashscope>=1.14",
]
vibe = [
    # vibe-coding 接入：NL → 代码 → 沙盒 → 自愈 + 仓库级 patch / heal。
    # 与本仓库源码并列时建议在部署/开发机上手动 `pip install -e ../vibe-coding[web]`，
    # 这样能把 path dep 的解析问题留给 pip。CI / 容器镜像可保留下面的版本约束以
    # 强制 lockfile 锁版本；运行时由 `modstore_server.integrations.vibe_adapter`
    # 做 import 失败的优雅降级。
    "vibe-coding[web]>=0.1.0",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",
  "PyYAML>=6.0",
  "black==26.3.1",
  "isort==6.1.0",
  "jsonschema>=4.21",
  "mypy>=2.3.1",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  # test_cache_extra imports RedisError directly; keep the release-gate
  # environment self-contained instead of relying on runner-global packages.
  "redis>=5.0",
]

[project.scripts]
modman = "modman.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["modman*", "modstore_server*"]

[tool.setuptools.package-data]
modman = ["data/*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["modman", "modstore_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "integration: HTTP/webhook integration tests",
    "release_gate: release train / digest / deploy smoke subset (PR hard gate)",
]

[tool.coverage.run]
source = ["modman", "modstore_server"]
branch = true
omit = ["*/tests/*", "*/modstore_server/workbench_script_runs/*"]

[tool.coverage.report]
# 适用于裸 ``coverage report``。enforced floor = 当前真实覆盖率(全量 tree 自承约 40%+,
# 本地未实测:xcagi_common 要求 Python>=3.11)。设为诚实的 40 作棘轮——能挡回归、只可上调。
# 路线图目标(尚未达成)为 80;CI 实际门禁见
# .github/workflows/ci-backend-python.yml 的 MODSTORE_PY_COVERAGE_FLOOR(=40,与此一致),
# 它发布到仓库根 .github/workflows/modstore-ci-backend-python.yml 后由 GitHub 实际执行。
fail_under = 40

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = ["."]
follow_imports = "normal"
packages = ["modstore_server", "modman"]
# 动态产物与沙箱跑一次脚本目录：不参与类型门禁（与 coverage.omit 对齐）。
exclude = [
    "(?x)^modstore_server/workbench_script_runs/",
]
# 全仓默认检查；以下为当前仍有大量推断债的遗留模块列表（可随时从列表移除以恢复检查）。
# 重新生成：`python scripts/export_mypy_ignore_modules.py --toml-fragment`
warn_unused_configs = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "modstore_server.infrastructure.db",
    "modstore_server.api.deps",
    "modstore_server.application.*",
    "modstore_server.domain.*",
]
ignore_errors = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "botpy.*",
    "fastapi.*",
    "chromadb.*",
    "redis.*",
    "pika.*",
    "edge_tts.*",
    "dashscope.*",
    "pptx.*",
    "fitz.*",
    "docx.*",
    "openpyxl.*",
    "PIL.*",
    "alipay.*",
    "app.*",
    "apscheduler.*",
    "bcrypt.*",
    "dotenv.*",
    "httpx.*",
    "jwt.*",
    "playwright.*",
    "prometheus_client.*",
    "psycopg2.*",
    "pydantic.*",
    "rank_bm25.*",
    "sqlalchemy.*",
    "starlette.*",
    "uvicorn.*",
    "websockets.*",
    "xcagi_common.*",
    "paramiko.*",
    "pysqlite3.*",
    "cursor_sdk.*",
    "redisvl.*",
    "vibe_coding.*",
    "retort_engine.*",
]
ignore_missing_imports = true
