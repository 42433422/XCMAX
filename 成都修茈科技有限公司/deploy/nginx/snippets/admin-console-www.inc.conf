# Full FHD management console isolated on the www origin.
#
# The apex /admin path remains owned by MODstore.  The surrounding www vhost
# has a certificate for www.xiu-ci.com and includes this file instead of a
# server-scope redirect, so only these management routes stay on www.
# Keep the automation dashboard on this same origin.  Redirecting it to the
# apex host makes X-Frame-Options: SAMEORIGIN reject the iframe.
location = /XCAGI-Full-Pipeline.html {
    return 302 /xcmax-dashboard/XCAGI-Full-Pipeline.html$is_args$args;
}

location ^~ /xcmax-dashboard/ {
    # Same finite public asset set as FHD's _DashboardStaticFiles. Never expose
    # the repository root, even when a new file has a normally public extension.
    if ($uri !~ "^/xcmax-dashboard/(?:XCAGI-(?:Full-Pipeline|Five-Line)\.html|tree-worker\.js|six_line_employee_map\.json|xcmax-pytest-coverage\.json|docs/xcagi-dashboard/(?:admin-tokens\.css|dashboard\.css|api-base\.js|app\.js|arch-graph-draw\.js|daily_digest_node_employees\.json|employee_labels_zh\.json|emp-wf-action-items\.js|emp-wf-node-staff\.js|emp-wf-pan-zoom\.js|emp-wf-radial-graph\.js|emp-wf-stage-artifacts\.js|emp-wf-surface-audit\.js|event-arch-graph\.js|event-merged-arch-graph\.js|event-rail-ui\.js|event-workflow-snake\.js|mon-ai-biz\.js|mon-live-dash\.js|mon-m0-evidence\.js|time_rail_workflow_graph\.json|tree-worker\.js|vendor/dagre\.min\.js|xcagi-dashboard-sot\.js)|\.cache/xcmax/xcmax-(?:tree-data|step-employee-coverage|line-coverage|path-employee-coverage|pytest-coverage)\.json|FHD/(?:config/(?:release_train|six_line_event_routes|six_line_employee_map)\.json|metrics/coverage-dual-summary\.json|docs/evidence/(?:m0-evidence-manifest\.json|slo/grafana-(?:local|staging)-m0-(?:api-availability|db-mod-sqlite-copies|ai-chat-p95|neurobus-delivery)-202606\.png|mod/(?:01-listing|02-store-page|03-payment|04-activated)\.png)))\z") {
        return 404;
    }
    disable_symlinks on from=/root/XCMAX;
    alias /root/XCMAX/;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location = /admin {
    return 308 /admin/;
}

# Hashed Vite assets keep the application as the release source of truth. Nginx
# compresses and caches the proxied response so it does not need filesystem
# access to the deliberately private /opt/fhd-full deployment root.
location ^~ /admin/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/javascript text/plain text/xml;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /admin/vite.svg {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # The current Vue i18n bundle compiles locale messages in the browser.
    # Keep this exception scoped to the authenticated management SPA instead
    # of weakening the apex website or MODstore CSP.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-src 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ^~ /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
}

location ^~ /ws/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

location = /health {
    proxy_pass http://127.0.0.1:5100/api/health?lite=true;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    return 301 https://xiu-ci.com$request_uri;
}
