# Full FHD management console isolated on the www origin.
#
# The apex /admin path remains owned by MODstore.  The surrounding www vhost
# has a certificate for www.xiu-ci.com and includes this file instead of a
# server-scope redirect, so only these management routes stay on www.
# Keep the automation dashboard on this same origin.  Redirecting it to the
# apex host makes X-Frame-Options: SAMEORIGIN reject the iframe.
location = /XCAGI-Full-Pipeline.html {
    return 302 /xcmax-dashboard/XCAGI-Full-Pipeline.html$is_args$args;
}

location ^~ /xcmax-dashboard/ {
    alias /root/XCMAX/;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

location = /admin {
    return 308 /admin/;
}

location ^~ /admin/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    # The current Vue i18n bundle compiles locale messages in the browser.
    # Keep this exception scoped to the authenticated management SPA instead
    # of weakening the apex website or MODstore CSP.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss:; frame-src 'self'" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location ^~ /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    client_max_body_size 100m;
}

location ^~ /ws/ {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

location = /health {
    proxy_pass http://127.0.0.1:5100/api/health?lite=true;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    return 301 https://xiu-ci.com$request_uri;
}
