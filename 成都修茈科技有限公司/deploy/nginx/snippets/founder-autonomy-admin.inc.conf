# FHD 创始人自治驾驶舱。
#
# These exact and longest-prefix locations intentionally take priority over
# the legacy MODstore `location ^~ /admin/` block.  Only the read-only founder
# aggregate is exposed; its application handler still requires a market-admin
# session and returns 401 when no valid session is present.
location = /admin/founder-autonomy {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /admin/founder-autonomy/ {
    return 308 /admin/founder-autonomy;
}

location ^~ /admin/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /admin/vite.svg {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/xcmax/ops/founder-autonomy {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Public World Will projection.  The authenticated founder cockpit writes the
# sanitized snapshot atomically; this exact route prevents a missing JSON file
# from being silently replaced by the market SPA HTML fallback.
location = /download-founder-autonomy.json {
    include /etc/nginx/snippets/security-headers.conf;
    root /var/lib/xcmax-public;
    try_files /download-founder-autonomy.json =404;
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
