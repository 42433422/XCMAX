# 营销官网：/site/ 子目录页面引用根目录 main.js / styles.css
# 在 SPA try_files 回退之前 include，或放在 location / 之前。
location = /site/main.js {
    alias /root/成都修茈科技有限公司/main.js;
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /site/styles.css {
    alias /root/成都修茈科技有限公司/styles.css;
    default_type text/css;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# 产品能力中心：xiu-ci.com.conf 是白名单模式（未列 location 一律 404），必须在此显式开放。
# 用 $uri/index.html 而非 $uri/，避免目录无尾斜杠时的内部重定向循环。
location ~ ^/(?:data/)?capabilities(?:/|$) {
    root /root/成都修茈科技有限公司;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
