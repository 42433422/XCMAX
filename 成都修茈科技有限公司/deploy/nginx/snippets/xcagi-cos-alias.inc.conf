# COS / 本机安装包下载（与 /market/ 无关；勿改 market/dist）
## XCAGI_COS_ALIAS_BEGIN
location /xcagi-v1.0.0.1/ {
    alias /var/www/update/releases/stable/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
## XCAGI_COS_ALIAS_END

# 历史兼容：旧前缀仍指向同一目录，便于老书签/老链接继续可下载
## XCAGI_COS_ALIAS_LEGACY_BEGIN
location /xcagi-v8.0.0/ {
    alias /var/www/update/releases/stable/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
## XCAGI_COS_ALIAS_LEGACY_END

## XCAGI_RELEASES_BEGIN
location /releases/stable/ {
    alias /var/www/update/releases/stable/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
## XCAGI_RELEASES_END
