# XCAGI 公开安装包下载（与 /market/ 无关；勿改 market/dist）。版本目录不能钉死，否则官网回退旧 URL。
## XCAGI_COS_ALIAS_BEGIN
location ~ ^/xcagi-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/.*\.(exe|dmg|pkg|zip|blockmap)$ {
    root /var/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ ^/xcagi-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/ {
    root /var/www;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=60";
}

# 官网下载页先读取这个指针；release-desktop 在两端制品验证后原子更新它。
location = /download-release.json {
    alias /root/成都修茈科技有限公司/download-release.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}

# Windows 未签名临时交付独立指针；不得替代稳定版 download-release.json。
location = /download-windows-hotfix.json {
    alias /var/www/update/releases/stable/enterprise/download-windows-hotfix.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}
## XCAGI_COS_ALIAS_END

## XCAGI_RELEASES_BEGIN
location /releases/stable/ {
    root /var/www/update;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=60";
}
## XCAGI_RELEASES_END

## XCAGI_RELEASES_TESTING_BEGIN —— 测试通道 OTA（未签名隔离包，仅供验收；2026-09-13 曾被 snippet 同步抹除致 :443 404，随本 snippet 入库防回归）
location /releases/testing/ { root /var/www/update; try_files $uri =404; add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
## XCAGI_RELEASES_TESTING_END
