# MODstore API upstream 负载均衡
# 两实例分别由 modstore@9999.service / modstore@9998.service 启动。
# 单实例时可注释掉第二个 server 行；scheduler 进程(:9990)不加入此组。
upstream modstore_api {
    least_conn;
    server 127.0.0.1:9999 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:9998 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# 官网静态根（developer.html 等 *.html 须由 成都修茈科技有限公司/ 提供，勿用 market/dist 作整站 root）
# 否则 /developer.html 等缺失页会回退到 Vue SPA index.html，表现为「点击无跳转」。

server {
    listen 80;
    server_name www.xiu-ci.com xiu-ci.com;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    root /root/成都修茈科技有限公司;
    index index.html;

    location = /market {
        return 301 /market/;
    }

    # 官网公开数据看板：AI 业务、软件下载与版本交付。
    location = /visualization {
        try_files /visualization.html =404;
    }

    location = /visualization/ {
        return 301 /visualization;
    }

    location = /visualization.html {
        return 301 /visualization;
    }

    # 旧静态快照已下线；官网改读 /api/public/visualization 实时聚合。
    location = /visualization-data.json {
        return 410;
    }

    # /download 独立下载中心(已从 /market/download 拆出)
    location = /download {
        try_files /download.html =404;
    }

    # 下载中心子页：XCAGI 版本更新日志。
    location = /download/releases {
        try_files /download-releases.html =404;
    }

    location = /download/releases/ {
        return 301 /download/releases;
    }

    location = /download-releases.html {
        return 301 /download/releases;
    }

    # 官网公开数据看板：AI 业务、软件下载与版本交付。
    location = /visualization {
        try_files /visualization.html =404;
    }

    location = /visualization/ {
        return 301 /visualization;
    }

    location = /visualization.html {
        return 301 /visualization;
    }

    # 旧静态快照已下线；官网改读 /api/public/visualization 实时聚合。
    location = /visualization-data.json {
        return 410;
    }

    # 客来来公开测试版安装包；保持在下载中心命名空间，不落入市场 SPA。
    location ^~ /downloads/kellai/ {
        try_files $uri =404;
        types {
            application/x-apple-diskimage dmg;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "attachment" always;
    }

    # /market/download 旧入口:301 到独立下载中心,携带查询参数
    location /market/download {
        return 301 /download$is_args$args;
    }

    # 市场 SPA（Vite base=/market/）
    location /market/ {
        alias /root/成都修茈科技有限公司/MODstore_deploy/market/dist/;
        index index.html;
        try_files $uri $uri/ /market/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ^~ /market/assets/ {
        alias /root/成都修茈科技有限公司/MODstore_deploy/market/dist/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /market/index.html {
        alias /root/成都修茈科技有限公司/MODstore_deploy/market/dist/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /market/download-release.json {
        alias /root/成都修茈科技有限公司/MODstore_deploy/market/dist/download-release.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # === XCAGI 安装包下载源 ===
    # CI(release-desktop.yml generate-manifest job)推送到 /var/www/update/releases/stable/{sku}/
    # electron-updater 自动更新源:latest.yml + 安装包
    location ^~ /releases/stable/ {
        alias /var/www/update/releases/stable/;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
        location ~* \.(exe|dmg|pkg|zip|blockmap)$ {
            alias /var/www/update/releases/stable/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 官网下载源:manifest.json + download-release.json + 按 SKU 分目录的安装包
    # CI 推送到 /var/www/xcagi-v{version}/
    # 1.0.0.1 当前稳定版
    location ^~ /xcagi-v1.0.0.1/ {
        alias /var/www/xcagi-v1.0.0.1/;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
        location ~* \.(exe|dmg|pkg|zip|blockmap)$ {
            alias /var/www/xcagi-v1.0.0.1/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 1.0.0.0 历史版本保留
    location ^~ /xcagi-v1.0.0.0/ {
        alias /var/www/xcagi-v1.0.0.0/;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
        location ~* \.(exe|dmg|pkg|zip|blockmap)$ {
            alias /var/www/xcagi-v1.0.0.0/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 根路径 download-release.json(前端 loadReleaseManifest() 首先尝试 /download-release.json)
    # 指向 CI 生成的最新版本(含 win_installer_mb 等元数据)
    location = /download-release.json {
        alias /var/www/xcagi-v1.0.0.1/download-release.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /corp-butler/ {
        alias /root/成都修茈科技有限公司/corp-butler/;
        add_header Cache-Control "no-cache";
    }

    # API 请求代理到后端（upstream 负载均衡）
    location /api/ {
        proxy_pass http://modstore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public MOD Catalog + /v1/mod-sync（upstream 与 /api/ 一致，同进程）
    location /v1/ {
        proxy_pass http://modstore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # 后端文档（通过 upstream 代理，任一实例均可返回 OpenAPI 文档）
    location /docs {
        proxy_pass http://modstore_api/docs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 健康检查（被动探活：max_fails/fail_timeout 已在 upstream 中配置）
    location = /api/health {
        proxy_pass http://modstore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Shared chrome fragments — must not SPA-fallback to index.html
    location ^~ /partials/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 官网静态（*.html / styles.css / main.js 等）
    location / {
        try_files $uri $uri/ =404;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
