server {
    listen 80;
    server_name www.xiu-ci.com xiu-ci.com;

    # 官网静态根（developer.html 等；勿将 market/dist 设为整站 root）
    root /root/成都修茈科技有限公司;
    index index.html;

    # 根路径
    location = / {
        try_files /index.html =404;
    }

    # 静态资源缓存（官网 styles/main 与 /assets）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # 官网公开数据看板：AI 业务、软件下载与版本交付。
    location = /visualization {
        try_files /visualization.html =404;
    }

    location = /visualization/ {
        return 301 /visualization;
    }

    location = /visualization.html {
        return 301 /visualization;
    }

    # 旧静态快照已下线；官网改读 /api/public/visualization 实时聚合。
    location = /visualization-data.json {
        return 410;
    }

    # /download 独立下载中心(已从 /market/download 拆出)
    location = /download {
        try_files /download.html =404;
    }

    # 下载中心子页：XCAGI 版本更新日志。
    location = /download/releases {
        try_files /download-releases.html =404;
    }

    location = /download/releases/ {
        return 301 /download/releases;
    }

    location = /download-releases.html {
        return 301 /download/releases;
    }

    # 官网公开数据看板：AI 业务、软件下载与版本交付。
    location = /visualization {
        try_files /visualization.html =404;
    }

    location = /visualization/ {
        return 301 /visualization;
    }

    location = /visualization.html {
        return 301 /visualization;
    }

    # 旧静态快照已下线；官网改读 /api/public/visualization 实时聚合。
    location = /visualization-data.json {
        return 410;
    }

    # /market/download 旧入口:301 到独立下载中心,携带查询参数
    location /market/download {
        return 301 /download$is_args$args;
    }

    # /market/ — MODstore 前端（与仓库 MODstore_deploy/market/dist 一致）
    location = /market {
        return 301 /market/;
    }

    location /market/ {
        alias /root/成都修茈科技有限公司/MODstore_deploy/market/dist/;
        index index.html;
        try_files $uri $uri/ /market/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # === XCAGI 安装包下载源 ===
    # CI(release-desktop.yml generate-manifest job)推送到 /var/www/update/releases/stable/{sku}/
    # electron-updater 自动更新源:latest.yml + 安装包
    location ^~ /releases/stable/ {
        alias /var/www/update/releases/stable/;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
        location ~* \.(exe|dmg|pkg|zip|blockmap)$ {
            alias /var/www/update/releases/stable/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 官网下载源:manifest.json + download-release.json + 按 SKU 分目录的安装包
    # CI 推送到 /var/www/xcagi-v{version}/
    # 1.0.0.1 当前稳定版
    location ^~ /xcagi-v1.0.0.1/ {
        alias /var/www/xcagi-v1.0.0.1/;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
        location ~* \.(exe|dmg|pkg|zip|blockmap)$ {
            alias /var/www/xcagi-v1.0.0.1/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 1.0.0.0 历史版本保留
    location ^~ /xcagi-v1.0.0.0/ {
        alias /var/www/xcagi-v1.0.0.0/;
        autoindex off;
        add_header Cache-Control "public, max-age=60";
        location ~* \.(exe|dmg|pkg|zip|blockmap)$ {
            alias /var/www/xcagi-v1.0.0.0/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 根路径 download-release.json(前端 loadReleaseManifest() 首先尝试 /download-release.json)
    # 指向 CI 生成的最新版本(含 win_installer_mb 等元数据)
    location = /download-release.json {
        alias /var/www/xcagi-v1.0.0.1/download-release.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /corp-butler/ {
        alias /root/成都修茈科技有限公司/corp-butler/;
        add_header Cache-Control "no-cache";
    }

    # API 请求代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Public MOD Catalog + /v1/mod-sync（须与 /api/ 指向同一 FastAPI 进程）
    location /v1/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100m;
    }

    # 后端文档
    location /docs {
        proxy_pass http://127.0.0.1:9999/docs;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:9999/redoc;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:9999/openapi.json;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 官网其余路径（含 developer.html、about.html 等）
    location / {
        try_files $uri $uri/ =404;
    }
}
