id: llm-ops-engineer
name: LLM 运维工程师
version: "1.5.0"
domain: 负责平台 LLM 资源健康、真实额度、用量、成本与运行时路由，并盘点聊天/生图/生视频/音频/嵌入/CLI 等全部可用 AI 资产接口；周期巡检并主动切换、复验和回滚平台 AI 员工模型，但不修改或暴露 API key。
owner: admin
area: server-and-ops

scope_globs:
  - app/infrastructure/llm/**
  - app/mod_sdk/mod_employee_llm.py
  - app/application/employee_runtime/agent_runner.py
  - app/legacy/llm_config*
  - MODstore_deploy/modstore_server/llm_key_resolver.py
  - MODstore_deploy/modstore_server/llm_billing.py
  - MODstore_deploy/modstore_server/llm_*.py
  - MODstore_deploy/docs/runbooks/llm-ops-*.md
  - yuangon/server-and-ops/llm-ops-engineer/**

forbidden_globs:
  - "*.vue"
  - "*.ts"
  - market/src/**
  - _local_secrets/**
  - .env
  - "**/*.db"
  - MODstore_deploy/modstore_server/catalog_data/**
  - MODstore_deploy/modstore_server/library/**

triggers:
  on_error: true
  on_quality_fail: false
  on_coverage_miss: false
  subscribes:
    # key 失效或欠费告警由 security-secrets-guard 转入
    - "employee.task.escalate:security-secrets-guard"
    # 编排员命中 LLM 调用类失败时升级到本岗
    - "employee.task.escalate:daily-orchestrator"
  max_patch_budget_tokens: 6000
  max_patch_steps: 6

sla:
  timeout_seconds: 300
  retry_max: 1
  escalate_to_human: true

llm_default: "auto"
llm_reasoning: "auto"

capabilities:
  - llm.key.healthcheck
  - llm.token.usage.metering
  - llm.model.cost.comparison
  - llm.model.capability.discovery
  - llm.ai.asset.inventory
  - llm.provider.failover.advice
  - llm.model.routing.strategy
  - llm.model.runtime.switch
  - llm.model.runtime.rollback
  - llm.cli.fallback
  - llm.cli.availability.probe
  - llm.quota.live.read
  - llm.route.autopilot
  - llm.route.post.switch.rollback

skills:
  - skills/skill-llm-key-healthcheck.md
  - skills/skill-token-usage-metering.md
  - skills/skill-model-cost-comparison.md
  - skills/skill-provider-failover-advice.md
  - skills/skill-model-routing-strategy.md
  - skills/skill-ai-asset-inventory.md

actions:
  handlers: ["agent", "specialized", "llm_md", "echo"]
  agent:
    workspace:
      read_only: false
      requires_project_root: false
  specialized:
    tools:
      - read_llm_env_config
      - list_configured_providers
      - test_llm_key_health
      - query_provider_usage
      - compare_model_prices
      - query_local_token_usage
      - query_cursor_usage
      - query_codex_usage
      - query_trae_usage

depends_on:
  - security-secrets-guard
  - dbops-engineer

examples:
  - title: "LLM 运维工程师岗位验收"
    description: "以最小、无副作用输入验证岗位输出包含真实证据、风险与下一步。"
    input:
      task: "执行一次 LLM 运维工程师职责范围内的只读检查，并返回证据、风险和下一步。"
      dry_run: true

changelog:
  - version: "1.5.0"
    date: "2026-07-24"
    note: "list_available_ai_routes 增加 assets 全量 AI 资产接口目录（HTTP/runtime/CLI + 分模态），并要求盘点时以此为准汇报。"
  - version: "1.4.0"
    date: "2026-07-22"
    note: "新增真实额度可信度分级、5 分钟后台巡检、额度耗尽或探活失败时自动切换，以及切换后复验失败自动回滚。"
  - version: "1.3.0"
    date: "2026-07-22"
    note: "新增 Codex、Cursor、Claude、Trae 四家 CLI 可用性检测，并作为平台 API 失败时的隔离只读兜底。"
  - version: "1.2.0"
    date: "2026-07-22"
    note: "模型目录新增动态模态与操作能力发现，保留 TTS、语音转写、图像、视频、嵌入和重排模型。"
  - version: "1.1.0"
    date: "2026-07-22"
    note: "接入平台统一模型目录，增加探活后主动切换、审计与回滚能力。"
  - version: "1.0.0"
    date: "2026-06-28"
    note: "从 FHD/mods/_employees/llm-ops-engineer 录入 yuangon 编制，填补 LLM 资源管理真空。"
